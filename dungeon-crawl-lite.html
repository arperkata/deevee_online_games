<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Dungeon Crawl Lite - Turn-based roguelike with permadeath. Free online game, plays on phone, tablet and PC. No sign-up."><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dungeon Crawl Lite</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit}
a.home,.mute{position:fixed;top:10px;z-index:1000;background:linear-gradient(#ffb21f,#f08a12);color:#fff;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font:700 17px 'Fredoka','Trebuchet MS',sans-serif;border:0;box-shadow:0 4px 0 #a9560b;cursor:pointer;background-color:#f08a12}
a.home{left:10px;padding:0 14px}
.mute{right:10px;width:44px;padding:0;font-size:20px}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;padding:8px 60px 4px 100px;min-height:52px}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:clamp(14px,3.4vw,20px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
button.go{font:700 clamp(20px,5vw,28px) 'Fredoka','Trebuchet MS',sans-serif;margin-top:12px;min-height:48px;padding:.3em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1200;width:100%;height:100%}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.9);z-index:1100;padding:12px}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:16px 22px;box-shadow:0 8px 0 #06244d;max-width:94vw;max-height:94dvh;overflow:auto;animation:pop2 .45s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.07)}}
#mt{font-size:clamp(18px,4.4vw,26px);font-weight:700;text-shadow:0 2px 0 #0b3a78;line-height:1.25}
#mt .em{font-size:clamp(46px,12vw,76px);display:block;line-height:1.1}
#mt h2{margin:2px 0 4px;font-size:clamp(26px,7vw,42px);color:#ffe14a;text-shadow:0 3px 0 #0b3a78}
#mt .st{font-size:clamp(34px,9vw,52px);letter-spacing:3px;display:block}
#mt .st i{font-style:normal;color:#6d86b0}#mt .st i.on{color:#ffcf1f;text-shadow:0 3px 0 #a9560b}
#mt small{font-size:.75em;color:#ffe14a;display:block}
.flt{position:fixed;z-index:1300;pointer-events:none;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #1b4f86,2px 0 0 #1b4f86,-2px 0 0 #1b4f86,0 -2px 0 #1b4f86;animation:flt .9s ease-out forwards;transform:translateX(-50%)}
@keyframes flt{from{transform:translate(-50%,0) scale(.6)}20%{transform:translate(-50%,-10px) scale(1.2)}to{transform:translate(-50%,-60px) scale(1)}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@media (max-height:500px){#hud{min-height:48px;padding-top:4px}}

body{background:linear-gradient(#2a1450,#0e0820)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 8px 8px;gap:6px}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#bd{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px;padding:4px;background:#05030d;border-radius:14px;border:4px solid #8a5cff;box-shadow:0 7px 0 #1a0b3a,0 0 24px #6a3cd8}
.c{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;font-size:calc(var(--bs)/11*.66);line-height:1;background:#0d0a1a;border-radius:3px;cursor:pointer}
.c.fl{background:#2a2347}.c.fv{background:#4a3f78}
.c.wl{background:#5d3b22}.c.wv{background:#b0713f;box-shadow:inset 0 -3px 0 #6e4020}
.c.hit{animation:ht .3s}
@keyframes ht{50%{background:#ff4a5a;transform:scale(1.15)}}
#log{background:#241448;border:3px solid #ffe14a;border-radius:14px;padding:3px 12px;font-weight:700;font-size:clamp(12px,3.1vw,16px);min-height:2.2em;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center}
#ctl{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
#dp{display:grid;grid-template-columns:repeat(3,clamp(48px,13vw,64px));grid-template-rows:repeat(2,clamp(44px,9dvh,58px));gap:5px}
.d{border:0;border-radius:14px;background:linear-gradient(#8a5cff,#5a2fd0);color:#fff;font-size:24px;font-weight:700;box-shadow:0 5px 0 #2f1480;cursor:pointer}
.d:active{transform:translateY(4px);box-shadow:0 1px 0 #2f1480}
.d.u{grid-column:2}
.pot{border:0;border-radius:16px;min-height:60px;min-width:84px;background:linear-gradient(#ff7aa0,#e0285a);color:#fff;font:700 18px 'Fredoka','Trebuchet MS',sans-serif;box-shadow:0 5px 0 #8a1535;cursor:pointer}
.pot:active{transform:translateY(4px);box-shadow:0 1px 0 #8a1535}
.hpb{display:inline-block;width:clamp(50px,12vw,90px);height:14px;background:#4a1220;border-radius:8px;vertical-align:middle;overflow:hidden;border:2px solid #fff}
.hpb i{display:block;height:100%;background:linear-gradient(#ff6a7a,#e0285a)}
@media (max-height:500px) and (orientation:landscape){#main{flex-direction:row;flex-wrap:wrap;align-content:center}#stage{width:auto;flex:1;height:100%}#side{width:210px}#log{order:5}}
@media (max-height:500px){.pill{font-size:13px;padding:1px 8px}}
#side{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button class="mute" id="mute" aria-label="Sound">🔊</button>

<div id="hud"><span class="pill">🏰 Floor <b id="fl">1</b></span><span class="pill">❤️ <span class="hpb"><i id="hb"></i></span> <b id="hp">0</b></span><span class="pill">⚔️<b id="at">0</b> 🛡️<b id="df">0</b></span><span class="pill">💰 <b id="gd">0</b></span><span class="pill">Best <b id="bs">0</b></span></div>
<div id="main"><div id="stage"><div id="bd"></div></div><div id="side"><div id="log">Find the stairs 🪜</div><div id="ctl"><div id="dp"><button class="d" data-d="0,0" style="grid-area:1/1;font-size:16px">⏳</button><button class="d" data-d="0,-1" style="grid-area:1/2">▲</button><button class="d" data-d="-1,0" style="grid-area:2/1">◀</button><button class="d" data-d="0,1" style="grid-area:2/2">▼</button><button class="d" data-d="1,0" style="grid-area:2/3">▶</button></div><button class="pot" id="pot">🧪 Potion<br>x<b id="pn">0</b></button></div></div></div>

<canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt"></div><button class="go" id="go">Play</button></div></div>
<script>
const GAME='dungeon-crawl-lite.html';
const $=id=>document.getElementById(id);
const BK=GAME+':best';let best=0,muted=false,ac,boxFn=null;
try{best=+localStorage.getItem(BK)||0}catch(e){}
function updBest(){const b=$('bs');if(b)b.textContent=best}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,best)}catch(e){}updBest();return true}return false}
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function beep(f,d=.12,type='triangle',v=.15,delay=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=type;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>beep(f,.16,'triangle',.15,i*.11))}
addEventListener('pointerdown',()=>{try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}},true);
const fx=$('fx'),fc=fx.getContext('2d');let PT=[],raf=0,lt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();addEventListener('resize',fxfit);
function confetti(x,y,n=40,cols){const C=cols||['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=120+Math.random()*320;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-180,l:1+Math.random()*.6,c:C[i%C.length],r:Math.random()*6,s:5+Math.random()*6})}lt=performance.now();if(!raf)raf=requestAnimationFrame(ptick)}
function ptick(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;fc.clearRect(0,0,fx.width,fx.height);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.max(0,Math.min(1,p.l*2));fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});PT=PT.filter(p=>p.l>0&&p.y<fx.height+20);raf=PT.length?requestAnimationFrame(ptick):0;if(!raf)fc.clearRect(0,0,fx.width,fx.height)}
function floatText(x,y,txt,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';if(col)d.style.color=col;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function floatAt(el,txt,col){const r=el.getBoundingClientRect();floatText(r.left+r.width/2,r.top+r.height/3,txt,col)}
function shake(el){el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk')}
function showBox(html,btn,fn){$('mt').innerHTML=html;const g=$('go');if(btn){g.style.display='';g.textContent=btn;boxFn=fn}else{g.style.display='none';boxFn=null}$('msg').style.display='flex'}
function hideBox(){$('msg').style.display='none'}
$('go').onclick=()=>{hideBox();beep(520,.1);const f=boxFn;if(f)f()};
function stars(n){let s='';for(let i=0;i<3;i++)s+='<i'+(i<n?' class="on"':'')+'>★</i>';return '<span class="st">'+s+'</span>'}
function endBox(emoji,title,n,score,extra,btn,fn){const nb=saveBest(score);showBox('<span class="em">'+emoji+'</span><h2>'+title+'</h2>'+stars(n)+'Score <b style="color:#ffe14a">'+score+'</b>'+(nb?' 🏆 New best!':'')+'<small>Best '+best+(extra?' · '+extra:'')+'</small>',btn||'Play Again ▶',fn||startGame);if(n>=2)confetti(innerWidth/2,innerHeight/3,70);jingle(n>=2?[523,659,784,1047]:[392,330,262])}
function lsGet(k,d){try{const v=localStorage.getItem(GAME+':'+k);return v===null?d:+v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(GAME+':'+k,v)}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
updBest();


const N=11,bd=$('bd');let M,seen,vis,pl,en,items,floor,gold,kills,pot,over,cells=[],xp,plv;
const ET=[{e:'🐀',hp:4,a:[1,2],x:3},{e:'🦇',hp:3,a:[1,3],x:3,fl:1},{e:'💀',hp:7,a:[2,3],x:5},{e:'👹',hp:11,a:[2,4],x:7},{e:'🐍',hp:8,a:[3,4],x:6},{e:'🐉',hp:22,a:[4,6],x:15}];
function fit(){const s=$('stage'),m=Math.max(120,Math.min(s.clientWidth,s.clientHeight)-12);bd.style.setProperty('--bs',m+'px');bd.style.width=bd.style.height=m+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
for(let i=0;i<N*N;i++){const b=document.createElement('div');b.className='c';const x=i%N,y=Math.floor(i/N);b.onpointerdown=()=>tapCell(x,y);bd.appendChild(b);cells.push(b)}
const log=m=>$('log').textContent=m;
function gen(){
 for(let tries=0;tries<200;tries++){M=Array.from({length:N},()=>new Array(N).fill(1));const rooms=[];
  for(let k=0;k<30&&rooms.length<6;k++){const w=3+rnd(2),h=3+rnd(2),x=1+rnd(N-w-1),y=1+rnd(N-h-1);
   if(rooms.some(o=>x<o.x+o.w+1&&x+w+1>o.x&&y<o.y+o.h+1&&y+h+1>o.y))continue;rooms.push({x,y,w,h});for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)M[j][i]=0}
  if(rooms.length<3)continue;
  for(let i=1;i<rooms.length;i++){const a=rooms[i-1],b=rooms[i];let cx=a.x+(a.w>>1),cy=a.y+(a.h>>1);const tx=b.x+(b.w>>1),ty=b.y+(b.h>>1);
   while(cx!==tx){M[cy][cx]=0;cx+=cx<tx?1:-1}while(cy!==ty){M[cy][cx]=0;cy+=cy<ty?1:-1}M[ty][tx]=0}
  return rooms}
 return null}
function newFloor(){
 const rooms=gen();const r0=rooms[0],r1=rooms[rooms.length-1];
 pl.x=r0.x+(r0.w>>1);pl.y=r0.y+(r0.h>>1);M[r1.y+(r1.h>>1)][r1.x+(r1.w>>1)]=2;
 seen=Array.from({length:N},()=>new Array(N).fill(false));en=[];items=[];
 const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(M[y][x]===0&&Math.abs(x-pl.x)+Math.abs(y-pl.y)>3)free.push([x,y]);
 free.sort(()=>Math.random()-.5);
 const ne=Math.min(8,3+Math.floor(floor/2));
 for(let i=0;i<ne&&free.length;i++){const[x,y]=free.pop();const pool=ET.filter((t,j)=>(j<2)||(j===2&&floor>=2)||(j===3&&floor>=3)||(j===4&&floor>=4)||(j===5&&floor>=6));const t=pick(pool.slice(-3));const hp=t.hp+Math.floor(floor/3);en.push({x,y,t,hp,mx:hp,awake:false})}
 const kinds=['🧪','🧪','💰','💰','💰','⚔️','🛡️','❤️'];const ni=3+rnd(3);
 for(let i=0;i<ni&&free.length;i++){const[x,y]=free.pop();let k=pick(kinds);items.push({x,y,k})}
 compute()}
function compute(){vis=Array.from({length:N},()=>new Array(N).fill(false));for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x-pl.x)**2+(y-pl.y)**2<=17){vis[y][x]=true;seen[y][x]=true}}
function render(){
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const e=cells[y*N+x],w=M[y][x]===1;let cls='c',t='';
  if(seen[y][x]){cls+=w?(vis[y][x]?' wv':' wl'):(vis[y][x]?' fv':' fl');if(M[y][x]===2)t='🪜'}
  if(vis[y][x]){const it=items.find(i=>i.x===x&&i.y===y);if(it)t=it.k;const o=en.find(o=>o.x===x&&o.y===y);if(o)t=o.t.e}
  if(pl.x===x&&pl.y===y)t='🧙';
  if(e.textContent!==t)e.textContent=t;e.className=cls}
 $('fl').textContent=floor;$('hp').textContent=pl.hp+'/'+pl.mx;$('hb').style.width=Math.max(0,pl.hp/pl.mx*100)+'%';$('at').textContent=pl.atk;$('df').textContent=pl.def;$('gd').textContent=gold;$('pn').textContent=pot}
function flash(x,y){const e=cells[y*N+x];e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),320)}
function walk(x,y){return x>=0&&y>=0&&x<N&&y<N&&M[y][x]!==1}
function act(dx,dy){
 if(over)return;
 const nx=pl.x+dx,ny=pl.y+dy;let msg='';
 if(dx||dy){
  if(!walk(nx,ny)){beep(120,.06,'square',.1);return}
  const o=en.find(o=>o.x===nx&&o.y===ny);
  if(o){const d=Math.max(1,pl.atk+rnd(3)-1);o.hp-=d;o.awake=true;flash(nx,ny);beep(260,.08,'square',.12);const el=cells[ny*N+nx];floatAt(el,'-'+d,'#fff');msg='You hit '+o.t.e+' for '+d;
   if(o.hp<=0){en=en.filter(q=>q!==o);kills++;xp+=o.t.x;gold+=o.t.x;msg='You defeated '+o.t.e+'! +'+o.t.x+'💰';beep(700,.12);
    if(xp>=plv*8){xp-=plv*8;plv++;pl.mx+=4;pl.hp=Math.min(pl.mx,pl.hp+6);if(plv%2===0)pl.atk++;msg+=' ⭐ Level '+plv+'!';confetti(innerWidth/2,innerHeight/2,40)}}}
  else{pl.x=nx;pl.y=ny;
   const ii=items.findIndex(i=>i.x===nx&&i.y===ny);
   if(ii>=0){const k=items[ii].k;items.splice(ii,1);beep(900,.1);
    if(k==='🧪'){pot++;msg='Found a potion 🧪'}else if(k==='💰'){const g=5+rnd(10)+floor*2;gold+=g;msg='+'+g+' gold 💰'}else if(k==='⚔️'){pl.atk++;msg='Sharper sword! ⚔️ +1 attack'}else if(k==='🛡️'){pl.def++;msg='Stronger shield! 🛡️ +1 defense'}else{pl.mx+=5;pl.hp=Math.min(pl.mx,pl.hp+5);msg='Heart! ❤️ +5 max HP'}}
   if(M[ny][nx]===2){floor++;pl.hp=Math.min(pl.mx,pl.hp+3);newFloor();log('Floor '+floor+' - deeper we go! ⬇️');beep(400,.3);render();return}}}
 compute();enemies(msg);}
function bfs(){const D=Array.from({length:N},()=>new Array(N).fill(99));D[pl.y][pl.x]=0;const q=[[pl.x,pl.y]];while(q.length){const[x,y]=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const X=x+a,Y=y+b;if(walk(X,Y)&&D[Y][X]===99){D[Y][X]=D[y][x]+1;q.push([X,Y])}})}return D}
function enemies(msg){
 const D=bfs();let hits='';
 en.forEach(o=>{const d=D[o.y][o.x];if(d<=5||vis[o.y][o.x])o.awake=true;if(!o.awake)return;
  if(d===1){if(o.t.fl&&Math.random()<.4)return;const dm=Math.max(1,o.t.a[0]+rnd(o.t.a[1]-o.t.a[0]+1)-pl.def);pl.hp-=dm;hits+=' '+o.t.e+' hits you -'+dm+'!';flash(pl.x,pl.y);shake($('bd'));beep(160,.15,'sawtooth',.12)}
  else{let moves=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[o.x+a,o.y+b]).filter(([x,y])=>walk(x,y)&&M[y][x]!==2&&!en.some(q=>q.x===x&&q.y===y)&&!(x===pl.x&&y===pl.y));
   if(o.t.fl&&Math.random()<.5)moves.sort(()=>Math.random()-.5);else moves.sort((a,b)=>D[a[1]][a[0]]-D[b[1]][b[0]]);
   if(moves.length&&(o.t.fl||D[moves[0][1]][moves[0][0]]<d)){o.x=moves[0][0];o.y=moves[0][1]}}});
 log((msg+hits).trim()||'...');render();
 if(pl.hp<=0)die()}
function die(){over=true;render();const sc=floor*100+gold*3+kills*10;setTimeout(()=>endBox('💀','You died on floor '+floor,floor>=6?3:floor>=3?2:1,sc,kills+' kills · '+gold+' gold'),600)}
function usePot(){if(over)return;if(!pot){log('No potions! 🧪');return}if(pl.hp>=pl.mx){log('Already at full health');return}pot--;pl.hp=Math.min(pl.mx,pl.hp+10);beep(800,.2);floatAt(cells[pl.y*N+pl.x],'+10 ❤️','#ffd0e0');compute();enemies('You drink a potion +10 ❤️')}
function tapCell(x,y){if(over)return;const dx=x-pl.x,dy=y-pl.y;if(!dx&&!dy)return act(0,0);
 if(Math.abs(dx)+Math.abs(dy)===1)return act(dx,dy);
 if(!seen[y][x]||M[y][x]===1)return;
 const D=Array.from({length:N},()=>new Array(N).fill(99));D[y][x]=0;const q=[[x,y]];while(q.length){const[a,b]=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([i,j])=>{const X=a+i,Y=b+j;if(walk(X,Y)&&D[Y][X]===99){D[Y][X]=D[b][a]+1;q.push([X,Y])}})}
 let bm=null,bd2=99;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([i,j])=>{const X=pl.x+i,Y=pl.y+j;if(walk(X,Y)&&D[Y][X]<bd2){bd2=D[Y][X];bm=[i,j]}});if(bm)act(bm[0],bm[1])}
