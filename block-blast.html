<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Blast</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border:0;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;max-width:100vw}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;font-size:clamp(16px,4.5vw,22px);line-height:1.4;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.btn{font:inherit;font-size:clamp(24px,6vw,32px);font-weight:700;min-height:52px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;padding:12px 44px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}.btn{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button></div>
<script>
const KEY='block-blast.html_best';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);
let W=400,H=640,LAND=false,best=0,muted=false;
try{best=+localStorage.getItem(KEY)||0;muted=localStorage.getItem(KEY+'_m')=='1'}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,best)}catch(e){}return true}return false}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'_m',muted?1:0)}catch(x){}e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function relayout(){const land=innerWidth/innerHeight>1.15;const d=layout(land);LAND=land;if(d[0]!=W||d[1]!=H||!cv.width){W=d[0];H=d[1];cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}fit()}
function fit(){const vw=innerWidth,vh=innerHeight,top=LAND?0:56,s=Math.max(.1,Math.min(vw/W,(vh-top-4)/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top)/2)+'px'}
addEventListener('resize',relayout);addEventListener('orientationchange',()=>setTimeout(relayout,120));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hit=(r,x,y)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
const rnd=n=>Math.random()*n|0;
let parts=[],pops=[],shake=0;
function burst(x,y,n,cols,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c,s){pops.push({x,y,t,c,s,l:.9})}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const q of pops){q.y-=40*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);shake=Math.max(0,shake-dt*30)}
function drawFx(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1;for(const q of pops){g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,q.s||22,'center',q.c)}g.globalAlpha=1}
function txt(t,x,y,s,al,c){g.font='bold '+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign=al||'left';g.textBaseline='alphabetic';g.lineWidth=s/4.5;g.shadowBlur=0;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(x,y,w,h,c){g.save();g.globalAlpha=1;g.fillStyle=c||'#14367a';rr(x,y,w,h,h/2);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();g.restore()}
function gloss(x,y,w,h,r,c1,c2){g.save();g.globalAlpha=1;const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;rr(x,y,w,h,r);g.fill();g.globalAlpha=.4;g.fillStyle='#fff';rr(x+3,y+2,Math.max(2,w-6),Math.max(2,h*.38),r*.7);g.fill();g.restore()}
const PAL=[['#ff8a8a','#ee2b2b','#8f1010'],['#ffc266','#ff8a00','#9b4f00'],['#fff27a','#ffd000','#9a7a00'],['#8cf58c','#27c227','#116b11'],['#8cf3ff','#10b5e0','#07688a'],['#8fb0ff','#2f62ee','#162f8f'],['#d59bff','#a233ee','#5a1590'],['#ffa6e0','#ff3fb4','#9a1670']];
function blk(x,y,s,ci){const c=PAL[ci];g.save();g.globalAlpha=1;g.fillStyle=c[2];rr(x+.5,y+1.5,s-1,s-1,s*.24);g.fill();gloss(x+.5,y+.5,s-1,s-3,s*.24,c[0],c[1]);g.restore()}
function btn(b,c1,c2,c3,down){g.save();g.globalAlpha=1;const o=down?4:0;g.fillStyle=c3;rr(b.x,b.y+5,b.w,b.h-2,16);g.fill();gloss(b.x,b.y+o,b.w,b.h-5,16,c1,c2);g.restore()}
const starRow=(s,a,b,c)=>'<span class="stars">'+(s>=c?'⭐⭐⭐':s>=b?'⭐⭐☆':s>=a?'⭐☆☆':'☆☆☆')+'</span>';
function emo(e,x,y,s,base,al){g.save();g.globalAlpha=al==null?1:al;g.shadowBlur=0;g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline=base||'middle';g.fillStyle='#000';g.fillText(e,x,y);g.restore()}
function shakeOn(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
function bgFill(c1,c2){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,c1||'#27a2e8');bg.addColorStop(1,c2||'#1b4f86');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40)}
const ovHidden=()=>$('ov').classList.contains('hide');
function hideOv(){$('ov').classList.add('hide')}
function showOv(t,m,b){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;$('ov').classList.remove('hide')}
function resultOv(score,a,b,c,sub,win){const nb=saveBest(score);showOv(nb&&score>0?'New Record! 🏆':(win?'Great Job! 🎉':'Game Over'),starRow(score,a,b,c)+'<span class="big">'+score+'</span>'+(sub||'')+' Best '+best+(nb&&score>0?'<br><span class="nb">🎉 New best!</span>':''),'Play again')}
$('go').onclick=()=>{$('go').blur();if(!ovHidden())start()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();start()}});
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000)||0);last=now;update(dt);updFx(dt);draw();requestAnimationFrame(loop)}
function run(){relayout();last=performance.now();requestAnimationFrame(loop)}

const N=8;
const SRC=[['1',2],['11',3],['111',3],['1111',2],['11111',1.5],['1/1',3],['1/1/1',3],['1/1/1/1',2],['1/1/1/1/1',1.5],['11/11',4],['111/111/111',1.5],['11/11/11',2.5],['111/111',2.5],['10/11',2.5],['01/11',2.5],['11/10',2.5],['11/01',2.5],['100/100/111',1.5],['001/001/111',1.5],['111/100/100',1.5],['111/001/001',1.5],['111/010',2],['010/111',2],['10/11/10',2],['01/11/01',2],['110/011',2],['011/110',2],['01/11/10',2],['10/11/01',2]];
const SHP=SRC.map(([s,w])=>{const m=s.split('/').map(r=>[...r].map(Number));let n=0;m.forEach(r=>r.forEach(v=>n+=v));return{m,w,n,pw:m[0].length,ph:m.length}});
let L={bx:0,by:0,cs:44,slots:[],lift:80};
let grid,tray,drag,score,streak,noClear,moves,state='ready',clr=[],dyT=0,t=0;
function layout(land){
  L.cs=44;
  if(land){L.bx=170;L.by=34;L.slots=[0,1,2].map(i=>({x:552,y:66+i*118,w:196,h:108}));L.lift=60;return[760,420]}
  L.bx=24;L.by=76;L.slots=[0,1,2].map(i=>({x:14+i*128,y:452,w:120,h:150}));L.lift=84;return[400,622];
}
function pick(){const f=1+Math.min(1.2,moves/60);let tot=0;const ws=SHP.map(s=>{const w=s.w*(s.n>=5?f:s.n<=2?1/f:1);tot+=w;return w});let r=Math.random()*tot;for(let i=0;i<SHP.length;i++){r-=ws[i];if(r<=0)return mkp(SHP[i])}return mkp(SHP[1])}
const mkp=s=>({m:s.m,pw:s.pw,ph:s.ph,n:s.n,ci:rnd(8)});
function fitsAt(m,gx,gy){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){const x=gx+c,y=gy+r;if(x<0||y<0||x>=N||y>=N||grid[y][x])return false}return true}
function canAny(m){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(fitsAt(m,x,y))return true;return false}
function refill(){let t3;for(let k=0;k<40;k++){t3=[pick(),pick(),pick()];if(t3.some(p=>canAny(p.m)))break}tray=t3}
function start(){hideOv();grid=Array.from({length:N},()=>Array(N).fill(0));score=0;streak=0;noClear=0;moves=0;drag=null;clr=[];parts=[];pops=[];shake=0;state='play';refill();beep(520,.1,'triangle')}
function fullLines(extra){const rows=[],cols=[];const at=(x,y)=>grid[y][x]||(extra&&extra.has(x+','+y));
  for(let y=0;y<N;y++){let f=true;for(let x=0;x<N;x++)if(!at(x,y)){f=false;break}if(f)rows.push(y)}
  for(let x=0;x<N;x++){let f=true;for(let y=0;y<N;y++)if(!at(x,y)){f=false;break}if(f)cols.push(x)}return[rows,cols]}
function place(i,gx,gy){
  const p=tray[i],cs=L.cs;
  p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)grid[gy+y][gx+x]=p.ci+1}));
  tray[i]=null;moves++;let pts=p.n;
  const[rows,cols]=fullLines(),n=rows.length+cols.length;
  beep(300+p.n*30,.06,'square',.04);
  if(n){
    const set=new Set();rows.forEach(y=>{for(let x=0;x<N;x++)set.add(x+','+y)});cols.forEach(x=>{for(let y=0;y<N;y++)set.add(x+','+y)});
    set.forEach(k=>{const[x,y]=k.split(',').map(Number);clr.push({x,y,ci:grid[y][x]-1,t:0});burst(L.bx+(x+.5)*cs,L.by+(y+.5)*cs,3,['#fff',PAL[grid[y][x]-1][1],'#ffe14d'],170);grid[y][x]=0});
    streak++;noClear=0;pts+=n*10+(n-1)*n*10+(streak>1?streak*10:0);
    const cx=L.bx+N*cs/2,cy=L.by+N*cs/2;
    pop(cx,cy,'+'+pts,'#ffe14d',n>1?34:28);
    if(n>1)pop(cx,cy-36,['','','Double!','Triple!','Awesome!','Amazing!'][Math.min(n,5)],'#ff9a3d',26);
    if(streak>1)pop(cx,cy+34,'Combo x'+streak,'#5fd35f',24);
    if(grid.every(r=>r.every(v=>!v))){pts+=100;pop(cx,cy-70,'PERFECT! +100','#ff7be5',26)}
    shake=Math.min(12,4+n*2);beep(520+n*100,.25,'triangle',.06);
  }else{noClear++;if(noClear>=3)streak=0}
  score+=pts;
  if(tray.every(q=>!q))refill();
  if(!tray.some(q=>q&&canAny(q.m))){state='dying';dyT=0;beep(220,.6,'sawtooth',.07,-170);shake=10}
}
function update(dt){t+=dt;for(const c of clr)c.t+=dt;clr=clr.filter(c=>c.t<.4);
  if(state=='dying'){dyT+=dt;if(dyT>1.1){state='over';resultOv(score,200,600,1500,'Moves '+moves+'<br>')}}}
function target(){if(!drag)return null;const p=tray[drag.i],cs=L.cs;const gx=Math.round((drag.x-p.pw*cs/2-L.bx)/cs),gy=Math.round((drag.y-L.lift-p.ph*cs/2-L.by)/cs);return{gx,gy,ok:fitsAt(p.m,gx,gy)}}
function drawPiece(p,cx,cy,cs){const ox=cx-p.pw*cs/2,oy=cy-p.ph*cs/2;p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)blk(ox+x*cs,oy+y*cs,cs,p.ci)}))}
function draw(){
  shakeOn();bgFill();const cs=L.cs,bx=L.bx,by=L.by;
  g.fillStyle='#0b2a5c';rr(bx-8,by-8,N*cs+16,N*cs+20,16);g.fill();g.fillStyle='#14367a';rr(bx-6,by-6,N*cs+12,N*cs+12,14);g.fill();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=((x>>1)+(y>>1))%2?'#1d4f9c':'#17448a';rr(bx+x*cs+1,by+y*cs+1,cs-2,cs-2,6);g.fill()}
  if(grid)for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])blk(bx+x*cs,by+y*cs,cs,grid[y][x]-1);
  for(const c of clr){const k=c.t/.4,s=cs*(1+k*.25)*(1-k);g.save();g.translate(bx+(c.x+.5)*cs,by+(c.y+.5)*cs);g.rotate(k*.8);blk(-s/2,-s/2,Math.max(1,s),c.ci);g.restore()}
  const tg=target();
  if(tg&&tg.ok){const p=tray[drag.i],set=new Set();p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)set.add((tg.gx+x)+','+(tg.gy+y))}));
    const[rows,cols]=fullLines(set);g.lineWidth=4;g.strokeStyle='#ffe14d';rows.forEach(y=>{rr(bx+2,by+y*cs+2,N*cs-4,cs-4,8);g.stroke()});cols.forEach(x=>{rr(bx+x*cs+2,by+2,cs-4,N*cs-4,8);g.stroke()});
    p.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){g.fillStyle=PAL[p.ci][0];rr(bx+(tg.gx+x)*cs+3,by+(tg.gy+y)*cs+3,cs-6,cs-6,7);g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke()}}))}
  for(let i=0;i<3;i++){const s=L.slots[i];g.fillStyle='#0b2a5c';rr(s.x,s.y+4,s.w,s.h,18);g.fill();g.fillStyle='#14367a';rr(s.x,s.y,s.w,s.h,18);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();
    const p=tray&&tray[i];if(p&&!(drag&&drag.i==i)){const k=Math.min(26,(s.w-16)/p.pw,(s.h-16)/p.ph);drawPiece(p,s.x+s.w/2,s.y+s.h/2,k)}}
  if(drag){const p=tray[drag.i];drawPiece(p,drag.x,drag.y-L.lift,cs)}
  if(LAND){pill(10,70,150,42);txt('Score',22,98,17,'left','#ffe14d');txt(''+score,150,98,24,'right');pill(10,122,150,42);txt('Best',22,150,17,'left','#ffe14d');txt(''+best,150,150,22,'right');if(streak>1)txt('Combo x'+streak,85,200,22,'center','#ffe14d')}
  else{pill(10,8,190,42);txt('Score '+score,24,38,24);pill(210,8,180,42);txt('Best '+best,226,36,20);if(streak>1)txt('🔥 Combo x'+streak,200,67,18,'center','#ffe14d')}
  if(state=='dying')txt('No room left!',bx+N*cs/2,by+N*cs/2,36,'center','#ff5c5c');
  drawFx();g.restore();
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state!='play'||drag)return;const[x,y]=pos(e);
  for(let i=0;i<3;i++)if(tray[i]&&hit(L.slots[i],x,y)){drag={i,x,y,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}beep(600,.04,'triangle',.03);return}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!=drag.id)return;const[x,y]=pos(e);drag.x=x;drag.y=y});
function up(e){if(!drag||e.pointerId!=drag.id)return;const[x,y]=pos(e);drag.x=x;drag.y=y;const tg=target(),i=drag.i;drag=null;
  if(state=='play'){if(tg.ok)place(i,tg.gx,tg.gy);else beep(200,.1,'square',.04)}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(drag&&e.pointerId==drag.id)drag=null});
showOv('🟦 Block Blast','Drag the 3 shapes onto the grid.<br>Fill a full row or column to blast it!<br>Chain combos for big points.','Play');
run();

</script></body></html>
