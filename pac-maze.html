<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pac Maze</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:radial-gradient(circle at 50% 30%,#2b3a8f,#0f1747 70%,#070b26) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation;padding:0}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;max-width:100vw}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:500;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;font-size:clamp(16px,4.5vw,22px);line-height:1.4;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.btn{font:inherit;font-weight:700;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#go{font-size:clamp(24px,6vw,32px);min-height:52px;padding:12px 44px;animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
#pad{position:fixed;left:0;right:0;bottom:8px;display:none;justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:40;pointer-events:none}
@media (pointer:coarse),(hover:none){#pad{display:flex}}
#pad .pb{pointer-events:auto;width:68px;height:68px;font-size:30px;padding:0;margin:0;touch-action:none}
#pad .pb.f{width:92px;background:linear-gradient(#ff9a5c,#e8451e);box-shadow:0 5px 0 #8f200d;text-shadow:0 2px 0 #8f200d}
#pad .pb.f.on,#pad .pb.f:active{box-shadow:0 1px 0 #8f200d}
#pad .pb.t{background:linear-gradient(#ffd84d,#f0a30a);box-shadow:0 5px 0 #a86c00;text-shadow:0 2px 0 #a86c00}
#pad .pb.t.on,#pad .pb.t:active{box-shadow:0 1px 0 #a86c00}
#pl,#pr{display:flex;gap:10px;align-items:flex-end}
.dp{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:6px}
.dp .u{grid-area:1/2}.dp .l{grid-area:2/1}.dp .d{grid-area:2/2}.dp .r{grid-area:2/3}
@media (orientation:landscape) and (max-height:500px){
#pad{bottom:auto;top:0;height:100%;padding:0}
#pl,#pr{position:fixed;top:50%;transform:translateY(-50%);flex-wrap:wrap;justify-content:center}
#pl{left:8px;width:190px}#pr{right:8px;width:190px}
#pad .pb{width:56px;height:56px;font-size:26px}#pad .pb.f{width:76px}
.dp{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:4px}
#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#go{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="pad"><div id="pl"></div><div id="pr"><div class="dp"><button class="btn pb u" data-k="up">▲</button><button class="btn pb l" data-k="left">◀</button><button class="btn pb d" data-k="down">▼</button><button class="btn pb r" data-k="right">▶</button></div></div></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button></div>
<script>
const W=456,H=520,KEY='pac-maze.html_best',PADH=150,SIDEW=190;
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
let best=0,muted=false;
try{best=+localStorage.getItem(KEY)||0;muted=localStorage.getItem(KEY+'_m')=='1'}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,best)}catch(e){}return true}return false}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'_m',muted?1:0)}catch(x){}e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function fit(){const vw=innerWidth,vh=innerHeight,pd=$('pad'),sp=pd&&getComputedStyle(pd).display!='none';
 const land=sp&&matchMedia('(orientation:landscape) and (max-height:500px)').matches;
 const bot=sp&&!land?PADH:0,side=land?SIDEW*2+16:0;let top=60;
 let s=Math.min((vw-side)/W,(vh-top-4-bot)/H);const s2=Math.min((vw-side)/W,(vh-8-bot)/H);
 if(land||(vw-side-W*s2)/2>=130){top=4;s=s2}
 s=Math.max(.2,s);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top-bot-4)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
let parts=[],pops=[],shake=0;
function burst(x,y,n,cols,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c,s){pops.push({x,y,t,c,s,l:.9})}
function clearFx(){parts=[];pops=[];shake=0}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const q of pops){q.y-=40*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);shake=Math.max(0,shake-dt*30)}
function drawFx(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1;for(const q of pops){g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,q.s||22,'center',q.c)}g.globalAlpha=1}
function txt(t,x,y,s,al,c){g.font='bold '+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign=al||'left';g.textBaseline='alphabetic';g.lineWidth=s/4.5;g.shadowBlur=0;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(x,y,w,h,c){g.save();g.globalAlpha=1;g.fillStyle=c||'#14367a';rr(x,y,w,h,h/2);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();g.restore()}
function gloss(x,y,w,h,r,c1,c2){g.save();g.globalAlpha=1;const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;rr(x,y,w,h,r);g.fill();g.globalAlpha=.4;g.fillStyle='#fff';rr(x+3,y+2,Math.max(2,w-6),Math.max(2,h*.38),Math.min(r*.7,h/2));g.fill();g.restore()}
const stars=n=>'<span class="stars">'+'⭐'.repeat(n)+'☆'.repeat(3-n)+'</span>';
function emo(e,x,y,s,base,al){g.save();g.globalAlpha=al==null?1:al;g.shadowBlur=0;g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline=base||'middle';g.fillStyle='#000';g.fillText(e,x,y);g.restore()}
function shakeOn(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
const ovHidden=()=>$('ov').classList.contains('hide');
function hideOv(){$('ov').classList.add('hide')}
function showOv(t,m,b){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;$('ov').classList.remove('hide')}
/* input: keys + pad buttons */
const keys={left:0,right:0,up:0,down:0,fire:0},hooks={press(k){}};
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down',' ':'fire',z:'fire',x:'fire'};
function setKey(k,v){if(v&&!keys[k])hooks.press(k);keys[k]=v?1:0;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',!!v))}
addEventListener('keydown',e=>{const k=KM[e.key.toLowerCase()];if(k&&ovHidden()){e.preventDefault();if(!e.repeat)setKey(k,1)}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)setKey(k,0)});
addEventListener('blur',()=>{for(const k in keys)setKey(k,0)});
document.querySelectorAll('.pb').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}setKey(k,1)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,0)))});
$('go').onclick=()=>{$('go').blur();startGame()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();startGame()}});
/* ---------- GAME ---------- */
const T=24,OY=56,NC=19,NR=19,PX=9,PYS=15;
const TOP='###################,#........#........#,#o##.###.#.###.##o#,#.................#,#.##.#.#####.#.##.#,#....#...#...#....#,####.###.#.###.####,####.#.......#.####,####.#.##-##.#.####,.....#.#   #.#.....,####.#.#####.#.####'.split(',');
const MAPR=TOP.concat([TOP[7],TOP[6],TOP[5],TOP[4],TOP[3],TOP[2],TOP[1],TOP[0]]);
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
const GH=[{n:'Chaser',c:'#ff3b3b',cr:[18,0],rel:0},{n:'Sneaky',c:'#ff7be5',cr:[0,0],rel:2.5},{n:'Tricky',c:'#2fe0e0',cr:[18,18],rel:6},{n:'Dreamy',c:'#ff9a1f',cr:[0,18],rel:10}];
let state='ready',score=0,lives=3,lvl=1,dots=[],left=0,pl,gs=[],want=[0,0],face=0,fright=0,chain=0,modeT=0,stT=0,t=0,mouth=0,tx0=null,ty0=0,dmap=null;
const wx=x=>(x+NC)%NC;
function cell(x,y){if(y<0||y>=NR)return'#';if(x<0||x>=NC)return y==9?'.':'#';return MAPR[y][x]}
function pass(x,y,door){const c=cell(x,y);return c!='#'&&(c!='-'||door)}
function bfs(){dmap=[];for(let y=0;y<NR;y++)dmap.push(Array(NC).fill(999));const q=[[9,9]];dmap[9][9]=0;
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of DIRS){const nx=wx(x+dx),ny=y+dy;if(ny<0||ny>=NR||!pass(nx,ny,true)||dmap[ny][nx]<999)continue;dmap[ny][nx]=dmap[y][x]+1;q.push([nx,ny])}}}
function fillDots(){dots=[];left=0;for(let y=0;y<NR;y++){dots.push([]);for(let x=0;x<NC;x++){const c=MAPR[y][x];let d=c=='.'?1:c=='o'?2:0;if(y==PYS&&x==PX)d=0;if(y==9&&(x<5||x>13))d=0;dots[y].push(d);if(d)left++}}}
function ent(x,y){return{tx:x,ty:y,nx:x,ny:y,p:0,dx:0,dy:0}}
function resetPos(){
  pl=ent(PX,PYS);want=[0,0];face=0;fright=0;chain=0;modeT=0;
  gs=GH.map((d,i)=>{const e=ent(i?8+(i-1):9,i?9:7);Object.assign(e,{i,c:d.c,cr:d.cr,mode:i?'pen':'out',rel:d.rel/(1+.1*(lvl-1)),scared:false,dx:i?0:-1});if(!i){e.nx=8;}return e});
}
function startGame(){
  if(ovHidden())return;hideOv();clearFx();score=0;lives=3;lvl=1;if(!dmap)bfs();fillDots();resetPos();state='ready2';stT=1.4;beep(520,.1,'triangle');
}
const epos=e=>{const x=e.tx+(e.nx-e.tx)*e.p,y=e.ty+(e.ny-e.ty)*e.p;return[x,y]};
function setWant(dx,dy){want=[dx,dy]}
hooks.press=k=>{if(k=='left')setWant(-1,0);else if(k=='right')setWant(1,0);else if(k=='up')setWant(0,-1);else if(k=='down')setWant(0,1)};
function pickPlayer(){
  for(const d of [want,[pl.dx,pl.dy]]){if((d[0]||d[1])&&pass(wx(pl.tx)+d[0],pl.ty+d[1],false)){pl.dx=d[0];pl.dy=d[1];pl.nx=pl.tx+d[0];pl.ny=pl.ty+d[1];face=d[0]>0?0:d[1]>0?1:d[0]<0?2:3;return}}
  pl.dx=pl.dy=0;pl.nx=pl.tx;pl.ny=pl.ty;pl.p=0;
}
function eat(){
  const x=wx(pl.tx),y=pl.ty,d=dots[y][x];if(!d)return;dots[y][x]=0;left--;
  if(d==1){score+=10;beep(420+(left%2)*80,.04,'triangle',.04)}
  else{score+=50;fright=Math.max(3,8-lvl*.6);chain=0;beep(200,.3,'sawtooth',.06,400);for(const g2 of gs)if(g2.mode=='out'){g2.scared=true;if(g2.dx||g2.dy){const a=g2.tx,b=g2.ty;g2.tx=g2.nx;g2.ty=g2.ny;g2.nx=a;g2.ny=b;g2.p=1-g2.p;g2.dx*=-1;g2.dy*=-1}}}
  if(left<=0){state='clear';stT=1.6;beep(700,.4,'triangle',.07,500);pop(W/2,OY+9*T,'Maze clear!','#ffe14d',32)}
}
function target(e){
  const [px,py]=[wx(pl.tx),pl.ty],scatter=(modeT%24)<6&&lvl<8;
  if(scatter)return e.cr;
  const fx=face==0?1:face==2?-1:0,fy=face==1?1:face==3?-1:0;
  if(e.i==0)return[px,py];
  if(e.i==1)return[px+4*fx,py+4*fy];
  if(e.i==2){const r=gs[0],vx=px+2*fx,vy=py+2*fy;return[2*vx-r.tx,2*vy-r.ty]}
  return(Math.hypot(px-e.tx,py-e.ty)>7)?[px,py]:e.cr;
}
function arriveGhost(e){
  e.tx=wx(e.tx);e.nx=e.tx;e.ny=e.ty;
  if(e.mode=='exit'){
    if(e.ty==9&&e.tx!=9){e.dx=Math.sign(9-e.tx);e.dy=0}else if(e.tx==9&&e.ty>7){e.dx=0;e.dy=-1}
    else{e.mode='out';e.dx=Math.random()<.5?-1:1;e.dy=0}
    if(e.mode=='exit'){e.nx=e.tx+e.dx;e.ny=e.ty+e.dy;return}
  }
  if(e.mode=='eyes'){
    if(e.tx==9&&e.ty==9){e.mode='exit';e.scared=false;e.dx=0;e.dy=-1;e.nx=9;e.ny=8;return}
    let b=null,bd=999;for(const [dx,dy] of DIRS){const nx=wx(e.tx+dx),ny=e.ty+dy;if(ny<0||ny>=NR||!pass(nx,ny,true))continue;if(dmap[ny][nx]<bd){bd=dmap[ny][nx];b=[dx,dy]}}
    e.dx=b[0];e.dy=b[1];e.nx=e.tx+e.dx;e.ny=e.ty+e.dy;return;
  }
  let c=[];for(const [dx,dy] of DIRS)if(!(dx==-e.dx&&dy==-e.dy&&(dx||dy))&&pass(wx(e.tx+dx),e.ty+dy,false))c.push([dx,dy]);
  if(!c.length)for(const [dx,dy] of DIRS)if(pass(wx(e.tx+dx),e.ty+dy,false))c.push([dx,dy]);
  let b;if(e.scared||Math.random()<.04)b=c[rint(0,c.length-1)];
  else{const tg=target(e);let bd=1e9;for(const d of c){const q=Math.pow(e.tx+d[0]-tg[0],2)+Math.pow(e.ty+d[1]-tg[1],2);if(q<bd){bd=q;b=d}}}
  e.dx=b[0];e.dy=b[1];e.nx=e.tx+e.dx;e.ny=e.ty+e.dy;
}
function ghostSpeed(e){return e.mode=='eyes'?11:e.mode=='exit'?3.5:e.scared?3.4:Math.min(6.2,5+.25*(lvl-1))}
function loseLife(){state='dying';stT=1.2;shake=10;beep(300,.8,'sawtooth',.07,-250);const [x,y]=epos(pl);burst(x*T+T/2,OY+y*T+T/2,24,['#4fc3ff','#fff','#ffe14d'],200)}
function update(dt){
  t+=dt;mouth+=dt*(pl&&(pl.dx||pl.dy)?14:0);
  if(state=='ready'||state=='over')return;
  if(state=='ready2'){stT-=dt;if(stT<=0)state='play';return}
  if(state=='clear'){stT-=dt;if(stT<=0){lvl++;score+=500;fillDots();resetPos();state='ready2';stT=1.2}return}
  if(state=='dying'){stT-=dt;if(stT<=0){lives--;if(lives<=0){over()}else{resetPos();state='ready2';stT=1.2}}return}
  modeT+=dt;
  if(fright>0){fright-=dt;if(fright<=0)for(const e of gs)e.scared=false}
  // player
  if(!(pl.dx||pl.dy))pickPlayer();
  else if(want[0]==-pl.dx&&want[1]==-pl.dy&&(want[0]||want[1])){const a=pl.tx,b=pl.ty;pl.tx=pl.nx;pl.ty=pl.ny;pl.nx=a;pl.ny=b;pl.p=1-pl.p;pl.dx=-pl.dx;pl.dy=-pl.dy;face=pl.dx>0?0:pl.dy>0?1:pl.dx<0?2:3}
  pl.p+=6.3*dt;
  let guard=0;while(pl.p>=1&&guard++<4){pl.p-=1;pl.tx=wx(pl.nx);pl.ty=pl.ny;pl.nx=pl.tx;pl.ny=pl.ty;eat();if(state!='play')return;pickPlayer();if(!(pl.dx||pl.dy)){pl.p=0;break}}
  // ghosts
  for(const e of gs){
    if(e.mode=='pen'){e.rel-=dt;if(e.rel<=0){e.mode='exit';arriveGhost(e);e.p=0}continue}
    e.p+=ghostSpeed(e)*dt;guard=0;
    while(e.p>=1&&guard++<4){e.p-=1;e.tx=e.nx;e.ty=e.ny;arriveGhost(e)}
    if(!e.dx&&!e.dy&&e.mode=='out')arriveGhost(e);
  }
  const [px,py]=epos(pl);
  for(const e of gs){
    if(e.mode=='pen'||e.mode=='eyes'||e.mode=='exit'&&!e.scared&&false)continue;
    const [gx,gy]=epos(e);if(Math.hypot(gx-px,gy-py)<.62){
      if(e.scared){e.scared=false;e.mode='eyes';chain++;const p=100*Math.pow(2,chain);score+=p;pop(gx*T+T/2,OY+gy*T,'+'+p,'#ffe14d',24);burst(gx*T+T/2,OY+gy*T+T/2,18,[e.c,'#fff'],200);beep(600,.25,'square',.06,500);e.nx=e.tx;e.ny=e.ty;e.p=0;arriveGhost(e)}
      else if(e.mode=='out'||e.mode=='exit'){loseLife();return}
    }
  }
}
function over(){
  state='over';const nb=saveBest(score);const n=score>=8000?3:score>=4000?2:score>=1500?1:0;
  setTimeout(()=>showOv(nb&&score>0?'New Record! 🏆':'Game Over 🫧',stars(n)+'<span class="big">'+score+'</span>Reached level '+lvl+' · Best '+best+(nb&&score>0?'<br><span class="nb">🎉 New best!</span>':''),'Play again'),600);
}
function drawGhost(e){
  const [x,y]=epos(e),cx=x*T+T/2,cy=OY+y*T+T/2+(e.mode=='pen'?Math.sin(t*6+e.i)*2:0);
  g.save();g.translate(cx,cy);
  if(e.mode!='eyes'){
    const fl=e.scared&&fright<2&&Math.floor(t*6)%2;const col=e.scared?(fl?'#fff':'#2a4fd6'):e.c;
    g.strokeStyle='#0b2a5c';g.lineWidth=2.5;g.lineJoin='round';g.fillStyle=col;
    g.beginPath();g.moveTo(-10,9);g.lineTo(-10,-2);g.arc(0,-2,10,Math.PI,0);g.lineTo(10,9);g.lineTo(6,5);g.lineTo(2,9);g.lineTo(-2,5);g.lineTo(-6,9);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(0,-12);g.lineTo(0,-16);g.stroke();g.fillStyle=e.scared?'#ffe14d':'#fff';g.beginPath();g.arc(0,-17,2.8,0,6.283);g.fill();g.stroke();
  }
  if(e.scared&&e.mode!='eyes'){g.fillStyle='#fff';g.fillRect(-5,-4,3,3);g.fillRect(2,-4,3,3);g.strokeStyle='#fff';g.lineWidth=1.8;g.beginPath();g.moveTo(-6,4);g.lineTo(-3,2);g.lineTo(0,4);g.lineTo(3,2);g.lineTo(6,4);g.stroke()}
  else for(const s of[-4.5,4.5]){g.fillStyle='#fff';g.beginPath();g.arc(s,-3,4,0,6.283);g.fill();g.fillStyle='#14367a';g.beginPath();g.arc(s+e.dx*1.6,-3+e.dy*1.6,2,0,6.283);g.fill()}
  g.restore();
}
function drawPlayer(){
  const [x,y]=epos(pl);let cx=x*T+T/2,cy=OY+y*T+T/2;
  g.save();g.translate(cx,cy);
  let sc=1;if(state=='dying'){sc=Math.max(0,stT/1.2);g.rotate((1.2-stT)*10)}g.scale(sc,sc);
  const gr=g.createRadialGradient(-3,-4,1,0,0,11);gr.addColorStop(0,'#9be4ff');gr.addColorStop(1,'#1f8fe8');
  g.fillStyle=gr;g.strokeStyle='#0b2a5c';g.lineWidth=2.5;g.beginPath();g.arc(0,0,10.5,0,6.283);g.fill();g.stroke();
  g.beginPath();g.arc(-7,-9,3.5,0,6.283);g.arc(7,-9,3.5,0,6.283);g.fillStyle='#1f8fe8';g.fill();
  g.save();g.rotate(face*Math.PI/2);const o=(Math.sin(mouth)+1)/2*.8+.15;g.fillStyle='#4a0a2a';g.beginPath();g.ellipse(5,0,5.5,3+o*4.5,0,0,6.283);g.fill();g.fillStyle='#ff7b9a';g.beginPath();g.ellipse(6,1.5,2.6,1.4*o+.4,0,0,6.283);g.fill();g.restore();
  const ex=face==2?-1:face==0?1:0,ey=face==1?1:face==3?-1:0;
  for(const s of[-3.8,3.8]){const ox=(face==0||face==2)?s*.5-ex*1:s,oy=(face==0||face==2)?-5.5:-5.5+ey*2;g.fillStyle='#fff';g.beginPath();g.arc(ox,oy,3,0,6.283);g.fill();g.fillStyle='#111';g.beginPath();g.arc(ox+ex*1.2,oy+ey*1,1.5,0,6.283);g.fill()}
  g.restore();
}
function draw(){
  shakeOn();
  g.fillStyle='#08113a';g.fillRect(-20,-20,W+40,H+40);
  for(let y=0;y<NR;y++)for(let x=0;x<NC;x++){
    const c=MAPR[y][x],px=x*T,py=OY+y*T;
    if(c=='#'){g.fillStyle='#1d4fc4';rr(px+1,py+1,T-2,T-2,6);g.fill();g.fillStyle='#4f86f0';rr(px+3,py+2,T-6,6,3);g.fill()}
    else if(c=='-'){g.fillStyle='#ff7be5';g.fillRect(px,py+T/2-3,T,6)}
    else{const d=dots[y]&&dots[y][x];if(d==1){g.fillStyle='#ffe9a8';g.beginPath();g.arc(px+T/2,py+T/2,3,0,6.283);g.fill()}else if(d==2){const r=6+Math.sin(t*8)*1.5;g.fillStyle='#ffb347';g.beginPath();g.arc(px+T/2,py+T/2,r,0,6.283);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}}
  }
  if(pl){for(const e of gs)drawGhost(e);drawPlayer()}
  drawFx();
  if(state=='ready2')txt('Ready!',W/2,OY+11*T+8,30,'center','#ffe14d');
  g.restore();
  pill(8,8,150,40);txt('Score '+score,38,36,22);
  pill(W-150,8,142,40);txt('Level '+lvl,W-138,36,22,'left','#ffe14d');
  for(let i=0;i<lives;i++){g.fillStyle='#1f8fe8';g.strokeStyle='#0b2a5c';g.lineWidth=2;g.beginPath();g.arc(W/2-24+i*24,28,9,0,6.283);g.fill();g.stroke()}
  if(fright>0){g.fillStyle='#14367a';g.fillRect(W/2-40,H-8,80,5);g.fillStyle='#5cc8ff';g.fillRect(W/2-40,H-8,80*Math.min(1,fright/6),5)}
}
cv.addEventListener('pointerdown',e=>{tx0=e.clientX;ty0=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{if(tx0==null)return;const dx=e.clientX-tx0,dy=e.clientY-ty0;if(Math.hypot(dx,dy)>18){if(Math.abs(dx)>Math.abs(dy))setWant(Math.sign(dx),0);else setWant(0,Math.sign(dy));tx0=e.clientX;ty0=e.clientY}});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>tx0=null));
showOv('🫧 Pac Maze','Gobble every dot with <b>Munchkin</b>! Dodge the 4 bugbots: <b>Chaser</b> hunts you, <b>Sneaky</b> ambushes ahead, <b>Tricky</b> flanks, <b>Dreamy</b> wanders. Power pellets turn the tables!<br>Swipe, arrows or buttons','Play');

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000)||0);last=now;try{update(dt);updFx(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
