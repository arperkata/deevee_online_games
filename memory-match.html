<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Memory Match - Flip cards, find the pairs. Free online game, plays on phone, tablet and PC. No sign-up."><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#1e90e6,#8fdcff);color:#fff;text-align:center;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;padding:8px 10px 4px}
a.home,.mute{background:linear-gradient(#ffb21f,#f07a0a);color:#fff;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;text-decoration:none;font:700 17px inherit;font-family:inherit;border:0;box-shadow:0 4px 0 #a9560b;cursor:pointer}
.mute{padding:0 12px}
h1{margin:0;font-size:clamp(22px,4.5vw,40px);color:#fff;text-shadow:0 3px 0 #0b3a78,2px 2px 0 #0b3a78,-2px -2px 0 #0b3a78,2px -2px 0 #0b3a78,-2px 2px 0 #0b3a78}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(16px,3vw,22px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px 10px}
#grid{display:grid;gap:clamp(6px,1.6vmin,12px);padding:clamp(8px,2vmin,16px);background:linear-gradient(#103d86,#0a2a63);border-radius:22px;box-shadow:0 8px 0 #06204a,0 12px 24px rgba(0,0,0,.35);border:4px solid #3aa0ff}
.card{perspective:700px;cursor:pointer;min-width:0;min-height:0;transition:transform .12s}
.card:active{transform:scale(.94)}
.in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.b{background:radial-gradient(circle at 30% 25%,#ffe27a,#ffb21f 45%,#f07a0a);border:3px solid #fff;color:#fff;font-weight:700;font-size:var(--fs);text-shadow:0 2px 0 #a9560b}
.f{background:linear-gradient(#fff,#d9efff);border:3px solid #fff;transform:rotateY(180deg);font-size:var(--fs);line-height:1}
.card.ok .f{background:linear-gradient(#d4ffc8,#6fe05a);border-color:#ffe14a;animation:pop .45s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.18)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.82);z-index:50;padding:16px}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:20px 28px;box-shadow:0 8px 0 #06244d;max-width:92vw;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
#mt{font-size:clamp(26px,6vw,40px);font-weight:700;text-shadow:0 3px 0 #0b3a78}
#mt .st{font-size:clamp(34px,9vw,56px);letter-spacing:4px;display:block;margin:4px 0}
#mt small{font-size:.6em;color:#ffe14a}
button.go{font:700 clamp(20px,5vw,28px) inherit;font-family:inherit;margin-top:14px;padding:.4em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 6px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
@media (max-height:500px){h1{display:none}#top{padding:4px 8px 0}}
</style></head><body>
<div id="top"><a class="home" href="index.html">⌂ Home</a><h1>Memory Match</h1><span class="pill" id="lvP">Level <b id="lv">1</b></span><span class="pill" id="mvP">Moves <b id="mv">0</b></span><span class="pill" id="bsP">Best <b id="bs">0</b></span><span class="pill" id="p1" style="display:none"></span><span class="pill" id="p2" style="display:none"></span><button class="mute" id="menuBtn">☰ Menu</button><button class="mute" id="mute" aria-label="Sound">🔊</button></div>
<div id="stage"><div id="grid"></div></div>
<canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt"></div><button class="go" id="nx">Next level ▶</button><div id="modes"></div></div></div>
<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const EM=Array.from("🐶🐱🐸🦊🐼🐵🦁🐯🐰🐻🐧🐙🦋🐢🐳🦄🍎🍓");
const LEVELS=[[2,2],[3,2],[4,3],[4,4],[5,4],[6,4]];
let VM=null,LVL='hard',NMV=['Player 1','Player 2'],sc=[0,0],turnI=0,known=new Map(),tok=0;
let level=0,moves=0,open=[],left=0,lock=false,ac,muted=false,bestLv=0,cols=2,rows=2;
const $=id=>document.getElementById(id);
try{bestLv=+localStorage.getItem('mmbest')||0}catch(e){}
$('bs').textContent=bestLv;
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function beep(f,d=.12){if(muted)return;try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* confetti */
const fx=$('fx'),fc=fx.getContext('2d');let P=[],raf=0,lt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();
function confetti(x,y,n=40){const C=['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=150+Math.random()*350;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,l:1.2+Math.random()*.6,c:C[i%6],r:Math.random()*6,s:5+Math.random()*6})}lt=performance.now();if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;fc.clearRect(0,0,fx.width,fx.height);P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.min(1,p.l*2);fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});P=P.filter(p=>p.l>0&&p.y<fx.height+20);raf=P.length?requestAnimationFrame(tick):0;if(!raf)fc.clearRect(0,0,fx.width,fx.height)}
function fit(){
  const st=$('stage'),gr=$('grid'),cs=getComputedStyle(gr);
  const gap=parseFloat(cs.columnGap)||8,pad=parseFloat(cs.paddingLeft)||8,bd=4;
  const aw=st.clientWidth-20-2*(pad+bd),ah=st.clientHeight-16-2*(pad+bd);
  let cell=Math.min((aw-gap*(cols-1))/cols,(ah-gap*(rows-1))/rows,150);
  cell=Math.max(30,Math.floor(cell));
  gr.style.gridTemplateColumns='repeat('+cols+','+cell+'px)';gr.style.gridAutoRows=cell+'px';
  gr.style.setProperty('--fs',Math.floor(cell*.6)+'px');
}
addEventListener('resize',()=>{fxfit();fit()});addEventListener('orientationchange',()=>setTimeout(()=>{fxfit();fit()},200));
function build(){
  tok++;[cols,rows]=VM?[5,4]:LEVELS[Math.min(level,LEVELS.length-1)];const n=cols*rows/2;
  const set=[...EM].sort(()=>Math.random()-.5).slice(0,n);
  const deck=[...set,...set].sort(()=>Math.random()-.5);
  const gr=$('grid');gr.innerHTML='';
  deck.forEach(e=>{const d=document.createElement('div');d.className='card';d.dataset.e=e;
    d.innerHTML='<div class="in"><div class="b">?</div><div class="f">'+e+'</div></div>';d.onclick=()=>flip(d);gr.appendChild(d)});
  left=n;moves=0;open=[];lock=false;$('lv').textContent=level+1;$('mv').textContent=0;$('msg').style.display='none';
  fit();
}
function remember(d){if(!VM)return;const p=LVL==='hard'?.95:.3;if(Math.random()<p)known.set(d,d.dataset.e)}
function flip(d,byCpu){
  if(lock||d.classList.contains('up'))return;
  if(VM==='cpu'&&turnI===1&&!byCpu)return;
  d.classList.add('up');beep(500);open.push(d);remember(d);const tk=tok;
  if(open.length<2)return;
  moves++;$('mv').textContent=moves;lock=true;
  const [a,b]=open;
  if(a.dataset.e===b.dataset.e){
    setTimeout(()=>{if(tk!==tok)return;a.classList.add('ok');b.classList.add('ok');known.delete(a);known.delete(b);beep(780);beep(990,.2);
      [a,b].forEach(c=>{const r=c.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,14)});open=[];lock=false;
      if(VM){sc[turnI]++;upd()}
      if(--left===0)setTimeout(win,600);else if(VM==='cpu'&&turnI===1)cpuTurn()},400);
  }else setTimeout(()=>{if(tk!==tok)return;a.classList.remove('up');b.classList.remove('up');beep(200,.2);open=[];lock=false;if(VM){turnI^=1;upd();if(VM==='cpu'&&turnI===1)cpuTurn()}},900);
}
function win(){
  if(VM)return vsEnd();
  const pairs=cols*rows/2;
  const stars=moves<=pairs*1.5?'⭐⭐⭐':moves<=pairs*2.5?'⭐⭐':'⭐';
  if(level+1>bestLv){bestLv=level+1;$('bs').textContent=bestLv;try{localStorage.setItem('mmbest',bestLv)}catch(e){}}
  $('nx').textContent='Next level ▶';$('modes').innerHTML='';$('mt').innerHTML='🎉 Great job! 🎉<span class="st">'+stars+'</span><small>'+moves+' moves</small>';$('msg').style.display='flex';
  confetti(innerWidth/2,innerHeight/3,90);
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*120));
}
$('nx').onclick=()=>{if(VM)startVs();else if(solo0){solo0=false;level=0;build()}else{level++;build()}};
let solo0=true;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function upd(){if(!VM)return;[0,1].forEach(i=>{const p=$('p'+(i+1));p.style.display='';p.textContent=(turnI===i?'👉 ':'')+NMV[i]+': '+sc[i];p.style.background=turnI===i?'#1f7a2e':'#0b3a78'})}
function setVsUi(on){['lvP','mvP','bsP'].forEach(id=>$(id).style.display=on?'none':'');if(!on){$('p1').style.display='none';$('p2').style.display='none'}}
function startVs(){sc=[0,0];turnI=0;known=new Map();setVsUi(true);build();upd();$('msg').style.display='none';$('modes').innerHTML='';}
async function cpuTurn(){
  const tk=tok;if(VM!=='cpu'||turnI!==1)return;
  await sleep(700);if(tk!==tok)return;
  const avail=[...$('grid').children].filter(c=>!c.classList.contains('up')&&!c.classList.contains('ok'));if(avail.length<2)return;
  const byE={};known.forEach((e,c)=>{if(avail.includes(c))(byE[e]=byE[e]||[]).push(c)});
  const pe=Object.keys(byE).find(e=>byE[e].length>=2);let c1,c2=null;
  if(pe){c1=byE[pe][0];c2=byE[pe][1]}
  else{const unk=avail.filter(c=>!known.has(c));const pool=unk.length?unk:avail;c1=pool[Math.floor(Math.random()*pool.length)]}
  flip(c1,true);await sleep(750);if(tk!==tok)return;
  if(!c2){const e=c1.dataset.e;const o=[...known].find(([c,ee])=>ee===e&&c!==c1&&avail.includes(c));

  flip(c2,true)}
