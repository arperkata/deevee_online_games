<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:10px;z-index:1000;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;text-shadow:none}
.btn{font:inherit;font-size:20px;font-weight:700;min-height:48px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:16px;padding:8px 22px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn[disabled]{background:linear-gradient(#9aa6b5,#6f7c8e);box-shadow:0 5px 0 #4a5566;text-shadow:0 2px 0 #4a5566;cursor:default}
.btn.red{background:linear-gradient(#ff7a6a,#e0382a);box-shadow:0 5px 0 #8f1f15;text-shadow:0 2px 0 #8f1f15}
.btn.red:active{box-shadow:0 1px 0 #8f1f15}
.btn.blue{background:linear-gradient(#5cc8ff,#1c7fd6);box-shadow:0 5px 0 #0f4a8c;text-shadow:0 2px 0 #0f4a8c}
.btn.blue:active{box-shadow:0 1px 0 #0f4a8c}
.btn.gold{background:linear-gradient(#ffd84d,#f09a12);box-shadow:0 5px 0 #a8620a;text-shadow:0 2px 0 #a8620a}
.btn.gold:active{box-shadow:0 1px 0 #a8620a}
.btn.sm{min-height:44px;font-size:16px;padding:6px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#14367a;border:3px solid #5cc8ff;border-radius:999px;padding:2px 14px;min-height:40px;font-weight:700;font-size:20px;white-space:nowrap}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:900;text-align:center;padding:16px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(32px,9vw,60px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,460px);font-size:clamp(16px,4.4vw,21px);line-height:1.4;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
#ov .btn{font-size:clamp(24px,6vw,32px);padding:12px 44px}
#ov .btn.ghost{font-size:20px;padding:8px 26px}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.fly{position:fixed;z-index:800;pointer-events:none;font-weight:700;font-size:24px;white-space:nowrap;transform:translate(-50%,-50%);animation:fly .9s ease-out forwards;text-shadow:0 2px 0 #1b4f86,0 0 4px #1b4f86}
@keyframes fly{to{transform:translate(-50%,-150px) scale(1.2);opacity:0}}
.pc{position:fixed;z-index:800;pointer-events:none;font-size:22px;transform:translate(-50%,-50%);animation:pc .8s ease-out forwards}
@keyframes pc{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
.cf{position:fixed;top:-40px;z-index:950;pointer-events:none;font-size:28px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#ov .btn{font-size:20px;padding:6px 28px;min-height:44px}}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:56px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{border-radius:14px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;background:#2c8a3e}
#panel{padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
#chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#towers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:440px}
.tw{min-height:50px;border-radius:14px;border:3px solid #0b2a5c;background:linear-gradient(#3b86e0,#1c55a8);color:#fff;font-size:13px;font-weight:700;line-height:1.05;box-shadow:0 4px 0 #0b2a5c;cursor:pointer;padding:2px;text-shadow:0 1px 0 #0b2a5c}
.tw span{display:block;font-size:22px}
.tw.on{background:linear-gradient(#ffd84d,#f09a12);border-color:#fff;color:#4a2a00;text-shadow:none;box-shadow:0 4px 0 #a8620a}
.tw.poor{background:linear-gradient(#7c8798,#556070)}
#sel{min-height:44px;display:flex;gap:6px;align-items:center;justify-content:center;background:#14367a;border:3px solid #5cc8ff;border-radius:16px;padding:2px 10px;width:100%;max-width:440px;font-weight:700;font-size:15px}
#info{flex:1;text-align:center}
#acts{display:flex;gap:8px;align-items:center;justify-content:center}
#wave{min-width:150px}
@media (min-aspect-ratio:12/10){
#app{flex-direction:row-reverse;padding-top:0}
#panel{width:210px;padding:54px 6px 6px;justify-content:flex-start;gap:5px;overflow:auto}
#chips .chip{min-height:32px;font-size:15px;padding:0 9px;border-width:2px}
#towers{grid-template-columns:1fr 1fr;gap:5px}
.tw{min-height:46px}
.tw span{display:inline;font-size:20px;margin-right:4px}
#sel{flex-wrap:wrap;font-size:13px;min-height:44px;padding:2px 6px}
#acts{flex-wrap:wrap;width:100%}
#wave{width:100%;min-width:0}
}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<div id="app"><div id="stage"><canvas id="c"></canvas></div>
<div id="panel">
<div id="chips"><span class="chip">💰 <b id="gold">0</b></span><span class="chip">❤️ <b id="lives">0</b></span><span class="chip">🌊 <b id="wv">0</b>/20</span></div>
<div id="towers"></div>
<div id="sel"><span id="info"></span><button class="btn sm gold" id="up" hidden></button><button class="btn sm red" id="sell" hidden></button></div>
<div id="acts"><button class="btn" id="wave">▶ Wave 1</button><button class="btn blue sm" id="spd">⏩ 1x</button><button class="btn red sm" id="reset">Reset</button></div>
</div></div>

<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button><button class="btn ghost blue" id="cont" hidden></button></div>
<script>
const KEY='tower-defense.html_';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ld(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function rmk(k){try{localStorage.removeItem(KEY+k)}catch(e){}}
let muted=ld('m',0)==1;
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';sv('m',muted?1:0);e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
document.addEventListener('contextmenu',e=>e.preventDefault());
function fly(x,y,txt,col){const d=document.createElement('div');d.className='fly';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col||'#ffe14d';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function pieces(x,y,em,n){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pc';d.textContent=em[i%em.length];d.style.left=x+'px';d.style.top=y+'px';const a=Math.random()*6.283,s=40+Math.random()*70;d.style.setProperty('--dx',Math.cos(a)*s+'px');d.style.setProperty('--dy',Math.sin(a)*s-20+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}
function confetti(n){const e=['🎉','⭐','🎊','✨','🍬','💛'];for(let i=0;i<(n||30);i++){const d=document.createElement('div');d.className='cf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function fmt(n){n=Math.floor(n);if(n<10000)return''+n;const u=['K','M','B','T','Qa'];let i=-1;let v=n;while(v>=1000&&i<u.length-1){v/=1000;i++}return(v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[i]}
function fmtT(s){s=Math.floor(s);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
const starRow=n=>'<span class="stars">'+(n>=3?'⭐⭐⭐':n==2?'⭐⭐☆':n==1?'⭐☆☆':'☆☆☆')+'</span>';
const ovHidden=()=>$('ov').classList.contains('hide');
let ovGo=null,ovCont=null;
function showOv(t,m,b,c,onGo,onCont){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;ovGo=onGo;ovCont=onCont;$('cont').hidden=!c;$('cont').textContent=c||'';$('ov').classList.remove('hide')}
function hideOv(){$('ov').classList.add('hide')}
$('go').onclick=()=>{$('go').blur();if(ovGo)ovGo()};
$('cont').onclick=()=>{$('cont').blur();if(ovCont)ovCont()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();if(ovGo)ovGo()}});
function wireReset(btn,fn){let t=0,tm;const lab=btn.textContent;btn.onclick=()=>{if(!t){t=1;btn.textContent='Sure? Tap again';tm=setTimeout(()=>{t=0;btn.textContent=lab},3000)}else{clearTimeout(tm);t=0;btn.textContent=lab;fn()}}}

const W=600,H=420,CS=60,COLS=10,ROWS=7,MAXW=20;
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
const CORN=[[0,3],[2,3],[2,1],[5,1],[5,5],[8,5],[8,2],[9,2]];
const WP=[{x:-30,y:3.5*CS}].concat(CORN.slice(1).map(c=>({x:(c[0]+.5)*CS,y:(c[1]+.5)*CS})));WP.push({x:W+30,y:2.5*CS});
const SEG=[];let PL=0;for(let i=0;i<WP.length-1;i++){const l=Math.hypot(WP[i+1].x-WP[i].x,WP[i+1].y-WP[i].y);SEG.push(l);PL+=l}
const isPath=new Array(COLS*ROWS).fill(false);
for(let i=0;i<CORN.length-1;i++){const a=CORN[i],b=CORN[i+1];for(let x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)for(let y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)isPath[y*COLS+x]=true}
function posAt(d){let i=0;while(i<SEG.length-1&&d>SEG[i]){d-=SEG[i];i++}const f=clamp(d/SEG[i],0,1),a=WP[i],b=WP[i+1];return{x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f}}
const T=[{n:'Archer',e:'🏹',c:50,r:105,d:10,cd:.45,col:'#5fd35f'},{n:'Cannon',e:'💣',c:100,r:95,d:30,cd:1.2,sp:48,col:'#ff9a3d'},{n:'Frost',e:'❄️',c:75,r:95,d:3,cd:.9,slow:1,col:'#5cc8ff'},{n:'Zap',e:'⚡',c:140,r:125,d:44,cd:1.4,zap:1,col:'#ffe14d'}];
const E=[{e:'🐛',hp:1,sp:55,g:5},{e:'🐇',hp:.6,sp:100,g:5},{e:'🦏',hp:3.2,sp:38,g:12},{e:'👹',hp:14,sp:32,g:60}];
let best=ld('best',0),gold,lives,wave,towers,kills,active,queue,spawnT,enemies,proj,fx,pops,speed=1,state='ready',shake=0,build=0,selT=null,t=0,banner=0,bannerT='';
function newGame(){gold=160;lives=20;wave=0;towers=[];kills=0;active=false;queue=[];enemies=[];proj=[];fx=[];pops=[];selT=null;spawnT=0;shake=0}
function save(){sv('save',{gold,lives,wave:active?wave-1:wave,kills,towers:towers.map(o=>[o.t,o.c,o.r,o.lv,o.spent])})}
function loadSave(){const s=ld('save',null);if(!s||!s.towers)return false;newGame();gold=s.gold;lives=s.lives;wave=s.wave;kills=s.kills;towers=s.towers.map(a=>({t:a[0],c:a[1],r:a[2],lv:a[3],spent:a[4],x:(a[1]+.5)*CS,y:(a[2]+.5)*CS,cd:0,kick:0}));return lives>0&&wave<MAXW}
const dmgOf=o=>T[o.t].d*(1+.6*(o.lv-1)),rngOf=o=>T[o.t].r*(1+.08*(o.lv-1)),upCost=o=>Math.ceil(T[o.t].c*.7*o.lv),sellV=o=>Math.floor(o.spent*.6);
function startWave(){
  if(active||state!='play')return;wave++;active=true;queue=[];const n=5+Math.floor(wave*1.2);
  for(let i=0;i<n;i++){let k=0;if(wave>=3&&i%4==3)k=1;if(wave>=5&&i%5==4)k=2;queue.push(k)}
  if(wave%5==0)queue.push(3);
  spawnT=.5;banner=1.6;bannerT=wave%5==0?'Boss wave '+wave+'!':'Wave '+wave;beep(440,.15,'triangle');save();
}
function spawn(k){const hp=28*Math.pow(1.12,wave-1)*E[k].hp;enemies.push({k,d:0,hp,max:hp,sp:E[k].sp,slow:0,dead:false,bob:Math.random()*6})}
function hurt(e,d){if(e.dead)return;e.hp-=d;if(e.hp<=0){e.dead=true;kills++;const gg=Math.round(E[e.k].g*(1+wave*.03));gold+=gg;const p=posAt(e.d);pop(p.x,p.y-14,'+'+gg,'#ffe14d');burst(p.x,p.y,10,['#ffe14d','#ff9a3d','#fff']);beep(700+Math.random()*200,.05,'triangle',.04)}}
function leak(e){e.dead=true;lives--;shake=10;beep(160,.3,'sawtooth',.07,-90);pop(W-40,150,'-1 ❤️','#ff5c5c');if(lives<=0){lives=0;end(false)}}
function burst(x,y,n,cols,sp=140){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());fx.push({k:0,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,m:.5,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c){pops.push({x,y,t,c,l:.9})}
function fire(o){
  const d=T[o.t],r=rngOf(o);let tg=null;
  for(const e of enemies){if(e.dead)continue;const p=posAt(e.d);if(Math.hypot(p.x-o.x,p.y-o.y)<=r&&(!tg||e.d>tg.d))tg=e}
  if(!tg)return false;
  o.cd=d.cd;o.kick=1;const p=posAt(tg.d);
  if(d.zap){hurt(tg,dmgOf(o));let c=0;for(const e of enemies){if(c>=2)break;if(e===tg||e.dead)continue;const q=posAt(e.d);if(Math.hypot(q.x-p.x,q.y-p.y)<80){hurt(e,dmgOf(o)*.6);fx.push({k:1,x:p.x,y:p.y,x2:q.x,y2:q.y,l:.18,m:.18});c++}}fx.push({k:1,x:o.x,y:o.y-4,x2:p.x,y2:p.y,l:.18,m:.18});beep(900,.08,'sawtooth',.04,-500)}
  else{proj.push({x:o.x,y:o.y,tg,t:o.t,dmg:dmgOf(o),sp:d.sp||0});beep(d.sp?200:520,.05,'square',.03)}
  return true;
}
function update(dt){
  t+=dt;banner=Math.max(0,banner-dt);shake=Math.max(0,shake-dt*30);
  for(const p of fx){if(p.k==0){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}p.l-=dt}fx=fx.filter(p=>p.l>0);
  for(const q of pops){q.y-=36*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);
  for(const o of towers)o.kick=Math.max(0,o.kick-dt*6);
  if(state!='play')return;
  dt*=speed;
  if(active&&queue.length){spawnT-=dt;if(spawnT<=0){spawn(queue.shift());spawnT=Math.max(.35,.85-wave*.025)}}
  for(const e of enemies){if(e.dead)continue;e.slow=Math.max(0,e.slow-dt);e.d+=e.sp*(e.slow>0?.5:1)*dt;if(e.d>=PL)leak(e);if(state!='play')return}
  for(const o of towers){o.cd-=dt;if(o.cd<=0)fire(o)}
  for(const p of proj){
    if(p.tg.dead){p.done=true;continue}
    const q=posAt(p.tg.d),dx=q.x-p.x,dy=q.y-p.y,dd=Math.hypot(dx,dy),st=400*dt;
    if(dd<=st+6){p.done=true;
      if(p.sp){for(const e of enemies){if(e.dead)continue;const z=posAt(e.d);if(Math.hypot(z.x-q.x,z.y-q.y)<=p.sp)hurt(e,p.dmg)}fx.push({k:2,x:q.x,y:q.y,l:.3,m:.3,r:p.sp});burst(q.x,q.y,8,['#ff9a3d','#ffe14d'],120);shake=Math.max(shake,3)}
      else{hurt(p.tg,p.dmg);if(p.t==2)p.tg.slow=1.8;burst(q.x,q.y,4,[T[p.t].col],80)}
    }else{p.x+=dx/dd*st;p.y+=dy/dd*st}
  }
  proj=proj.filter(p=>!p.done);enemies=enemies.filter(e=>!e.dead);
  if(state=='play'&&active&&!queue.length&&!enemies.length){
    active=false;const b=20+wave*4;gold+=b;pop(W/2,H/2,'Wave clear! +'+b,'#5fd35f');beep(660,.2,'triangle');
    if(wave>=MAXW)end(true);else save();
  }
}
function end(win){
  state='over';rmk('save');const sc=wave*100+kills*5+lives*25+(win?500:0);
  const stars=win?(lives>=15?3:lives>=8?2:1):(wave>=12?1:0);
  const nb=sc>best;if(nb){best=sc;sv('best',best)}
  if(win)confetti(36);beep(win?880:200,.5,win?'triangle':'sawtooth',.07,win?300:-120);
  setTimeout(()=>{showOv(win?'Victory! 🏆':'Overrun! 💥',starRow(stars)+'<span class="big">'+sc+'</span>Waves '+wave+'/'+MAXW+' · Kills '+kills+' · Best '+best+(nb?'<br><span class="nb">🎉 New best!</span>':''),'Play again',null,()=>{newGame();state='play';hideOv();refreshAll()})},win?900:600);
}
function shop(){const w=$('towers');w.innerHTML='';T.forEach((d,i)=>{const b=document.createElement('button');b.className='tw';b.id='tw'+i;b.innerHTML='<span>'+d.e+'</span>$'+d.c;b.onclick=()=>{build=i;selT=null;refreshAll()};w.appendChild(b)})}
const cache={};function set(id,v){if(cache[id]!==v){cache[id]=v;$(id).textContent=v}}
function refreshAll(){
  set('gold',gold);set('lives',lives);set('wv',wave);
  T.forEach((d,i)=>{const b=$('tw'+i);b.className='tw'+(build==i&&!selT?' on':'')+(gold<d.c?' poor':'')});
  if(selT){const o=selT,mx=o.lv>=3;set('info',T[o.t].e+' '+T[o.t].n+' Lv'+o.lv);$('up').hidden=false;$('sell').hidden=false;set('up',mx?'MAX':'⬆ $'+upCost(o));$('up').disabled=mx||gold<upCost(o);set('sell','Sell $'+sellV(o))}
  else{set('info','Build: '+T[build].e+' '+T[build].n+' - tap a green tile');$('up').hidden=true;$('sell').hidden=true}
  set('wave',active?'Wave '+wave+' running...':'▶ Wave '+(wave+1));$('wave').disabled=active||state!='play';
}
$('up').onclick=()=>{const o=selT;if(!o||o.lv>=3||gold<upCost(o))return;const c=upCost(o);gold-=c;o.spent+=c;o.lv++;burst(o.x,o.y,14,['#ffe14d','#fff'],150);pop(o.x,o.y-26,'Level '+o.lv+'!','#ffe14d');beep(760,.12,'triangle');save();refreshAll()};
$('sell').onclick=()=>{const o=selT;if(!o)return;gold+=sellV(o);pop(o.x,o.y-20,'+'+sellV(o),'#ffe14d');towers=towers.filter(x=>x!==o);selT=null;beep(300,.1);save();refreshAll()};
$('wave').onclick=()=>{startWave();refreshAll()};
$('spd').onclick=()=>{speed=speed==1?2:1;$('spd').textContent='⏩ '+speed+'x';$('spd').blur()};
wireReset($('reset'),()=>{rmk('save');newGame();state='play';hideOv();refreshAll();pop(W/2,H/2,'Fresh start!','#fff')});
cv.addEventListener('pointerdown',e=>{
  if(state!='play')return;const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*COLS),y=Math.floor((e.clientY-r.top)/r.height*ROWS);
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  const o=towers.find(o=>o.c==x&&o.r==y);
  if(o){selT=selT===o?null:o;beep(500,.04);refreshAll();return}
  if(isPath[y*COLS+x]){selT=null;pop((x+.5)*CS,(y+.5)*CS,'Path!','#ff8a7a');refreshAll();return}
  const d=T[build];if(gold<d.c){pop((x+.5)*CS,(y+.5)*CS,'Need $'+d.c,'#ff8a7a');beep(200,.1,'sawtooth');return}
  gold-=d.c;const n={t:build,c:x,r:y,lv:1,spent:d.c,x:(x+.5)*CS,y:(y+.5)*CS,cd:.2,kick:0};towers.push(n);selT=n;burst(n.x,n.y,10,[d.col,'#fff'],120);beep(600,.08,'triangle');save();refreshAll();
});
addEventListener('keydown',e=>{if(state!='play')return;if(e.key>='1'&&e.key<='4'){build=+e.key-1;selT=null;refreshAll()}if(e.code=='Space'){e.preventDefault();startWave();refreshAll()}});
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function emo(e,x,y,s){g.save();g.globalAlpha=1;g.shadowBlur=0;g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(e,x,y);g.restore()}
function txt(s,x,y,sz,c){g.save();g.globalAlpha=1;g.font='bold '+sz+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign='center';g.textBaseline='middle';g.lineWidth=sz/4.5;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=c||'#fff';g.fillText(s,x,y);g.restore()}
function draw(){
  g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){g.fillStyle=(x+y)%2?'#3fae4e':'#48bb57';g.fillRect(x*CS,y*CS,CS,CS)}
  g.lineCap='round';g.lineJoin='round';g.strokeStyle='#8a5a22';g.lineWidth=CS-4;g.beginPath();WP.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();
  g.strokeStyle='#e0a95c';g.lineWidth=CS-12;g.stroke();
  const o0=selT;if(o0){g.fillStyle='rgba(255,255,255,.3)';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(o0.x,o0.y,rngOf(o0),0,6.283);g.fill();g.stroke()}
  for(const o of towers){
    const d=T[o.t];g.fillStyle='#0b2a5c';g.beginPath();g.ellipse(o.x,o.y+20,22,8,0,0,6.283);g.fill();
    const gr=g.createRadialGradient(o.x-8,o.y-10,2,o.x,o.y,24);gr.addColorStop(0,'#fff');gr.addColorStop(1,d.col);g.fillStyle=gr;g.strokeStyle=o===selT?'#fff':'#0b2a5c';g.lineWidth=o===selT?4:3;g.beginPath();g.arc(o.x,o.y+2,23,0,6.283);g.fill();g.stroke();
    emo(d.e,o.x,o.y+2-o.kick*3,28+o.kick*4);
    for(let i=0;i<o.lv;i++){g.fillStyle='#ffe14d';g.strokeStyle='#8a5a00';g.lineWidth=1.5;g.beginPath();g.arc(o.x-8+i*8,o.y+25,3.5,0,6.283);g.fill();g.stroke()}
  }
  for(const e of enemies){
    const p=posAt(e.d),b=Math.sin(t*10+e.bob)*2,s=e.k==3?44:e.k==2?36:30;
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(p.x,p.y+s*.4,s*.4,5,0,0,6.283);g.fill();
    if(e.slow>0){g.fillStyle='#bfeaff';g.strokeStyle='#1c7fd6';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,s*.55,0,6.283);g.fill();g.stroke()}
    emo(E[e.k].e,p.x,p.y+b,s);
    const bw=s*.9;g.fillStyle='#8f1f15';g.fillRect(p.x-bw/2,p.y-s*.65,bw,5);g.fillStyle='#5fd35f';g.fillRect(p.x-bw/2,p.y-s*.65,bw*Math.max(0,e.hp/e.max),5);g.strokeStyle='#0b2a5c';g.lineWidth=1.5;g.strokeRect(p.x-bw/2,p.y-s*.65,bw,5);
  }
  for(const p of proj){g.fillStyle=p.sp?'#222':p.t==2?'#bfeaff':'#fff';g.strokeStyle='#0b2a5c';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,p.sp?6:4,0,6.283);g.fill();g.stroke()}
  for(const p of fx){
    g.save();
    if(p.k==0){g.globalAlpha=clamp(p.l/p.m,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}
    else if(p.k==1){g.strokeStyle='#fff7a0';g.lineWidth=5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x2,p.y2);g.stroke();g.strokeStyle='#ffb300';g.lineWidth=2;g.stroke()}
    else{g.strokeStyle='#ff9a3d';g.lineWidth=5;g.globalAlpha=clamp(p.l/p.m,0,1);g.beginPath();g.arc(p.x,p.y,p.r*(1-p.l/p.m*.6),0,6.283);g.stroke()}
    g.restore();
  }
  for(const q of pops)txt(q.t,q.x,q.y,20,q.c);
  if(banner>0)txt(bannerT,W/2,50,36+Math.sin(banner*8)*3,'#ffe14d');
  g.restore();
}
function fit(){const s=$('stage'),k=Math.min((s.clientWidth-14)/W,(s.clientHeight-14)/H);cv.style.width=Math.max(120,Math.floor(W*k))+'px';cv.style.height=Math.max(84,Math.floor(H*k))+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state=='play')save()});
addEventListener('pagehide',()=>{if(state=='play')save()});
shop();newGame();fit();refreshAll();
const had=loadSave();
function begin(){state='play';hideOv();fit();refreshAll()}
showOv('🏰 Tower Defense',(had?'Welcome back! Wave <b>'+(wave+1)+'</b> of '+MAXW+' · 💰 '+gold+' · ❤️ '+lives:'Tap green tiles to build towers.<br>Stop the bugs before they escape!')+'<br>Best score <b>'+best+'</b>',had?'Continue':'Play',had?'New game':null,begin,()=>{rmk('save');newGame();begin()});
let last=performance.now();
function loop(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000)||0);last=now;update(dt);if(state=='play')refreshAll();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);setTimeout(fit,50);

</script></body></html>
