<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maze Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{height:100dvh;background:linear-gradient(#1e90e6,#8fdcff) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 8px 2px;flex:none}
.home{background:linear-gradient(#ffb21f,#f07a0a);color:#fff;text-decoration:none;padding:0 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #a9560b}
.pill{background:#0b3a78;color:#fff;border:2px solid #ffe14a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #06244d;white-space:nowrap}
.pill b{color:#ffe14a;font-size:19px}
.btn{min-height:44px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #1c701c;padding:8px 28px;border-radius:999px;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 6px 0 #1c701c}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
.btn.sm{min-height:40px;min-width:44px;font-size:15px;padding:4px 12px;border-radius:999px;box-shadow:0 4px 0 #1c701c}
.btn.sm:active{box-shadow:0 1px 0 #1c701c}
#ov{position:fixed;inset:0;background:rgba(6,30,70,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov.hide{display:none}
#card{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:20px 26px;box-shadow:0 8px 0 #06244d;max-width:min(94vw,420px);max-height:94dvh;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
#card h1{margin:0;font-size:clamp(26px,7vw,40px);text-shadow:0 3px 0 #0b3a78}#card p{margin:0;font-size:clamp(15px,4vw,19px);line-height:1.35;text-shadow:0 2px 0 #0b3a78}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:4px 8px 10px}
#bw{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{display:block;border-radius:14px;border:4px solid #0b3a78;box-shadow:0 8px 0 #06204a,0 12px 22px rgba(0,0,0,.35);touch-action:none;background:#fff8e1}
#tbw{height:14px;background:#0b3a78;border:2px solid #fff;border-radius:8px;overflow:hidden;flex:none}
#tb{height:100%;width:100%;background:linear-gradient(#ffe14a,#f08a12)}
#pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;flex:none}
#pad button{border:0;border-radius:16px;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 5px 0 #1c701c;color:#fff;font-size:24px;touch-action:none;text-shadow:0 2px 0 #1c701c}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #1c701c}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (orientation:landscape) and (max-height:520px){#main{flex-direction:row;gap:14px}#bw{width:auto;flex:0 1 auto;height:100%}}
</style></head><body>
<div id="top"><a class="home" href="index.html">⌂ Home</a><span class="pill">Lv <b id="lv">1</b></span><span class="pill">⏱ <b id="tm">0</b></span><span class="pill">Score <b id="sc">0</b></span><span class="pill">Best <b id="bs">0</b></span><button id="fog" class="btn sm">🌫 Fog: off</button><button id="mute" class="btn sm" aria-label="Sound">🔊</button></div>
<div id="main"><div id="bw"><canvas id="c" width="960" height="960"></canvas><div id="tbw"><div id="tb"></div></div></div>
<div id="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div></div>
<div id="ov"><div id="card"><h1 id="t">🐱 Maze Runner</h1><p id="m">Reach the 🏁 before time runs out. Grab ⭐ for points! Arrows / WASD / swipe / D-pad. Fog mode = double points.</p><button class="btn" id="go">▶ Play</button></div></div>
<script>
const $=id=>document.getElementById(id);
let AC,muted=false;
function beep(f,d=.1,t='sine',v=.15){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function best(v){try{if(v!==undefined)localStorage.setItem('mzbest',v);return +localStorage.getItem('mzbest')||0}catch(e){return 0}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
const cv=$('c'),x=cv.getContext('2d'),S=480;
const FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let N,cs,mz,px,py,vx,vy,stars,lvl=1,score=0,tl=0,tmax=1,fog=false,over=true,msg='',msgT=0,parts=[],held={},lastMove=0,bestS=best(),last=performance.now();
function fit(){const b=$('bw'),m=$('main'),row=getComputedStyle(m).flexDirection==='row',pd=$('pad'),w=row?m.clientWidth-16-(pd.offsetWidth?pd.offsetWidth+14:0):b.clientWidth,h=b.clientHeight-22;const s=Math.max(150,Math.floor(Math.min(w,h,820)));cv.style.width=cv.style.height=s+'px';$('tbw').style.width=s+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
$('fog').onclick=function(){fog=!fog;this.textContent='🌫 Fog: '+(fog?'ON x2':'off')};
function ui(){$('lv').textContent=lvl;$('tm').textContent=Math.ceil(Math.max(0,tl));$('sc').textContent=score;$('bs').textContent=bestS;$('tb').style.width=Math.max(0,tl/tmax*100)+'%';$('tb').style.background=tl/tmax<.25?'linear-gradient(#ff8a7a,#ff2a1a)':'linear-gradient(#ffe14a,#f08a12)'}
function gen(n){N=n;cs=S/N;mz=Array(N*N).fill(0);const seen=new Uint8Array(N*N),st=[0];seen[0]=1;
while(st.length){const i=st[st.length-1],cx=i%N,cy=i/N|0,o=[];
[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]].forEach(([dx,dy,a,b])=>{const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx])o.push([nx,ny,a,b])});
if(!o.length){st.pop();continue}const[nx,ny,a,b]=o[Math.random()*o.length|0];mz[i]|=a;mz[ny*N+nx]|=b;seen[ny*N+nx]=1;st.push(ny*N+nx)}}
function pathLen(){const d=new Int32Array(N*N).fill(-1),q=[0];d[0]=0;while(q.length){const i=q.shift(),cx=i%N,cy=i/N|0;
for(const[dx,dy,f]of[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]])if(mz[i]&f){const j=(cy+dy)*N+cx+dx;if(d[j]<0){d[j]=d[i]+1;q.push(j)}}}return d[N*N-1]}
function level(){gen(Math.min(7+(lvl-1)*2,27));px=py=vx=vy=0;stars=[];const k=Math.min(3+lvl,12);
while(stars.length<k){const sx=Math.random()*N|0,sy=Math.random()*N|0;if((sx||sy)&&(sx!=N-1||sy!=N-1)&&!stars.some(s=>s.x==sx&&s.y==sy))stars.push({x:sx,y:sy})}
tl=10+pathLen()*(.5-Math.min(.17,lvl*.012))+k*2;tmax=tl;ui()}
function start(){lvl=1;score=0;over=false;parts=[];level();$('ov').classList.add('hide');fit()}
$('go').onclick=start;
const CONF=['#ffe14a','#ff4a5a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];
function burst(cx,cy,c,n=14){for(let i=0;i<n;i++)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:34,c:c||CONF[i%6]})}
function move(dx,dy){if(over)return;const f=dy<0?1:dx>0?2:dy>0?4:8;if(!(mz[py*N+px]&f))return;px+=dx;py+=dy;beep(420+(px+py)%5*30,.04,'square',.05);
const si=stars.findIndex(s=>s.x==px&&s.y==py);if(si>=0){stars.splice(si,1);const p=100*(fog?2:1);score+=p;burst((px+.5)*cs,(py+.5)*cs,'#ffd23f');beep(900,.15,'triangle',.2);msg='+'+p;msgT=40}
if(px==N-1&&py==N-1){const b=(200*lvl+Math.floor(tl)*5)*(fog?2:1);score+=b;burst((px+.5)*cs,(py+.5)*cs,null,40);burst(S/2,S/2,null,40);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*90));lvl++;const keep=Math.min(tl,10);level();tl+=keep;tmax=tl;msg='Level '+lvl+'! +'+b;msgT=80}
if(score>bestS){bestS=score;best(bestS)}ui()}
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(!k)return;e.preventDefault();if(!held[e.key]){held[e.key]=k;move(k[0],k[1]);lastMove=performance.now()}});
addEventListener('keyup',e=>{delete held[e.key]});
let anc=null;
cv.addEventListener('pointerdown',e=>{anc={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!anc)return;const dx=e.clientX-anc.x,dy=e.clientY-anc.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);anc={x:e.clientX,y:e.clientY}}});
cv.addEventListener('pointerup',()=>anc=null);cv.addEventListener('pointercancel',()=>anc=null);
document.querySelectorAll('#pad button').forEach(b=>{const d=b.dataset.d.split(',').map(Number);let iv;
const stop=()=>{clearInterval(iv)};b.addEventListener('pointerdown',e=>{e.preventDefault();move(d[0],d[1]);clearInterval(iv);iv=setInterval(()=>move(d[0],d[1]),130)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))});
function emoji(s,px_,py_,size){x.save();x.globalAlpha=1;x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';x.font=Math.floor(size)+'px '+FONT;x.fillText(s,px_,py_);x.restore()}
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
if(!over){tl-=dt;ui();const ks=Object.values(held);if(ks.length&&t-lastMove>105){move(ks[ks.length-1][0],ks[ks.length-1][1]);lastMove=t}
if(tl<=0){over=true;beep(150,.6,'sawtooth');setTimeout(()=>{$('t').textContent='⏰ Time\'s up!';$('m').innerHTML='<span style="font-size:1.8em">'+(lvl>=6?'⭐⭐⭐':lvl>=3?'⭐⭐':'⭐')+'</span><br>Level '+lvl+' · Score <b style="color:#ffe14a">'+score+'</b><br>'+(score>=bestS&&score>0?'🏆 New best!':'Best '+bestS);$('go').textContent='▶ Play Again';$('ov').classList.remove('hide')},500)}}
vx+=(px-vx)*.4;vy+=(py-vy)*.4;
x.setTransform(2,0,0,2,0,0);x.globalAlpha=1;x.clearRect(0,0,S,S);
// floor: checkerboard
for(let i=0;i<N*N;i++){const cx=i%N,cy=i/N|0;x.fillStyle=(cx+cy)%2?'#ffe9a6':'#fff6d6';x.fillRect(cx*cs,cy*cs,cs+.5,cs+.5)}
x.fillStyle='#7be07a';x.fillRect(0,0,cs,cs);x.fillStyle='#ffd23f';x.fillRect((N-1)*cs,(N-1)*cs,cs,cs);
// walls
x.strokeStyle='#0b3a78';x.lineWidth=Math.max(3,cs*.14);x.lineCap='round';x.beginPath();
for(let i=0;i<N*N;i++){const cx=i%N*cs,cy=(i/N|0)*cs,m=mz[i];if(!(m&1)){x.moveTo(cx,cy);x.lineTo(cx+cs,cy)}if(!(m&8)){x.moveTo(cx,cy);x.lineTo(cx,cy+cs)}if(!(m&4)){x.moveTo(cx,cy+cs);x.lineTo(cx+cs,cy+cs)}if(!(m&2)){x.moveTo(cx+cs,cy);x.lineTo(cx+cs,cy+cs)}}x.stroke();
x.strokeStyle='#2f8cff';x.lineWidth=Math.max(1.5,cs*.05);x.stroke();
emoji('🏁',(N-.5)*cs,(N-.5)*cs,cs*.7);
const pul=1+Math.sin(t/200)*.1;for(const s of stars){x.save();x.fillStyle='#ffd23f';x.globalAlpha=1;x.beginPath();x.arc((s.x+.5)*cs,(s.y+.5)*cs,cs*.36*pul,0,7);x.fill();x.restore();emoji('⭐',(s.x+.5)*cs,(s.y+.5)*cs,cs*.6*pul)}
emoji('🐱',(vx+.5)*cs,(vy+.5)*cs,cs*.75);
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--;x.save();x.globalAlpha=Math.min(1,p.l/20);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill();x.restore()}
if(fog&&!over){const gr=x.createRadialGradient((vx+.5)*cs,(vy+.5)*cs,0,(vx+.5)*cs,(vy+.5)*cs,cs*3.3);gr.addColorStop(0,'rgba(10,40,80,0)');gr.addColorStop(.5,'rgba(10,40,80,0)');gr.addColorStop(1,'rgba(10,40,80,.97)');x.fillStyle=gr;x.fillRect(0,0,S,S)}
if(msgT>0){msgT--;x.save();x.textAlign='center';x.textBaseline='middle';x.font='bold 38px '+FONT;x.lineWidth=7;x.lineJoin='round';x.strokeStyle='#0b3a78';x.fillStyle='#ffe14a';x.globalAlpha=Math.min(1,msgT/20);x.strokeText(msg,S/2,60);x.fillText(msg,S/2,60);x.restore()}
requestAnimationFrame(loop)}
gen(7);stars=[];ui();fit();requestAnimationFrame(loop);
</script></body></html>
