<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fidget Spinner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:1000;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation;padding:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:900}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:58px}
#stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:6px 10px;position:relative}
#panel{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:8px 10px 12px}
@media (min-aspect-ratio:1/1){#app{flex-direction:row;padding-top:0}#stage{padding:8px 8px 8px 116px}#panel{width:320px;padding:64px 10px 10px;align-content:flex-start}}
@media (max-height:450px){.chips{display:none!important}}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.chip{background:#14407a;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 #0b2a5c;text-shadow:none;border:2px solid #5cc8ff;font-size:16px;white-space:nowrap}
.chip b{color:#ffe14d}
.tb{font:inherit;font-weight:700;font-size:20px;min-width:44px;height:46px;padding:0 10px;border-radius:14px;background:#fff;color:#1b4f86;border:3px solid #1b4f86;box-shadow:0 4px 0 #1b4f86;cursor:pointer;touch-action:manipulation;text-shadow:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 #1b4f86}
.tb.on{background:#ffd93b}
.tb.red{background:#ff4b4b;color:#fff;border-color:#8c1414;box-shadow:0 4px 0 #8c1414}
.tb.red.on{background:#ff9a9a;color:#8c1414}
.sw{width:44px;height:44px;border-radius:12px;border:3px solid #1b4f86;box-shadow:0 4px 0 #1b4f86;cursor:pointer;padding:0;touch-action:manipulation}
.sw.on{outline:4px solid #ffd93b;transform:scale(1.1);z-index:2}
.sw:active{transform:translateY(3px)}
.btn{font:inherit;font-size:clamp(22px,6vw,30px);font-weight:700;min-height:52px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;padding:10px 40px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.alt{background:linear-gradient(#ffb04a,#f08a12);text-shadow:0 2px 0 #a85d00;box-shadow:0 5px 0 #a85d00}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:950;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ot{margin:0;font-size:clamp(34px,10vw,60px);line-height:1.05;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;animation:pop .5s}
#om{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);font-size:clamp(16px,4.5vw,22px);line-height:1.4;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#om b{color:#ffe14d}
#ob{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#ov .btn:first-child{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;top:68px;transform:translate(-50%,-30px) scale(.8);background:#ffe14d;color:#1b4f86;font-weight:700;font-size:20px;padding:10px 22px;border-radius:999px;box-shadow:0 4px 0 #a85d00;text-shadow:none;z-index:960;pointer-events:none;transition:transform .25s,visibility .25s;visibility:hidden;white-space:nowrap}
#toast.show{transform:translate(-50%,0) scale(1);visibility:visible}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ot{font-size:28px}#om{font-size:14px;padding:6px 14px}.btn{font-size:20px;padding:6px 28px;min-height:44px}}

html,body{background:radial-gradient(circle at 50% 45%,#2f4fc0,#101a55 65%,#070b2a) fixed}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:1}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px 12px;pointer-events:none}
#hud .row{pointer-events:auto}
.sk{width:48px;height:48px;border-radius:50%;font-size:24px;padding:0;background:#fff;border:3px solid #1b4f86;box-shadow:0 4px 0 #1b4f86;cursor:pointer;touch-action:manipulation;text-shadow:none}
.sk.on{background:#ffd93b;outline:4px solid #fff;transform:scale(1.12)}
.sk:active{transform:translateY(3px)}
.chip{font-size:18px}
.chip.new{background:#ff9a3d;animation:pulse .5s 3}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="fx"></canvas>
<div id="ov" class="hide"><h1 id="ot"></h1><p id="om"></p><div id="ob"></div></div>
<div id="toast"></div>
<canvas id="c"></canvas>
<div id="hud"><div class="row"><span class="chip">🌀 Spins <b id="sp">0</b></span><span class="chip" id="bc">🏆 Best <b id="bs">0</b></span><span class="chip">⚡ <b id="rp">0</b> RPM</span></div><div class="row" id="skins"></div></div>
<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
var GAME='fidget-spinner.html';
function $(i){return document.getElementById(i)}
function lsGet(k,d){try{var v=localStorage.getItem(GAME+':'+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(GAME+':'+k,JSON.stringify(v))}catch(e){}}
var AC=null,muted=lsGet('muted',false);
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,vol,slide,when){if(muted)return;var a=audio();if(!a)return;var t=when||a.currentTime;var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
var muteBtn=$('mute');
function paintMute(){muteBtn.textContent=muted?'🔇':'🔊'}
paintMute();
muteBtn.addEventListener('click',function(){muted=!muted;lsSet('muted',muted);paintMute();if(window.onMute)onMute();if(!muted)tone(660,.1,'sine',.15)});
document.addEventListener('pointerdown',function(){audio()});
var fx=$('fx'),fc=fx.getContext('2d'),ps=[],fxOn=false;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}
fxSize();
function burst(x,y,n,cols){cols=cols||['#ff4b4b','#ffd93b','#5fd35f','#38b6ff','#ff6fb5','#ff9a3d'];for(var i=0;i<n;i++){var a=Math.random()*6.283,s=2+Math.random()*7;ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:3+Math.random()*5,c:cols[(Math.random()*cols.length)|0],l:40+Math.random()*30,rot:Math.random()*6})}if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);for(var i=ps.length-1;i>=0;i--){var p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.98;p.l--;p.rot+=.2;if(p.l<=0){ps.splice(i,1);continue}fc.save();fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillRect(-p.r,-p.r/2,p.r*2,p.r);fc.restore()}if(ps.length)requestAnimationFrame(fxLoop);else fxOn=false}
var toastT=0;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}
function hideOv(){$('ov').classList.add('hide')}
function ov(title,msg,btns){$('ot').innerHTML=title;var m=$('om');m.innerHTML=msg||'';m.style.display=msg?'':'none';var b=$('ob');b.innerHTML='';btns.forEach(function(x){var e=document.createElement('button');e.className='btn'+(x.c?' '+x.c:'');e.textContent=x.t;e.onclick=function(){hideOv();if(x.f)x.f()};b.appendChild(e)});$('ov').classList.remove('hide')}
function stageBox(){var s=$('stage'),cs=getComputedStyle(s);return{w:Math.max(40,s.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)),h:Math.max(40,s.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))}}
function fitEl(el,aspect){var b=stageBox();var w=Math.max(50,Math.min(b.w,b.h*aspect));el.style.width=w+'px';el.style.height=(w/aspect)+'px'}
function onResize(){fxSize();if(window.fit)fit()}
addEventListener('resize',onResize);
addEventListener('orientationchange',function(){setTimeout(onResize,150)});
function dlCanvas(cv,name){try{cv.toBlob(function(b){if(!b)return;var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},3000)},'image/png')}catch(e){}}

var cv=$('c'),g=cv.getContext('2d'),W=0,H=0,dpr=1,cxp=0,cyp=0,R=100;
var SK=[{e:'🔴',arms:3,c:['#ff3b30','#ff8a80'],o:'#7a0f0a'},{e:'🔵',arms:3,c:['#1e90ff','#7fd4ff'],o:'#0a2f78'},{e:'🟡',arms:4,c:['#ffb400','#fff08a'],o:'#7a4a00'},
 {e:'🟣',arms:5,c:['#a64dff','#e0b8ff'],o:'#3f1480'},{e:'🌈',arms:6,c:null,o:'#222'},{e:'🍕',arms:3,em:'🍕',c:['#ffcf4a','#fff3b0'],o:'#8a4b00'}];
var skin=lsGet('skin',0),ang=0,om=0,drag=false,lastA=0,lastT=0,cnt=0,active=false,best=lsGet('best',0),det=0,lastTick=0,everSpun=lsGet('spun',false),hum=null,humG=null,pid=-1;
if(skin>=SK.length)skin=0;
$('bs').textContent=best;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  var hh=$('hud').offsetHeight,top=58;cxp=W/2;cyp=top+(H-hh-top)/2;R=Math.max(60,Math.min(W/2-8,(H-hh-top)/2-6,330))}
function buildSkins(){var s=$('skins');s.innerHTML='';SK.forEach(function(k,i){var b=document.createElement('button');b.className='sk'+(i===skin?' on':'');b.textContent=k.e;b.setAttribute('aria-label','Skin '+(i+1));
  b.onclick=function(){skin=i;lsSet('skin',i);buildSkins();tone(500+i*80,.1,'triangle',.12);burst(cxp,cyp,16,k.c||['#ff4b4b','#ffd93b','#5fd35f','#38b6ff'])};s.appendChild(b)});fit()}
function ap(x,y){return Math.atan2(y-cyp,x-cxp)}
function wrap(d){while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(drag)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}pid=e.pointerId;drag=true;lastA=ap(e.clientX,e.clientY);lastT=performance.now();om*=.3;cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;var dx=e.clientX-cxp,dy=e.clientY-cyp;if(dx*dx+dy*dy<400)return;var a=Math.atan2(dy,dx),d=wrap(a-lastA),t=performance.now(),dt=Math.max(.008,(t-lastT)/1000);
  lastA=a;lastT=t;ang+=d;count(d);om=om*.4+Math.max(-120,Math.min(120,d/dt))*.6});
function up(e){if(e&&e.pointerId!==pid)return;if(drag&&performance.now()-lastT>90)om*=.2;drag=false;pid=-1;cv.style.cursor='grab'}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
var dOn=false,dT0=0,dTot=0,DSEC=20;
function count(d){if(dOn)dTot+=Math.abs(d)/6.2832;if(!active&&Math.abs(d)>0){active=true;cnt=0;$('bc').classList.remove('new')}cnt+=Math.abs(d)/6.2832}
function endSpin(){active=false;if(dOn)return;var n=Math.floor(cnt);if(n>=1){var rec=n>best;if(rec){best=n;lsSet('best',best);$('bs').textContent=best;$('bc').classList.add('new');burst(cxp,cyp,90);toast('🏆 New best: '+n+' spins!');[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.18,'triangle',.16)},i*100)})}else toast('🌀 '+n+' spin'+(n>1?'s':'')+'!');
  if(!everSpun){everSpun=true;lsSet('spun',true)}}}
function tick(){var a=audio();if(!a||muted){if(humG)humG.gain.value=0;return}
  if(!hum){try{hum=a.createOscillator();humG=a.createGain();hum.type='sawtooth';var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=500;humG.gain.value=0;hum.connect(f);f.connect(humG);humG.connect(a.destination);hum.start()}catch(e){hum=null;humG=null}}
  var s=Math.abs(om);if(humG){humG.gain.setTargetAtTime(Math.min(.05,s/500),a.currentTime,.05);hum.frequency.setTargetAtTime(60+s*3,a.currentTime,.05)}}
function onMute(){if(humG&&muted)humG.gain.value=0}
function clickSnd(){var now=performance.now();if(now-lastTick<28)return;lastTick=now;tone(500+Math.min(Math.abs(om),70)*14,.05,'triangle',.07)}
function lobe(x,y,r,k,i){
  var gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  if(k.c){gr.addColorStop(0,k.c[1]);gr.addColorStop(1,k.c[0])}else{var h=i*(360/SK[skin].arms);gr.addColorStop(0,'hsl('+h+',100%,80%)');gr.addColorStop(1,'hsl('+h+',100%,50%)')}
  g.beginPath();g.arc(x,y,r,0,6.2832);g.arc(x,y,r*.5,0,6.2832,true);g.fillStyle=gr;g.fill('evenodd');g.lineWidth=R*.03;g.strokeStyle=k.o;g.stroke();
}
function drawSp(){var k=SK[skin],n=k.arms,lr=R*(n>4?.22:.3),dist=R-lr-R*.04;
  g.save();g.translate(cxp,cyp);g.rotate(ang);
  var bodyC=k.c?k.c[0]:'#444';
  g.lineCap='round';g.strokeStyle=k.o;g.lineWidth=lr*1.2+R*.05;for(var i=0;i<n;i++){var a=i*6.2832/n;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*dist,Math.sin(a)*dist);g.stroke()}
  g.strokeStyle=k.c?k.c[0]:'#555';g.lineWidth=lr*1.2;for(var i=0;i<n;i++){var a=i*6.2832/n;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*dist,Math.sin(a)*dist);g.stroke()}
  for(var i=0;i<n;i++){var a=i*6.2832/n,x=Math.cos(a)*dist,y=Math.sin(a)*dist;lobe(x,y,lr,k,i);
    if(k.em){g.save();g.globalAlpha=1;g.fillStyle='#000';g.font=Math.round(lr*.8)+'px serif';g.textAlign='center';g.textBaseline='middle';g.translate(x,y);g.rotate(-ang);g.fillText(k.em,0,0);g.restore()}}
  var hr=R*.2,hg=g.createRadialGradient(-hr*.3,-hr*.3,2,0,0,hr);hg.addColorStop(0,'#fff');hg.addColorStop(1,'#9aa7bd');
  g.beginPath();g.arc(0,0,hr,0,6.2832);g.fillStyle=hg;g.fill();g.lineWidth=R*.03;g.strokeStyle=k.o;g.stroke();
  g.beginPath();g.arc(0,0,hr*.45,0,6.2832);g.fillStyle='#1b4f86';g.fill();
  g.restore()}
function startDuo(){hideOv();ang=0;om=0;drag=false;pid=-1;active=false;cnt=0;dTot=0;dT0=performance.now();dOn=true;
  var c=$('dtm');if(!c){c=document.createElement('span');c.className='chip';c.id='dtm';$('hud').firstElementChild.appendChild(c)}c.style.display='';c.textContent='⏱ '+DSEC+'s';toast('🌀 Spin as many times as you can!')}
function duoTick(){if(!dOn)return;var left=Math.max(0,DSEC-(performance.now()-dT0)/1000);$('dtm').textContent='⏱ '+Math.ceil(left)+'s';
  if(left<=0){dOn=false;drag=false;pid=-1;active=false;om=0;$('dtm').style.display='none';var n=Math.floor(dTot);if(!Duo.finish(n))ov('⏱ Time!','You spun <b>'+n+'</b> times!',[{t:'Spin!',f:function(){}}])}}
var prev=0;
function frame(t){requestAnimationFrame(frame);var dt=Math.min(.05,(t-prev)/1000||0.016);prev=t;duoTick();
  if(drag&&performance.now()-lastT>80)om*=Math.pow(.001,dt);
  if(!drag){var s=Math.abs(om);if(s>0){var dec=(.2*s+.6)*dt;if(s-dec<=.15){om=0}else om-=Math.sign(om)*dec;
      var d=om*dt;ang+=d;count(d)}
    else if(active)endSpin()}
  var step=6.2832/SK[skin].arms,dn=Math.floor(ang/step);if(dn!==det){det=dn;if(Math.abs(om)>.5||drag)clickSnd()}
  tick();
  var s2=Math.abs(om);$('sp').textContent=Math.floor(cnt);$('rp').textContent=Math.round(s2/6.2832*60);
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  var gl=Math.min(1,s2/60);
  if(gl>.02){g.save();var rg=g.createRadialGradient(cxp,cyp,R*.3,cxp,cyp,R*(1.1+gl*.5));rg.addColorStop(0,'#ffd93b');rg.addColorStop(1,'#ffd93b00');g.globalAlpha=gl*.5;g.fillStyle=rg;g.beginPath();g.arc(cxp,cyp,R*(1.1+gl*.5),0,6.2832);g.fill();g.restore()}
  g.beginPath();g.arc(cxp,cyp+R*.06,R*1.02,0,6.2832);g.fillStyle='#0b1138';g.fill();
  if(s2>10){var save=ang,gh=Math.min(4,Math.floor(s2/10));for(var i=gh;i>=1;i--){g.save();g.globalAlpha=.16;ang=save-Math.sign(om)*i*Math.min(.5,s2*dt*.9)/1.5;drawSp();g.restore()}ang=save}
  g.globalAlpha=1;drawSp();
  if(!everSpun&&!drag&&!active){g.save();g.font='bold '+Math.round(Math.max(18,R*.14))+'px Fredoka,Trebuchet MS,sans-serif';g.textAlign='center';g.lineWidth=5;g.strokeStyle='#1b4f86';g.fillStyle='#fff';
    var yy=cyp+R+Math.max(18,R*.14)+4;if(yy>H-$('hud').offsetHeight)yy=cyp-R-8;var tx='Flick me around!';g.strokeText(tx,cxp,yy);g.fillText(tx,cxp,yy);g.restore()}
}
buildSkins();fit();requestAnimationFrame(frame);
ov('🌀 Fidget Spinner','Drag and <b>flick</b> the spinner as fast as you can. Collect spins, beat your best, and try every skin!',[{t:'Spin!',f:function(){}}]);
Duo.addButtons($('ob'),{game:'fidget-spinner',start:startDuo,cpu:[40,120],hw:true,unit:' spins'});
</script><script src="mascot.js" defer></script>
