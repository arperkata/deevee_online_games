<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const KEY='number-sequence.html:best';
function withSeed(seed,fn){const o=Math.random;let a=seed>>>0;Math.random=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};try{return fn()}finally{Math.random=o}}
let duoRuns=0,duoSeed=0;function duoNewRun(){if(Duo.mode()==='two'){if(duoRuns++%2===0)duoBase=1+Math.floor(Math.random()*1e9);duoSeed=duoBase}else duoSeed=0}
let duoBase=0;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let muted=false,AC=null;
function beep(f,d,t,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.15;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={good(){beep(660,.1,'triangle');setTimeout(()=>beep(880,.14,'triangle'),90)},bad(){beep(170,.3,'sawtooth',.1)},tap(){beep(520,.05,'sine',.1)},win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle'),i*110))},lose(){[400,320,240].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.09),i*140))}};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(!muted)beep(600,.08)};
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
function getBest(){try{return +localStorage.getItem(KEY)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function showOv(o){$('oe').textContent=o.emoji;$('ot').textContent=o.title;$('os').textContent=o.stars?'⭐'.repeat(o.stars)+'☆'.repeat(3-o.stars):'';$('op').innerHTML=o.text;$('obtn').textContent=o.btn||'▶ Play Again';$('ov').classList.remove('hide')}
function finish(o){if(Duo.active()&&Duo.finish(o.score))return;const b=getBest(),nb=o.score>b;if(nb)setBest(o.score);showOv({emoji:o.emoji,title:o.title,stars:o.stars,text:(o.line?o.line+'<br>':'')+'Score <b>'+o.score+'</b> · Best <b>'+Math.max(b,o.score)+'</b>'+(nb&&o.score>0?' 🏆 New best!':'')});o.stars>=2?sfx.win():sfx.lose()}
$('obtn').onclick=()=>{$('ov').classList.add('hide');startGame()};
Duo.addButtons($('duoBox'),{game:'number-sequence',start:()=>{$('ov').classList.add('hide');startGame()},cpu:[700,1500],hw:true,unit:' pts'});
function burst(x,y,n,set){set=set||['⭐','✨','🎉','💥','🌟'];for(let i=0;i<(n||14);i++){const e=document.createElement('div');e.textContent=set[rnd(set.length)];e.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;font-size:'+(16+rnd(18))+'px;pointer-events:none;z-index:950;text-shadow:none';document.body.appendChild(e);const a=Math.random()*6.283,d=50+Math.random()*130;if(e.animate){const an=e.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d+50)+'px)) scale(1.2) rotate('+rnd(360)+'deg)',opacity:0}],{duration:650+rnd(450),easing:'cubic-bezier(.2,.7,.4,1)'});an.onfinish=()=>e.remove()}else e.remove()}}
function floatTxt(x,y,t,c){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;font-size:28px;font-weight:bold;color:'+(c||'#ffe14a')+';text-shadow:0 3px 0 #1b4f86,0 0 6px #1b4f86;pointer-events:none;z-index:960;white-space:nowrap';document.body.appendChild(e);if(e.animate){const an=e.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:'translate(-50%,-110px) scale(1.2)',opacity:0}],{duration:1000,easing:'ease-out'});an.onfinish=()=>e.remove()}else e.remove()}
function elPos(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function shake(el){if(el.animate)el.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'translateX(-6px)'},{transform:'translateX(0)'}],{duration:350})}
function popEl(el){if(el.animate)el.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:320})}
const Q={round:0,score:0,lives:3,streak:0,correct:0,state:'idle',tLeft:1,tMax:1,tid:0,cur:null,total:10};
function hud(){$('pr').textContent='Round '+Math.min(Q.round+1,Q.total)+'/'+Q.total;$('ps').textContent='⭐ '+Q.score;$('pl').textContent='❤️'.repeat(Q.lives)+'🖤'.repeat(3-Q.lives);$('pk').textContent='🔥 '+Q.streak}
function updBar(){const f=$('fill'),r=Math.max(0,Q.tLeft/Q.tMax);f.style.width=(r*100)+'%';f.style.background=r<.25?'linear-gradient(#ff8a8a,#d63030)':'linear-gradient(#ffd84a,#f08a12)'}
function startGame(){duoNewRun();clearInterval(Q.tid);Object.assign(Q,{round:0,score:0,lives:3,streak:0,correct:0});nextQ()}
function nextQ(){if(Q.round>=Q.total||Q.lives<=0)return endQ();Q.cur=duoSeed?withSeed(duoSeed+Q.round*977,()=>gen(Q.round)):gen(Q.round);Q.tMax=Q.tLeft=tFor(Q.round);render(Q.cur);Q.state='play';clearInterval(Q.tid);Q.tid=setInterval(tickQ,100);hud();updBar()}
function tickQ(){if(Q.state!=='play')return;Q.tLeft-=.1;updBar();if(Q.tLeft<=0)answerQ(-1)}
function answerQ(i){if(Q.state!=='play')return;Q.state='wait';clearInterval(Q.tid);const ok=i===Q.cur.ans;let pts=0;
if(ok){Q.streak++;Q.correct++;pts=100+Math.round(Q.tLeft/Q.tMax*60)+(Q.streak-1)*25;Q.score+=pts;sfx.good()}else{Q.streak=0;Q.lives--;sfx.bad()}
reveal(Q.cur,i,ok,pts);Q.round++;hud();setTimeout(nextQ,ok?900:1900)}
function endQ(){Q.state='idle';clearInterval(Q.tid);const c=Q.correct,st=c>=Q.total*.8?3:c>=Q.total*.5?2:1;
finish({score:Q.score,stars:st,emoji:st===3?'🧠':st===2?'😎':'🤔',title:st===3?'Genius!':st===2?'Sharp mind!':'Nice try!',line:c+' / '+Q.total+' correct'})}
Q.total=12;
function genSeq(round){
  const ri=(a,b)=>a+rnd(b-a+1);
  const pool=round<2?['add']:round<4?['add','add','mul','sq']:round<7?['add','mul','sq','fib','grow','alt']:['mul','sq','fib','grow','alt','cube','addneg'];
  const t=pool[rnd(pool.length)];let s=[],rule='';
  if(t==='add'){const a=ri(1,25),d=ri(2,9+round);for(let i=0;i<6;i++)s.push(a+d*i);rule='Add '+d+' each time'}
  else if(t==='addneg'){const d=ri(3,9),a=d*6+ri(5,30);for(let i=0;i<6;i++)s.push(a-d*i);rule='Subtract '+d+' each time'}
  else if(t==='mul'){const a=ri(1,3),r=ri(2,3);s.push(a);for(let i=1;i<6;i++)s.push(s[i-1]*r);rule='Multiply by '+r+' each time'}
  else if(t==='sq'){const k=ri(1,7);for(let i=0;i<6;i++)s.push((k+i)*(k+i));rule='Square numbers: '+(k+5)+'² = '+s[5]}
  else if(t==='cube'){const k=ri(1,3);for(let i=0;i<6;i++)s.push(Math.pow(k+i,3));rule='Cube numbers: '+(k+5)+'³ = '+s[5]}
  else if(t==='fib'){s=[ri(1,4),ri(1,5)];for(let i=2;i<6;i++)s.push(s[i-1]+s[i-2]);rule='Add the two previous numbers'}
  else if(t==='grow'){const a=ri(1,10),d0=ri(1,3);let c=a;for(let i=0;i<6;i++){s.push(c);c+=d0+i}rule='The jump grows: +'+d0+', +'+(d0+1)+', +'+(d0+2)+'...'}
  else{const a=ri(2,15),x=ri(2,5),y=ri(6,10);let c=a;for(let i=0;i<6;i++){s.push(c);c+=i%2?y:x}rule='Alternate +'+x+' and +'+y}
  const ans=s[5],last=s[5]-s[4],set=new Set([ans]),cand=shuffle([ans+1,ans-1,ans+2,ans-2,ans+last,ans-last,ans+10,ans-10,ans*2,s[4]+s[4]-s[3]].filter(v=>v>0&&v!==ans&&Number.isInteger(v)));
  const opts=[ans];for(const v of cand){if(opts.length>=4)break;if(!set.has(v)){set.add(v);opts.push(v)}}
  let g=0;while(opts.length<4&&g++<200){const v=ans+rnd(21)-10;if(v>0&&!set.has(v)){set.add(v);opts.push(v)}}
  shuffle(opts);return{seq:s.slice(0,5),ansVal:ans,opts,ans:opts.indexOf(ans),rule};
}
const gen=genSeq,tFor=r=>Math.max(10,22-r*1.1);
function render(p){
  const sq=$('seq');sq.innerHTML='';
  p.seq.forEach((v,i)=>{const d=document.createElement('div');d.className='n';d.textContent=v;d.style.animationDelay=i*60+'ms';sq.appendChild(d)});
  const q=document.createElement('div');q.className='n q';q.id='qc';q.textContent='?';q.style.animationDelay='300ms';sq.appendChild(q);
  $('rule').className='';$('rule').textContent='What comes next?';
  const op=$('opts');op.innerHTML='';
  p.opts.forEach((v,i)=>{const b=document.createElement('button');b.className='o';b.textContent=v;b.onclick=()=>{if(Q.state==='play'){sfx.tap();answerQ(i)}};op.appendChild(b)});
}
function reveal(p,i,ok,pts){
  const bs=$('opts').children;bs[p.ans].classList.add('good');
  if(!ok&&bs[i]){bs[i].classList.add('bad');shake(bs[i])}
  const q=$('qc');q.textContent=p.ansVal;q.classList.add(ok?'ok':'no');popEl(q);
  $('rule').className='s';$('rule').textContent='💡 '+p.rule;
  const [x,y]=elPos(q);
  if(ok){burst(x,y,16);floatTxt(x,y,'+'+pts+(Q.streak>1?' 🔥x'+Q.streak:''))}else floatTxt(x,y,'Oops!','#ff8a8a');
}
addEventListener('keydown',e=>{if(document.querySelector('.duoOv'))return;const n=+e.key;if(n>=1&&n<=4&&Q.state==='play')answerQ(n-1)});
