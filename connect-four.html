<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Four</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #14407a;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:linear-gradient(#ffc766,#f08a12);color:#fff;text-decoration:none;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;font-weight:700;box-shadow:0 4px 0 #a85d00;text-shadow:0 2px 0 #a85d00}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;padding:8px 8px 0 112px;font-size:13px;font-weight:700;min-height:54px}
#bar span{background:linear-gradient(#2a6fc0,#14407a);border:2px solid #0c2c58;box-shadow:0 3px 0 #0c2c58;border-radius:12px;padding:2px 10px;text-align:center;line-height:1.15}
#bar b{display:block;font-size:20px}
.btn{min-height:44px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 #1c701c;padding:10px 26px;border-radius:16px;background:linear-gradient(#7be07b,#2ea32e);box-shadow:0 5px 0 #1c701c,inset 0 2px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c,inset 0 2px 0 rgba(255,255,255,.45)}
.btn.b2{background:linear-gradient(#ffc766,#f08a12);box-shadow:0 5px 0 #a85d00,inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 #a85d00}
.btn.b2:active{box-shadow:0 1px 0 #a85d00,inset 0 2px 0 rgba(255,255,255,.45)}
.btn.sm{min-width:44px;font-size:18px;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 #0c2c58,inset 0 2px 0 rgba(255,255,255,.3);background:linear-gradient(#2a6fc0,#14407a);border:2px solid #0c2c58}
#ov{position:fixed;inset:0;background:rgba(10,40,90,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:50;text-align:center;padding:16px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(30px,9vw,52px);color:#ffe66b;text-shadow:0 4px 0 #14407a,0 0 14px rgba(0,0,0,.45)}#ov p{margin:0;font-size:clamp(16px,4.5vw,22px);font-weight:700;max-width:340px}
#ov .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.big{font-size:clamp(56px,16vw,104px);line-height:1;animation:bnc .8s ease-in-out infinite alternate}
.stars{font-size:clamp(28px,8vw,44px);letter-spacing:4px;animation:spp .6s}
@keyframes bnc{to{transform:translateY(-12px) scale(1.08)}}
@keyframes spp{from{transform:scale(.2)}60%{transform:scale(1.3)}to{transform:scale(1)}}
canvas{display:block;margin:6px auto 0;width:min(96vw,calc((100vh - 120px)*700/680));height:auto;touch-action:none;filter:drop-shadow(0 8px 0 #0c2c58) drop-shadow(0 14px 16px rgba(0,0,0,.35))}
@media(max-width:620px){#bar{padding:54px 6px 0}}
@media(max-height:520px){#bar{min-height:0;padding:6px 6px 0 112px;flex-wrap:nowrap;font-size:11px}#bar b{font-size:16px}#bar span{padding:0 8px}.btn.sm{min-height:36px}.home{min-height:36px;padding:0 12px}#ov{gap:4px}.big{font-size:48px}#ov h1{font-size:28px}.stars{font-size:22px}#ov p{font-size:15px}#ov .btn{font-size:17px;padding:6px 16px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a>
<div id="bar"><span id="tn" style="min-width:120px">Turn<b id="tnb" style="font-size:16px">-</b></span><span class="so">Wins<b id="w">0</b></span><span class="so">Streak 🔥<b id="st">0</b></span><span class="so">Score<b id="sc">0</b></span><span class="so">Best<b id="bs">0</b></span><span class="tp" style="display:none"><i id="pa1" style="font-style:normal">-</i><b id="pa2">0</b></span><span class="tp" style="display:none"><i id="pb1" style="font-style:normal">-</i><b id="pb2">0</b></span><button id="mute" class="btn sm">🔊</button></div>
<canvas id="c" width="700" height="680"></canvas>
<div id="ov"><div class="big" id="ob">🔴</div><h1 id="t">🔴 Connect Four</h1><div class="stars" id="osr"></div><p id="m">Beat the computer! Tap a column to drop your disc.</p><div class="btns"><button class="btn" id="b1">Easy 🙂</button><button class="btn b2" id="b2">Hard 😈</button><button class="btn" id="b3" style="background:linear-gradient(#6fb6ff,#2a6fc0);box-shadow:0 5px 0 #14407a">👥 2 Players</button><button class="btn b2" id="b4" style="display:none">🔁 Rematch</button></div></div>
<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const $=id=>document.getElementById(id);
let AC,muted=false;
function beep(f,d=.1,t='sine',v=.15){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function best(v){try{if(v!==undefined)localStorage.setItem('c4best',v);return +localStorage.getItem('c4best')||0}catch(e){return 0}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
const cv=$('c'),x=cv.getContext('2d');
function fit(){const bh=$('bar').offsetHeight;const w=Math.max(200,Math.min(innerWidth*.96,(innerHeight-bh-26)*700/680));cv.style.width=Math.floor(w)+'px'}
let frt;addEventListener('resize',()=>{clearTimeout(frt);frt=setTimeout(fit,100)});addEventListener('orientationchange',()=>setTimeout(fit,200));
let mode='cpu',pn=['You','🤖 Computer'],tw=[0,0],B,turn,busy,anim,win,hover=3,diff='easy',wins=0,streak=0,score=0,moves=0,over=true,parts=[],bestS=best(),started=false,fr=0,lastRes=0;
const D=[[0,1],[1,0],[1,1],[1,-1]],ORD=[3,2,4,1,5,0,6];
function ui(){const two=mode=='two';document.querySelectorAll('.so').forEach(e=>e.style.display=two?'none':'');document.querySelectorAll('.tp').forEach(e=>e.style.display=two?'':'none');
$('pa1').textContent='🔴 '+pn[0];$('pa2').textContent=tw[0];$('pb1').textContent='🟡 '+pn[1];$('pb2').textContent=tw[1];
$('tnb').textContent=over?(started?'Game over':'-'):(turn==1?'🔴 ':'🟡 ')+pn[turn-1]+(two||turn==1?"'s turn":' thinking...');$('w').textContent=wins;$('st').textContent=streak;$('sc').textContent=score;$('bs').textContent=bestS}
function reset(){B=Array.from({length:6},()=>Array(7).fill(0));turn=1;busy=false;anim=null;win=null;moves=0;over=false;parts=[];lastMv=null}
function dropRow(b,q){for(let r=5;r>=0;r--)if(!b[r][q])return r;return -1}
function findWin(b,p){for(let r=0;r<6;r++)for(let q=0;q<7;q++)for(const[d,e]of D){const cells=[];for(let k=0;k<4;k++){const rr=r+d*k,cc=q+e*k;if(rr<0||rr>5||cc<0||cc>6||b[rr][cc]!==p)break;cells.push([rr,cc])}if(cells.length==4)return cells}return null}
function ev(b){let s=0;for(let r=0;r<6;r++){if(b[r][3]==2)s+=3;else if(b[r][3]==1)s-=3}
for(let r=0;r<6;r++)for(let q=0;q<7;q++)for(const[d,e]of D){const re=r+d*3,ce=q+e*3;if(re>5||ce<0||ce>6)continue;let a=0,h=0;for(let k=0;k<4;k++){const v=b[r+d*k][q+e*k];if(v==2)a++;else if(v==1)h++}
if(a&&h)continue;if(a==4)return 10000;if(h==4)return -10000;if(a==3)s+=6;else if(a==2)s+=2;if(h==3)s-=7;else if(h==2)s-=2}return s}
function mm(b,d,al,be,mx){const e=ev(b);if(Math.abs(e)>=10000)return e>0?e+d:e-d;if(d==0)return e;let any=false,v=mx?-1e9:1e9;
for(const q of ORD){const r=dropRow(b,q);if(r<0)continue;any=true;b[r][q]=mx?2:1;const s=mm(b,d-1,al,be,!mx);b[r][q]=0;
if(mx){if(s>v)v=s;if(v>al)al=v}else{if(s<v)v=s;if(v<be)be=v}if(al>=be)break}
return any?v:0}
function ai(){const cols=ORD.filter(q=>dropRow(B,q)>=0);let pick;
if(diff=='easy'&&Math.random()<.3)pick=cols[Math.random()*cols.length|0];
else{const dep=diff=='easy'?2:6;let bv=-1e9,bc=[];for(const q of cols){const r=dropRow(B,q);B[r][q]=2;const s=mm(B,dep-1,-1e9,1e9,false);B[r][q]=0;if(s>bv){bv=s;bc=[q]}else if(s==bv)bc.push(q)}
pick=diff=='easy'?bc[Math.random()*bc.length|0]:bc[0]}
drop(pick,2)}
function drop(q,p){const r=dropRow(B,q);if(r<0)return;busy=true;anim={c:q,r,p,y:40,v:0,b:0};beep(p==1?500:380,.05,'triangle')}
let lastMv=null;
function land(){const{c,r,p}=anim;B[r][c]=p;lastMv=[r,c];moves++;anim=null;beep(p==1?330:260,.12,'sine',.2);
for(let i=0;i<8;i++)parts.push({x:c*100+50,y:80+r*100+90,vx:(Math.random()-.5)*6,vy:-Math.random()*3,l:25,c:p==1?'#ff7a7a':'#ffe46b'});
const w=findWin(B,p);if(w){win=w;end(p)}else if(moves==42)end(0);else{turn=3-p;busy=false;if(turn==2&&mode!='two'){busy=true;setTimeout(ai,350)}ui()}}
function end(p){lastRes=p;over=true;busy=true;let m;
if(mode=='two'){if(p){tw[p-1]++;m='🎉 '+pn[p-1]+' wins!';[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*110));for(const[r,c]of win)for(let i=0;i<12;i++)parts.push({x:c*100+50,y:80+r*100+50,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*9,l:60,c:['#fff','#ffe46b','#ff7a7a','#7affb0'][i%4]})}else m='🤝 Draw!';ui();setTimeout(()=>showOv(m),1300);return}
if(p==1){wins++;streak++;const pts=(diff=='hard'?200:100)+(42-moves)*3+streak*50;score+=pts;m='🎉 '+pn[0]+' wins! +'+pts;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*110));
for(const[r,c]of win)for(let i=0;i<12;i++)parts.push({x:c*100+50,y:80+r*100+50,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*9,l:60,c:['#fff','#ffe46b','#ff7a7a','#7affb0'][i%4]})}
else if(p==2){streak=0;m='😵 '+pn[1]+' wins!';[300,250,200].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sawtooth',.1),i*150))}
else{streak=0;m='🤝 It\'s a draw!'}
if(score>bestS){bestS=score;best(bestS);m+='\n🏆 New best!'}ui();setTimeout(()=>showOv(m),1300)}
function showOv(m){const two=mode=='two';$('b4').style.display=started?'':'none';
if(two&&started){$('ob').textContent=lastRes?'🏆':'🤝';$('osr').textContent='';$('t').textContent=m;$('m').textContent=pn[0]+' '+tw[0]+' - '+tw[1]+' '+pn[1];$('b1').textContent='Easy vs 🤖';$('b2').textContent='Hard vs 🤖';$('b3').textContent='👥 Change players';$('ov').classList.remove('hide');return}
$('b3').textContent='👥 2 Players';$('ob').textContent=!started?'🔴':lastRes==1?'🏆':lastRes==2?'😵':'🤝';$('osr').textContent=started&&lastRes==1?'⭐⭐⭐':'';$('t').textContent=started?m.split('\n')[0]:'🔴 Connect Four';$('m').textContent=started?'Score '+score+' · Best '+bestS+(m.indexOf('\n')>0?' · New best!':''):'Beat the computer! Tap a column to drop your disc.';
$('b1').textContent=(started?'Play Again ':'')+'Easy 🙂';$('b2').textContent=(started?'Play Again ':'')+'Hard 😈';$('b4').textContent='🔁 Rematch';$('ov').classList.remove('hide')}
function startG(d){diff=d;started=true;reset();$('ov').classList.add('hide');ui()}
let cpuNamed=false;
async function goCpu(d){if(mode!='cpu'||!cpuNamed){const n=await Duo.askNames({cpu:true});if(!n)return;pn=n;cpuNamed=true;tw=[0,0]}mode='cpu';startG(d)}
$('b1').onclick=()=>goCpu('easy');$('b2').onclick=()=>goCpu('hard');
$('b3').onclick=async()=>{const n=await Duo.askNames();if(!n)return;pn=n;mode='two';cpuNamed=false;tw=[0,0];startG(diff)};
$('b4').onclick=()=>startG(diff);
function colOf(e){const r=cv.getBoundingClientRect();return Math.max(0,Math.min(6,Math.floor((e.clientX-r.left)/r.width*7)))}
cv.addEventListener('pointermove',e=>{hover=colOf(e)});
cv.addEventListener('pointerdown',e=>{hover=colOf(e);if(!over&&!busy&&(turn==1||mode=='two')&&dropRow(B,hover)>=0)drop(hover,turn)});
function disc(cx,cy,p,a){x.globalAlpha=a||1;const g=x.createRadialGradient(cx-12,cy-12,5,cx,cy,42);g.addColorStop(0,p==1?'#ff8a8a':'#fff6a0');g.addColorStop(.35,p==1?'#ff3030':'#ffd21f');g.addColorStop(1,p==1?'#b80f0f':'#e09a00');x.fillStyle=g;x.beginPath();x.arc(cx,cy,40,0,7);x.fill();x.strokeStyle=p==1?'#a30d0d':'#c78400';x.lineWidth=4;x.beginPath();x.arc(cx,cy,28,0,7);x.stroke();x.globalAlpha=1}
function draw(){fr++;x.clearRect(0,0,700,680);
x.globalAlpha=1;x.fillStyle='#0a2a5a';x.beginPath();if(x.roundRect)x.roundRect(0,80,700,600,24);else x.rect(0,80,700,600);x.fill();
if(anim){anim.y+=anim.v;anim.v+=1.5;const ty=80+anim.r*100+50;if(anim.y>=ty){anim.y=ty;if(!anim.b&&anim.v>6){anim.v=-anim.v*.25;anim.b=1}else land()}}
if(!over&&!busy&&(turn==1||mode=='two'))disc(hover*100+50,40+Math.sin(fr/8)*4,turn);
for(let r=0;r<6;r++)for(let q=0;q<7;q++)if(B[r][q])disc(q*100+50,80+r*100+50,B[r][q]);
if(anim)disc(anim.c*100+50,anim.y,anim.p);
x.globalAlpha=1;
const bg=x.createLinearGradient(0,80,0,680);bg.addColorStop(0,'#3a8cf2');bg.addColorStop(1,'#1553b8');x.fillStyle=bg;x.beginPath();if(x.roundRect)x.roundRect(0,80,700,600,24);else x.rect(0,80,700,600);
for(let r=0;r<6;r++)for(let q=0;q<7;q++){const cx=q*100+50,cy=80+r*100+50;x.moveTo(cx+38,cy);x.arc(cx,cy,38,0,Math.PI*2)}
x.fill('evenodd');x.strokeStyle='#0c3a8a';x.lineWidth=5;
for(let r=0;r<6;r++)for(let q=0;q<7;q++){x.beginPath();x.arc(q*100+50,80+r*100+50,38,0,7);x.stroke()}
if(lastMv&&!anim&&B[lastMv[0]][lastMv[1]]){x.strokeStyle='#fff';x.lineWidth=6;x.globalAlpha=.65+.35*Math.sin(fr/6);x.beginPath();x.arc(lastMv[1]*100+50,80+lastMv[0]*100+50,45,0,7);x.stroke();x.globalAlpha=1}
if(win){x.strokeStyle='#fff';x.lineWidth=8;x.globalAlpha=.6+.4*Math.sin(fr/5);for(const[r,q]of win){x.beginPath();x.arc(q*100+50,80+r*100+50,40,0,7);x.stroke()}x.globalAlpha=1}
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;x.globalAlpha=Math.min(1,p.l/20);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,6,0,7);x.fill()}x.globalAlpha=1;
requestAnimationFrame(draw)}
reset();over=true;ui();showOv('');fit();draw();
