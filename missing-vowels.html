<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();

<script>
const $=id=>document.getElementById(id);
const GK='missing-vowels.html:';
function lsGet(k,d){try{const v=localStorage.getItem(GK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(GK+k,JSON.stringify(v))}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let AC=null,muted=lsGet('mute',false);
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d,type,v,delay){if(muted)return;try{audio();if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.1)+.02)}catch(e){}}
const sfx={tap(){beep(520,.05,'square',.06)},ok(){beep(660,.1);beep(880,.14,'sine',.15,.09)},bad(){beep(170,.22,'sawtooth',.1)},
 good(n){beep(500+Math.min(n||0,8)*70,.12,'triangle',.18)},win(){[523,659,784,1047].forEach((f,i)=>beep(f,.2,'triangle',.18,i*.11))},lose(){[420,330,250].forEach((f,i)=>beep(f,.25,'sawtooth',.1,i*.16))}};
function setMuteUI(){$('mute').textContent=muted?'🔇':'🔊'}
$('mute').onclick=()=>{muted=!muted;lsSet('mute',muted);setMuteUI();audio();if(!muted)sfx.tap()};setMuteUI();
addEventListener('pointerdown',audio);addEventListener('keydown',audio);
function overlay(o){$('oe').textContent=o.e||'';$('ot').textContent=o.t||'';$('op').innerHTML=o.p||'';
 $('os').textContent=o.s==null?'':'⭐'.repeat(o.s)+'☆'.repeat(3-o.s);
 $('oextra').innerHTML=o.extra||'';$('obtn').textContent=o.btn||'Play';$('obtn').onclick=()=>{sfx.tap();$('ov').classList.add('hide');o.go&&o.go()};
 const c=$('ov').firstElementChild;c.style.animation='none';c.offsetWidth;c.style.animation='';$('ov').classList.remove('hide')}
function floatText(x,y,t,c){const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.color=c||'#ffd84a';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
 const a=e.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-30px) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-80px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'});a.onfinish=()=>e.remove()}
function burst(x,y,n,list){list=list||['✨','⭐','🎉','💥'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='pt';e.textContent=list[rnd(list.length)];e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
 const ang=Math.random()*6.283,d=40+Math.random()*90,dx=Math.cos(ang)*d,dy=Math.sin(ang)*d-30;
 const a=e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.2)`,opacity:1,offset:.6},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+60}px)) scale(.6)`,opacity:0}],{duration:700+Math.random()*400,easing:'ease-out'});a.onfinish=()=>e.remove()}}
function confetti(n){const cols=['#ff4d4d','#ffd84a','#5fd35f','#3b9cff','#c06bff','#ff9a2e'];for(let i=0;i<(n||60);i++){const e=document.createElement('div');e.style.cssText=`position:fixed;z-index:600;pointer-events:none;width:10px;height:14px;border-radius:2px;background:${cols[rnd(6)]};left:${Math.random()*100}vw;top:-20px`;document.body.appendChild(e);
 const a=e.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:1}],{duration:1400+Math.random()*1400,delay:Math.random()*400,easing:'ease-in'});a.onfinish=()=>e.remove()}}
function shake(el){el.classList.remove('shk');el.offsetWidth;el.classList.add('shk')}
function popEl(el){el.classList.remove('pop');el.offsetWidth;el.classList.add('pop')}
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
const PACKS={
'Animals':['ELEPHANT','GIRAFFE','PENGUIN','DOLPHIN','KANGAROO','CHEETAH','BUTTERFLY','CROCODILE','GORILLA','HAMSTER','LEOPARD','OCTOPUS','PARROT','RABBIT','SQUIRREL','TURTLE','ZEBRA','MONKEY','TIGER','HIPPO'],
'Food':['PIZZA','SPAGHETTI','CHOCOLATE','BANANA','HAMBURGER','SANDWICH','PANCAKE','POPCORN','WATERMELON','STRAWBERRY','CARROT','BROCCOLI','NOODLES','COOKIE','CHEESE','PEANUT','LEMONADE','CEREAL','PINEAPPLE','TOMATO'],
'Countries':['CANADA','BRAZIL','EGYPT','FRANCE','GERMANY','ITALY','JAPAN','MEXICO','NORWAY','PORTUGAL','RUSSIA','SPAIN','SWEDEN','THAILAND','TURKEY','AUSTRALIA','ARGENTINA','INDIA','KENYA','PERU'],
'Space & Nature':['PLANET','GALAXY','ROCKET','COMET','JUPITER','SATURN','NEPTUNE','ASTRONAUT','TELESCOPE','VOLCANO','RAINBOW','THUNDER','TORNADO','GLACIER','WATERFALL','MOUNTAIN','FOREST','DESERT','OCEAN','METEOR'],
'Sports':['SOCCER','TENNIS','BASKETBALL','SWIMMING','CRICKET','HOCKEY','VOLLEYBALL','SKATEBOARD','GYMNASTICS','BASEBALL','BADMINTON','ARCHERY','KARATE','SURFING','MARATHON','CYCLING','BOWLING','SKIING','FOOTBALL','RUGBY'],
'Everyday':['SCHOOL','TEACHER','BACKPACK','PENCIL','COMPUTER','KEYBOARD','TELEVISION','BICYCLE','REFRIGERATOR','UMBRELLA','GUITAR','PIANO','BLANKET','PILLOW','WINDOW','GARDEN','KITCHEN','MIRROR','CLOCK','TELEPHONE']};
const ICON={'Mix':'🎲','Animals':'🐘','Food':'🍕','Countries':'🌍','Space & Nature':'🚀','Sports':'⚽','Everyday':'🏠'};
const ROUND=10,TW=25;let best=lsGet('best',0),pack=lsGet('pack','Mix');
let list,wi,W,T,hn,score,streak,okN,tleft,tStart,running,busy,missed;
const isV=c=>'AEIOU'.includes(c);
function build(){const L=pack==='Mix'?Object.keys(PACKS).flatMap(k=>shuffle(PACKS[k]).slice(0,4)):PACKS[pack];list=shuffle(L).slice(0,ROUND).sort((a,b)=>a.length-b.length)}
function load(){W=list[wi];T='';hn=0;busy=false;tleft=TW;tStart=performance.now();
 $('pz').innerHTML=W.split('').filter(c=>!isV(c)).map(c=>'<div class="tl">'+c+'</div>').join('');renderAns();
 const k=Object.keys(PACKS).find(k=>PACKS[k].includes(W));$('cat').textContent=ICON[k]+' '+k+' · '+W.length+' letters';hud()}
function renderAns(){$('ans').innerHTML=W.split('').map((c,i)=>'<div class="sl'+(i<hn?' lk':'')+'">'+(T[i]||'')+'</div>').join('')}
function hud(){$('pP').textContent='🔤 '+(wi+1)+'/'+ROUND;$('pS').textContent='⭐ '+score;$('pC').textContent='🔥 '+streak;$('fill').style.width=(tleft/TW*100)+'%'}
function type(ch){if(!running||busy||T.length>=W.length)return;T+=ch;sfx.tap();renderAns();if(T.length===W.length)verify()}
function back(){if(!running||busy||T.length<=hn)return;T=T.slice(0,-1);sfx.tap();renderAns()}
function verify(){if(T===W)return win();sfx.bad();streak=0;shake($('ans'));T=W.slice(0,hn);setTimeout(renderAns,250);hud()}
function reveal(good){busy=true;$('pz').innerHTML=W.split('').map(c=>'<div class="tl'+(isV(c)?' v':'')+'">'+c+'</div>').join('');
 if(good)[...$('ans').children].forEach(e=>e.classList.add('go'))}
function win(){const p=100+Math.round(tleft*5)+streak*20-hn*30;streak++;score+=Math.max(30,p);okN++;reveal(true);sfx.good(streak);
 const r=$('pz').getBoundingClientRect();floatText(r.left+r.width/2,r.top,'+'+Math.max(30,p)+(streak>1?' 🔥'+streak:''));burst(r.left+r.width/2,r.top+20,12);if(streak%3===0)confetti(25);hud();setTimeout(nextW,1100)}
function fail(why){streak=0;missed.push(W);reveal(false);sfx.lose();T=W;renderAns();$('cat').textContent=why+' It was '+W;hud();setTimeout(nextW,1500)}
function nextW(){if(!running)return;if(wi>=ROUND-1)return end();wi++;load()}
$('hint').onclick=()=>{if(!running||busy||hn>=W.length-1)return;T=W.slice(0,hn+1);hn++;if(T.length>=W.length)T=W.slice(0,W.length-1);sfx.ok();renderAns()};
$('skip').onclick=()=>{if(!running||busy)return;fail('Skipped!')};
['QWERTYUIOP','ASDFGHJKL','ZXCVBNM⌫'].forEach(r=>{const d=document.createElement('div');d.className='kr';for(const ch of r){const b=document.createElement('button');b.className='kk'+(ch==='⌫'?' d':isV(ch)?' v':'');b.textContent=ch;b.onpointerdown=e=>{e.preventDefault();ch==='⌫'?back():type(ch)};d.appendChild(b)}$('kb').appendChild(d)});
addEventListener('keydown',e=>{if(!running||document.querySelector('.duoOv'))return;if(/^[a-z]$/i.test(e.key))type(e.key.toUpperCase());else if(e.key==='Backspace')back()});
function chips(){return'<div class="chips">'+['Mix',...Object.keys(PACKS)].map(t=>'<button class="chip'+(t===pack?' on':'')+'" data-t="'+t+'">'+ICON[t]+' '+t+'</button>').join('')+'</div>'}
$('oextra').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;pack=b.dataset.t;lsSet('pack',pack);sfx.tap();[...document.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('on',x===b))});
let dq=null;
function newGame(){if(Duo.mode()==='two'&&dq&&dq.n<2){dq.n++;list=dq.list.slice()}else{build();dq=Duo.mode()==='two'?{list:list.slice(),n:1}:null}wi=0;score=0;streak=0;okN=0;missed=[];running=true;load()}
function end(){running=false;if(Duo.active()&&Duo.finish(score))return;const st=okN>=9?3:okN>=6?2:1,nb=score>best;if(nb){best=score;lsSet('best',best)}sfx.win();if(st>=2)confetti(60);
 overlay({e:st===3?'🏆':'🔤',t:okN+' of '+ROUND+' fixed!',p:'Score <b>'+score+'</b><br>'+(nb?'🌟 New best!':'Best: '+best)+(missed.length?'<br><small>Missed: '+missed.join(', ')+'</small>':''),s:st,extra:chips(),btn:'Play Again',go:newGame})}
function loop(){if(running&&!busy){tleft=TW-(performance.now()-tStart)/1000;if(tleft<=0){tleft=0;fail("Time's up!")}else $('fill').style.width=(tleft/TW*100)+'%'}requestAnimationFrame(loop)}
W='PLNT';T='';hn=0;list=[];score=0;streak=0;tleft=TW;running=false;busy=true;$('pz').innerHTML='<div class="tl">?</div>';$('ans').innerHTML='';loop();
Duo.addButtons($('duoBox'),{game:'missing-vowels',start:()=>{$('ov').classList.add('hide');newGame()},cpu:[1000,2400],hw:true,unit:' pts'});
overlay({e:'🔤',t:'Missing Vowels',p:'The vowels ran away! Fill them back in and type the whole word. Orange keys are the vowels. Pick a pack!<br>Best: '+best,extra:chips(),btn:'Start!',go:newGame});

</script></body></html>
