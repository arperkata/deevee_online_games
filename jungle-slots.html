 });

 fctx.setTransform(dpr,0,0,dpr,0,0);fctx.clearRect(0,0,fx.width,fx.height);
 parts.forEach(p=>{fctx.save();fctx.globalAlpha=1;fctx.translate(p.x,p.y);fctx.scale(Math.max(.15,Math.abs(Math.cos(p.rot))),1);
  const g=fctx.createRadialGradient(-3,-3,1,0,0,p.r);g.addColorStop(0,'#fff3a0');g.addColorStop(1,'#ffb300');
  fctx.beginPath();fctx.arc(0,0,p.r,0,6.3);fctx.fillStyle=g;fctx.fill();fctx.lineWidth=3;fctx.strokeStyle='#9a5b00';fctx.stroke();
  fctx.beginPath();fctx.arc(0,0,p.r*.55,0,6.3);fctx.lineWidth=2;fctx.strokeStyle='#ffef9a';fctx.stroke();fctx.restore();});
}
const parts=[];
function burst(n){
 const r=cv.getBoundingClientRect();
 for(let i=0;i<n&&parts.length<160;i++)parts.push({x:r.left+r.width*(.2+rnd()*.6),y:r.top+r.height*.6,vx:(rnd()-.5)*520,vy:-(500+rnd()*750),r:9+rnd()*6,rot:rnd()*6,rs:6+rnd()*10,life:2.6+rnd(),b:0});
}
let coinsShown=coins,winShown=0,winTarget=0;
function updHud(){
 setH('coins',Math.round(coinsShown));setH('win',Math.round(winShown));
 setH('betv',(fs.left>0?fs.bet:BETS[bi])+'<i>BET</i>',1);
 setH('spin',phase==='spin'?'STOP':phase==='busy'?'...':fs.left>0?'FREE SPIN '+fs.left:'SPIN');
 const cl=phase==='idle'?'go':(phase==='busy'?'gray':'');if(cache.cls!==cl){cache.cls=cl;$('spin').className=cl;}
 const h=!fs.on;if(cache.fh!==h){cache.fh=h;$('fsp').hidden=h;}
 setH('fsn',fs.on?(fs.left+' left'+(fs.mult>1?'  x'+fs.mult:'')):'');
}
const cache={};
function setH(id,v,html){if(cache[id]===v)return;cache[id]=v;const e=$(id);if(html)e.innerHTML=v;else e.textContent=v;}
function update(dt){
 gt+=dt;
 for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);t.r();}}
 reels.forEach((r,c)=>{
  if(r.bump>0)r.bump=Math.max(0,r.bump-dt*3);
  if(r.mode==='spin'){r.y-=22*dt;if(gt>=r.stopAt){r.mode='stop';r.y0=r.tg+5+(r.y-Math.floor(r.y));r.t=0;r.dur=quick?.38:.7;}}
  else if(r.mode==='stop'){r.t+=dt;const k=Math.min(1,r.t/r.dur),e=1-Math.pow(1-k,3);r.y=r.y0+(r.tg-r.y0)*e;
   if(k>=1){r.y=r.tg;r.mode='idle';r.cells=[0,1,2].map(i=>({s:symAt(c,r.tg+i),sc:1,dy:0,v:0}));r.bump=1;sfx.tick();stopped++;if(stopped===COLS&&allDone){const f=allDone;allDone=null;f();}}}
  if(r.cells)r.cells.forEach(cl=>{if(cl.pop)cl.sc=Math.max(0,cl.sc-dt*4);if(cl.dy<0){cl.v+=2800*dt;cl.dy=Math.min(0,cl.dy+cl.v*dt);if(cl.dy===0){cl.v=0;}}});
 });
 const d1=coins-coinsShown;coinsShown=Math.abs(d1)<=1?coins:coinsShown+Math.sign(d1)*Math.max(1,Math.abs(d1)*Math.min(1,dt*5));
 const d2=winTarget-winShown;winShown=Math.abs(d2)<=1?winTarget:winShown+Math.sign(d2)*Math.max(1,Math.abs(d2)*Math.min(1,dt*5));
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.rs*dt;p.life-=dt;
  const fl=window.innerHeight-12;if(p.y>fl&&p.vy>0){p.y=fl;p.vy*=-.55;p.vx*=.8;p.b++;}
  if(p.life<=0||p.b>3)parts.splice(i,1);}
 updHud();
}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;update(dt);draw();}
/* ---------- UI helpers ---------- */
const setMsg=t=>{$('msg').textContent=t;};
function modal(html,btn,hideBtn){return new Promise(res=>{$('ovc').innerHTML=html;const b=$('ovb');b.innerHTML=btn||'OK';b.hidden=!!hideBtn;$('ov').hidden=false;b.onclick=()=>{$('ov').hidden=true;$('ovc').onclick=null;res();};});}
function banner(t){const b=$('banner');b.textContent=t;b.className='banner';void b.offsetWidth;b.className='banner show';}
function addWin(a){coins+=a;winTarget+=a;if(a>best){best=a;}save();}
function resetWin(){winTarget=0;winShown=0;}
function payHTML(){
 const lb=(fs.left>0?fs.bet:BETS[bi])/NL;
 let h='<div class="big-e">'+CFG.emoji+'</div><h2>Pay Table</h2><p>Bet '+(lb*NL)+' = '+NL+' lines x '+lb+'. Wins pay left to right.</p><table>';
 const top=id=>Math.max.apply(null,Object.keys(CFG.pay[id]).map(k=>CFG.pay[id][k]));
 Object.keys(CFG.pay).sort((a,b)=>top(b)-top(a)).forEach(id=>{
  h+='<tr><td class="e">'+SYM[id].e+'</td><td>'+Object.keys(CFG.pay[id]).map(k=>k+'x <b>'+Math.round(CFG.pay[id][k]*lb)+'</b>').join(' &nbsp; ')+'</td></tr>';});
 h+='</table>';
 if(CFG.wild)h+='<p>'+SYM[CFG.wild].e+' <b>WILD</b> '+CFG.wildText+'</p>';
 h+='<p>'+SYM[CFG.scatter].e+' <b>SCATTER</b> '+CFG.scatterText+'</p><p>&#127881; '+CFG.featureText+'</p><p>Just for fun - no real money, no purchases.</p>';
 return h;
}
function pickGame(bet){
 return new Promise(res=>{
  const board=[];for(let i=0;i<12;i++)board.push(drawPrize());
  const got=[];let total=0,done=false;
  function render(){
   let h='<div class="big-e">'+CFG.emoji+'</div><h2>Bubble Bonus!</h2><p>'+(done?'All done!':'Pop '+(CFG.pick.picks-got.length)+' bubble'+(CFG.pick.picks-got.length>1?'s':''))+' &mdash; prize so far: <b style="color:#ffe44d">'+total+'</b></p><div class="grid">';
   board.forEach((v,i)=>{const o=got.indexOf(i)>=0;h+='<button class="bub'+(o?' open':done?' rest':'')+'" data-i="'+i+'">'+(o||done?(v*bet):'')+'</button>';});
   $('ovc').innerHTML=h+'</div>';
  }
  render();$('ovb').hidden=true;$('ov').hidden=false;
  $('ovc').onclick=e=>{
   const t=e.target.closest?e.target.closest('[data-i]'):null;if(!t||done)return;const i=parseInt(t.dataset.i,10);if(got.indexOf(i)>=0)return;
   got.push(i);total+=board[i]*bet;sfx.pop();burst(8);if(got.length>=CFG.pick.picks){done=true;render();const b=$('ovb');b.textContent='Collect '+total;b.hidden=false;b.onclick=()=>{$('ov').hidden=true;$('ovc').onclick=null;res(total);};}else render();};
 });
}
/* ---------- spin flow ---------- */
async function doSpin(){
 if(phase!=='idle')return;
 const free=fs.left>0;
 if(!free){
  if(coins<BETS[0]){refill();return;}
  while(BETS[bi]>coins)bi--;
  coins-=BETS[bi];
 }else fs.left--;
 const bet=free?fs.bet:BETS[bi],mult=free?fs.mult:1;
 phase='spin';quick=false;hl={};lineWins=[];resetWin();save();setMsg(free?'Free spin! x'+mult:'Good luck!');
 const res=computeSpin(bet,mult);
 reels.forEach((r,c)=>{r.mode='spin';r.cells=null;r.tg=res.stops[c];r.stopAt=gt+.45+c*.27;});
 stopped=0;await new Promise(r=>{allDone=r;});
 phase='busy';await sleep(150);
 if(res.expand.length){
  res.expand.forEach(c=>{reels[c].cells=reels[c].cells.map(cl=>({s:cl.s===CFG.scatter?cl.s:CFG.wild,sc:1,dy:0,v:0}));});
  sfx.big();setMsg(SYM[CFG.wild].e+' Wild expands!');burst(10);await sleep(700);
 }
 let spinWin=0;
 for(const st of res.steps){
  hl={};st.wins.forEach(w=>w.cells.forEach(([c,r])=>{hl[c+','+r]=1;}));lineWins=st.wins;
  spinWin+=st.amt;addWin(st.amt);sfx.win(Math.min(6,3+st.wins.length));burst(6+Math.min(24,st.amt/bet*3));
  const bw=st.wins.slice().sort((a,b)=>b.mult-a.mult)[0];
  setMsg((st.wins.length>1?st.wins.length+' lines! ':'')+SYM[bw.sym].e.repeat(bw.n)+' +'+st.amt+(st.sm>1?'  (cascade x'+st.sm+')':''));
  await sleep(1150);
  if(st.next){
   const rem={};st.removed.forEach(k=>{rem[k]=1;});
   reels.forEach((r,c)=>r.cells.forEach((cl,rw)=>{if(rem[c+','+rw])cl.pop=true;}));
   hl={};lineWins=[];sfx.pop();await sleep(380);
   reels.forEach((r,c)=>{
    const sv=[];r.cells.forEach((cl,rw)=>{if(!rem[c+','+rw])sv.push({cl,rw});});const nn=ROWS-sv.length;const nc=[];
    for(let i=0;i<nn;i++)nc.push({s:st.next[c][i],sc:1,dy:-nn*CH,v:0});
    sv.forEach((o,j)=>nc.push({s:o.cl.s,sc:1,dy:(o.rw-(nn+j))*CH,v:0}));
    r.cells=nc;});
   await sleep(750);
  }
 }
 if(res.scCount>=3){
  hl={};reels.forEach((r,c)=>r.cells.forEach((cl,rw)=>{if(cl.s===CFG.scatter)hl[c+','+rw]=1;}));lineWins=[];
  if(res.scWin){spinWin+=res.scWin;addWin(res.scWin);}
  sfx.big();burst(20);setMsg(SYM[CFG.scatter].e+' '+res.scCount+' scatters!'+(res.scWin?' +'+res.scWin:''));await sleep(900);
 }
 if(res.fsAward>0&&(!free||CFG.fs.retrig)){
  if(!free){fs={left:res.fsAward,mult:fsStart(),total:0,bet:bet,on:true};}else fs.left+=res.fsAward;
  banner(res.fsAward+' FREE SPINS!');sfx.big();burst(30);await sleep(1300);
 }
 if(res.pick){const p=await pickGame(bet);spinWin+=p;addWin(p);burst(30);sfx.big();setMsg('Bubble bonus +'+p);await sleep(400);}
 if(free){fs.total+=spinWin;fs.mult=fsNext(fs.mult,res.total>0);}
 const ratio=spinWin/bet;
 if(ratio>=25){banner('MEGA WIN!');sfx.big();burst(70);}else if(ratio>=10){banner('BIG WIN!');sfx.big();burst(45);}else if(ratio>=4){banner('NICE WIN!');burst(25);}
 if(spinWin===0&&!res.fsAward)setMsg(free?'No win - spin again!':'Try again!');
 else if(ratio>=4)await sleep(700);
 if(free&&fs.left===0&&fs.on){
  const st=fs.total/fs.bet,n=st>=40?3:st>=12?2:1,tot=fs.total;fs.on=false;fs.mult=1;fs.bet=0;
  phase='idle';updHud();
  await modal('<div class="big-e">'+CFG.emoji+'</div><h2>Free Spins Complete!</h2><div class="stars">'+'&#11088;'.repeat(n)+'</div><p>You won <b style="color:#ffe44d">'+tot+'</b> coins</p><p>Best win: '+best+'</p>','Keep Spinning');
 }
 phase='idle';save();
 if(coins<BETS[0]&&fs.left===0)refill();
}
async function refill(){
 phase='busy';
 await modal('<div class="big-e">&#129689;</div><h2>Out of coins!</h2><p>No worries - it is all just for fun. Grab a free refill!</p>','&#129689; Free refill +1000');
 coins+=1000;bi=0;save();phase='idle';setMsg('Refilled! Spin away!');
}
function quickStop(){quick=true;reels.forEach((r,c)=>{if(r.mode==='spin')r.stopAt=Math.min(r.stopAt,gt+c*.07);});}
$('spin').onclick=()=>{if(phase==='idle')doSpin();else if(phase==='spin')quickStop();};
$('bm').onclick=()=>{if(phase==='idle'&&fs.left===0){bi=Math.max(0,bi-1);save();}};
$('bp').onclick=()=>{if(phase==='idle'&&fs.left===0){bi=Math.min(BETS.length-1,bi+1);while(BETS[bi]>coins&&bi>0)bi--;save();}};
$('pay').onclick=async()=>{if(phase!=='idle')return;phase='busy';await modal(payHTML(),'Got it!');phase='idle';};
$('snd').onclick=()=>{muted=!muted;$('snd').innerHTML=muted?'&#128263;':'&#128266;';};
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='Enter')&&$('ov').hidden){e.preventDefault();$('spin').onclick();}});
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,150));
fit();requestAnimationFrame(frame);
phase='busy';
modal('<div class="big-e">'+CFG.emoji+'</div><h2>'+CFG.title+'</h2><p>'+CFG.intro+'</p><p>You start with 1000 free coins. Out of coins? Get a free refill!</p><p><b>Just for fun - no real money, no purchases.</b></p>'+(best?'<p>Best win: <b style="color:#ffe44d">'+best+'</b></p>':''),'&#9654; PLAY').then(()=>{phase='idle';beep(660,.1,'square',.05);});
})();
</script><script src="dragon-theme.js" defer></script>
