<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Invaders</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:radial-gradient(circle at 50% 30%,#2b3a8f,#0f1747 70%,#070b26) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation;padding:0}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;max-width:100vw}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:500;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;font-size:clamp(16px,4.5vw,22px);line-height:1.4;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.btn{font:inherit;font-weight:700;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#go{font-size:clamp(24px,6vw,32px);min-height:52px;padding:12px 44px;animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
#pad{position:fixed;left:0;right:0;bottom:8px;display:none;justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:40;pointer-events:none}
@media (pointer:coarse),(hover:none){#pad{display:flex}}
#pad .pb{pointer-events:auto;width:68px;height:68px;font-size:30px;padding:0;margin:0;touch-action:none}
#pad .pb.f{width:92px;background:linear-gradient(#ff9a5c,#e8451e);box-shadow:0 5px 0 #8f200d;text-shadow:0 2px 0 #8f200d}
#pad .pb.f.on,#pad .pb.f:active{box-shadow:0 1px 0 #8f200d}
#pad .pb.t{background:linear-gradient(#ffd84d,#f0a30a);box-shadow:0 5px 0 #a86c00;text-shadow:0 2px 0 #a86c00}
#pad .pb.t.on,#pad .pb.t:active{box-shadow:0 1px 0 #a86c00}
#pl,#pr{display:flex;gap:10px;align-items:flex-end}
.dp{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:6px}
.dp .u{grid-area:1/2}.dp .l{grid-area:2/1}.dp .d{grid-area:2/2}.dp .r{grid-area:2/3}
@media (orientation:landscape) and (max-height:500px){
#pad{bottom:auto;top:0;height:100%;padding:0}
#pl,#pr{position:fixed;top:50%;transform:translateY(-50%);flex-wrap:wrap;justify-content:center}
#pl{left:8px;width:150px}#pr{right:8px;width:150px}
#pad .pb{width:56px;height:56px;font-size:26px}#pad .pb.f{width:76px}
.dp{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:4px}
#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#go{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="pad"><div id="pl"><button class="btn pb" data-k="left">◀</button><button class="btn pb" data-k="right">▶</button></div><div id="pr"><button class="btn pb f" data-k="fire">FIRE</button></div></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button></div>
<script>
const W=420,H=560,KEY='space-invaders.html_best',PADH=84,SIDEW=150;
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
let best=0,muted=false;
try{best=+localStorage.getItem(KEY)||0;muted=localStorage.getItem(KEY+'_m')=='1'}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,best)}catch(e){}return true}return false}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'_m',muted?1:0)}catch(x){}e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function fit(){const vw=innerWidth,vh=innerHeight,pd=$('pad'),sp=pd&&getComputedStyle(pd).display!='none';
 const land=sp&&matchMedia('(orientation:landscape) and (max-height:500px)').matches;
 const bot=sp&&!land?PADH:0,side=land?SIDEW*2+16:0;let top=60;
 let s=Math.min((vw-side)/W,(vh-top-4-bot)/H);const s2=Math.min((vw-side)/W,(vh-8-bot)/H);
 if(land||(vw-side-W*s2)/2>=130){top=4;s=s2}
 s=Math.max(.2,s);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top-bot-4)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
let parts=[],pops=[],shake=0;
function burst(x,y,n,cols,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c,s){pops.push({x,y,t,c,s,l:.9})}
function clearFx(){parts=[];pops=[];shake=0}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const q of pops){q.y-=40*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);shake=Math.max(0,shake-dt*30)}
function drawFx(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1;for(const q of pops){g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,q.s||22,'center',q.c)}g.globalAlpha=1}
function txt(t,x,y,s,al,c){g.font='bold '+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign=al||'left';g.textBaseline='alphabetic';g.lineWidth=s/4.5;g.shadowBlur=0;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(x,y,w,h,c){g.save();g.globalAlpha=1;g.fillStyle=c||'#14367a';rr(x,y,w,h,h/2);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();g.restore()}
function gloss(x,y,w,h,r,c1,c2){g.save();g.globalAlpha=1;const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;rr(x,y,w,h,r);g.fill();g.globalAlpha=.4;g.fillStyle='#fff';rr(x+3,y+2,Math.max(2,w-6),Math.max(2,h*.38),Math.min(r*.7,h/2));g.fill();g.restore()}
const stars=n=>'<span class="stars">'+'⭐'.repeat(n)+'☆'.repeat(3-n)+'</span>';
function emo(e,x,y,s,base,al){g.save();g.globalAlpha=al==null?1:al;g.shadowBlur=0;g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline=base||'middle';g.fillStyle='#000';g.fillText(e,x,y);g.restore()}
function shakeOn(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
const ovHidden=()=>$('ov').classList.contains('hide');
function hideOv(){$('ov').classList.add('hide')}
function showOv(t,m,b){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;$('ov').classList.remove('hide')}
/* input: keys + pad buttons */
const keys={left:0,right:0,up:0,down:0,fire:0},hooks={press(k){}};
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down',' ':'fire',z:'fire',x:'fire'};
function setKey(k,v){if(v&&!keys[k])hooks.press(k);keys[k]=v?1:0;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',!!v))}
addEventListener('keydown',e=>{const k=KM[e.key.toLowerCase()];if(k&&ovHidden()){e.preventDefault();if(!e.repeat)setKey(k,1)}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)setKey(k,0)});
addEventListener('blur',()=>{for(const k in keys)setKey(k,0)});
document.querySelectorAll('.pb').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}setKey(k,1)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,0)))});
$('go').onclick=()=>{$('go').blur();startGame()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();startGame()}});
/* ---------- GAME ---------- */
const CW=40,CH=34,COLS=8,SY=H-46,SH_Y=H-132,EM=['👽','🦑','🐙','👾','🤖'],PTS=[40,30,20,20,10];
const STARS=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,2)}));
let state='ready',score=0,lives=3,wave=1,al=[],gx=0,gy=0,dir=1,stepT=0,flip=0,total=1,sx=W/2,tx=W/2,pb=[],ab=[],shields=[],ufo=null,ufoT=15,fireT=0,shootT=1,streak=0,inv=0,bannerT=0,t=0,held=false,ptr=false;
function mkShields(){shields=[];for(let i=0;i<4;i++){const cells=[];for(let r=0;r<9;r++)for(let c=0;c<14;c++){const corner=r<3&&(c<3-r||c>=11+r);const arch=r>=6&&c>=4&&c<10;cells.push(!(corner||arch))}shields.push({x:W/4*(i+.5)-28,y:SH_Y,cells})}}
function spawnWave(){
  const rows=Math.min(5,3+Math.ceil(wave/2));al=[];
  for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++)al.push({c,r,k:r%5,alive:true});
  total=al.length;gx=40;gy=64+Math.min(4,wave-1)*10;dir=1;stepT=.5;pb=[];ab=[];shootT=1;ufo=null;ufoT=rnd(12,20);
}
function startGame(){
  if(ovHidden())return;hideOv();clearFx();score=0;lives=3;wave=1;state='play';sx=tx=W/2;fireT=0;streak=0;inv=1;bannerT=0;mkShields();spawnWave();beep(520,.1,'triangle');
}
const alive=()=>al.filter(a=>a.alive);
function shoot(){
  if(fireT>0||pb.length>=3||state!='play')return;fireT=.3;pb.push({x:sx,y:SY-22,hit:false});beep(880,.08,'square',.04,-500);
}
function eraseAt(sh,x,y,rad){ // returns true if cell was solid
  const c=Math.floor((x-sh.x)/4),r=Math.floor((y-sh.y)/4);
  if(c<0||r<0||c>=14||r>=9||!sh.cells[r*14+c])return false;
  for(let dr=-rad;dr<=rad;dr++)for(let dc=-rad;dc<=rad;dc++){const rr2=r+dr,cc=c+dc;if(rr2<0||cc<0||rr2>=9||cc>=14)continue;if((!dr&&!dc)||Math.random()<.6)sh.cells[rr2*14+cc]=false}
  return true;
}
function hitShield(x,y,rad){for(const sh of shields)if(x>=sh.x&&x<sh.x+56&&y>=sh.y&&y<sh.y+36&&eraseAt(sh,x,y,rad))return true;return false}
function killAlien(a){
  a.alive=false;streak++;const mul=Math.min(5,1+Math.floor(streak/4)),p=PTS[a.k]*mul;score+=p;
  const x=gx+a.c*CW+CW/2,y=gy+a.r*CH+CH/2;burst(x,y,14,['#7dff7d','#ffe14d','#ff7be5','#5cc8ff'],200);pop(x,y-8,'+'+p+(mul>1?' x'+mul:''),'#ffe14d',20);beep(300+a.k*60,.1,'square',.05,200);shake=Math.max(shake,3);
}
function hurt(){
  lives--;inv=2;shake=14;ab=[];burst(sx,SY,34,['#ff5c5c','#ffe14d','#fff','#5cc8ff'],260);beep(180,.5,'sawtooth',.07,-140);streak=0;
  if(lives<=0)over();
}
function over(){
  state='over';const nb=saveBest(score);const n=score>=2500?3:score>=1000?2:score>=250?1:0;
  setTimeout(()=>showOv(nb&&score>0?'New Record! 🏆':'Game Over 👾',stars(n)+'<span class="big">'+score+'</span>Reached wave '+wave+' · Best '+best+(nb&&score>0?'<br><span class="nb">🎉 New best!</span>':''),'Play again'),800);
}
function update(dt){
  t+=dt;inv=Math.max(0,inv-dt);fireT=Math.max(0,fireT-dt);
  if(state=='banner'){bannerT-=dt;if(bannerT<=0){state='play';spawnWave()}}
  if(state!='play'&&state!='banner')return;
  const mv=(keys.right-keys.left);
  if(mv){sx+=mv*290*dt;tx=sx}else if(ptr){sx+=clamp(tx-sx,-620*dt,620*dt)}
  sx=clamp(sx,22,W-22);tx=clamp(tx,22,W-22);
  if(keys.fire||(ptr&&held))shoot();
  if(state=='banner')return;
  // aliens
  const live=alive(),f=live.length/total;
  stepT-=dt;
  if(stepT<=0){
    stepT=(.09+.6*f)*Math.max(.5,1-.07*(wave-1));flip^=1;
    let mn=99,mx=-1;for(const a of live){mn=Math.min(mn,a.c);mx=Math.max(mx,a.c)}
    const nx=gx+dir*10;
    if(nx+mn*CW<14||nx+mx*CW+CW>W-14){dir=-dir;gy+=16}else gx=nx;
    beep(110+flip*30,.05,'square',.03);
    for(const a of live)if(gy+a.r*CH+CH>=SY-24){lives=1;hurt();return}
  }
  // alien erode shields when low
  for(const a of live){const ay=gy+a.r*CH+CH-6;if(ay>=SH_Y)hitShield(gx+a.c*CW+CW/2,ay,1)}
  // alien shooting
  shootT-=dt;
  if(shootT<=0&&ab.length<Math.min(6,2+wave)&&live.length){
    shootT=Math.max(.35,1.1-.09*wave)*rnd(.6,1.2);
    const col=live[rint(0,live.length-1)].c;let low=null;for(const a of live)if(a.c==col&&(!low||a.r>low.r))low=a;
    ab.push({x:gx+low.c*CW+CW/2,y:gy+low.r*CH+CH});
  }
  // player bullets
  for(const b of pb){
    for(let s=0;s<3&&!b.hit;s++){
      b.y-=170*dt*1.0;
      if(hitShield(b.x,b.y,1)){b.hit=true;streak=0;break}
      for(const a of al){if(!a.alive)continue;const x=gx+a.c*CW,y=gy+a.r*CH;if(b.x>x+4&&b.x<x+CW-4&&b.y>y+4&&b.y<y+CH-2){killAlien(a);b.hit=true;break}}
      if(!b.hit&&ufo&&Math.abs(b.x-ufo.x)<22&&Math.abs(b.y-ufo.y)<16){const p=[50,100,150,300][rint(0,3)]*Math.min(5,1+Math.floor(streak/4));score+=p;pop(ufo.x,ufo.y,'+'+p+' 🛸','#ff7be5',24);burst(ufo.x,ufo.y,30,['#ff7be5','#ffe14d','#fff'],260);beep(900,.3,'triangle',.06,600);ufo=null;b.hit=true;streak++}
    }
    if(b.y<46&&!b.hit){b.hit=true;streak=0}
  }
  pb=pb.filter(b=>!b.hit);
  // alien bullets
  for(const b of ab){
    for(let s=0;s<3&&!b.hit;s++){
      b.y+=(185+wave*10)*dt/3;if(hitShield(b.x,b.y+8,1)){b.hit=true;break}
    }
    if(!b.hit&&inv<=0&&b.y>SY-18&&b.y<SY+14&&Math.abs(b.x-sx)<20){b.hit=true;hurt();if(state!='play')return}
    if(b.y>H)b.hit=true;
  }
  ab=ab.filter(b=>!b.hit);
  // ufo
  ufoT-=dt;
  if(!ufo&&ufoT<=0){const l=Math.random()<.5;ufo={x:l?-24:W+24,y:56,v:(l?1:-1)*95};ufoT=rnd(14,24)}
  if(ufo){ufo.x+=ufo.v*dt;if(ufo.x<-40||ufo.x>W+40)ufo=null}
  // wave clear
  if(!alive().length){const bn=100*wave;score+=bn;wave++;state='banner';bannerT=1.6;pb=[];ab=[];pop(W/2,H/2,'Wave clear! +'+bn,'#ffe14d',28);beep(700,.3,'triangle',.07,500);if(wave%2==0&&lives<5)lives++}
}
function drawShip(){
  if(inv>0&&Math.floor(inv*10)%2)return;
  g.save();g.fillStyle='#0b2a5c';rr(sx-22,SY-4,44,18,6);g.fill();
  gloss(sx-22,SY-8,44,18,7,'#6fe0ff','#1f7fe0');gloss(sx-6,SY-22,12,18,4,'#ffe14d','#f0a30a');
  g.fillStyle='#ff5c5c';g.beginPath();g.arc(sx,SY+1,3.5,0,6.283);g.fill();g.restore();
}
function draw(){
  shakeOn();
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101a5e');bg.addColorStop(1,'#1b2f8f');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
  g.fillStyle='#fff';for(const s of STARS){g.fillRect(s.x,(s.y+t*8*s.r)%H,s.r,s.r)}
  g.fillStyle='#14367a';g.fillRect(0,SY+22,W,H-SY);g.fillStyle='#5cc8ff';g.fillRect(0,SY+22,W,3);
  for(const sh of shields){for(let r=0;r<9;r++)for(let c=0;c<14;c++)if(sh.cells[r*14+c]){g.fillStyle=r<4?'#6dff6d':'#33d433';g.fillRect(sh.x+c*4,sh.y+r*4,4,4)}}
  for(const a of al){if(!a.alive)continue;const x=gx+a.c*CW+CW/2,y=gy+a.r*CH+CH/2+(flip?2:-2);emo(EM[a.k],x,y,28+(flip?2:0))}
  if(ufo)emo('🛸',ufo.x,ufo.y,34);
  for(const b of pb){g.fillStyle='#0b2a5c';rr(b.x-3.5,b.y-9,7,20,3);g.fill();g.fillStyle='#7dff7d';rr(b.x-2.5,b.y-10,5,18,2.5);g.fill()}
  for(const b of ab){g.fillStyle='#fff';rr(b.x-4,b.y-2,8,18,4);g.fill();g.fillStyle='#ff3d8f';rr(b.x-3,b.y-1,6,16,3);g.fill()}
  drawShip();drawFx();
  if(state=='banner')txt('Wave '+wave+' get ready!',W/2,H/2+70,30,'center','#ffe14d');
  g.restore();
  pill(8,8,150,40);txt('Score '+score,42,36,22);
  pill(W-150,8,142,40);txt('Wave '+wave,W-142,36,22,'left','#ffe14d');
  const mul=Math.min(5,1+Math.floor(streak/4));
  if(mul>1)txt('Combo x'+mul+'!',W/2,H-6,20,'center','#ffe14d');
  for(let i=0;i<lives;i++)emo('❤️',20+i*26,H-14,22);
  txt('Best '+best,W-10,H-8,16,'right');
}
function ptrSet(e){tx=pos(e)[0]}
cv.addEventListener('pointerdown',e=>{ptr=true;held=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}ptrSet(e)});
cv.addEventListener('pointermove',e=>{if(ptr)ptrSet(e)});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ptr=false;held=false}));
showOv('👾 Space Invaders','Zap the cute aliens before they land!<br>Hide behind shields, chain kills for combos.<br>Drag to move &amp; auto-fire, or ← → + Space','Play');

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000)||0);last=now;try{update(dt);updFx(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
