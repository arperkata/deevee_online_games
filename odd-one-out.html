<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spot the Odd One</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#1e90e6,#8fdcff);color:#fff;text-align:center;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;padding:8px 10px 4px}
a.home,.mute{background:linear-gradient(#ffb21f,#f07a0a);color:#fff;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;text-decoration:none;font:700 17px inherit;font-family:inherit;border:0;box-shadow:0 4px 0 #a9560b;cursor:pointer}
.mute{padding:0 12px}
h1{margin:0;font-size:clamp(22px,4.5vw,40px);text-shadow:0 3px 0 #0b3a78,2px 2px 0 #0b3a78,-2px -2px 0 #0b3a78,2px -2px 0 #0b3a78,-2px 2px 0 #0b3a78}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(16px,3vw,22px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
#bar{width:min(90vw,520px);height:16px;margin:2px auto 0;background:#0b3a78;border:2px solid #fff;border-radius:9px;overflow:hidden;flex:none}
#fill{height:100%;width:100%;background:linear-gradient(#a6ff5a,#35c21a);transition:width .1s linear}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px 10px}
#grid{display:grid;gap:clamp(4px,1.2vmin,8px);padding:clamp(8px,2vmin,14px);background:linear-gradient(#103d86,#0a2a63);border-radius:22px;box-shadow:0 8px 0 #06204a,0 12px 24px rgba(0,0,0,.35);border:4px solid #3aa0ff}
.c{background:linear-gradient(#fff,#cfe9ff);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #06204a;transition:transform .1s;line-height:1;min-width:0;min-height:0}
.c:active{transform:scale(.9)}
.c.no{background:linear-gradient(#ff9a9a,#ff3b3b);animation:sh .3s}
.c.yes{background:linear-gradient(#d4ffc8,#4cd83a);animation:pop .3s;box-shadow:0 0 0 3px #ffe14a,0 4px 0 #06204a}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.25)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.82);z-index:50;padding:16px}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:20px 28px;box-shadow:0 8px 0 #06244d;max-width:92vw;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
#mt{font-size:clamp(26px,6vw,40px);font-weight:700;text-shadow:0 3px 0 #0b3a78}
#mt .st{font-size:clamp(34px,9vw,56px);display:block;margin:4px 0}
#mt small{font-size:.6em;color:#ffe14a}
button.go{font:700 clamp(20px,5vw,28px) inherit;font-family:inherit;margin-top:14px;padding:.4em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 6px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
@media (max-height:500px){h1{display:none}#top{padding:4px 8px 0}}
</style></head><body>
<div id="top"><a class="home" href="index.html">⌂ Home</a><h1>Spot the Odd One!</h1><span class="pill">Score <b id="sc">0</b></span><span class="pill">Round <b id="rd">1</b></span><span class="pill">Best <b id="bs">0</b></span><button class="mute" id="mute" aria-label="Sound">🔊</button></div>
<div id="bar"><div id="fill"></div></div>
<div id="stage"><div id="grid"></div></div>
<canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt"></div><button class="go" id="again">Play again</button></div></div>
<script>
const PAIRS=[["🍎","🍅"],["😀","😃"],["🐶","🐕"],["🌞","🌝"],["🐱","😺"],["⭐","🌟"],["🍊","🏀"],["🐻","🧸"],["🍋","🌕"],["🐸","🐢"],["🔵","🟦"],["❤️","🧡"]];
let score=0,round=0,time=60,timer,odd,over=false,ac,muted=false,best=0,n=2;
const $=id=>document.getElementById(id);
try{best=+localStorage.getItem('oddbest')||0}catch(e){}
$('bs').textContent=best;
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function beep(f,d=.12,t='triangle'){if(muted)return;try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=t;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* confetti */
const fx=$('fx'),fc=fx.getContext('2d');let P=[],raf=0,lt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();
function confetti(x,y,k=40){const C=['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<k;i++){const a=Math.random()*6.283,s=150+Math.random()*350;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,l:1+Math.random()*.6,c:C[i%6],r:Math.random()*6,s:5+Math.random()*6})}lt=performance.now();if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;fc.clearRect(0,0,fx.width,fx.height);P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.min(1,p.l*2);fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});P=P.filter(p=>p.l>0&&p.y<fx.height+20);raf=P.length?requestAnimationFrame(tick):0;if(!raf)fc.clearRect(0,0,fx.width,fx.height)}
function fit(){
  const st=$('stage'),gr=$('grid'),cs=getComputedStyle(gr);
  const gap=parseFloat(cs.columnGap)||6,pad=parseFloat(cs.paddingLeft)||8,bd=4;
  const aw=st.clientWidth-20-2*(pad+bd),ah=st.clientHeight-16-2*(pad+bd);
  let cell=Math.min((aw-gap*(n-1))/n,(ah-gap*(n-1))/n,130);
  cell=Math.max(24,Math.floor(cell));
  gr.style.gridTemplateColumns='repeat('+n+','+cell+'px)';gr.style.gridAutoRows=cell+'px';
  gr.style.setProperty('--fs',Math.floor(cell*.68)+'px');
}
addEventListener('resize',()=>{fxfit();fit()});addEventListener('orientationchange',()=>setTimeout(()=>{fxfit();fit()},200));
function next(){
  if(over)return;
  n=Math.min(2+Math.floor(round/2),7);const [a,b]=PAIRS[Math.random()*PAIRS.length|0];
  const swap=Math.random()<.5,same=swap?b:a,diff=swap?a:b;
  odd=Math.random()*n*n|0;
  const gr=$('grid');gr.innerHTML='';
  for(let i=0;i<n*n;i++){const d=document.createElement('div');d.className='c';d.style.fontSize='var(--fs)';d.textContent=i===odd?diff:same;d.onclick=()=>pick(d,i);gr.appendChild(d)}
  fit();
  $('rd').textContent=round+1;
}
function pick(d,i){
  if(over)return;
  if(i===odd){d.classList.add('yes');score+=10+Math.floor(time/6);round++;time=Math.min(60,time+2);beep(700);beep(940,.15);$('sc').textContent=score;
    const r=d.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,22);setTimeout(next,280)}
  else{d.classList.add('no');time=Math.max(0,time-3);beep(160,.25,'sawtooth');setTimeout(()=>d.classList.remove('no'),300)}
}
function start(){score=0;round=0;time=60;over=false;$('sc').textContent=0;$('msg').style.display='none';next();
  clearInterval(timer);timer=setInterval(()=>{time-=.1;$('fill').style.width=Math.max(0,time/60*100)+'%';$('fill').style.background=time<15?'linear-gradient(#ff8a7a,#ff2a1a)':'linear-gradient(#a6ff5a,#35c21a)';
    if(time<=0){over=true;clearInterval(timer);
      if(score>best){best=score;$('bs').textContent=best;try{localStorage.setItem('oddbest',best)}catch(e){}}
      $('mt').innerHTML='⏰ Time\'s up!<span class="st">'+(round>=12?'⭐⭐⭐':round>=6?'⭐⭐':'⭐')+'</span>Score: '+score+'<br><small>'+round+' found</small>';$('msg').style.display='flex';confetti(innerWidth/2,innerHeight/3,70);
      [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*120))}},100)}
$('again').onclick=start;start();
</script></body></html>
