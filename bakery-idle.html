<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Cookie Bakery Idle - Tap the cookie, buy bakers. Free online game, plays on phone, tablet and PC. No sign-up."><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Bakery</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:10px;z-index:1000;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;text-shadow:none}
.btn{font:inherit;font-size:20px;font-weight:700;min-height:48px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:16px;padding:8px 22px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn[disabled]{background:linear-gradient(#9aa6b5,#6f7c8e);box-shadow:0 5px 0 #4a5566;text-shadow:0 2px 0 #4a5566;cursor:default}
.btn.red{background:linear-gradient(#ff7a6a,#e0382a);box-shadow:0 5px 0 #8f1f15;text-shadow:0 2px 0 #8f1f15}
.btn.red:active{box-shadow:0 1px 0 #8f1f15}
.btn.blue{background:linear-gradient(#5cc8ff,#1c7fd6);box-shadow:0 5px 0 #0f4a8c;text-shadow:0 2px 0 #0f4a8c}
.btn.blue:active{box-shadow:0 1px 0 #0f4a8c}
.btn.gold{background:linear-gradient(#ffd84d,#f09a12);box-shadow:0 5px 0 #a8620a;text-shadow:0 2px 0 #a8620a}
.btn.gold:active{box-shadow:0 1px 0 #a8620a}
.btn.sm{min-height:44px;font-size:16px;padding:6px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#14367a;border:3px solid #5cc8ff;border-radius:999px;padding:2px 14px;min-height:40px;font-weight:700;font-size:20px;white-space:nowrap}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:900;text-align:center;padding:16px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(32px,9vw,60px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,460px);font-size:clamp(16px,4.4vw,21px);line-height:1.4;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
#ov .btn{font-size:clamp(24px,6vw,32px);padding:12px 44px}
#ov .btn.ghost{font-size:20px;padding:8px 26px}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.fly{position:fixed;z-index:800;pointer-events:none;font-weight:700;font-size:24px;white-space:nowrap;transform:translate(-50%,-50%);animation:fly .9s ease-out forwards;text-shadow:0 2px 0 #1b4f86,0 0 4px #1b4f86}
@keyframes fly{to{transform:translate(-50%,-150px) scale(1.2);opacity:0}}
.pc{position:fixed;z-index:800;pointer-events:none;font-size:22px;transform:translate(-50%,-50%);animation:pc .8s ease-out forwards}
@keyframes pc{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
.cf{position:fixed;top:-40px;z-index:950;pointer-events:none;font-size:28px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#ov .btn{font-size:20px;padding:6px 28px;min-height:44px}}

body{background:radial-gradient(circle at 50% 30%,#ffb066 0,#c9622b 55%,#6b2a12 100%) fixed}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:54px}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
#top{text-align:center;width:100%;padding:0 10px}
#cnt{font-size:clamp(30px,8vw,52px);font-weight:700;line-height:1;text-shadow:0 3px 0 #5a2008}
#cps{font-size:18px;font-weight:600;margin-top:2px;text-shadow:0 2px 0 #5a2008}
#goal{position:relative;height:22px;max-width:360px;margin:6px auto 0;background:#5a2008;border:3px solid #ffd84d;border-radius:999px;overflow:hidden}
#gb{height:100%;width:0;background:linear-gradient(#ffe14d,#f09a12)}
#gt{position:absolute;inset:0;font-size:13px;font-weight:700;line-height:16px;text-shadow:0 1px 0 #5a2008}
#cwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#cookie{width:min(33vh,60vw,330px);height:min(33vh,60vw,330px);border-radius:50%;border:0;padding:0;font-size:min(25vh,45vw,250px);line-height:1;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ffe9b8,#e8a24d 60%,#b86a22);box-shadow:0 10px 0 #7a3d10,0 0 0 6px #fff3c4,0 0 40px #ffd84d;display:flex;align-items:center;justify-content:center;touch-action:manipulation;text-shadow:none}
#cookie:active,#cookie.sq{transform:scale(.93);box-shadow:0 4px 0 #7a3d10,0 0 0 6px #fff3c4,0 0 40px #ffd84d}
#gold{position:absolute;font-size:56px;cursor:pointer;animation:gl 1s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffe14d);z-index:20;padding:6px}
@keyframes gl{50%{transform:scale(1.25) rotate(12deg)}}
#side{height:42%;display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;background:#5a2008;border-top:4px solid #ffd84d}
#sbar{display:flex;gap:8px;justify-content:center;padding-top:6px}
#shop{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px;touch-action:pan-y}
.it{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;border:3px solid #0b2a5c;background:linear-gradient(#3b86e0,#1c55a8);color:#fff;font-size:15px;font-weight:700;text-align:left;padding:2px 10px;box-shadow:0 4px 0 #0b2a5c;cursor:pointer;flex-shrink:0;width:100%;text-shadow:0 1px 0 #0b2a5c}
.it .e{font-size:28px}.it .nm{flex:1;line-height:1.1}.it small{display:block;font-size:12px;font-weight:600;color:#cfe6ff}.it .n{font-size:22px;color:#ffe14d}
.it.poor{background:linear-gradient(#7c8798,#556070)}
.it.done{display:none}
@media (min-aspect-ratio:12/10){
#app{flex-direction:row;padding-top:0}#main{padding-top:50px}#side{height:auto;width:46%;border-top:0;border-left:4px solid #ffd84d;padding-top:54px}
#sbar{padding-top:0}
#cookie{width:min(60vh,36vw);height:min(60vh,36vw);font-size:min(46vh,28vw)}
}
</style><link rel="stylesheet" href="dragon-theme.css">
</head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<div id="app"><div id="main">
<div id="top"><div id="cnt">0</div><div id="cps">0 per second</div><div id="goal"><div id="gb"></div><span id="gt"></span></div></div>
<div id="cwrap"><button id="cookie" aria-label="Cookie">🍪</button><div id="gold" hidden>🌟</div></div></div>
<div id="side"><div id="sbar"><button class="btn blue sm" id="qty">Buy x1</button><button class="btn red sm" id="reset">Reset</button></div><div id="shop"></div></div></div>

<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button><button class="btn ghost blue" id="cont" hidden></button></div>
<script>
const KEY='cookie-clicker-idle.html_';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ld(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function rmk(k){try{localStorage.removeItem(KEY+k)}catch(e){}}
let muted=ld('m',0)==1;
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';sv('m',muted?1:0);e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
document.addEventListener('contextmenu',e=>e.preventDefault());
function fly(x,y,txt,col){const d=document.createElement('div');d.className='fly';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col||'#ffe14d';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function pieces(x,y,em,n){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pc';d.textContent=em[i%em.length];d.style.left=x+'px';d.style.top=y+'px';const a=Math.random()*6.283,s=40+Math.random()*70;d.style.setProperty('--dx',Math.cos(a)*s+'px');d.style.setProperty('--dy',Math.sin(a)*s-20+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}
function confetti(n){const e=['🎉','⭐','🎊','✨','🍬','💛'];for(let i=0;i<(n||30);i++){const d=document.createElement('div');d.className='cf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function fmt(n){n=Math.floor(n);if(n<10000)return''+n;const u=['K','M','B','T','Qa'];let i=-1;let v=n;while(v>=1000&&i<u.length-1){v/=1000;i++}return(v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[i]}
function fmtT(s){s=Math.floor(s);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
const starRow=n=>'<span class="stars">'+(n>=3?'⭐⭐⭐':n==2?'⭐⭐☆':n==1?'⭐☆☆':'☆☆☆')+'</span>';
const ovHidden=()=>$('ov').classList.contains('hide');
let ovGo=null,ovCont=null;
function showOv(t,m,b,c,onGo,onCont){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;ovGo=onGo;ovCont=onCont;$('cont').hidden=!c;$('cont').textContent=c||'';$('ov').classList.remove('hide')}
function hideOv(){$('ov').classList.add('hide')}
$('go').onclick=()=>{$('go').blur();if(ovGo)ovGo()};
$('cont').onclick=()=>{$('cont').blur();if(ovCont)ovCont()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();if(ovGo)ovGo()}});
function wireReset(btn,fn){let t=0,tm;const lab=btn.textContent;btn.onclick=()=>{if(!t){t=1;btn.textContent='Sure? Tap again';tm=setTimeout(()=>{t=0;btn.textContent=lab},3000)}else{clearTimeout(tm);t=0;btn.textContent=lab;fn()}}}

const B=[['👆','Cursor',15,.5],['👵','Grandma',100,3],['🧑‍🌾','Farm',1100,20],['⛏️','Mine',12000,110],['🏭','Factory',130000,600],['🚀','Rocket',1400000,3200],['🔮','Portal',20000000,18000]];
const CU=[['🧤','Strong finger',100,2],['💪','Big fist',1000,2],['🦾','Robo arm',10000,3],['🔥','Mega oven',100000,3]];
const GOAL=300000;
let best=ld('best',0),S=null,qty=1,last=Date.now(),frenzy=0,shown=false,goldT=30+Math.random()*30,accS=0;
const fresh=()=>({c:0,tot:0,n:B.map(()=>0),cu:CU.map(()=>0),t:0,ts:Date.now(),won:0});
const pw=()=>CU.reduce((m,u,i)=>m*(S.cu[i]?u[3]:1),1);
const cps=()=>S.n.reduce((a,n,i)=>a+n*B[i][3],0)*(frenzy>0?7:1);
const cost=(i,q)=>{const b=B[i][2]*Math.pow(1.15,S.n[i]);return Math.ceil(b*(Math.pow(1.15,q)-1)/.15)};
function save(){S.ts=Date.now();sv('save',S)}
function build(){const s=$('shop');s.innerHTML='';
  CU.forEach((u,i)=>{const b=document.createElement('button');b.className='it';b.id='cu'+i;b.innerHTML='<span class="e">'+u[0]+'</span><span class="nm">'+u[1]+'<small>Click power x'+u[3]+'</small></span><span id="cuc'+i+'"></span>';b.onclick=()=>buyCU(i);s.appendChild(b)});
  B.forEach((u,i)=>{const b=document.createElement('button');b.className='it';b.id='b'+i;b.innerHTML='<span class="e">'+u[0]+'</span><span class="nm">'+u[1]+'<small>+'+u[3]+' per sec each</small></span><span class="n" id="bn'+i+'"></span><span id="bc'+i+'"></span>';b.onclick=()=>buy(i);s.appendChild(b)})}
function buyCU(i){const u=CU[i];if(S.cu[i]||S.c<u[2]){beep(200,.1,'sawtooth');return}S.c-=u[2];S.cu[i]=1;beep(800,.15,'triangle');pieces(innerWidth/2,innerHeight/2,['✨','🍪'],8);upd(true)}
function buy(i){const c=cost(i,qty);if(S.c<c){beep(200,.1,'sawtooth');return}S.c-=c;S.n[i]+=qty;beep(520+i*60,.1,'triangle');const r=$('b'+i).getBoundingClientRect();pieces(r.left+40,r.top+20,[B[i][0]],4);upd(true)}
function upd(force){
  $('cnt').textContent=fmt(S.c)+' 🍪';const cp=cps();$('cps').textContent=(cp<10?cp.toFixed(1):fmt(cp))+' per second'+(frenzy>0?' 🔥 x7!':'');
  const pr=Math.min(1,S.tot/GOAL);$('gb').style.width=pr*100+'%';$('gt').textContent='Goal: bake '+fmt(GOAL)+' · '+fmt(S.tot)+' so far';
  CU.forEach((u,i)=>{const b=$('cu'+i);b.className='it'+(S.cu[i]?' done':S.c<u[2]?' poor':'');$('cuc'+i).textContent='🍪 '+fmt(u[2])});
  B.forEach((u,i)=>{const b=$('b'+i),c=cost(i,qty);b.className='it'+(S.c<c?' poor':'');$('bn'+i).textContent=S.n[i];$('bc'+i).textContent='🍪 '+fmt(c)});
  if(S.tot>=GOAL&&!S.won)win();
}
function win(){S.won=1;save();const t=S.t,stars=t<=600?3:t<=1200?2:1,nb=!best||t<best;if(nb){best=t;sv('best',best)}confetti(40);beep(880,.5,'triangle',.07,300);
  showOv('🍪 Cookie Legend!',starRow(stars)+'<span class="big">'+fmtT(t)+'</span>to bake '+fmt(GOAL)+' cookies · Best '+fmtT(best)+(nb?'<br><span class="nb">🎉 New best!</span>':''),'Play again','Keep baking',()=>{newRun()},()=>hideOv())}
function newRun(){rmk('save');S=fresh();frenzy=0;hideOv();upd(true);save()}
function click(e){const p=pw();S.c+=p;S.tot+=p;const x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2;fly(x+(Math.random()-.5)*40,y-10,'+'+fmt(p));if(Math.random()<.35)pieces(x,y,['🍪','✨'],2);beep(420+Math.random()*120,.04,'triangle',.04);const c=$('cookie');c.classList.add('sq');setTimeout(()=>c.classList.remove('sq'),70);upd()}
$('cookie').addEventListener('pointerdown',e=>{e.preventDefault();click(e)});
$('cookie').addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();click({})}});
$('qty').onclick=()=>{qty=qty==1?10:qty==10?100:1;$('qty').textContent='Buy x'+qty;upd(true)};
wireReset($('reset'),()=>{newRun();fly(innerWidth/2,innerHeight/2,'Fresh bakery!','#fff')});
$('gold').addEventListener('pointerdown',e=>{e.preventDefault();const g=$('gold');g.hidden=true;shown=false;goldT=40+Math.random()*40;
  if(Math.random()<.5){const b=Math.max(60,cps()*60);S.c+=b;S.tot+=b;fly(e.clientX,e.clientY,'Lucky! +'+fmt(b),'#7dff7d')}else{frenzy=12;fly(e.clientX,e.clientY,'Frenzy x7!','#ff9a3d')}
  pieces(e.clientX,e.clientY,['🌟','✨'],10);beep(900,.2,'triangle',.07,400);upd()});
function tick(){
  const now=Date.now();let d=(now-last)/1000;last=now;if(d<0)d=0;if(d>2){d=d*.5;}else S.t+=d;
  const g=cps()*d;S.c+=g;S.tot+=g;if(frenzy>0)frenzy=Math.max(0,frenzy-d);
  goldT-=Math.min(d,1);const el=$('gold');
  if(!shown&&goldT<=0){shown=true;el.hidden=false;el.style.left=(10+Math.random()*70)+'%';el.style.top=(10+Math.random()*70)+'%';goldT=9}
  else if(shown&&goldT<=0){shown=false;el.hidden=true;goldT=30+Math.random()*30}
  accS+=d;if(accS>3){accS=0;save()}upd();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=Date.now()});addEventListener('pagehide',save);
const sd=ld('save',null);S=sd&&sd.n&&sd.n.length==B.length?Object.assign(fresh(),sd):fresh();
while(S.cu.length<CU.length)S.cu.push(0);
let away=0;if(sd){const el=clamp((Date.now()-(S.ts||Date.now()))/1000,0,28800);away=cps()*el*.5;S.c+=away;S.tot+=away}
build();upd(true);last=Date.now();setInterval(tick,100);
showOv('🍪 Cookie Bakery',sd?'Welcome back baker!'+(away>1?'<br>Your bakers made <b>'+fmt(away)+'</b> cookies while you were away.':'')+'<br>You have <b>'+fmt(S.c)+'</b> 🍪':'Tap the giant cookie, buy bakers and upgrades.<br>Bake <b>'+fmt(GOAL)+'</b> cookies to win! Your bakers keep working even when you leave.','Bake!',null,()=>{hideOv();last=Date.now()});

</script><script src="dragon-theme.js" defer></script>
</body></html>
