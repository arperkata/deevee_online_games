<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="description" content="City Builder - Balance food, money, happiness. Free online game, plays on phone, tablet and PC. No sign-up."><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Builder</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit}
a.home,.mute{position:fixed;top:10px;z-index:1000;background:linear-gradient(#ffb21f,#f08a12);color:#fff;min-height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font:700 17px 'Fredoka','Trebuchet MS',sans-serif;border:0;box-shadow:0 4px 0 #a9560b;cursor:pointer;background-color:#f08a12}
a.home{left:10px;padding:0 14px}
.mute{right:10px;width:44px;padding:0;font-size:20px}
#hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;padding:8px 60px 4px 100px;min-height:52px}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:clamp(14px,3.4vw,20px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
button.go{font:700 clamp(20px,5vw,28px) 'Fredoka','Trebuchet MS',sans-serif;margin-top:12px;min-height:48px;padding:.3em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1200;width:100%;height:100%}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.9);z-index:1100;padding:12px}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:16px 22px;box-shadow:0 8px 0 #06244d;max-width:94vw;max-height:94dvh;overflow:auto;animation:pop2 .45s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.07)}}
#mt{font-size:clamp(18px,4.4vw,26px);font-weight:700;text-shadow:0 2px 0 #0b3a78;line-height:1.25}
#mt .em{font-size:clamp(46px,12vw,76px);display:block;line-height:1.1}
#mt h2{margin:2px 0 4px;font-size:clamp(26px,7vw,42px);color:#ffe14a;text-shadow:0 3px 0 #0b3a78}
#mt .st{font-size:clamp(34px,9vw,52px);letter-spacing:3px;display:block}
#mt .st i{font-style:normal;color:#6d86b0}#mt .st i.on{color:#ffcf1f;text-shadow:0 3px 0 #a9560b}
#mt small{font-size:.75em;color:#ffe14a;display:block}
.flt{position:fixed;z-index:1300;pointer-events:none;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #1b4f86,2px 0 0 #1b4f86,-2px 0 0 #1b4f86,0 -2px 0 #1b4f86;animation:flt .9s ease-out forwards;transform:translateX(-50%)}
@keyframes flt{from{transform:translate(-50%,0) scale(.6)}20%{transform:translate(-50%,-10px) scale(1.2)}to{transform:translate(-50%,-60px) scale(1)}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@media (max-height:500px){#hud{min-height:48px;padding-top:4px}}

body{background:linear-gradient(#27a2e8,#bdeafc)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 8px 8px;gap:6px}
#goal{background:#0b3a78;border:3px solid #ffe14a;border-radius:16px;padding:4px 12px;font-weight:700;font-size:clamp(12px,3.1vw,17px);box-shadow:0 4px 0 #06244d;line-height:1.3}
#goal span{display:inline-block;margin:0 4px;padding:0 8px;border-radius:999px;background:#c0392b}
#goal span.ok{background:#2ea32e}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;padding:5px;background:#14407a;border-radius:16px;border:4px solid #3aa0ff;box-shadow:0 7px 0 #06204a}
.c{border:0;padding:0;border-radius:18%;background:linear-gradient(#7fd85a,#4cb23a);box-shadow:inset 0 -3px 0 #2f8626;cursor:pointer;min-width:0;min-height:0;font-size:calc(var(--bs)/8*.62);line-height:1;display:flex;align-items:center;justify-content:center}
.c.f{background:linear-gradient(#ffe8a8,#f2c460);box-shadow:inset 0 -3px 0 #b98a2c}
.c.pop{animation:bp .45s}
@keyframes bp{0%{transform:scale(.3)}60%{transform:scale(1.2)}}
@media (max-height:500px){.pill{font-size:13px;padding:1px 8px}}
#tools{display:flex;gap:clamp(4px,1vw,8px);width:100%;max-width:640px}
.t{flex:1;min-width:0;min-height:clamp(54px,9dvh,70px);border:3px solid #fff;border-radius:14px;background:linear-gradient(#ffe27a,#ffb21f);box-shadow:0 5px 0 #a9560b;color:#5a2d00;font-weight:700;font-size:clamp(10px,2.6vw,13px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.t span{font-size:clamp(22px,5.5vw,32px);line-height:1}
.t.sel{background:linear-gradient(#d4ffc8,#6fe05a);border-color:#2ea32e;transform:translateY(-3px)}
.t.no{background:#9aa6b8;color:#33405a;box-shadow:0 5px 0 #5d6b82}
#side{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:640px}
#prev{font-weight:700;font-size:clamp(12px,3vw,16px);background:#0b3a78;border-radius:999px;padding:3px 12px;border:2px solid #ffe14a}
button.go.end{margin:0;font-size:clamp(18px,4.5vw,24px);width:100%}
@media (max-height:500px) and (orientation:landscape){#main{flex-direction:row;flex-wrap:wrap;align-content:center}#goal{order:0;width:100%}#stage{width:auto;flex:1;height:calc(100% - 50px)}#side{width:220px;max-width:220px}#tools{flex-wrap:wrap}.t{flex:1 1 30%;min-height:44px}.t small{display:none}}
</style><link rel="stylesheet" href="dragon-theme.css">
</head><body>
<a class="home" href="index.html">⌂ Home</a><button class="mute" id="mute" aria-label="Sound">🔊</button>

<div id="hud"><span class="pill">💰 <b id="mo">0</b></span><span class="pill">🍎 <b id="fo">0</b></span><span class="pill">😊 <b id="ha">0</b></span><span class="pill">👥 <b id="po">0</b></span><span class="pill">Turn <b id="tu">1</b>/<b id="tl">12</b></span><span class="pill">Best <b id="bs">0</b></span></div>
<div id="main"><div id="goal"></div><div id="stage"><div id="bd"></div></div><div id="side"><div id="tools"></div><div id="prev"></div><button class="go end" id="et">Next Season ▶</button></div></div>

<canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt"></div><button class="go" id="go">Play</button></div></div>
<script>
const GAME='city-builder.html';
const $=id=>document.getElementById(id);
const BK=GAME+':best';let best=0,muted=false,ac,boxFn=null;
try{best=+localStorage.getItem(BK)||0}catch(e){}
function updBest(){const b=$('bs');if(b)b.textContent=best}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,best)}catch(e){}updBest();return true}return false}
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function beep(f,d=.12,type='triangle',v=.15,delay=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=type;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>beep(f,.16,'triangle',.15,i*.11))}
addEventListener('pointerdown',()=>{try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}},true);
const fx=$('fx'),fc=fx.getContext('2d');let PT=[],raf=0,lt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();addEventListener('resize',fxfit);
function confetti(x,y,n=40,cols){const C=cols||['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=120+Math.random()*320;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-180,l:1+Math.random()*.6,c:C[i%C.length],r:Math.random()*6,s:5+Math.random()*6})}lt=performance.now();if(!raf)raf=requestAnimationFrame(ptick)}
function ptick(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;fc.clearRect(0,0,fx.width,fx.height);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.max(0,Math.min(1,p.l*2));fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});PT=PT.filter(p=>p.l>0&&p.y<fx.height+20);raf=PT.length?requestAnimationFrame(ptick):0;if(!raf)fc.clearRect(0,0,fx.width,fx.height)}
function floatText(x,y,txt,col){const d=document.createElement('div');d.className='flt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';if(col)d.style.color=col;document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function floatAt(el,txt,col){const r=el.getBoundingClientRect();floatText(r.left+r.width/2,r.top+r.height/3,txt,col)}
function shake(el){el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk')}
function showBox(html,btn,fn){$('mt').innerHTML=html;const g=$('go');if(btn){g.style.display='';g.textContent=btn;boxFn=fn}else{g.style.display='none';boxFn=null}$('msg').style.display='flex'}
function hideBox(){$('msg').style.display='none'}
$('go').onclick=()=>{hideBox();beep(520,.1);const f=boxFn;if(f)f()};
function stars(n){let s='';for(let i=0;i<3;i++)s+='<i'+(i<n?' class="on"':'')+'>★</i>';return '<span class="st">'+s+'</span>'}
function endBox(emoji,title,n,score,extra,btn,fn){const nb=saveBest(score);showBox('<span class="em">'+emoji+'</span><h2>'+title+'</h2>'+stars(n)+'Score <b style="color:#ffe14a">'+score+'</b>'+(nb?' 🏆 New best!':'')+'<small>Best '+best+(extra?' · '+extra:'')+'</small>',btn||'Play Again ▶',fn||startGame);if(n>=2)confetti(innerWidth/2,innerHeight/3,70);jingle(n>=2?[523,659,784,1047]:[392,330,262])}
function lsGet(k,d){try{const v=localStorage.getItem(GAME+':'+k);return v===null?d:+v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(GAME+':'+k,v)}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
updBest();


const T={h:{e:'🏠',n:'House',c:100},f:{e:'🌾',n:'Farm',c:80},k:{e:'🏭',n:'Factory',c:150},p:{e:'🌳',n:'Park',c:60},s:{e:'🏪',n:'Shop',c:120},x:{e:'🧨',n:'Demolish',c:0}};
const LV=[{pop:20,turns:12,name:'Little Village'},{pop:40,ha:55,turns:16,name:'Growing Town'},{pop:60,ha:50,mo:800,turns:20,name:'Busy Town'},{pop:100,ha:60,mo:1500,turns:24,name:'Big City'},{pop:150,ha:65,mo:3000,turns:28,name:'Mega Metropolis'}];
const N=8,bd=$('bd');let G,lv=0,money,food,pop,turn,sel='h',total=0,busy=false,over=true,cells=[];
function fit(){const s=$('stage'),m=Math.max(120,Math.min(s.clientWidth,s.clientHeight)-12);bd.style.setProperty('--bs',m+'px');bd.style.width=bd.style.height=m+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
const tl=$('tools'),tb={};
Object.keys(T).forEach(k=>{const b=document.createElement('button');b.className='t';b.innerHTML='<span>'+T[k].e+'</span>'+T[k].n+'<small>'+(T[k].c?'💰'+T[k].c:'50% back')+'</small>';b.onclick=()=>{sel=k;beep(600,.05);ui()};tl.appendChild(b);tb[k]=b});
for(let i=0;i<N*N;i++){const b=document.createElement('button');b.className='c';const r=Math.floor(i/N),c=i%N;b.onclick=()=>tap(r,c);bd.appendChild(b);cells.push(b)}
function nb(r,c,t){let n=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=r+a,x=c+b;if(y>=0&&x>=0&&y<N&&x<N&&G[y][x]===t)n++});return n}
function calc(){let h=0,f=0,k=0,p=0,s=0,hp=0,hk=0;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=G[r][c];if(t==='h'){h++;hp+=nb(r,c,'p');hk+=nb(r,c,'k')}else if(t==='f')f++;else if(t==='k')k++;else if(t==='p')p++;else if(t==='s')s++}
 const cap=h*6,ha=Math.max(0,Math.min(100,Math.round(50+p*6+s*2-k*6+hp*3-hk*5-(pop>cap*.9&&cap?3:0)))),fi=f*12-pop,mi=Math.floor(pop*1.5)+k*40+s*25;
 return{h,f,k,p,s,cap,ha,fi,mi}}
function ui(){const c=calc(),L=LV[lv];
 $('mo').textContent=money;$('fo').textContent=food;$('ha').textContent=c.ha;$('po').textContent=pop+'/'+c.cap;$('tu').textContent=turn;$('tl').textContent=L.turns;
 const g=(ok,t)=>'<span class="'+(ok?'ok':'')+'">'+t+'</span>';
 $('goal').innerHTML='🎯 <b>'+L.name+'</b> '+g(pop>=L.pop,'👥 '+L.pop)+(L.ha?g(c.ha>=L.ha,'😊 '+L.ha):'')+(L.mo?g(money>=L.mo,'💰 '+L.mo):'');
 $('prev').textContent='Next season: 🍎 '+(c.fi>=0?'+':'')+c.fi+'  💰 +'+c.mi;
 Object.keys(T).forEach(k=>{tb[k].classList.toggle('sel',sel===k);tb[k].classList.toggle('no',T[k].c>money)});
 for(let r=0;r<N;r++)for(let q=0;q<N;q++){const e=cells[r*N+q],t=G[r][q];e.textContent=t?T[t].e:'';e.className='c'+(t?' f':'')}}
function tap(r,c){if(over||busy)return;const t=G[r][c],e=cells[r*N+c];
 if(sel==='x'){if(!t){beep(150,.08,'square',.1);return}G[r][c]=null;money+=Math.floor(T[t].c/2);beep(200,.15,'sawtooth',.1);floatAt(e,'+'+Math.floor(T[t].c/2),'#ffe14a');ui();return}
 if(t){beep(150,.08,'square',.1);floatAt(e,'Occupied');return}
 if(money<T[sel].c){beep(150,.12,'square',.1);floatAt(e,'Need 💰','#ffb0b0');shake($('bd'));return}
 money-=T[sel].c;G[r][c]=sel;ui();const e2=cells[r*N+c];e2.classList.add('pop');beep(520,.1);beep(780,.1,'triangle',.15,.08);floatAt(e2,'-'+T[sel].c)}
function endTurn(){if(over||busy)return;const c=calc(),L=LV[lv];busy=true;
 food+=c.fi;money+=c.mi;let msg='';
 if(food<0){food=0;const l=Math.ceil(pop*.2);pop=Math.max(1,pop-l);msg='🍎 Starvation! -'+l+' people'}
 else if(c.ha<35){const l=Math.ceil(pop*.12);pop=Math.max(1,pop-l);msg='😠 Unhappy! -'+l+' people moved out'}
 else if(pop<c.cap){const g=Math.min(c.cap-pop,Math.max(1,Math.ceil(pop*.35)));pop+=g;msg='👥 +'+g+' new citizens'}
 else msg='🏠 Town is full - build houses!';
 turn++;ui();const r=$('prev').getBoundingClientRect();floatText(r.left+r.width/2,r.top-10,msg);beep(440,.1);
 const c2=calc(),win=pop>=L.pop&&(!L.ha||c2.ha>=L.ha)&&(!L.mo||money>=L.mo);
 if(win){finishLevel()}
 else if(turn>L.turns){over=true;endBox('🏚️','Time ran out!',1,total+pop*2,L.name+' failed','Try Again ▶',()=>{total=0;lv=0;startGame()})}
 busy=false}
function finishLevel(){over=true;const L=LV[lv],left=L.turns-turn+1,ratio=left/L.turns,st=ratio>=.4?3:ratio>=.15?2:1;
 total+=100*(lv+1)+left*20+Math.floor(money/10);
 if(lv>=LV.length-1){endBox('🌆','Mayor of the Year!',3,total,'All levels done','Play Again ▶',()=>{total=0;lv=0;startGame()})}
 else endBox('🏙️',L.name+' done!',st,total,'Next: '+LV[lv+1].name,'Next Level ▶',()=>{lv++;startGame()})}
function startGame(){G=Array.from({length:N},()=>new Array(N).fill(null));G[3][3]='h';G[3][4]='f';money=400;food=30;pop=4;turn=1;sel='h';over=false;busy=false;fit();ui()}
$('et').onclick=endTurn;
addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if($('msg').style.display!=='flex')endTurn()}const m={1:'h',2:'f',3:'k',4:'p',5:'s',6:'x'}[e.key];if(m){sel=m;ui()}});
G=Array.from({length:N},()=>new Array(N).fill(null));money=0;food=0;pop=0;turn=1;ui();fit();
showBox('<span class="em">🏙️</span><h2>City Builder</h2>Place 🏠 houses, 🌾 farms, 🏭 factories, 🌳 parks &amp; 🏪 shops.<br>Balance <b>food, money &amp; happiness</b>, then tap <b>Next Season</b>.<br>Reach each level goal before time runs out!','Start ▶',()=>{lv=0;total=0;startGame()});
</script><script src="dragon-theme.js" defer></script>
</body></html>
