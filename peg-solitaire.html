<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peg Solitaire</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ff:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;font-family:var(--ff);background:linear-gradient(#27a2e8,#bdeafc);color:#fff;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
a.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;border-radius:999px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:17px;box-shadow:0 4px 0 #a9560b}
#top{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;padding:8px 10px 4px 100px;min-height:56px}
h1{margin:0;font-size:clamp(22px,3.6vw,38px);color:#fff;text-shadow:0 3px 0 #0b3a78,2px 2px 0 #0b3a78,-2px -2px 0 #0b3a78,2px -2px 0 #0b3a78,-2px 2px 0 #0b3a78}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:3px 12px;font-weight:700;font-size:clamp(14px,2.8vw,20px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
.mute{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 4px 0 #a9560b;font-size:20px;cursor:pointer;color:#fff}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 10px 10px}
#wrap{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
@media (orientation:landscape) and (max-height:520px){#stage{flex-direction:row;justify-content:center}#wrap{width:auto}#ctl{flex-direction:column;flex-wrap:nowrap}#top{min-height:0;padding-top:4px;padding-bottom:2px}}
@media (max-width:700px){h1{display:none}}
.btn{font:700 clamp(16px,3.4vw,22px) var(--ff);min-height:44px;min-width:44px;padding:0 18px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1c701c}
.btn.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}
.btn.b{background:linear-gradient(#4aa8ff,#1f6fd0);box-shadow:0 5px 0 #134a96;text-shadow:0 2px 0 #134a96}
.btn.sel{outline:4px solid #ffe14a}
.btn:disabled{background:#6b7f99;box-shadow:0 5px 0 #46566b;cursor:default;text-shadow:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:950}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.85);z-index:900;padding:16px}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:18px 26px;box-shadow:0 8px 0 #06244d;max-width:94vw;max-height:96dvh;overflow:auto;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
.em{font-size:clamp(44px,12vmin,80px);line-height:1.1}
.tt{font-size:clamp(24px,6vmin,38px);font-weight:700;text-shadow:0 3px 0 #0b3a78}
.st{font-size:clamp(30px,8vmin,50px);letter-spacing:3px}.st i{color:#3a5f98;font-style:normal}
.sc{font-size:clamp(17px,4vmin,24px);font-weight:700;margin:4px 0}.sc b{color:#ffe14a}
.tip{font-size:clamp(14px,3vmin,18px);max-width:340px;margin:6px auto;font-weight:600}
button.go{font:700 clamp(22px,5vmin,30px) var(--ff);margin-top:10px;padding:.35em 1.6em;min-height:52px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 6px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
.ft{position:fixed;z-index:960;pointer-events:none;font-weight:700;font-size:26px;color:#ffe14a;text-shadow:0 2px 0 #1b4f86,2px 0 0 #1b4f86,-2px 0 0 #1b4f86;animation:fl .9s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-150%);opacity:0}}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#bd{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);padding:2.5%;background:linear-gradient(#103d86,#0a2a63);border:4px solid #3aa0ff;border-radius:50%;box-shadow:0 8px 0 #06204a,0 12px 24px rgba(0,0,0,.35)}
.c{position:relative;display:flex;align-items:center;justify-content:center;padding:9%;cursor:pointer;min-width:0;min-height:0}
.c.x{visibility:hidden;pointer-events:none}
.h{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 60%,#02163a,#0a2a63);box-shadow:inset 0 4px 6px #01102a,0 2px 0 #3a78c8;position:relative}
.p{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,#ffc04a 18%,#ff7a1a 55%,#c2400a);box-shadow:0 5px 0 #7a2605;transition:transform .15s}
.c.sel .p{transform:translateY(-6px) scale(1.12);background:radial-gradient(circle at 35% 30%,#fff 0 7%,#fff27a 18%,#ffd21f 55%,#d49a00);box-shadow:0 9px 0 #7a5605}
.c.tg .h::after{content:'';position:absolute;inset:12%;border-radius:50%;background:#4ade5a;border:4px solid #fff;animation:pl .7s infinite alternate}
@keyframes pl{to{transform:scale(1.15)}}
.p.in{animation:pi .3s}
@keyframes pi{0%{transform:scale(.3)}70%{transform:scale(1.15)}}</style></head><body>
<a class="home" href="index.html">⌂ Home</a>
<div id="top"><h1>Peg Solitaire</h1><span class="pill">Pegs <b id="pg">32</b></span><span class="pill">Combo <b id="cb">0</b></span><span class="pill">Score <b id="sc">0</b></span><span class="pill">Best <b id="bs">0</b></span><button class="mute" id="mute" aria-label="Sound">🔊</button></div>
<div id="stage"><div id="wrap"><div id="bd"></div></div>
<div id="ctl"><button class="btn o" id="un">↩ Undo</button><button class="btn b" id="rs">↺ Restart</button></div></div><canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt"></div><button class="go" id="go">Play</button></div></div>
<script>
const KEY='peg-solitaire.html:best';
const $=id=>document.getElementById(id);
let best=0,muted=false,ac=null;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
$('bs').textContent=best;
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,String(best))}catch(e){}}$('bs').textContent=best}
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
addEventListener('pointerdown',audio);addEventListener('keydown',audio);
function beep(f,d=.1,type='triangle',v=.15,w=0){if(muted)return;try{audio();if(!ac)return;const t=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={tap:()=>beep(520,.07),ok:()=>{beep(660,.1);beep(880,.12,'triangle',.15,.08)},bad:()=>beep(160,.18,'sawtooth',.1),win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.22,'triangle',.16,i*.1)),lose:()=>[400,300,220].forEach((f,i)=>beep(f,.22,'sawtooth',.1,i*.12))};
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
/* confetti */
const fx=$('fx'),fc=fx.getContext('2d');let PT=[],fxr=0,flt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();
function confetti(x,y,n=40){const C=['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<n;i++){const a=Math.random()*6.283,s=150+Math.random()*350;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,l:1.2+Math.random()*.6,c:C[i%6],r:Math.random()*6,s:5+Math.random()*6})}flt=performance.now();if(!fxr)fxr=requestAnimationFrame(ftick)}
function ftick(t){const dt=Math.min(.05,(t-flt)/1000||0);flt=t;fc.clearRect(0,0,fx.width,fx.height);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.min(1,p.l*2);fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});PT=PT.filter(p=>p.l>0&&p.y<fx.height+20);fxr=PT.length?requestAnimationFrame(ftick):0;if(!fxr)fc.clearRect(0,0,fx.width,fx.height)}
function floatText(x,y,t){const d=document.createElement('div');d.className='ft';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function starsHtml(n){return '<div class="st">'+'⭐'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i></div>'}
function overlay(html,btn,cb){$('mt').innerHTML=html;$('go').textContent=btn;$('msg').style.display='flex';$('go').onclick=()=>{audio();$('msg').style.display='none';cb()}}
function startScreen(emoji,title,tip,cb){overlay('<div class="em">'+emoji+'</div><div class="tt">'+title+'</div><div class="tip">'+tip+'</div><div class="sc">Best <b>'+best+'</b></div>','▶ Play',cb)}
function resultScreen(emoji,title,n,score,tip,btn,cb){overlay('<div class="em">'+emoji+'</div><div class="tt">'+title+'</div>'+starsHtml(n)+'<div class="sc">Score <b>'+score+'</b> &nbsp; Best <b>'+best+'</b></div><div class="tip">'+tip+'</div>',btn,cb)}
function centerOf(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
addEventListener('resize',fxfit);
const OK=i=>{const r=i/7|0,c=i%7;return !((r<2||r>4)&&(c<2||c>4))};
let peg,sel=-1,hist=[],score=0,combo=0,chain=-1,started=false,done=false,landed=-1;
const bd=$('bd'),cells=[];
for(let i=0;i<49;i++){const d=document.createElement('div');d.className='c'+(OK(i)?'':' x');d.innerHTML='<div class="h"></div>';if(OK(i))d.addEventListener('pointerdown',e=>{e.preventDefault();tap(i)});bd.appendChild(d);cells.push(d)}
function reset(){peg=Array.from({length:49},(_,i)=>OK(i));peg[24]=false;sel=-1;hist=[];score=0;combo=0;chain=-1;done=false;landed=-1;render()}
function targets(i){const o=[];if(!peg[i])return o;const r=i/7|0,c=i%7;[[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{const r2=r+2*dr,c2=c+2*dc;if(r2<0||c2<0||r2>6||c2>6)return;const m=(r+dr)*7+c+dc,t=r2*7+c2;if(OK(t)&&peg[m]&&!peg[t])o.push([t,m])});return o}
function anyMove(){return peg.some((p,i)=>p&&targets(i).length)}
const count=()=>peg.filter(Boolean).length;
function render(){
  const tg=sel>=0?targets(sel).map(t=>t[0]):[];
  cells.forEach((d,i)=>{if(!OK(i))return;const h=d.firstChild;d.className='c'+(i===sel?' sel':'')+(tg.includes(i)?' tg':'');
    if(peg[i]){if(!h.firstChild){const p=document.createElement('div');p.className='p'+(i===landed?' in':'');h.appendChild(p)}}else if(h.firstChild)h.innerHTML=''});
  $('pg').textContent=count();$('cb').textContent=combo;$('sc').textContent=score;landed=-1;
}
function tap(i){
  if(!started||done)return;
  if(peg[i]){if(i===sel){sel=-1;SFX.tap()}else if(targets(i).length){sel=i;SFX.tap()}else{SFX.bad();shake(cells[i]);sel=-1}render();return}
  if(sel<0)return;
  const t=targets(sel).find(x=>x[0]===i);if(!t){SFX.bad();sel=-1;render();return}
  hist.push({peg:peg.slice(),score,combo,chain});
  const from=sel;peg[from]=false;peg[t[1]]=false;peg[i]=true;landed=i;
  combo=chain===from?combo+1:1;chain=i;const gain=10*combo;score+=gain;SFX.ok();if(combo>1)beep(500+combo*80,.12,'triangle',.12,.15);
  const[x,y]=centerOf(cells[t[1]]);confetti(x,y,combo>2?24:12);floatText(x,y,'+'+gain+(combo>1?' x'+combo:''));
  sel=targets(i).length?i:-1;if(sel<0)combo=combo;render();
  if(count()===1||!anyMove())finish();
}
function undo(){if(!started||done||!hist.length)return;const h=hist.pop();peg=h.peg;score=h.score;combo=h.combo;chain=h.chain;sel=-1;SFX.tap();render()}
$('un').onclick=undo;$('rs').onclick=()=>{if(started){SFX.tap();reset()}};
addEventListener('keydown',e=>{if(e.key==='z')undo()});
function finish(){
  done=true;const p=count();
  const R=p===1?['🏆','Genius!',3]:p<=3?['🌟','Excellent!',3]:p<=6?['😎','Well played!',2]:p<=10?['🙂','Not bad!',1]:['🤔','Keep trying!',1];
  const bonus=p===1?500:Math.max(0,(12-p))*20;score+=bonus;saveBest(score);p<=3?SFX.win():SFX.lose();$('sc').textContent=score;
  if(p<=3){const[x,y]=centerOf(bd);confetti(x,y,90)}
  setTimeout(()=>resultScreen(R[0],R[1],R[2],score,p+' peg'+(p>1?'s':'')+' left'+(bonus?' - bonus +'+bonus:'')+(p>1?'. Can you get down to just 1?':'. Perfect game!'),'Play Again',reset),700);
}
function fit(){const w=$('wrap'),s=Math.max(150,Math.floor(Math.min(w.clientWidth,w.clientHeight,640)-8));bd.style.width=bd.style.height=s+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.ResizeObserver)new ResizeObserver(fit).observe($('wrap'));
reset();fit();
startScreen('📍','Peg Solitaire','Jump a peg over a neighbor into an empty hole - the jumped peg disappears. Clear the board until only 1 peg is left! Chain jumps with one peg for combos.',()=>{started=true;reset()});
</script></body></html>
