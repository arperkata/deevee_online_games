<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Echo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#1e90e6,#8fdcff);color:#fff;text-align:center;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;padding:8px 10px 4px}
a.home,.mute{background:linear-gradient(#ffb21f,#f07a0a);color:#fff;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;text-decoration:none;font:700 17px inherit;font-family:inherit;border:0;box-shadow:0 4px 0 #a9560b;cursor:pointer}
.mute{padding:0 12px}
h1{margin:0;font-size:clamp(22px,4.5vw,40px);text-shadow:0 3px 0 #0b3a78,2px 2px 0 #0b3a78,-2px -2px 0 #0b3a78,2px -2px 0 #0b3a78,-2px 2px 0 #0b3a78}
.pill{background:#0b3a78;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(16px,3vw,22px);box-shadow:0 3px 0 #06244d;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
#hud{font-size:clamp(20px,4vw,28px);font-weight:700;min-height:36px;margin:2px 10px 0;text-shadow:0 3px 0 #0b3a78,2px 2px 0 #0b3a78,-2px -2px 0 #0b3a78,2px -2px 0 #0b3a78,-2px 2px 0 #0b3a78}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px 10px}
#pads{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vmin,16px);padding:clamp(8px,2vmin,16px);background:linear-gradient(#103d86,#0a2a63);border-radius:30px;border:4px solid #3aa0ff;box-shadow:0 8px 0 #06204a,0 12px 24px rgba(0,0,0,.35)}
.p{border-radius:26px;cursor:pointer;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.4),inset 0 10px 0 rgba(255,255,255,.28),inset 0 -10px 0 rgba(0,0,0,.18);transition:transform .08s,filter .08s;min-width:0;min-height:0}
.p:active{transform:scale(.96)}
.p.on{transform:scale(1.07);filter:brightness(1.5) saturate(1.3);box-shadow:0 0 50px 14px #fff,0 0 0 4px #ffe14a,inset 0 10px 0 rgba(255,255,255,.5)}
#r{background:radial-gradient(circle at 30% 25%,#ff8a80,#e0261c)}#b{background:radial-gradient(circle at 30% 25%,#7cc0ff,#1565e0)}#y{background:radial-gradient(circle at 30% 25%,#fff08a,#f5b800)}#gr{background:radial-gradient(circle at 30% 25%,#86f58a,#1fa830)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.82);z-index:50;padding:16px}
#msg.hide{display:none}
#box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:20px 28px;box-shadow:0 8px 0 #06244d;max-width:92vw;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
#mt{font-size:clamp(24px,6vw,38px);font-weight:700;text-shadow:0 3px 0 #0b3a78}
#mt .st{font-size:clamp(34px,9vw,56px);display:block;margin:4px 0}
#mt small{font-size:.55em;color:#ffe14a;display:block}
button.go{font:700 clamp(20px,5vw,28px) inherit;font-family:inherit;margin-top:14px;padding:.4em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 6px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
button.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
@media (max-height:500px){h1{display:none}#top{padding:4px 8px 0}#hud{min-height:28px;margin:0}}
</style></head><body>
<div id="top"><a class="home" href="index.html">⌂ Home</a><h1>Color Echo</h1><span class="pill">Round <b id="rn">0</b></span><span class="pill">Best <b id="bs">0</b></span><button class="mute" id="mute" aria-label="Sound">🔊</button></div>
<div id="hud">Watch, then repeat!</div>
<div id="stage"><div id="pads">
  <div class="p" id="r" data-i="0"></div><div class="p" id="b" data-i="1"></div>
  <div class="p" id="y" data-i="2"></div><div class="p" id="gr" data-i="3"></div>
</div></div>
<canvas id="fx"></canvas>
<div id="msg"><div id="box"><div id="mt">🎵 Color Echo<small>Watch the colors, then repeat them!</small></div><button class="go" id="go">Start</button></div></div>
<script>
const pads=[...document.querySelectorAll('.p')],F=[262,330,392,523];
let seq=[],pos=0,busy=true,best=0,ac,muted=false;
const $=id=>document.getElementById(id);
try{best=+localStorage.getItem('echobest')||0}catch(e){}
$('bs').textContent=best;
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function tone(f,d=.35){if(muted)return;try{ac=ac||new AudioContext();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* confetti */
const fx=$('fx'),fc=fx.getContext('2d');let P=[],raf=0,lt=0;
function fxfit(){fx.width=innerWidth;fx.height=innerHeight}fxfit();
function confetti(x,y,k=40){const C=['#ff4a5a','#ffe14a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];for(let i=0;i<k;i++){const a=Math.random()*6.283,s=150+Math.random()*350;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,l:1+Math.random()*.6,c:C[i%6],r:Math.random()*6,s:5+Math.random()*6})}lt=performance.now();if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;fc.clearRect(0,0,fx.width,fx.height);P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.l-=dt;p.r+=dt*8;fc.save();fc.globalAlpha=Math.min(1,p.l*2);fc.fillStyle=p.c;fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fc.restore()});P=P.filter(p=>p.l>0&&p.y<fx.height+20);raf=P.length?requestAnimationFrame(tick):0;if(!raf)fc.clearRect(0,0,fx.width,fx.height)}
function fit(){
  const st=$('stage'),pd=$('pads');
  const s=Math.max(120,Math.floor(Math.min(st.clientWidth-20,st.clientHeight-16,560)));
  pd.style.width=s+'px';pd.style.height=s+'px';
}
addEventListener('resize',()=>{fxfit();fit()});addEventListener('orientationchange',()=>setTimeout(()=>{fxfit();fit()},200));fit();
function light(i,ms=350){pads[i].classList.add('on');tone(F[i],ms/1000);return new Promise(r=>setTimeout(()=>{pads[i].classList.remove('on');setTimeout(r,120)},ms))}
async function play(){
  busy=true;pos=0;$('hud').textContent='👀 Watch...';
  await new Promise(r=>setTimeout(r,600));
  const ms=Math.max(180,380-seq.length*12);
  for(const i of seq)await light(i,ms);
  busy=false;$('hud').textContent='👆 Your turn!';
}
function add(){seq.push(Math.random()*4|0);$('rn').textContent=seq.length;play()}
pads.forEach(p=>p.onclick=async()=>{
  if(busy)return;const i=+p.dataset.i;
  light(i,200);
  if(i!==seq[pos]){busy=true;tone(110,.6);const got=seq.length-1;
    if(got>best){best=got;$('bs').textContent=best;try{localStorage.setItem('echobest',best)}catch(e){}}
    $('hud').textContent='Oops! You reached '+got+' · Best '+best;
    $('mt').innerHTML='😮 Oops!<span class="st">'+(got>=8?'⭐⭐⭐':got>=4?'⭐⭐':'⭐')+'</span>You reached '+got+'<small>Best '+best+'</small>';
    $('go').textContent='Try again';setTimeout(()=>$('msg').classList.remove('hide'),500);return}
  if(++pos===seq.length){busy=true;$('hud').textContent='⭐ Great! Round '+seq.length+' done';
    const r=p.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,30);[0,1,2].forEach(k=>setTimeout(()=>tone(F[k]*2,.12),k*70));setTimeout(add,900)}
});
$('go').onclick=()=>{seq=[];$('msg').classList.add('hide');add()};
</script></body></html>
