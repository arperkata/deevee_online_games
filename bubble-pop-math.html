<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bubble Pop Math</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc) fixed;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;touch-action:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
.home{position:fixed;left:10px;top:10px;z-index:999;background:#f08a12;color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:bold;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:8px;z-index:999;font-size:22px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 #1b4f86;cursor:pointer}
.btn{font:inherit;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:16px;padding:10px 22px;min-height:44px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#hud{position:fixed;left:0;right:0;top:0;padding:52px 8px 0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}


.pill{background:linear-gradient(#3b86e0,#1b4f86);border:2px solid #fff;border-radius:999px;padding:2px clamp(8px,2.6vw,14px);font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 3px 0 #0f2f57;text-shadow:0 2px 0 #0f2f57;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(15,47,87,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:48px 12px 12px;touch-action:manipulation}
.card{background:linear-gradient(#fff,#e3f3ff);color:#1b4f86;text-shadow:none;border:5px solid #ffd84a;border-radius:28px;box-shadow:0 10px 0 #0f2f57,0 20px 40px rgba(0,0,0,.35);padding:clamp(14px,4vmin,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);text-align:center;width:min(94vw,520px);max-height:calc(100vh - 60px);overflow-y:auto;animation:cardin .4s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0;font-size:clamp(26px,7.5vmin,44px);color:#e8590c;text-shadow:0 3px 0 #ffd84a}
.card p{margin:0;font-size:clamp(15px,3.6vmin,20px);line-height:1.35;font-weight:bold}
.card .btn{width:100%}
.stars{font-size:clamp(28px,8vmin,44px);letter-spacing:4px}.stars:empty{display:none}
.btn{border:3px solid #fff}
.btn.o{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 5px 0 #a85d00;text-shadow:0 2px 0 #a85d00}.btn.o:active{box-shadow:0 1px 0 #a85d00}
.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}
.btn.b{background:linear-gradient(#5fb8ff,#2a7fe0);box-shadow:0 5px 0 #174f95;text-shadow:0 2px 0 #174f95}.btn.b:active{box-shadow:0 1px 0 #174f95}
@keyframes cardin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hide{display:none!important}
@media (max-height:480px){.ov{padding:8px 12px}.card{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100vh - 16px);width:min(94vw,640px)}.card h1,.card p,.stars{flex:1 1 100%}.card .btn{width:auto;flex:1 1 auto;padding:8px 14px;font-size:16px}html,body{overflow-y:auto}}
#tgt{font-size:clamp(22px,min(8vw,7vh),44px);font-weight:bold;background:linear-gradient(#ffe45a,#f08a12);color:#1b4f86;text-shadow:none;border:3px solid #fff;border-radius:20px;padding:0 18px;box-shadow:0 5px 0 #a85d00}
#bar{width:min(340px,80vw);height:18px;background:#0f2f57;border:3px solid #fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 #0f2f57}
#fill{height:100%;background:linear-gradient(#ffd84a,#f08a12)}
@media (max-height:480px){#hud{padding-top:6px;gap:4px}}
</style></head><body>
<canvas id="cv"></canvas>
<a class="home" href="index.html">⌂ Home</a><button id="mute">🔊</button>
<div id="hud"><div id="row"><div class="pill">⭐ <b id="sc">0</b></div><div class="pill">🏆 <b id="bs">0</b></div><div class="pill">🎯 Lv <b id="lvl">1</b></div><div class="pill" id="lives">❤️❤️❤️</div><div class="pill">🔥 <b id="cb">0</b></div></div>
<div id="tgt">Make 10</div><div id="bar"><div id="fill"></div></div></div>
<div class="ov" id="ov"><div class="card"><h1 id="ovT">🫧 Bubble Pop Math</h1><div class="stars" id="ovS"></div><p id="ovP">Tap bubbles that add up to the target number!<br>Beat the clock. Don't overshoot!<br>(Keys 1-9 pick bubbles too.)</p><button class="btn" id="go">▶ Play</button></div></div>
<script>
const $=s=>document.querySelector(s);
let muted=false;try{muted=localStorage.getItem('bp_mute')==='1'}catch(e){}
let AC;function beep(f,d=.1,t='sine',v=.12){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle'),i*90))}
function load(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function emo(x,y,list,n=12){for(let i=0;i<n;i++){const s=document.createElement('div');s.textContent=list[i%list.length];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:150`;document.body.appendChild(s);const a=Math.random()*6.28,d=60+Math.random()*120;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+30}px)) scale(.3)`,opacity:0}],{duration:700+Math.random()*300,easing:'ease-out'}).onfinish=()=>s.remove()}}
$('#mute').textContent=muted?'🔇':'🔊';
$('#mute').onclick=()=>{muted=!muted;save('bp_mute',muted?1:0);$('#mute').textContent=muted?'🔇':'🔊'};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const cv=$('#cv'),g=cv.getContext('2d');let W,H;
function size(){const D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,200));size();const hudH=()=>$('#hud').offsetHeight+6;
const COL=[['#ff9a9a','#e23b3b'],['#ffc56b','#f08a12'],['#fff07a','#e0b000'],['#9af09a','#2ea32e'],['#7fe6e6','#12a0a0'],['#8cc8ff','#2a7fe0'],['#d3b0ff','#7b3fe0'],['#ffb0e0','#e0409a']];
let B=[],P=[],target,tMax,tLeft,lives,score,combo,level,solved,best,run=false,acc=0,last=0,shake=0,flash=0;
const RAD=()=>Math.max(26,Math.min(36,W/10));
function newTarget(){target=R(4,Math.min(10+level*3,30));tMax=Math.max(8,18-level);tLeft=tMax;B.forEach(b=>b.sel=false);hud()}
function spawn(n){if(B.length>16)return;const r=RAD();B.push({x:R(r,W-r),y:H+r,r,n,vy:35+level*6+Math.random()*20,sel:false,ph:Math.random()*6})}
function spawnTick(){const l=level;if(Math.random()<.45){if(l<3&&Math.random()<.6)spawn(target);else{const a=R(1,target-1);spawn(a);spawn(target-a)}}else spawn(R(1,Math.min(9+l,15)))}
function sum(){return B.reduce((s,b)=>b.sel?s+b.n:s,0)}
function hud(){$('#sc').textContent=score;$('#bs').textContent=best;$('#lvl').textContent=level;$('#cb').textContent=combo;$('#lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);const s=sum();$('#tgt').textContent='Make '+target+(s?'  ('+s+')':'')}
function startGame(){B=[];P=[];score=0;combo=0;level=1;solved=0;lives=3;best=load('bp_best');run=true;acc=0;last=performance.now();newTarget();$('#ov').classList.add('hide');requestAnimationFrame(loop)}
function pop(b,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=60+Math.random()*140;P.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c:col||'#fff'})}}
function toggle(b){b.sel=!b.sel;beep(b.sel?520+b.n*20:400,.06);const s=sum();
if(s===target){combo++;const pts=target*5+Math.floor(tLeft)*2+combo*5;score+=pts;solved++;B.filter(x=>x.sel).forEach(x=>pop(x,'#ffd84a'));B=B.filter(x=>!x.sel);jingle([523,659,784].concat(combo>2?[1047]:[]));flash=.25;if(solved%5===0){level++;jingle([392,523,659,784,1047])}if(score>best){best=score;save('bp_best',best)}newTarget();spawnTick()}
else if(s>target){combo=0;B.forEach(x=>{if(x.sel)pop(x,'#ff8a8a');x.sel=false});shake=.3;beep(150,.25,'sawtooth')}
hud()}
function hit(x,y){for(let i=B.length-1;i>=0;i--){const b=B[i];if(Math.hypot(b.x-x,b.y-y)<=b.r+6){toggle(b);return}}}
cv.addEventListener('pointerdown',e=>{if(run){e.preventDefault();const r=cv.getBoundingClientRect();hit((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)}});
addEventListener('keydown',e=>{if(!run)return;if(/^[1-9]$/.test(e.key)){const n=+e.key;const c=B.filter(b=>b.n===n&&!b.sel&&b.y<H-b.r&&b.y>hudH()).sort((a,b)=>a.y-b.y)[0];if(c)toggle(c)}else if(e.key==='Backspace'||e.key==='Escape'){B.forEach(b=>b.sel=false);hud()}});
function loseLife(){lives--;combo=0;shake=.4;beep(130,.4,'sawtooth');if(lives<=0)return end();newTarget()}
function end(){run=false;const nb=score>0&&score>=best;jingle([392,330,262]);$('#ovS').textContent=(nb?'⭐⭐⭐':score>0&&score>=best*.6?'⭐⭐':score>0?'⭐':'💪');if(nb)emo(innerWidth/2,innerHeight/3,['⭐','🎉','✨','🏆'],26);$('#ovT').textContent=nb?'🏆 New Best!':'💥 Game Over';$('#ovP').innerHTML='Score: <b>'+score+'</b> &nbsp; Best: <b>'+best+'</b><br>Level reached: '+level;$('#go').textContent='🔁 Play again';$('#ov').classList.remove('hide');hud()}
function loop(t){if(!run)return;requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
acc+=dt;if(acc>Math.max(.55,1.3-level*.07)){acc=0;spawnTick()}
tLeft-=dt;if(tLeft<=0)loseLife();
B.forEach(b=>{b.y-=b.vy*dt;b.ph+=dt*2;b.x+=Math.sin(b.ph)*12*dt;b.x=Math.max(b.r,Math.min(W-b.r,b.x))});
if(B.some(b=>b.y<-b.r)){B=B.filter(b=>b.y>=-b.r);hud()}
P.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt});P=P.filter(p=>p.l>0);
if(shake>0)shake-=dt;if(flash>0)flash-=dt;
$('#fill').style.width=Math.max(0,tLeft/tMax*100)+'%';
g.clearRect(0,0,W,H);g.save();if(shake>0)g.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
if(flash>0){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H)}
g.textAlign='center';g.textBaseline='middle';
B.forEach(b=>{const c=COL[b.n%8];const gr=g.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);if(b.sel){gr.addColorStop(0,'#fff6b0');gr.addColorStop(1,'#ffb000')}else{gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1])}
g.globalAlpha=1;g.shadowColor='#0f2f57';g.shadowOffsetY=5;g.shadowBlur=0;g.fillStyle=gr;g.strokeStyle=b.sel?'#1b4f86':'#fff';g.lineWidth=b.sel?6:4;g.beginPath();g.arc(b.x,b.y,b.r,0,6.3);g.fill();g.shadowColor='transparent';g.stroke();
g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(b.x-b.r*.38,b.y-b.r*.5,b.r*.28,b.r*.15,-.6,0,6.3);g.fill();
g.font='bold '+Math.round(b.r*1.0)+"px 'Fredoka','Trebuchet MS',sans-serif";g.lineJoin='round';g.lineWidth=Math.max(4,b.r*.2);g.strokeStyle='#0f2f57';g.strokeText(b.n,b.x,b.y+2);g.fillStyle='#fff';g.fillText(b.n,b.x,b.y+2)});
P.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,4,0,6.3);g.fill()});g.globalAlpha=1;g.restore()}
$('#go').onclick=startGame;hud();
</script></body></html>
