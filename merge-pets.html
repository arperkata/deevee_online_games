<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Pets</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:10px;z-index:1000;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;text-shadow:none}
.btn{font:inherit;font-size:20px;font-weight:700;min-height:48px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:16px;padding:8px 22px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn[disabled]{background:linear-gradient(#9aa6b5,#6f7c8e);box-shadow:0 5px 0 #4a5566;text-shadow:0 2px 0 #4a5566;cursor:default}
.btn.red{background:linear-gradient(#ff7a6a,#e0382a);box-shadow:0 5px 0 #8f1f15;text-shadow:0 2px 0 #8f1f15}
.btn.red:active{box-shadow:0 1px 0 #8f1f15}
.btn.blue{background:linear-gradient(#5cc8ff,#1c7fd6);box-shadow:0 5px 0 #0f4a8c;text-shadow:0 2px 0 #0f4a8c}
.btn.blue:active{box-shadow:0 1px 0 #0f4a8c}
.btn.gold{background:linear-gradient(#ffd84d,#f09a12);box-shadow:0 5px 0 #a8620a;text-shadow:0 2px 0 #a8620a}
.btn.gold:active{box-shadow:0 1px 0 #a8620a}
.btn.sm{min-height:44px;font-size:16px;padding:6px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#14367a;border:3px solid #5cc8ff;border-radius:999px;padding:2px 14px;min-height:40px;font-weight:700;font-size:20px;white-space:nowrap}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:900;text-align:center;padding:16px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(32px,9vw,60px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,460px);font-size:clamp(16px,4.4vw,21px);line-height:1.4;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
#ov .btn{font-size:clamp(24px,6vw,32px);padding:12px 44px}
#ov .btn.ghost{font-size:20px;padding:8px 26px}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.fly{position:fixed;z-index:800;pointer-events:none;font-weight:700;font-size:24px;white-space:nowrap;transform:translate(-50%,-50%);animation:fly .9s ease-out forwards;text-shadow:0 2px 0 #1b4f86,0 0 4px #1b4f86}
@keyframes fly{to{transform:translate(-50%,-150px) scale(1.2);opacity:0}}
.pc{position:fixed;z-index:800;pointer-events:none;font-size:22px;transform:translate(-50%,-50%);animation:pc .8s ease-out forwards}
@keyframes pc{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
.cf{position:fixed;top:-40px;z-index:950;pointer-events:none;font-size:28px;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#ov .btn{font-size:20px;padding:6px 28px;min-height:44px}}

body{background:linear-gradient(#ffd0f0,#bfe8ff) fixed}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:54px}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#grid{display:grid;grid-template-columns:repeat(4,var(--cs,70px));grid-auto-rows:var(--cs,70px);gap:5px;background:#7a4ccf;padding:8px;border-radius:22px;box-shadow:0 0 0 4px #fff,0 8px 0 4px #4a2a8f;touch-action:none}
.cell{border-radius:16px;background:linear-gradient(#e9dcff,#c9b3f5);box-shadow:inset 0 -4px 0 #a58be0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs,70px)*.62);line-height:1;position:relative;touch-action:none;text-shadow:none}
.cell.has{background:linear-gradient(#fff,#e6f7ff);box-shadow:inset 0 -4px 0 #9ccbe8}
.cell.sel{background:linear-gradient(#fff3a0,#ffd84d);box-shadow:0 0 0 4px #ff9a3d,inset 0 -4px 0 #e0a010;transform:scale(1.06);z-index:2}
.cell.over{box-shadow:0 0 0 4px #5fd35f}
.cell.drag .p{opacity:0}
.cell .t{position:absolute;right:5px;bottom:2px;font-size:calc(var(--cs,70px)*.2);font-weight:700;color:#fff;background:#7a4ccf;border-radius:8px;padding:0 5px;text-shadow:none;line-height:1.2}
.pop{animation:pp .35s}
@keyframes pp{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
#ghost{position:fixed;z-index:700;pointer-events:none;font-size:70px;transform:translate(-50%,-50%);display:none;text-shadow:none;filter:drop-shadow(0 6px 4px #0006)}
#panel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 10px 10px}
#chips{display:flex;gap:6px;justify-content:center}
#buy{min-width:220px}
#book{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;background:#14367a;border:3px solid #5cc8ff;border-radius:16px;padding:3px 6px;max-width:320px;font-size:22px;text-shadow:none}
#book span{width:28px;text-align:center;line-height:1.3}#book .nx{background:#ffd84d;border-radius:8px}
#hint{font-size:14px;font-weight:600;text-align:center}
@media (max-height:430px){#hint{display:none}#book{font-size:18px}#book span{width:24px}#chips .chip{min-height:34px}}
@media (min-aspect-ratio:12/10){
#app{flex-direction:row;padding-top:6px}#panel{width:230px;justify-content:center;padding-top:54px}#board{padding-left:6px}
}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<div id="app"><div id="board"><div id="grid"></div></div>
<div id="panel"><div id="chips"><span class="chip">🪙 <b id="coins">0</b></span><span class="chip">⚡ <b id="inc">0</b>/s</span></div>
<button class="btn" id="buy">🐭 Buy pet</button>
<div id="book"></div>
<div id="hint">Drag or tap two matching pets to merge them!</div>
<button class="btn red sm" id="reset">Reset</button></div></div>
<div id="ghost"></div>

<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button><button class="btn ghost blue" id="cont" hidden></button></div>
<script>
const KEY='merge-pets.html_';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ld(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function rmk(k){try{localStorage.removeItem(KEY+k)}catch(e){}}
let muted=ld('m',0)==1;
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';sv('m',muted?1:0);e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
document.addEventListener('contextmenu',e=>e.preventDefault());
function fly(x,y,txt,col){const d=document.createElement('div');d.className='fly';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=col||'#ffe14d';document.body.appendChild(d);setTimeout(()=>d.remove(),950)}
function pieces(x,y,em,n){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pc';d.textContent=em[i%em.length];d.style.left=x+'px';d.style.top=y+'px';const a=Math.random()*6.283,s=40+Math.random()*70;d.style.setProperty('--dx',Math.cos(a)*s+'px');d.style.setProperty('--dy',Math.sin(a)*s-20+'px');document.body.appendChild(d);setTimeout(()=>d.remove(),850)}}
function confetti(n){const e=['🎉','⭐','🎊','✨','🍬','💛'];for(let i=0;i<(n||30);i++){const d=document.createElement('div');d.className='cf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
function fmt(n){n=Math.floor(n);if(n<10000)return''+n;const u=['K','M','B','T','Qa'];let i=-1;let v=n;while(v>=1000&&i<u.length-1){v/=1000;i++}return(v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[i]}
function fmtT(s){s=Math.floor(s);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}
const starRow=n=>'<span class="stars">'+(n>=3?'⭐⭐⭐':n==2?'⭐⭐☆':n==1?'⭐☆☆':'☆☆☆')+'</span>';
const ovHidden=()=>$('ov').classList.contains('hide');
let ovGo=null,ovCont=null;
function showOv(t,m,b,c,onGo,onCont){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;ovGo=onGo;ovCont=onCont;$('cont').hidden=!c;$('cont').textContent=c||'';$('ov').classList.remove('hide')}
function hideOv(){$('ov').classList.add('hide')}
$('go').onclick=()=>{$('go').blur();if(ovGo)ovGo()};
$('cont').onclick=()=>{$('cont').blur();if(ovCont)ovCont()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();if(ovGo)ovGo()}});
function wireReset(btn,fn){let t=0,tm;const lab=btn.textContent;btn.onclick=()=>{if(!t){t=1;btn.textContent='Sure? Tap again';tm=setTimeout(()=>{t=0;btn.textContent=lab},3000)}else{clearTimeout(tm);t=0;btn.textContent=lab;fn()}}}

const PETS=['🐭','🐱','🐶','🐰','🦊','🐼','🦁','🐯','🦄','🐲'],N=20,GOAL=10;
let best=ld('best',0),S,sel=-1,drag=null,last=Date.now(),accS=0;
const fresh=()=>({coins:20,g:[1,1].concat(new Array(N-2).fill(0)),buys:0,t:0,ts:Date.now(),disc:1,won:0});
const val=t=>Math.pow(2.4,t-1)*.5,inc=()=>S.g.reduce((a,t)=>a+(t?val(t):0),0);
const price=()=>Math.floor(10*Math.pow(1.09,Math.min(S.buys,80)));
const spawnT=()=>1+Math.floor((S.disc-1)/3);
function save(){S.ts=Date.now();sv('save',S)}
function build(){const gr=$('grid');gr.innerHTML='';for(let i=0;i<N;i++){const c=document.createElement('div');c.className='cell';c.id='c'+i;c.dataset.i=i;gr.appendChild(c)}
  gr.addEventListener('pointerdown',down);
  const bk=$('book');bk.innerHTML='';PETS.forEach((p,i)=>{const s=document.createElement('span');s.id='bk'+i;bk.appendChild(s)})}
function render(){
  for(let i=0;i<N;i++){const c=$('c'+i),t=S.g[i];const k=t+'|'+(sel==i)+'|'+(drag&&drag.moved&&drag.from==i);if(c._k===k)continue;c._k=k;
    c.className='cell'+(t?' has':'')+(sel==i?' sel':'')+(drag&&drag.moved&&drag.from==i?' drag':'');
    c.innerHTML=t?'<span class="p">'+PETS[t-1]+'</span><span class="t">'+t+'</span>':''}
  $('coins').textContent=fmt(S.coins);$('inc').textContent=inc()<10?inc().toFixed(1):fmt(inc());
  const pr=price(),free=S.g.indexOf(0)>=0;$('buy').textContent=(free?PETS[spawnT()-1]+' Buy pet 🪙'+fmt(pr):'Board full - merge!');$('buy').disabled=!free||S.coins<pr;
  PETS.forEach((p,i)=>{const b=$('bk'+i);b.textContent=i<S.disc?p:'❓';b.className=i==S.disc?'nx':''});
}
function buy(){const e=S.g.indexOf(0);if(e<0||S.coins<price()){beep(200,.1,'sawtooth');return}S.coins-=price();S.buys++;const t=spawnT();S.g[e]=t;S.disc=Math.max(S.disc,t);beep(500,.08,'triangle');save();render();bounce(e)}
function bounce(i){const c=$('c'+i);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
function act(a,b){
  if(a==b||!S.g[a])return;const ta=S.g[a],tb=S.g[b];
  if(!tb){S.g[b]=ta;S.g[a]=0;beep(400,.05)}
  else if(ta==tb&&ta<GOAL){S.g[b]=ta+1;S.g[a]=0;const r=$('c'+b).getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,bonus=2*ta;S.coins+=bonus;
    pieces(x,y,['✨','⭐','💖','🪙'],10);fly(x,y-10,'+'+bonus+' 🪙');beep(500+ta*70,.16,'triangle',.06,200);
    if(ta+1>S.disc){S.disc=ta+1;confetti(14);fly(innerWidth/2,innerHeight/3,'New pet! '+PETS[ta],'#fff')}
    if(ta+1>=GOAL&&!S.won){S.won=1;save();render();bounce(b);return win()}
    save();render();bounce(b);return}
  else{S.g[a]=tb;S.g[b]=ta;beep(300,.05)}
  save();render();bounce(b);
}
function win(){const t=S.t,stars=t<=1800?3:t<=3600?2:1,nb=!best||t<best;if(nb){best=t;sv('best',best)}confetti(40);
  showOv('🐲 Dragon Master!',starRow(stars)+'<span class="big">'+fmtT(t)+'</span>Merged all the way to the dragon! Best '+fmtT(best)+(nb?'<br><span class="nb">🎉 New best!</span>':''),'Play again','Keep playing',()=>newRun(),()=>hideOv())}
function newRun(){rmk('save');S=fresh();sel=-1;hideOv();save();render()}
function cellAt(x,y){const r=$('grid').getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return -1;for(let i=0;i<N;i++){const q=$('c'+i).getBoundingClientRect();if(x>=q.left&&x<=q.right&&y>=q.top&&y<=q.bottom)return i}return -1}
function down(e){const i=cellAt(e.clientX,e.clientY);if(i<0)return;e.preventDefault();drag={from:i,x:e.clientX,y:e.clientY,moved:false}}
addEventListener('pointermove',e=>{if(!drag)return;
  if(!drag.moved&&S.g[drag.from]&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;const g=$('ghost');g.textContent=PETS[S.g[drag.from]-1];g.style.display='block';render()}
  if(drag.moved){const g=$('ghost');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}});
function up(e){if(!drag)return;const d=drag;drag=null;$('ghost').style.display='none';
  const to=cellAt(e.clientX,e.clientY);
  if(d.moved){sel=-1;if(to>=0)act(d.from,to);render();return}
  if(to<0||to!=d.from)return;
  if(sel<0){if(S.g[to]){sel=to;beep(600,.04)}}else{const a=sel;sel=-1;if(a==to)beep(300,.04);else act(a,to)}
  render()}
addEventListener('pointerup',up);addEventListener('pointercancel',()=>{drag=null;$('ghost').style.display='none';render()});
$('buy').onclick=buy;
wireReset($('reset'),()=>{newRun();fly(innerWidth/2,innerHeight/2,'Fresh start!','#fff')});
function fit(){const b=$('board'),cs=Math.floor(Math.min((b.clientWidth-40)/4,(b.clientHeight-40)/5,110));document.documentElement.style.setProperty('--cs',Math.max(40,cs)+'px')}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));
function tick(){const now=Date.now();let d=(now-last)/1000;last=now;if(d<0)d=0;if(d>2)d*=.5;else S.t+=d;const g=inc()*d;S.coins+=g;accS+=d;if(accS>3){accS=0;save()}render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=Date.now()});addEventListener('pagehide',save);
const sd=ld('save',null);S=sd&&sd.g&&sd.g.length==N?Object.assign(fresh(),sd):fresh();
let away=0;if(sd){away=inc()*clamp((Date.now()-(S.ts||Date.now()))/1000,0,7200)*.5;S.coins+=away}
build();fit();render();setTimeout(fit,60);last=Date.now();setInterval(tick,200);
showOv('🐾 Merge Pets',sd?'Welcome back!'+(away>1?'<br>Your pets earned <b>'+fmt(away)+'</b> 🪙 while you were away.':''):'Buy pets, drag or tap two <b>matching</b> pets to evolve them.<br>Pets earn coins. Reach the 🐲 dragon!','Play',null,()=>hideOv());

</script><script src="mascot.js" defer></script>
</body></html>
