.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}

/* 3D dice */
.die{--ds:64px;width:var(--ds);height:var(--ds);perspective:calc(var(--ds)*5);position:relative;flex:none;cursor:pointer;text-shadow:none}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(24deg)}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#d9e4f3);border:2px solid #8aa4cc;border-radius:16%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-shadow:inset 0 0 8px rgba(40,70,120,.35)}
.f1{transform:translateZ(calc(var(--ds)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}.f5{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.f3{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}.f4{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.pip{border-radius:50%;margin:14%;background:radial-gradient(circle at 35% 30%,#4a4a4a,#0b0b0b)}
.f1 .pip{background:radial-gradient(circle at 35% 30%,#ff7b7b,#c41414)}
.die.red .face{background:linear-gradient(145deg,#ff7a7a,#c91c1c);border-color:#7a0f0f}.die.red .pip{background:radial-gradient(circle at 35% 30%,#fff,#e8e8e8)}
.die.gold .face{background:linear-gradient(145deg,#ffe58a,#f0a810);border-color:#a56d00}
.die.hop{animation:hop .9s}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-34%) scale(1.08)}60%{transform:translateY(0)}78%{transform:translateY(-9%)}100%{transform:translateY(0)}}
.die::after{content:'';position:absolute;left:12%;right:12%;bottom:-9%;height:12%;border-radius:50%;background:rgba(10,30,60,.35);z-index:-1}

<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const KEY='snakes-and-ladders';
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let muted=false;try{muted=localStorage.getItem(KEY+'_mute')==='1'}catch(e){}
let AC;function beep(f,d=.1,t='sine',v=.12){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a,t='triangle'){a.forEach((f,i)=>setTimeout(()=>beep(f,.14,t),i*90))}
function load(k){try{return +localStorage.getItem(KEY+'_'+k)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(KEY+'_'+k,v)}catch(e){}}
function burst(x,y,list,n=12){for(let i=0;i<n;i++){const s=document.createElement('div');s.textContent=list[i%list.length];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*16}px;pointer-events:none;z-index:150;text-shadow:none`;document.body.appendChild(s);const a=Math.random()*6.28,d=40+Math.random()*90;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+30}px)) scale(.3)`,opacity:0}],{duration:600+Math.random()*400,easing:'ease-out'}).onfinish=()=>s.remove()}}
function burstEl(el,list,n){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,list,n)}
function floatText(x,y,txt,col='#ffd84a'){const s=document.createElement('div');s.className='flt';s.textContent=txt;s.style.cssText+=`left:${x}px;top:${y}px;color:${col}`;document.body.appendChild(s);s.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-60px) scale(1.15)',opacity:1,offset:.7},{transform:'translate(-50%,-80px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>s.remove()}
function floatEl(el,txt,col){const r=el.getBoundingClientRect();floatText(r.left+r.width/2,r.top+r.height/3,txt,col)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
(function(){const m=$('#mute');m.textContent=muted?'🔇':'🔊';m.onclick=()=>{muted=!muted;save('mute',muted?1:0);try{localStorage.setItem(KEY+'_mute',muted?'1':'0')}catch(e){}m.textContent=muted?'🔇':'🔊';beep(600,.08)}})();
document.addEventListener('pointerdown',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}});
function ov(title,stars,html,btns){$('#ovT').textContent=title;$('#ovS').textContent=stars||'';$('#ovP').innerHTML=html||'';const b=$('#ovB');b.innerHTML='';btns.forEach(([l,c,f])=>{const e=document.createElement('button');e.className='btn '+(c||'');e.innerHTML=l;e.onclick=()=>{beep(520,.06);f()};b.appendChild(e)});$('#ov').classList.remove('hide')}
function ovHide(){$('#ov').classList.add('hide')}
const PIPS=[null,[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const ROT=[null,[0,0],[0,-90],[-90,0],[90,0],[0,90],[0,180]];
function mkDie(parent,size,cls){const el=document.createElement('div');el.className='die'+(cls?' '+cls:'');el.style.setProperty('--ds',size);let h='<div class="tilt"><div class="cube">';for(let f=1;f<=6;f++){h+='<div class="face f'+f+'">';for(let i=0;i<9;i++)h+=PIPS[f].includes(i)?'<span class="pip" style="grid-area:'+(Math.floor(i/3)+1)+'/'+(i%3+1)+'"></span>':'';h+='</div>'}el.innerHTML=h+'</div></div>';parent.appendChild(el);const cube=el.querySelector('.cube');
const d={el,v:1,kx:0,ky:0,show(v,dur=900){d.v=v;const r=ROT[v];if(dur){d.kx+=R(1,2);d.ky+=R(1,3)}cube.style.transition=dur?'transform '+dur+'ms cubic-bezier(.2,.75,.3,1)':'none';cube.style.transform='rotateX('+(r[0]+d.kx*360)+'deg) rotateY('+(r[1]+d.ky*360)+'deg)';if(dur){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop');for(let i=1;i<5;i++)setTimeout(()=>beep(220+R(0,200),.04,'square',.05),i*dur/6)}return dur?sleep(dur):Promise.resolve()}};d.show(1,0);return d}
function fitBoard(cv,main,sideLand,sideBot){const W=innerWidth,H=innerHeight,tp=$('#top').offsetHeight,land=W/H>1.15;let s=land?Math.min(H-tp-14,W-sideLand-24):Math.min(W-14,H-tp-sideBot-14);s=Math.max(160,Math.floor(s||0));cv.style.width=cv.style.height=s+'px';main.style.flexDirection=land?'row':'column';return s}
const CANCEL='cancel';

const cv=$('#bd'),ctx=cv.getContext('2d'),DPR=Math.min(2,window.devicePixelRatio||1);cv.width=cv.height=600*DPR;
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const PC=[{n:'Fox',e:'🦊',c:'#e53935',d:'#8f1c1c',l:'#ff9a94'},{n:'Frog',e:'🐸',c:'#2eaa3a',d:'#1c701c',l:'#a6eba6'},{n:'Octo',e:'🐙',c:'#8e44d6',d:'#55208f',l:'#d6adff'},{n:'Tiger',e:'🐯',c:'#f08a12',d:'#a85d00',l:'#ffd08a'}];
const OFF=[[-13,-12],[13,-12],[-13,12],[13,12]];
const SC=['#2eaa3a','#e53935','#8e44d6','#f08a12','#1aa7a7','#d6309a','#3b6ae0','#6aaa00','#c43c00','#00897b'];
let pn=['You','Player 2'];let pls=[],cur=0,gen=0,over=true,mode=1,wins=0,die;
die=mkDie($('#dieBox'),'var(--dsz)');
function xy(n){if(n<1)n=1;const r=Math.floor((n-1)/10),c=r%2===0?(n-1)%10:9-(n-1)%10;return[c*60+30,(9-r)*60+30]}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const bg=document.createElement('canvas');bg.width=bg.height=600*DPR;
function snakePts(a,b,k){const p0=xy(a),p3=xy(b),dx=p3[0]-p0[0],dy=p3[1]-p0[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,o=L*.16*(k%2?1:-1);return[p0,[p0[0]+dx*.3+nx*o,p0[1]+dy*.3+ny*o],[p0[0]+dx*.7-nx*o,p0[1]+dy*.7-ny*o],p3]}
function drawBG(){const g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);const cols=['#ffe27a','#a6ecab','#8fd3ff','#ffb3d1'];
for(let n=1;n<=100;n++){const[x,y]=xy(n),r=Math.floor((n-1)/10),c=(n-1)%10;g.fillStyle=n===100?'#ffc400':cols[(r+(r%2?9-c:c))%4];g.fillRect(x-30,y-30,60,60);g.strokeStyle='#1b4f86';g.lineWidth=1.5;g.strokeRect(x-30,y-30,60,60);g.fillStyle='#1b4f86';g.font='bold 14px sans-serif';g.textAlign='left';g.textBaseline='top';g.fillText(n,x-27,y-26)}
g.fillStyle='#8f1c1c';g.font='bold 15px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('FINISH',xy(100)[0],xy(100)[1]+10);
g.lineCap='round';g.lineJoin='round';
Object.keys(LD).forEach(a=>{const p0=xy(+a),p1=xy(LD[a]),dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy*9,ny=ux*9;
[[10,'#5b3000'],[6,'#d9902a']].forEach(([w,col])=>{g.strokeStyle=col;g.lineWidth=w;[1,-1].forEach(s=>{g.beginPath();g.moveTo(p0[0]+nx*s,p0[1]+ny*s);g.lineTo(p1[0]+nx*s,p1[1]+ny*s);g.stroke()});
for(let d=16;d<L-8;d+=20){g.lineWidth=w-2;g.beginPath();g.moveTo(p0[0]+ux*d+nx,p0[1]+uy*d+ny);g.lineTo(p0[0]+ux*d-nx,p0[1]+uy*d-ny);g.stroke()}})});
Object.keys(SN).forEach((a,k)=>{const P=snakePts(+a,SN[a],k),col=SC[k%SC.length];g.beginPath();g.moveTo(P[0][0],P[0][1]);g.bezierCurveTo(P[1][0],P[1][1],P[2][0],P[2][1],P[3][0],P[3][1]);
g.strokeStyle='#1a1a1a';g.lineWidth=17;g.stroke();g.strokeStyle=col;g.lineWidth=12;g.stroke();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=4;g.setLineDash([5,11]);g.stroke();g.setLineDash([]);
g.beginPath();g.arc(P[3][0],P[3][1],4,0,7);g.fillStyle=col;g.fill();
const h=P[0];g.beginPath();g.arc(h[0],h[1],14,0,7);g.fillStyle=col;g.fill();g.strokeStyle='#1a1a1a';g.lineWidth=3;g.stroke();
[-6,6].forEach(s=>{g.beginPath();g.arc(h[0]+s,h[1]-4,4.5,0,7);g.fillStyle='#fff';g.fill();g.beginPath();g.arc(h[0]+s,h[1]-3,2,0,7);g.fillStyle='#000';g.fill()});
g.strokeStyle='#e00000';g.lineWidth=2.5;g.beginPath();g.moveTo(h[0],h[1]+5);g.lineTo(h[0],h[1]+13);g.moveTo(h[0],h[1]+13);g.lineTo(h[0]-3,h[1]+17);g.moveTo(h[0],h[1]+13);g.lineTo(h[0]+3,h[1]+17);g.stroke()})}
function frame(now){requestAnimationFrame(frame);const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.clearRect(0,0,600,600);g.drawImage(bg,0,0,600,600);
const list=pls.map((p,i)=>{if(p.an){const k=Math.min(1,(now-p.an.t0)/p.an.ms),e=p.an.slide?(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2):k;p.x=p.an.fx+(p.an.tx-p.an.fx)*e;p.y=p.an.fy+(p.an.ty-p.an.fy)*e;p.hop=p.an.slide?Math.sin(Math.PI*k)*6:Math.sin(Math.PI*k)*14;if(k>=1)p.an=null}else p.hop=(i===cur&&!over)?Math.abs(Math.sin(now/260))*5:0;return{p,i}});
list.sort((a,b)=>a.p.y-b.p.y).forEach(({p,i})=>{const pc=PC[p.pi],x=p.x+OFF[i][0],y=p.y+OFF[i][1]-p.hop;g.save();g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y+13+p.hop,11,4,0,0,7);g.fill();
const gr=g.createRadialGradient(x-4,y-5,2,x,y,14);gr.addColorStop(0,pc.l);gr.addColorStop(1,pc.c);g.beginPath();g.arc(x,y,13,0,7);g.fillStyle=gr;g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();g.lineWidth=1.5;g.strokeStyle=pc.d;g.beginPath();g.arc(x,y,14.5,0,7);g.stroke();
g.globalAlpha=1;g.fillStyle='#000';g.font='17px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(pc.e,x,y+1);g.restore()})}
function ui(){$('#chips').innerHTML=pls.map((p,i)=>'<div class="pill chip'+(i===cur&&!over?' on':'')+'" style="background:linear-gradient('+PC[p.pi].l+','+PC[p.pi].c+');box-shadow:0 3px 0 '+PC[p.pi].d+'">'+PC[p.pi].e+' '+p.n+' '+p.pos+'</div>').join('');$('#bw').textContent=wins;const p=pls[cur];if(p)$('#dieBox').style.borderColor=PC[p.pi].c}
function msg(t){$('#msg').textContent=t}
function tw(p,c,ms,slide){p.an={fx:p.x,fy:p.y,tx:c[0],ty:c[1],t0:performance.now(),ms,slide};return sleep(ms).then(()=>{p.x=c[0];p.y=c[1];p.an=null})}
function board(el){const r=cv.getBoundingClientRect();return[r.left+el[0]/600*r.width,r.top+el[1]/600*r.height]}
let rollRes=null;
async function run(){const g=++gen,chk=()=>{if(g!==gen)throw CANCEL};try{while(true){const p=pls[cur];let sixes=0;
while(true){ui();const hum=!p.ai;$('#roll').disabled=!hum;msg(hum?PC[p.pi].e+' '+p.n+': roll the dice!':p.n+' is rolling...');
if(hum)await new Promise(r=>{rollRes=r});else await sleep(650);chk();$('#roll').disabled=true;
const v=R(1,6);await die.show(v,800);chk();if(v===6){sixes++;if(sixes===3){msg('Three 6s in a row - turn lost!');beep(150,.3,'sawtooth');await sleep(1100);chk();break}}else sixes=0;
if(p.pos+v>100){msg('Rolled '+v+' - need exactly '+(100-p.pos)+' to finish');await sleep(900);chk();if(v===6)continue;break}
msg('Rolled '+v);for(let i=0;i<v;i++){p.pos++;beep(400+i*40,.05);await tw(p,xy(p.pos),150);chk()}ui();
if(p.pos===100)return finish(p);
const dest=SN[p.pos]||LD[p.pos];if(dest){const up=dest>p.pos;msg(up?'🪜 Ladder! Climb to '+dest:'🐍 Snake! Slide to '+dest);jingle(up?[523,659,784,1047]:[400,300,220,150],up?'triangle':'sawtooth');
const bp=board(xy(p.pos));floatText(bp[0],bp[1],(up?'+':'')+(dest-p.pos),up?'#7dff7d':'#ff8a8a');if(!up)shake($('#bd'));await sleep(350);chk();p.pos=dest;await tw(p,xy(dest),up?900:800,true);chk();ui();
if(p.pos===100)return finish(p)}
if(v===6){msg('🎁 Rolled a 6 - go again!');await sleep(600);chk();continue}break}
cur=(cur+1)%pls.length}}catch(e){if(e!==CANCEL)throw e}}
function finish(w){over=true;$('#roll').disabled=true;ui();const me=pls[0];let title,stars;
if(mode===0){title='🏆 '+w.n+' wins!';stars='⭐⭐⭐'}else if(w===me){title='🏆 '+me.n+' wins!';stars='⭐⭐⭐';wins++;save('wins',wins)}else{title='😮 '+w.n+' wins';stars=me.pos>=70?'⭐⭐':'⭐'}
jingle([392,523,659,784,1047]);burst(innerWidth/2,innerHeight/3,['⭐','🎉','🪜','✨'],26);ui();
setTimeout(()=>ov(title,stars,mode===0?'First to square 100 wins!<br>'+pls.map(p=>p.n+': square <b>'+p.pos+'</b>').join(' &nbsp; '):'First to square 100 wins!<br>'+me.n+' reached square <b>'+me.pos+'</b> &nbsp; Wins: <b>'+wins+'</b>',[['▶ Play Again','',()=>start(mode)],['🏠 Menu','o',menu]]),900)}
function start(m,nm){if(nm)pn=nm;mode=m;const n=m===0?2:m+1;pls=[];for(let i=0;i<n;i++){const c=xy(1);pls.push({pi:i,pos:0,x:c[0],y:c[1],hop:0,an:null,ai:m===0?false:i>0,n:m===0?pn[i]:i===0?pn[0]:'🤖 Computer'+(m>1?' '+i:'')})}
cur=0;over=false;rollRes=null;wins=load('wins');die.show(1,0);ovHide();ui();run()}
async function vs(m){const n=await Duo.askNames({cpu:true});if(n)start(m,n)}
function menu(){gen++;over=true;ov('🐍 Snakes & Ladders','','Race to square 100! 🪜 Ladders lift you up, 🐍 snakes slide you down. Roll a 6 to go again. You need the exact roll to finish!',[['🤖 vs 1 Computer','',()=>vs(1)],['🤖 vs 2 Computers','b',()=>vs(2)],['🤖 vs 3 Computers','p',()=>vs(3)],['👥 2 Players','o',async()=>{const n=await Duo.askNames();if(n)start(0,n)}]])}
function rollClick(){if(rollRes&&!over&&!pls[cur].ai){const f=rollRes;rollRes=null;beep(500,.05);f()}}
$('#roll').onclick=rollClick;$('#dieBox').onclick=rollClick;
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();rollClick()}});
function fit(){fitBoard(cv,$('#main'),250,110)}addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
drawBG();fit();wins=load('wins');requestAnimationFrame(frame);menu();ui();
</script><script src="mascot.js" defer></script>
</body></html>
