<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KenKen Mini</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc) fixed;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;height:100dvh}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:bold;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:8px;z-index:1000;font-size:22px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 #1b4f86;cursor:pointer;padding:0}
.btn{font:inherit;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:3px solid #fff;border-radius:16px;padding:10px 22px;min-height:44px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.o{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 5px 0 #a85d00;text-shadow:0 2px 0 #a85d00}.btn.o:active{box-shadow:0 1px 0 #a85d00}
.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}
.btn.b{background:linear-gradient(#5fb8ff,#2a7fe0);box-shadow:0 5px 0 #174f95;text-shadow:0 2px 0 #174f95}.btn.b:active{box-shadow:0 1px 0 #174f95}
#top{padding:52px 8px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.pill{background:linear-gradient(#3b86e0,#1b4f86);border:2px solid #fff;border-radius:999px;padding:2px clamp(8px,2.6vw,14px);font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 3px 0 #0f2f57;text-shadow:0 2px 0 #0f2f57;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(15,47,87,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:48px 12px 12px;touch-action:manipulation}
.card{background:linear-gradient(#fff,#e3f3ff);color:#1b4f86;text-shadow:none;border:5px solid #ffd84a;border-radius:28px;box-shadow:0 10px 0 #0f2f57,0 20px 40px rgba(0,0,0,.35);padding:clamp(14px,4vmin,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);text-align:center;width:min(94vw,520px);max-height:calc(100dvh - 60px);overflow-y:auto;animation:cardin .4s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0;font-size:clamp(26px,7.5vmin,44px);color:#e8590c;text-shadow:0 3px 0 #ffd84a}
.card p{margin:0;font-size:clamp(15px,3.6vmin,20px);line-height:1.35;font-weight:bold}
.stars{font-size:clamp(28px,8vmin,44px);letter-spacing:4px}.stars:empty{display:none}
#ovB{display:flex;flex-direction:column;gap:10px;width:100%}#ovB .btn{width:100%}
@keyframes cardin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hide{display:none!important}
@media (max-height:480px){.ov{padding:8px 12px}.card{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100dvh - 16px);width:min(94vw,640px)}.card h1,.card p,.stars,#ovB{flex:1 1 100%}#ovB{flex-direction:row;flex-wrap:wrap}#ovB .btn{width:auto;flex:1 1 auto;padding:8px 14px;font-size:16px}#top{padding-top:6px}}
.k{font:inherit;font-weight:bold;background:linear-gradient(#fff,#cfe6ff);color:#1b4f86;text-shadow:none;border:3px solid #fff;border-radius:14px;box-shadow:0 5px 0 #3f78b4;cursor:pointer;padding:0;min-height:44px}
.k:active{transform:translateY(4px);box-shadow:0 1px 0 #3f78b4}
.k.del{background:linear-gradient(#ff8a8a,#d63030);color:#fff;text-shadow:0 2px 0 #8f1c1c;box-shadow:0 5px 0 #8f1c1c}
.k.go{background:linear-gradient(#7be07b,#2ea32e);color:#fff;text-shadow:0 2px 0 #1c701c;box-shadow:0 5px 0 #1c701c}
.k.hint{background:linear-gradient(#ffb347,#f08a12);color:#fff;text-shadow:0 2px 0 #a85d00;box-shadow:0 5px 0 #a85d00}
.k.pur{background:linear-gradient(#c59cff,#7b3fe0);color:#fff;text-shadow:0 2px 0 #4a1fa0;box-shadow:0 5px 0 #4a1fa0}
.k.on{background:linear-gradient(#4a1fa0,#2d1070);color:#ffd84a;box-shadow:0 1px 0 #1d0a50;transform:translateY(4px)}
.k.done,.k:disabled{background:#9fb2c6;color:#5d7089;box-shadow:0 5px 0 #6b7f94;pointer-events:none}
.ft{position:fixed;z-index:300;pointer-events:none;font-weight:bold;font-size:22px;color:#fff;text-shadow:0 2px 0 #1b4f86,0 0 6px #1b4f86}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pp .3s}@keyframes pp{50%{transform:scale(1.15)}}

#game{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 8px}
#game.land{flex-direction:row;gap:22px}
#board{--b:340px;--n:4;width:var(--b);height:var(--b);display:grid;grid-template:repeat(var(--n),1fr)/repeat(var(--n),1fr);background:#1b4f86;border:4px solid #1b4f86;border-radius:12px;box-shadow:0 6px 0 #0f2f57;flex:none;overflow:hidden}
.c{position:relative;color:#1b4f86;text-shadow:none;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:calc(var(--b)/var(--n)*.5);cursor:pointer;min-width:0;min-height:0;border:1px solid #8aa9c9}
.c.s{background:#ffd84a!important}.c.e{color:#d00000;background:#ff9a9a!important}
.c .lb{position:absolute;left:3px;top:1px;font-size:calc(var(--b)/var(--n)*.22);line-height:1.1;color:#0f2f57;font-weight:bold}
.c .lb.bad{color:#d00000}
.c.ok .lb{color:#0a7a2a}
#ctl{display:flex;flex-direction:column;gap:10px;width:min(var(--b,340px),400px);flex:none}
#game.land #ctl{width:min(230px,38vw)}
#pad{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8px}
#pad .k{height:48px;font-size:26px}
#game.land #pad{grid-template-columns:repeat(3,1fr)}
@media (max-height:480px){#pad .k{height:42px;font-size:22px}#pad{gap:6px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Sound">🔊</button>
<div class="ov" id="ov"><div class="card"><h1 id="ovT"></h1><div class="stars" id="ovS"></div><p id="ovP"></p><div id="ovB"></div></div></div>

<div id="top"><div class="pill">⭐ <b id="sc">0</b></div><div class="pill">🏆 <b id="bs">0</b></div><div class="pill">⏱ <b id="tm">0:00</b></div><div class="pill">🔥 <b id="st">0</b></div></div>
<div id="game"><div id="board"></div><div id="ctl"><div id="pad"></div></div></div>
<script>
const KEY='kenken-mini.html_';
const $=s=>document.querySelector(s);
let muted=false;try{muted=localStorage.getItem(KEY+'mute')==='1'}catch(e){}
let AC;function actx(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d=.1,t='sine',v=.12){if(muted)return;try{actx();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle'),i*90))}
function load(k){try{return +localStorage.getItem(KEY+k)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}
function burst(x,y,list,n=12){for(let i=0;i<n;i++){const s=document.createElement('div');s.textContent=list[i%list.length];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*16}px;pointer-events:none;z-index:250`;document.body.appendChild(s);const a=Math.random()*6.28,d=40+Math.random()*80;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+30}px)) scale(.3)`,opacity:0}],{duration:600+Math.random()*300,easing:'ease-out'}).onfinish=()=>s.remove()}}
function floatText(x,y,t){const s=document.createElement('div');s.className='ft';s.textContent=t;s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);s.animate([{transform:'translate(-50%,0)',opacity:1},{transform:'translate(-50%,-60px)',opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>s.remove()}
function fx(el,t,list){if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;if(t)floatText(x,y,t);if(list)burst(x,y,list,8)}
function anim(el,c){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
$('#mute').textContent=muted?'🔇':'🔊';
$('#mute').onclick=()=>{muted=!muted;save('mute',muted?1:0);$('#mute').textContent=muted?'🔇':'🔊';actx()};
document.addEventListener('pointerdown',actx,{once:true});
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showOv(t,s,p,btns){$('#ovT').textContent=t;$('#ovS').textContent=s||'';$('#ovP').innerHTML=p;const b=$('#ovB');b.innerHTML='';btns.forEach(([tx,c,fn])=>{const e=document.createElement('button');e.className='btn '+c;e.innerHTML=tx;e.onclick=fn;b.appendChild(e)});$('#ov').classList.remove('hide')}
function hideOv(){$('#ov').classList.add('hide')}
const isLand=()=>innerWidth>innerHeight*1.15;
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const D={easy:{n:4,mx:3,b:600},medium:{n:5,mx:3,b:1200},hard:{n:5,mx:4,b:1800}};
const PAL=['#ffd6d6','#d6ecff','#d9f7c9','#ffe9b8','#ead9ff','#c9f3f0'];
let N=4,sol,val,cage,cages,sel=-1,diff='easy',score=0,streak=0,secs=0,hints=0,tmr,run=false,best=0;
function latin(n){const g=Array(n*n).fill(0);const nums=[...Array(n).keys()].map(i=>i+1);
(function rec(p){if(p===n*n)return true;const r=(p/n)|0,c=p%n;for(const d of shuffle(nums.slice())){let ok=true;for(let k=0;k<c&&ok;k++)if(g[r*n+k]===d)ok=false;for(let k=0;k<r&&ok;k++)if(g[k*n+c]===d)ok=false;if(!ok)continue;g[p]=d;if(rec(p+1))return true}g[p]=0;return false})(0);return g}
function nbrs(i,n){const r=(i/n)|0,c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o}
function mkCages(n,g,mx){const id=Array(n*n).fill(-1),cs=[];
for(const s of shuffle([...Array(n*n).keys()])){if(id[s]>=0)continue;const w=mx===3?[1,2,2,2,3,3]:[1,2,2,3,3,4];const sz=w[R(0,w.length-1)];
const cl=[s];id[s]=cs.length;
while(cl.length<sz){const opts=[];for(const c of cl)for(const q of nbrs(c,n))if(id[q]<0&&!opts.includes(q))opts.push(q);if(!opts.length)break;const q=opts[R(0,opts.length-1)];id[q]=cs.length;cl.push(q)}
const v=cl.map(i=>g[i]);let op,t;
if(cl.length===1){op='';t=v[0]}
else if(cl.length===2){const a=Math.max(...v),b=Math.min(...v),ch=['+','×','−'];if(a%b===0)ch.push('÷','÷');op=ch[R(0,ch.length-1)];t=op==='+'?a+b:op==='×'?a*b:op==='−'?a-b:a/b}
else{op=Math.random()<.5?'+':'×';t=op==='+'?v.reduce((x,y)=>x+y,0):v.reduce((x,y)=>x*y,1)}
cs.push({cells:cl,op,t})}
return{id,cs}}
function cageVal(c,vals){const v=c.cells.map(i=>vals[i]);if(v.some(x=>!x))return null;if(c.op==='')return v[0];if(c.op==='+')return v.reduce((x,y)=>x+y,0);if(c.op==='×')return v.reduce((x,y)=>x*y,1);const a=Math.max(...v),b=Math.min(...v);return c.op==='−'?a-b:a/b}
function countSol(n,id,cs,limit){const g=Array(n*n).fill(0);let cnt=0;
(function rec(p){if(cnt>=limit)return;if(p===n*n){cnt++;return}const r=(p/n)|0,c=p%n;
for(let d=1;d<=n;d++){let ok=true;for(let k=0;k<c&&ok;k++)if(g[r*n+k]===d)ok=false;for(let k=0;k<r&&ok;k++)if(g[k*n+c]===d)ok=false;if(!ok)continue;g[p]=d;
const cg=cs[id[p]];let good=true;if(cg.op==='+'||cg.op==='×'){let acc=cg.op==='+'?0:1,full=true;for(const i of cg.cells){if(!g[i]){full=false;continue}acc=cg.op==='+'?acc+g[i]:acc*g[i]}if(acc>cg.t)good=false;else if(full&&acc!==cg.t)good=false}
else{const v=cageVal(cg,g);if(v!==null&&v!==cg.t)good=false}
if(good)rec(p+1)}g[p]=0})(0);return cnt}
function gen(d){const n=D[d].n;let best=null;const t0=Date.now();
for(let a=0;a<60;a++){const g=latin(n);for(let b=0;b<12;b++){const m=mkCages(n,g,D[d].mx);if(countSol(n,m.id,m.cs,2)===1)return{n,g,m};best={n,g,m};if(Date.now()-t0>2500)return best}}
return best}
function colorCages(){const col=Array(cages.length).fill(-1);cages.forEach((c,k)=>{const used=new Set();for(const i of c.cells)for(const q of nbrs(i,N)){const o=cage[q];if(o!==k&&col[o]>=0)used.add(col[o])}let x=0;while(used.has(x))x++;col[k]=x%PAL.length});return col}
let colr=[];const cellEls=[];
function build(){const b=$('#board');b.innerHTML='';cellEls.length=0;b.style.setProperty('--n',N);colr=colorCages();
for(let i=0;i<N*N;i++){const e=document.createElement('div');e.className='c';e.style.background=PAL[colr[cage[i]]];
const k=cage[i],r=(i/N)|0,c=i%N,T='3px solid #1b4f86';
if(r===0||cage[i-N]!==k)e.style.borderTop=T;if(r===N-1||cage[i+N]!==k)e.style.borderBottom=T;if(c===0||cage[i-1]!==k)e.style.borderLeft=T;if(c===N-1||cage[i+1]!==k)e.style.borderRight=T;
e.onclick=()=>{if(run){sel=i;render()}};b.appendChild(e);cellEls.push(e)}
const p=$('#pad');p.innerHTML='';p.style.setProperty('--cols',N===4?3:4);
for(let d=1;d<=N;d++){const k=document.createElement('button');k.className='k';k.textContent=d;k.onclick=()=>put(d);p.appendChild(k)}
let k=document.createElement('button');k.className='k del';k.textContent='⌫';k.onclick=erase;p.appendChild(k);
k=document.createElement('button');k.className='k hint';k.id='bh';k.onclick=hint;p.appendChild(k);fit()}
function conflict(i){const v=val[i];if(!v)return false;const r=(i/N)|0,c=i%N;for(let k=0;k<N;k++){if(k!==c&&val[r*N+k]===v)return true;if(k!==r&&val[k*N+c]===v)return true}return false}
function render(){const lab=Array(N*N).fill(null);cages.forEach(c=>{const f=Math.min(...c.cells);lab[f]=c});
for(let i=0;i<N*N;i++){const e=cellEls[i],c=cages[cage[i]],cv=cageVal(c,val);let cl='c';if(i===sel)cl+=' s';else if(conflict(i))cl+=' e';if(cv!==null&&cv===c.t)cl+=' ok';e.className=cl;
e.innerHTML=(lab[i]?'<span class="lb'+(cv!==null&&cv!==c.t?' bad':'')+'">'+c.t+c.op+'</span>':'')+(val[i]||'')}
const h=$('#bh');if(h)h.textContent='💡 '+(3-hints)}
function upd(){$('#sc').textContent=score;$('#bs').textContent=best;$('#tm').textContent=mmss(secs);$('#st').textContent=streak}
function put(d){if(!run||sel<0)return;const e=cellEls[sel];val[sel]=d;
if(d===sol[sel]){streak++;const p=10+Math.min(streak,10)*2;score+=p;beep(600+Math.min(streak,10)*40,.1,'triangle');render();upd();fx(e,'+'+p);anim(e,'pop');check()}
else{streak=0;beep(200,.12,'square');render();upd();anim(e,'shake');check()}}
function erase(){if(!run||sel<0)return;val[sel]=0;beep(300,.05);render()}
function hint(){if(!run||hints>=3)return;let t=sel;if(t<0||val[t]===sol[t]){const l=[];for(let i=0;i<N*N;i++)if(val[i]!==sol[i])l.push(i);if(!l.length)return;t=l[R(0,l.length-1)]}
sel=t;val[t]=sol[t];hints++;streak=0;score=Math.max(0,score-30);jingle([660,880]);render();upd();fx(cellEls[t],'💡',['✨']);check()}
function check(){for(let i=0;i<N*N;i++)if(!val[i]||conflict(i))return;for(const c of cages)if(cageVal(c,val)!==c.t)return;finish()}
function finish(){run=false;clearInterval(tmr);const bonus=Math.max(0,Math.round(D[diff].b/2-secs*2));score+=bonus;const nb=score>best;if(nb){best=score;save('best_'+diff,best)}upd();
jingle([523,659,784,1047]);burst(innerWidth/2,innerHeight/3,['⭐','🎉','✨','🧮'],26);
const st=hints===0?'⭐⭐⭐':hints<=1?'⭐⭐':'⭐';
setTimeout(()=>showOv(nb?'🏆 New Best!':'🎉 Puzzle Solved!',st,'Score: <b>'+score+'</b> (time bonus '+bonus+')<br>Best: <b>'+best+'</b> &middot; Time '+mmss(secs)+'<br>Hints used: '+hints,[['▶ Play Again','',()=>newGame(diff)],['🎚 Change Level','o',menu]]),800)}
function newGame(d){diff=d;hideOv();const g=gen(d);N=g.n;sol=g.g;cage=g.m.id;cages=g.m.cs;val=Array(N*N).fill(0);sel=-1;score=0;streak=0;hints=0;secs=0;best=load('best_'+d);run=true;build();render();upd();clearInterval(tmr);tmr=setInterval(()=>{secs++;upd()},1000)}
function menu(){showOv('🧮 KenKen Mini','','Fill the grid so no number repeats in any row or column.<br>Each bordered cage must hit its target using its operation.<br>Example: <b>6×</b> in 2 cells = 2 and 3.',[['😊 Easy (4x4)','',()=>newGame('easy')],['🙂 Medium (5x5)','o',()=>newGame('medium')],['😤 Hard (5x5)','r',()=>newGame('hard')]])}
document.addEventListener('keydown',e=>{if(!run||e.ctrlKey||e.metaKey)return;if(/^[1-9]$/.test(e.key)&&+e.key<=N)put(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')erase();else if(e.key==='h')hint();
else if(e.key.startsWith('Arrow')){e.preventDefault();if(sel<0)sel=0;else{const r=(sel/N)|0,c=sel%N;if(e.key==='ArrowUp'&&r>0)sel-=N;if(e.key==='ArrowDown'&&r<N-1)sel+=N;if(e.key==='ArrowLeft'&&c>0)sel--;if(e.key==='ArrowRight'&&c<N-1)sel++}render()}});
function fit(){const land=isLand();$('#game').classList.toggle('land',land);const topH=land?44:92;let b;
if(land)b=Math.min(innerHeight-topH-14,innerWidth-290,600);else b=Math.min(innerWidth-16,innerHeight-topH-150,600);
b=Math.max(180,Math.floor(b/N)*N);$('#board').style.setProperty('--b',b+'px');$('#ctl').style.setProperty('--b',b+'px')}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
sol=[];val=[];cage=[];cages=[];fit();upd();menu();
</script></body></html>
