<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox & Geese</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc);color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
a.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;border-radius:999px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;font-weight:700;font-size:17px;text-decoration:none;box-shadow:0 4px 0 #a9560b}
#top{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 10px 4px 100px;min-height:56px;flex:none}
h1{margin:0;font-size:clamp(20px,3.4vw,34px);text-shadow:0 3px 0 #1b4f86,2px 2px 0 #1b4f86,-2px -2px 0 #1b4f86,2px -2px 0 #1b4f86,-2px 2px 0 #1b4f86;white-space:nowrap}
.pill{background:#1b4f86;color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(15px,2.6vw,21px);box-shadow:0 3px 0 #0b2d55;border:2px solid #ffe14a;white-space:nowrap}
.pill b{color:#ffe14a}
.mute{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 4px 0 #a9560b;font-size:20px;cursor:pointer;flex:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:2px 10px 10px;gap:8px}
#bw{flex:1;min-height:0;min-width:0;position:relative}
#cv{position:absolute;border-radius:16px;box-shadow:0 8px 0 #06204a,0 12px 24px rgba(0,0,0,.35);touch-action:none;background:#14407a;display:block}
#side{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#status{flex:1 1 100%;background:#fff;color:#0b3a78;border:3px solid #ffe14a;border-radius:16px;padding:6px 12px;font-weight:700;font-size:clamp(14px,2.5vmin,19px);text-align:center;box-shadow:0 4px 0 #0b2d55;min-height:44px;display:block;padding-top:9px;padding-bottom:9px;line-height:1.3}
#btns,#xbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#extra{display:flex;align-items:center;justify-content:center}
#extra canvas{border-radius:12px;background:#14407a;box-shadow:0 4px 0 #06204a;border:3px solid #fff}
.btn{font-family:inherit;font-weight:700;font-size:clamp(15px,2.6vmin,20px);min-height:44px;padding:0 16px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.b{background:linear-gradient(#4aa8ff,#1b66c9);box-shadow:0 5px 0 #0d3f85;text-shadow:0 2px 0 #0d3f85}
.btn.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}
.btn[disabled]{background:#8a97a8;box-shadow:0 5px 0 #5c6775;text-shadow:none;cursor:default}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,30,70,.9);z-index:50;padding:10px}
.ov.show{display:flex}
.box{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:clamp(10px,2.5vmin,22px) clamp(14px,4vmin,30px);box-shadow:0 8px 0 #06244d;max-width:min(94vw,460px);max-height:96dvh;overflow:auto;text-align:center;animation:pop2 .45s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.07)}}
.big{font-size:clamp(40px,12vmin,84px);line-height:1.1}
.box h2{margin:2px 0;font-size:clamp(26px,6.5vmin,42px);text-shadow:0 3px 0 #0b3a78}
.box p{margin:4px 0 8px;font-size:clamp(14px,3.2vmin,19px);font-weight:700;color:#fff}
.seg{display:flex;gap:8px;justify-content:center;margin:8px 0}
.seg button{flex:1;min-height:44px;border-radius:14px;border:3px solid #fff;background:#fff;color:#0b3a78;font-family:inherit;font-weight:700;font-size:clamp(14px,3.4vmin,20px);box-shadow:0 4px 0 #06244d;cursor:pointer;padding:0 8px}
.seg button.on{background:linear-gradient(#ffe14a,#ffb21f);color:#5a2d00}
.go{font-family:inherit;font-weight:700;font-size:clamp(20px,5vmin,28px);margin-top:8px;padding:.35em 1.5em;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 6px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c;min-height:48px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
.stars{font-size:clamp(34px,9vmin,54px);letter-spacing:4px;color:#ffd21f;text-shadow:0 3px 0 #8a5a00}
.stars i{font-style:normal;color:#0b3a78;text-shadow:none}
.sc{font-size:clamp(18px,4.4vmin,26px);font-weight:700}
.sc b{color:#ffe14a}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fl{position:fixed;z-index:70;pointer-events:none;font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 #1b4f86,2px 2px 0 #1b4f86,-2px -2px 0 #1b4f86,2px -2px 0 #1b4f86,-2px 2px 0 #1b4f86;transform:translate(-50%,-50%);animation:fl .95s ease-out forwards;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-220%) scale(1.3);opacity:0}}
.shake{animation:sh .3s}
@keyframes sh{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
@media (orientation:landscape){#stage{flex-direction:row}#side{width:clamp(150px,24vw,250px);flex-direction:column;flex-wrap:nowrap;justify-content:center}#status{flex:none;width:100%}}
@media (max-width:700px){h1{display:none}}
@media (max-height:500px){#top{min-height:48px;padding-top:6px}#stage{padding-bottom:6px}.big{font-size:34px}.seg{margin:4px 0}.box p{margin:2px 0 4px}.box{padding:8px 16px}.go{margin-top:4px}}

</style></head><body>
<a class="home" href="index.html">⌂ Home</a>
<div id="top"><h1>Fox & Geese</h1><span class="pill" id="p1"></span><span class="pill">Best <b id="bs">0</b></span><button class="mute" id="mute" aria-label="Sound">🔊</button></div>
<div id="stage">
<div id="bw"><canvas id="cv"></canvas></div>
<div id="side"><div id="status"></div><div id="extra"></div><div id="xbtns"></div><div id="btns"><button class="btn b" id="bNew">↺ Restart</button><button class="btn o" id="bMenu">☰ Menu</button></div></div>
</div>
<canvas id="fx"></canvas>
<div class="ov" id="ovS"><div class="box"><div class="big" id="stE"></div><h2 id="stT"></h2><p id="stD"></p><div class="seg" id="sgM"></div><div class="seg" id="sgD"></div><div class="seg" id="sgS"></div><button class="go" id="play">▶ Play!</button></div></div>
<div class="ov" id="ovR"><div class="box"><div class="big" id="rE"></div><h2 id="rT"></h2><div class="stars" id="rS"></div><p id="rD"></p><div class="sc">Score <b id="rSc">0</b> &nbsp; Best <b id="rB">0</b></div><button class="go" id="again">▶ Play Again</button><div><button class="btn o" id="rMenu" style="margin-top:12px">☰ Menu</button></div></div></div>
<script>
const CFG={title:'Fox & Geese',emoji:'🦊',desc:'13 geese try to trap the sneaky fox. The fox jumps over geese to catch them! Geese move forward or sideways.',key:'fox-and-geese.html',two:true,sides:['🦆 I play Geese','🦊 I play Fox'],LW:600,LH:600};

const $=id=>document.getElementById(id);
const S={mode:'ai',diff:'easy',side:0};
let ac=null,muted=false,best=0,tok=0,over=true;
const cv=$('cv'),ctx=cv.getContext('2d');
try{best=+localStorage.getItem(CFG.key+':best')||0}catch(e){}
function beep(f,d,type,v){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.connect(g);g.connect(ac.destination);o.start();o.stop(t+(d||.12))}catch(e){}}
function sfx(n){const seq={move:[[330,.07]],pick:[[520,.05]],cap:[[200,.14,'sawtooth']],hit:[[160,.18,'sawtooth'],[110,.2,'sawtooth']],miss:[[260,.1,'sine']],bad:[[130,.14,'square']],win:[[523,.12],[659,.12],[784,.12],[1047,.25]],lose:[[300,.18],[240,.18],[180,.3]],pop:[[600,.06]]}[n]||[];seq.forEach((s,i)=>setTimeout(()=>beep(s[0],s[1],s[2]),i*110))}
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function later(fn,ms){const t=tok;setTimeout(()=>{if(t===tok)fn()},ms)}
function setStatus(h){$('status').innerHTML=h}
function setPill(h){$('p1').innerHTML=h}
function setX(list){const d=$('xbtns');d.innerHTML='';(list||[]).forEach(o=>{const b=document.createElement('button');b.className='btn '+(o.c||'b');b.innerHTML=o.t;b.disabled=!!o.dis;b.onclick=()=>{unlock();o.fn()};d.appendChild(b)})}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function emo(g,t,x,y,s){g.save();g.globalAlpha=1;g.fillStyle='#000';g.font=s+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y);g.restore()}
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CFG.LW/r.width,y:(e.clientY-r.top)*CFG.LH/r.height}}
function toClient(x,y){const r=cv.getBoundingClientRect();return{x:r.left+x*r.width/CFG.LW,y:r.top+y*r.height/CFG.LH}}
function fit(){const bw=$('bw'),w=bw.clientWidth,h=bw.clientHeight-8;if(w<10||h<10)return;const s=Math.min(w/CFG.LW,h/CFG.LH),cw=Math.floor(CFG.LW*s),ch=Math.floor(CFG.LH*s),d=Math.min(window.devicePixelRatio||1,2);cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=Math.floor((w-cw)/2)+'px';cv.style.top=Math.floor((h-ch)/2)+'px';cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);if(typeof onFit==='function')onFit()}
/* fx */
const fx=$('fx'),fc=fx.getContext('2d');let P=[],fr=0;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}
function burst(x,y,n,cols,sp){cols=cols||['#ffe14a','#ff5a5a','#5fe35f','#4aa8ff','#fff'];sp=sp||7;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp+1;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:cols[i%cols.length],s:4+Math.random()*6})}runFx()}
function confetti(){for(let i=0;i<90;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,l:1.6,c:['#ffe14a','#ff5a5a','#5fe35f','#4aa8ff','#ff8ad8'][i%5],s:6+Math.random()*7});runFx()}
function runFx(){if(fr)return;fr=1;(function f(){fc.clearRect(0,0,fx.width,fx.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=.016;fc.globalAlpha=Math.max(0,Math.min(1,p.l));fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s)});fc.globalAlpha=1;P=P.filter(p=>p.l>0&&p.y<innerHeight+30);if(P.length)requestAnimationFrame(f);else{fr=0;fc.clearRect(0,0,fx.width,fx.height)}})()}
function floatText(t,x,y,col){const d=document.createElement('div');d.className='fl';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';if(col)d.style.color=col;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function floatAt(t,lx,ly,col){const c=toClient(lx,ly);floatText(t,c.x,c.y,col)}
function burstAt(lx,ly,n,cols){const c=toClient(lx,ly);burst(c.x,c.y,n,cols)}
function shake(){const b=$('bw');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
/* setup / result */
function mkSeg(id,opts,key){const d=$(id);d.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.textContent=o[1];b.dataset.v=o[0];b.onclick=()=>{S[key]=o[0];unlock();beep(520,.06);refreshSeg()};d.appendChild(b)})}
function refreshSeg(){[['sgM','mode'],['sgD','diff'],['sgS','side']].forEach(a=>{[...$(a[0]).children].forEach(b=>b.classList.toggle('on',String(b.dataset.v)===String(S[a[1]])))});$('sgM').style.display=CFG.two?'':'none';$('sgD').style.display=S.mode==='ai'?'':'none';$('sgS').style.display=(CFG.sides&&S.mode==='ai')?'':'none'}
function showStart(){over=true;tok++;$('ovR').classList.remove('show');$('ovS').classList.add('show');refreshSeg()}
function startGame(){$('ovS').classList.remove('show');$('ovR').classList.remove('show');over=false;tok++;if(S.mode==='two')S.side=0;$('bs').textContent=best;newGame()}
function stars(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'<i>★</i>';return s}
function finish(o){over=true;tok++;const ai=S.mode==='ai';let nb=false;if(ai&&o.win&&o.score>best){best=o.score;nb=true;try{localStorage.setItem(CFG.key+':best',best)}catch(e){}}
$('bs').textContent=best;sfx(o.win?'win':'lose');
setTimeout(()=>{$('rE').textContent=o.emoji;$('rT').textContent=o.title;$('rS').innerHTML=stars(o.stars);$('rD').textContent=o.sub||(nb?'New best score!':'');$('rSc').textContent=o.score;$('rB').textContent=best;$('ovR').classList.add('show');if(o.win)confetti()},o.delay==null?800:o.delay)}
$('play').onclick=()=>{unlock();startGame()};
$('again').onclick=()=>{unlock();startGame()};
$('bNew').onclick=()=>{unlock();startGame()};
$('bMenu').onclick=()=>{unlock();showStart()};
$('rMenu').onclick=()=>{unlock();showStart()};
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{cv.setPointerCapture(e.pointerId)}catch(x){}if(!over&&typeof onDown==='function')onDown(pt(e),e)});
cv.addEventListener('pointermove',e=>{if(!over&&typeof onMove==='function')onMove(pt(e),e)});
cv.addEventListener('pointerup',e=>{if(!over&&typeof onUp==='function')onUp(pt(e),e)});
addEventListener('keydown',e=>{if(!over&&typeof onKey==='function')onKey(e)});
addEventListener('resize',()=>{fxSize();fit()});addEventListener('orientationchange',()=>setTimeout(()=>{fxSize();fit()},120));
function frame(t){try{const k=cv.width/CFG.LW;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,CFG.LW,CFG.LH);draw(t)}catch(e){console.error(e)}requestAnimationFrame(frame)}

const D=[[-1,0],[1,0],[0,-1],[0,1]],FOXWIN=5;
const ok=(r,c)=>r>=0&&c>=0&&r<7&&c<7&&((r>=2&&r<=4)||(c>=2&&c<=4));
const px=i=>60+(i%7)*80,py=i=>60+(i/7|0)*80;
let G=0,st,turn,sel,dests,busy,plies,caught,mover,tm=0;
function newGame(){G=1;const g=new Array(49).fill(-1);for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(ok(r,c))g[r*7+c]=0;
for(let r=4;r<7;r++)for(let c=0;c<7;c++)if(ok(r,c)&&g[r*7+c]===0&&(r>4||(c>=0))&&(r*7+c)>=4*7)g[r*7+c]=1;
st={g,fox:3*7+3,geese:0};g[st.fox]=2;st.geese=g.filter(x=>x===1).length;turn=0;sel=-1;dests=[];busy=false;plies=0;caught=0;mover=null;beginTurn()}
function human(){return S.mode==='two'||turn===S.side}
function gMoves(s){const a=[];for(let i=0;i<49;i++)if(s.g[i]===1){const r=i/7|0,c=i%7;[[-1,0],[0,-1],[0,1]].forEach(d=>{const R=r+d[0],C=c+d[1];if(ok(R,C)&&s.g[R*7+C]===0)a.push({f:i,t:R*7+C,caps:[]})})}return a}
function fMoves(s){const res=[],seen=new Set();const o=s.fox;const emp=(r,c,caps)=>ok(r,c)&&(s.g[r*7+c]===0||r*7+c===o)&&!caps.includes(r*7+c);
const r0=o/7|0,c0=o%7;D.forEach(d=>{const R=r0+d[0],C=c0+d[1];if(ok(R,C)&&s.g[R*7+C]===0)res.push({f:o,t:R*7+C,caps:[]})});
(function dfs(r,c,caps){D.forEach(d=>{const mr=r+d[0],mc=c+d[1],nr=r+2*d[0],nc=c+2*d[1];if(!ok(mr,mc)||s.g[mr*7+mc]!==1||caps.includes(mr*7+mc))return;if(!emp(nr,nc,caps))return;const n=nr*7+nc,cp=caps.concat(mr*7+mc);if(!seen.has(n)){seen.add(n);res.push({f:o,t:n,caps:cp})}dfs(nr,nc,cp)})})(r0,c0,[]);
return res}
function app(s,m,isFox){const g=s.g.slice();g[m.f]=0;g[m.t]=isFox?2:1;m.caps.forEach(c=>g[c]=0);return{g,fox:isFox?m.t:s.fox,geese:s.geese-m.caps.length}}
function evalG(s,fm){let v=s.geese*80-fm*6;for(let i=0;i<49;i++)if(s.g[i]===1)v+=(6-(i/7|0))*9;return v}
function ab(s,d,al,be,foxT,dl){const caps=s.geese<=FOXWIN;if(caps)return-10000-d;const ms=foxT?fMoves(s):gMoves(s);if(!ms.length)return foxT?10000+d:-10000-d;if(d===0)return evalG(s,foxT?ms.length:fMoves(s).length);
if(foxT){ms.sort((a,b)=>b.caps.length-a.caps.length);let v=1e9;for(const m of ms){v=Math.min(v,ab(app(s,m,true),d-1,al,be,false));be=Math.min(be,v);if(al>=be)break}return v}
let v=-1e9;for(const m of ms){v=Math.max(v,ab(app(s,m,false),d-1,al,be,true));al=Math.max(al,v);if(al>=be)break}return v}
function aiMove(){if(over)return;const isFox=turn===1,ms=isFox?fMoves(st):gMoves(st);let pick;
if(S.diff==='hard'){let bv=isFox?1e9:-1e9;const sh=ms.slice().sort(()=>Math.random()-.5);sh.forEach(m=>{const v=ab(app(st,m,isFox),isFox?4:4,-1e9,1e9,!isFox);if(isFox?v<bv:v>bv){bv=v;pick=m}})}
else if(isFox){const cp=ms.filter(m=>m.caps.length);if(cp.length&&Math.random()<.85)pick=cp[Math.random()*cp.length|0];else{pick=ms[Math.random()*ms.length|0]}}
else{const safe=ms.filter(m=>fMoves(app(st,m,false)).every(f=>!f.caps.length));const pool=safe.length?safe:ms;const fw=pool.filter(m=>m.t<m.f),arr=(fw.length&&Math.random()<.85)?fw:pool;pick=arr[Math.random()*arr.length|0]}
busy=false;doMove(pick)}
function doMove(m){const isFox=turn===1;if(m.caps.length){sfx('cap');shake();caught+=m.caps.length;m.caps.forEach(c=>{burstAt(px(c),py(c),16,['#fff','#ffb21f']);floatAt('Caught!',px(c),py(c),'#ffe14a')})}else sfx('move');
st=app(st,m,isFox);plies++;mover={t:m.t,at:tm};sel=-1;dests=[];turn=1-turn;beginTurn()}
function beginTurn(){const isFox=turn===1,ms=isFox?fMoves(st):gMoves(st);setPill('Geese <b>'+st.geese+'</b>');
if(st.geese<=FOXWIN)return fin(1);if(!ms.length)return fin(isFox?0:1);if(plies>=220)return fin(-1);
if(S.mode==='two')setStatus((isFox?'🦊 <b>Fox</b>':'🦆 <b>Geese</b>')+' to move');else setStatus(human()?(isFox?'Your turn 🦊 - jump over geese!':'Your turn 🦆 - trap the fox!'):'Computer is thinking...');
if(human()){if(isFox){sel=st.fox;dests=ms}}else{busy=true;later(aiMove,550)}}
function fin(w){busy=true;sel=-1;dests=[];const two=S.mode==='two',youFox=S.side===1;let foxWon=w===1;
const mult=S.diff==='hard'?1.5:1;
if(w===-1)return finish({win:false,emoji:'🤝',title:'Draw',sub:'Nobody could finish. Try again!',score:0,stars:1});
if(two){setStatus(foxWon?'<b>Fox wins!</b>':'<b>Geese trapped the fox!</b>');return finish({win:true,emoji:foxWon?'🦊':'🦆',title:foxWon?'Fox wins!':'Geese win!',sub:'Well played!',score:0,stars:3})}
const win=foxWon===youFox;setStatus(win?'<b>You win!</b>':'<b>Computer wins</b>');
const sc=win?Math.round((youFox?300+caught*45:400+st.geese*45)*mult):0;
