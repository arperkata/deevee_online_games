<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Flip</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(#1b1464,#6a1bb1) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border:3px solid #1b4f86;border-radius:50%;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;max-width:100vw}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;font-size:clamp(16px,4.5vw,22px);line-height:1.4;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.btn{font:inherit;font-size:clamp(24px,6vw,32px);font-weight:700;min-height:52px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;padding:12px 44px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}.btn{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button></div>
<script>
const W=600,H=400,KEY='gravity-flip.html_best';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
let best=0,muted=false;
try{best=+localStorage.getItem(KEY)||0;muted=localStorage.getItem(KEY+'_m')=='1'}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,best)}catch(e){}return true}return false}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'_m',muted?1:0)}catch(x){}e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function fit(){const vw=innerWidth,vh=innerHeight;let top=60,s=Math.min(vw/W,(vh-top-6)/H);const s2=Math.min(vw/W,(vh-10)/H);if((vw-W*s2)/2>=128){top=5;s=s2}cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top-5)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let parts=[],pops=[],shake=0;
function burst(x,y,n,cols,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c,s){pops.push({x,y,t,c,s,l:.8})}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const q of pops){q.y-=40*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);shake=Math.max(0,shake-dt*30)}
function drawFx(){g.save();for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.restore();for(const q of pops){g.save();g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,q.s||22,'center',q.c);g.restore()}}
function txt(t,x,y,s,al,c){g.font='bold '+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign=al||'left';g.textBaseline='alphabetic';g.lineWidth=s/4.5;g.shadowBlur=0;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(x,y,w,h,c){g.save();g.globalAlpha=1;g.fillStyle=c||'#14367a';rr(x,y,w,h,h/2);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();g.restore()}
function emo(e,x,y,s,rot,al){g.save();g.globalAlpha=al==null?1:al;g.shadowBlur=0;g.translate(x,y);if(rot)g.rotate(rot);g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(e,0,0);g.restore()}
function hud(sc,extra){pill(8,8,150,40);txt('Score '+sc,20,37,22);pill(W-128,8,120,40);txt('Best '+best,W-20,36,19,'right');if(extra)txt(extra,W/2+14,36,20,'center','#ffe14d')}
const starRow=(s,a,b,c)=>'<span class="stars">'+(s>=c?'⭐⭐⭐':s>=b?'⭐⭐☆':s>=a?'⭐☆☆':'☆☆☆')+'</span>';
function shakeOn(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
const ovHidden=()=>$('ov').classList.contains('hide');
function hideOv(){$('ov').classList.add('hide')}
function showOv(t,m,b){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;$('ov').classList.remove('hide')}
function endGame(emoji,score,a,b,c,extra){const nb=saveBest(score);setTimeout(()=>{state='over';showOv(emoji+(nb&&score>0?' New Record!':' Game Over'),starRow(score,a,b,c)+'<span class="big">'+score+'</span>'+(extra||'')+' Best '+best+(nb&&score>0?'<br><span class="nb">🎉 New best!</span>':''),'Play again')},700)}
let state='ready',t=0;
const FL=60,CE=340,RW=34,RH=34,PXX=110;
let bonus=0,py,vy,dir,obs,orbs,dist,spd,spawnX,onSurf,tilt,gap0,score=0;
function start(){if(ovHidden())return;hideOv();parts=[];pops=[];shake=0;py=FL;vy=0;dir=1;obs=[];orbs=[];dist=0;spd=260;spawnX=W+200;onSurf=true;tilt=0;bonus=0;score=0;state='play';beep(520,.1,'triangle')}
function flip(){if(state!='play')return;dir=-dir;onSurf=false;vy=0;beep(dir>0?400:600,.08,'square',.05,150);burst(PXX,dir>0?CE-RH:FL+RH,6,['#fff','#7ff'],120)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flip()});
addEventListener('keydown',e=>{if(e.code=='Space'||e.key=='ArrowUp'||e.key=='ArrowDown'){e.preventDefault();if(ovHidden())flip()}});
// y measured from the top; floor surface at CE, ceiling at FL
function gen(){
  const r=Math.random(),s=Math.min(1,dist/6000);
  const w=rnd(26,44),h=rnd(40,78+s*20),top=Math.random()<.5;
  obs.push({x:spawnX,w,h,top,sp:r<.12&&s>.2});
  if(Math.random()<.7)orbs.push({x:spawnX+rnd(120,200),y:Math.random()<.5?FL+22:CE-22,got:false});
  spawnX+=Math.max(260,rnd(330,520)-s*140)*(spd/260);
}
function die(){state='dying';shake=18;burst(PXX,py,40,['#ffe14d','#ff5c5c','#fff','#7ff'],320);beep(200,.5,'sawtooth',.07,-150);endGame('🙃',score,40,100,200,'Distance '+Math.floor(dist/10)+'m. ')}
function update(dt){
  if(state!='play')return;
  spd=Math.min(620,260+dist*.03);dist+=spd*dt;score=Math.floor(dist/10)+bonus;
  const target=dir>0?CE-RH/2:FL+RH/2;
  vy+=2600*dt*dir;py+=vy*dt;
  if(dir>0&&py>=target||dir<0&&py<=target){py=target;vy=0;onSurf=true}
  tilt+=((dir>0?0:3.14159)-tilt)*Math.min(1,dt*14);
  for(const o of obs)o.x-=spd*dt;for(const o of orbs)o.x-=spd*dt;spawnX-=spd*dt;
  while(spawnX<W+300)gen();
  for(const o of obs){
    const oy=o.top?FL:CE-o.h,oh=o.h;
    if(PXX+RW/2-6>o.x&&PXX-RW/2+6<o.x+o.w&&py+RH/2-6>oy&&py-RH/2+6<oy+oh)return die();
    if(!o.passed&&o.x+o.w<PXX-RW){o.passed=true;bonus+=2;}
  }
  for(const o of orbs)if(!o.got&&Math.hypot(o.x-PXX,o.y-py)<28){o.got=true;bonus+=10;burst(o.x,o.y,14,['#ffe14d','#fff'],220);pop(o.x,o.y-20,'+10','#ffe14d',24);beep(900,.1,'triangle',.07)}
  obs=obs.filter(o=>o.x>-80);orbs=orbs.filter(o=>o.x>-40&&!o.got);
}
function draw(){
  shakeOn();
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b1464');bg.addColorStop(1,'#6a1bb1');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
  g.fillStyle='#ffffff';for(let i=0;i<20;i++){const x=((i*97-dist*.2*(1+i%3*.3))%W+W)%W;g.fillRect(x,70+(i*53)%260,3,3)}
  const sg=(y,up)=>{g.fillStyle='#0d0833';g.fillRect(-20,up?-20:y,W+40,up?y+20:H-y+20);g.fillStyle='#4de1ff';g.fillRect(-20,up?y-6:y,W+40,6);g.fillStyle='#ff4dd8';for(let i=0;i<14;i++){const x=((i*60-dist)%(W+60)+W+60)%(W+60)-30;g.fillRect(x,up?y-6:y,26,6)}};
  sg(FL,true);sg(CE,false);
  if(obs)for(const o of obs){
    const oy=o.top?FL:CE-o.h;
    g.fillStyle='#7a0d2a';rr(o.x+3,oy+4,o.w,o.h,8);g.fill();
    const gr=g.createLinearGradient(o.x,0,o.x+o.w,0);gr.addColorStop(0,'#ff6b8a');gr.addColorStop(1,'#e01f4a');g.fillStyle=gr;rr(o.x,oy,o.w,o.h,8);g.fill();
    g.fillStyle='#fff';g.fillRect(o.x+5,oy+6,5,o.h-12);
    emo('🔺',o.x+o.w/2,o.top?oy+o.h+4:oy-4,o.w*.9,o.top?3.14159:0);
  }
  if(orbs)for(const o of orbs)emo('⭐',o.x,o.y+Math.sin(t*6+o.x)*3,30);
  if(state=='play'){
    const y=py;
    g.save();g.translate(PXX,y);g.rotate(tilt*0);g.scale(1,dir);
    g.fillStyle='#8a5a00';rr(-RW/2+2,-RH/2+4,RW,RH,9);g.fill();
    const gr=g.createLinearGradient(0,-RH/2,0,RH/2);gr.addColorStop(0,'#ffe14d');gr.addColorStop(1,'#ff9a00');g.fillStyle=gr;rr(-RW/2,-RH/2,RW,RH,9);g.fill();g.lineWidth=3;g.strokeStyle='#5b3500';g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(6,-4,6,0,6.283);g.fill();g.fillStyle='#111';g.beginPath();g.arc(8,-4,3,0,6.283);g.fill();
    g.restore();
  }
  drawFx();
  g.restore();
  hud(score,'');
  if(state=='play'&&dist<1500)txt('TAP to flip gravity!',W/2,H/2+10,26,'center','#ffe14d');
}
showOv('🙃 Gravity Flip','<b>Tap</b> to flip gravity!<br>Run on the floor or ceiling,<br>dodge spikes and grab ⭐','Play');

$('go').onclick=()=>{$('go').blur();start()};
addEventListener('keydown',e=>{if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();start()}});
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000)||0);last=now;t+=dt;update(dt);updFx(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
