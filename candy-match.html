<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candy Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;text-decoration:none;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;font-weight:700;box-shadow:0 3px 0 #b3600a;text-shadow:none}
#bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;padding:8px 8px 0 112px;font-size:16px;font-weight:700;min-height:54px}
#bar b{font-size:20px}
.btn{min-height:44px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 #1c701c;padding:10px 26px;border-radius:16px;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.sm{min-width:44px;font-size:16px;padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 #1c701c}
#ov{position:fixed;inset:0;background:rgba(10,50,100,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;text-align:center;padding:20px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(28px,8vw,44px)}#ov p{margin:0;font-size:18px;max-width:340px}
canvas{display:block;margin:6px auto 0;width:min(96vw,calc(100vh - 80px));min-width:240px;height:auto;aspect-ratio:1;touch-action:none;background:#14407a;border-radius:18px;box-shadow:0 8px 0 #0c2c58,0 14px 30px rgba(0,0,0,.35)}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a>
<div id="bar"><span>Score <b id="sc">0</b></span><span>Moves <b id="mv">30</b></span><span>Goal <b id="tg">0</b></span><span>Best <b id="bs">0</b></span><button id="mute" class="btn sm">🔊</button></div>
<canvas id="c" width="480" height="480"></canvas>
<div id="ov"><h1 id="t">🍬 Candy Match</h1><p id="m">Swap neighbors to match 3+ sweets. 4 in a row makes a blast candy, 5 makes a rainbow! 30 moves, hit goals for bonus moves.</p><button class="btn" id="go">▶ Play</button></div>
<script>
const $=id=>document.getElementById(id);
let AC,muted=false;
function beep(f,d=.1,t='sine',v=.15){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function best(v){try{if(v!==undefined)localStorage.setItem('cmbest',v);return +localStorage.getItem('cmbest')||0}catch(e){return 0}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
const cv=$('c'),x=cv.getContext('2d'),N=8,CS=60,E=['🍬','🍭','🍫','🍩','🍪','🍓'],TC=['#ff8fb8','#ffb347','#b0764a','#ffd1e8','#e8c48a','#ff6b6b'];
const BC=['#ff5fa8','#a05cff','#b87333','#1fc8d8','#ffab2e','#ff4545'];
const FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let g=[],sel=null,busy=true,moves=30,score=0,tgt=500,lvl=1,over=true,parts=[],texts=[],drag=null,bestS=best();
const mk=(t,sp=0)=>({t,sp,x:0,y:0,s:1}),rnd=()=>Math.random()*E.length|0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);fn(k);k<1?requestAnimationFrame(f):res()})(t0)})}
function ui(){$('sc').textContent=score;$('mv').textContent=moves;$('tg').textContent=tgt;$('bs').textContent=bestS}
function runs(){const rs=[];
for(let r=0;r<N;r++){let c=0;while(c<N){let e=c;const t=g[r][c].t;while(e+1<N&&t>=0&&g[r][e+1].t==t)e++;if(t>=0&&e-c>=2){const a=[];for(let k=c;k<=e;k++)a.push([r,k]);rs.push(a)}c=e+1}}
for(let c=0;c<N;c++){let r=0;while(r<N){let e=r;const t=g[r][c].t;while(e+1<N&&t>=0&&g[e+1][c].t==t)e++;if(t>=0&&e-r>=2){const a=[];for(let k=r;k<=e;k++)a.push([k,c]);rs.push(a)}r=e+1}}
return rs}
function sw(a,b,c,d){const t=g[a][b];g[a][b]=g[c][d];g[c][d]=t}
function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(g[r][c].sp==2)return true;for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;sw(r,c,r2,c2);const ok=runs().length>0;sw(r,c,r2,c2);if(ok)return true}}return false}
function shuffleBoard(){do{g=Array.from({length:N},()=>Array.from({length:N},()=>mk(rnd())));let n=0;while(runs().length&&n++<300)for(const run of runs()){const[r,c]=run[1];g[r][c]=mk(rnd())}}while(runs().length||!hasMove())}
function start(){moves=30;score=0;tgt=500;lvl=1;over=false;busy=false;sel=null;parts=[];texts=[];shuffleBoard();ui();$('ov').classList.add('hide')}
$('go').onclick=start;
function pop(px,py,c){for(let i=0;i<8;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*9,vy:(Math.random()-.7)*8,l:30,c})}
function say(px,py,t){texts.push({x:px,y:py,t,l:50})}
async function gravity(){let maxd=0;
for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(g[r][c]){if(r!=w){g[w][c]=g[r][c];g[r][c]=null;g[w][c].y=(r-w)*CS;maxd=Math.max(maxd,w-r)}w--}
for(let r=w;r>=0;r--){const ce=mk(rnd());ce.y=-(w+1)*CS;g[r][c]=ce;maxd=Math.max(maxd,w+1)}}
const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c].y)cells.push([g[r][c],g[r][c].y]);
await tween(150+maxd*45,k=>{const e=1-(1-k)*(1-k);for(const[ce,y0]of cells)ce.y=y0*(1-e)});
for(const[ce]of cells)ce.y=0}
async function resolve(swp,pre){let chain=0;
while(true){const rs=runs(),clear=new Set(),make=[];
if(pre){pre.forEach(k=>clear.add(k));pre=null}
if(!rs.length&&!clear.size)break;chain++;
for(const run of rs){run.forEach(([r,c])=>clear.add(r*N+c));if(run.length>=4){const p=run.find(([r,c])=>swp.some(([a,b])=>a==r&&b==c))||run[run.length>>1];make.push([p[0],p[1],run.length>=5?2:1])}}
const q=[...clear];while(q.length){const k=q.pop(),r=k/N|0,c=k%N;if(g[r][c].sp==1){for(let i=0;i<N;i++)for(const kk of[r*N+i,i*N+c])if(!clear.has(kk)){clear.add(kk);q.push(kk)}}}
const mc=[];for(const[r,c,sp]of make){clear.delete(r*N+c);const ce=g[r][c];ce.sp=sp;if(sp==2)ce.t=-1;mc.push(ce);score+=50;say((c+.5)*CS,(r+.5)*CS,sp==2?'RAINBOW!':'BLAST!')}
score+=clear.size*10*chain;
if(chain>1)say(240,200+chain*10,'Combo x'+chain+'!');
beep(380+chain*90,.15,'triangle',.2);
const cells=[];clear.forEach(k=>{const r=k/N|0,c=k%N;cells.push(g[r][c]);pop((c+.5)*CS,(r+.5)*CS,TC[Math.max(0,g[r][c].t)])});
await tween(220,k=>{cells.forEach(ce=>ce.s=1-k);mc.forEach(ce=>ce.s=1+.35*(1-k))});
mc.forEach(ce=>ce.s=1);clear.forEach(k=>g[k/N|0][k%N]=null);
ui();await gravity();swp=[]}
return chain}
async function trySwap(r1,c1,r2,c2){if(busy||over)return;busy=true;sel=null;const A=g[r1][c1],B=g[r2][c2];
await tween(160,k=>{A.x=(c2-c1)*CS*k;A.y=(r2-r1)*CS*k;B.x=(c1-c2)*CS*k;B.y=(r1-r2)*CS*k});
A.x=A.y=B.x=B.y=0;g[r1][c1]=B;g[r2][c2]=A;
const rb=A.sp==2||B.sp==2;
if(!rb&&!runs().length){beep(180,.15,'square');
await tween(160,k=>{A.x=(c1-c2)*CS*k;A.y=(r1-r2)*CS*k;B.x=(c2-c1)*CS*k;B.y=(r2-r1)*CS*k});
A.x=A.y=B.x=B.y=0;g[r1][c1]=A;g[r2][c2]=B;busy=false;return}
moves--;let pre=null;
if(rb){pre=new Set();const t=(A.sp==2&&B.sp==2)?-2:(A.sp==2?B.t:A.t);for(let r=0;r<N;r++)for(let c=0;c<N;c++){const ce=g[r][c];if(ce.sp==2||t==-2||ce.t==t)pre.add(r*N+c)}}
await resolve([[r1,c1],[r2,c2]],pre);
if(score>=tgt){lvl++;moves+=5;tgt+=400+lvl*200;say(240,240,'GOAL! +5 moves');[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*90))}
if(score>bestS){bestS=score;best(bestS)}ui();
if(moves<=0){over=true;beep(160,.5,'sawtooth');await sleep(600);$('t').textContent='🍭 Game Over';$('m').textContent='Score '+score+' · Best '+bestS;$('go').textContent='▶ Play Again';$('ov').classList.remove('hide');busy=false;return}
if(!hasMove()){say(240,240,'Shuffle!');shuffleBoard()}
busy=false}
function cellAt(e){const b=cv.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/b.width*N),r=Math.floor((e.clientY-b.top)/b.height*N);return(r<0||c<0||r>=N||c>=N)?null:[r,c]}
cv.addEventListener('pointerdown',e=>{if(busy||over)return;const p=cellAt(e);if(!p)return;const[r,c]=p;
if(sel&&Math.abs(sel[0]-r)+Math.abs(sel[1]-c)==1){const s=sel;trySwap(s[0],s[1],r,c);return}
sel=[r,c];drag={x:e.clientX,y:e.clientY,r,c};beep(600,.04)});
cv.addEventListener('pointermove',e=>{if(!drag||busy)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,th=cv.getBoundingClientRect().width/N*.35;
if(Math.abs(dx)>th||Math.abs(dy)>th){let r2=drag.r,c2=drag.c;if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;const{r,c}=drag;drag=null;if(r2>=0&&r2<N&&c2>=0&&c2<N)trySwap(r,c,r2,c2)}});
addEventListener('pointerup',()=>drag=null);addEventListener('pointercancel',()=>drag=null);
function rr(px,py,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(px,py,w,h,r);else x.rect(px,py,w,h)}
function loop(t){x.clearRect(0,0,480,480);x.textAlign='center';x.textBaseline='middle';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const px=c*CS,py=r*CS;x.fillStyle=(r+c)%2?'#1c5a9e':'#17498a';x.fillRect(px,py,CS,CS)}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const ce=g[r]&&g[r][c];if(!ce)continue;const cx=c*CS+ce.x+CS/2,cy=r*CS+ce.y+CS/2;
x.save();x.translate(cx,cy);x.scale(ce.s,ce.s);
if(ce.sp==1){x.strokeStyle='#ffd23f';x.lineWidth=4;x.globalAlpha=.7+.3*Math.sin(t/120);rr(-26,-26,52,52,14);x.stroke();x.globalAlpha=1}
x.globalAlpha=1;const col=ce.sp==2?'#ffffff':BC[ce.t],gr=x.createLinearGradient(0,-26,0,26);gr.addColorStop(0,'#fff');gr.addColorStop(.18,col);gr.addColorStop(1,col);x.fillStyle='rgba(0,0,0,.3)';rr(-25,-22,52,52,16);x.fill();x.fillStyle=gr;rr(-26,-26,52,52,16);x.fill();x.fillStyle='rgba(255,255,255,.35)';rr(-20,-22,40,12,8);x.fill();x.fillStyle='#000';x.font='34px '+FONT;x.fillText(ce.sp==2?'🌈':E[ce.t],0,3);
if(ce.sp==1){x.font='16px '+FONT;x.fillText('✨',15,-16)}
x.restore()}
if(sel&&!over){x.strokeStyle='#fff';x.lineWidth=4;rr(sel[1]*CS+3,sel[0]*CS+3,CS-6,CS-6,12);x.stroke()}
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--;x.globalAlpha=Math.min(1,p.l/15);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,5,0,7);x.fill()}x.globalAlpha=1;
texts=texts.filter(q=>q.l>0);x.font='bold 30px Fredoka,Trebuchet MS,sans-serif';x.lineWidth=6;x.strokeStyle='#1b4f86';x.fillStyle='#fff';for(const q of texts){q.y-=.8;q.l--;x.globalAlpha=Math.min(1,q.l/20);x.strokeText(q.t,q.x,q.y);x.fillText(q.t,q.x,q.y)}x.globalAlpha=1;
requestAnimationFrame(loop)}
shuffleBoard();ui();requestAnimationFrame(loop);
</script></body></html>
