<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flanker Arrows</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc) fixed;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:bold;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:8px;z-index:1000;font-size:22px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 #1b4f86;cursor:pointer;padding:0}
.btn{font:inherit;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:3px solid #fff;border-radius:16px;padding:10px 22px;min-height:44px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.o{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 5px 0 #a85d00;text-shadow:0 2px 0 #a85d00}.btn.o:active{box-shadow:0 1px 0 #a85d00}
.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}
.btn.b{background:linear-gradient(#5fb8ff,#2a7fe0);box-shadow:0 5px 0 #174f95;text-shadow:0 2px 0 #174f95}.btn.b:active{box-shadow:0 1px 0 #174f95}
#top{padding:52px 8px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.pill{background:linear-gradient(#3b86e0,#1b4f86);border:2px solid #fff;border-radius:999px;padding:2px clamp(8px,2.6vw,14px);font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 3px 0 #0f2f57;text-shadow:0 2px 0 #0f2f57;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(15,47,87,.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:52px 12px 12px;touch-action:manipulation}
.card{background:linear-gradient(#fff,#e3f3ff);color:#1b4f86;text-shadow:none;border:5px solid #ffd84a;border-radius:28px;box-shadow:0 10px 0 #0f2f57,0 20px 40px rgba(0,0,0,.35);padding:clamp(14px,4vmin,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);text-align:center;width:min(94vw,520px);max-height:calc(100dvh - 64px);overflow-y:auto;animation:cardin .4s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0;font-size:clamp(26px,7.5vmin,44px);color:#e8590c;text-shadow:0 3px 0 #ffd84a}
.card p{margin:0;font-size:clamp(15px,3.6vmin,20px);line-height:1.35;font-weight:bold}
.stars{font-size:clamp(28px,8vmin,44px);letter-spacing:4px}.stars:empty{display:none}
#ovB{display:flex;flex-direction:column;gap:10px;width:100%}
@keyframes cardin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hide{display:none!important}
#main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 8px 10px}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
@keyframes popin{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.popin{animation:popin .3s}
@media (max-height:480px){
.ov{padding:8px 12px}
.card{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100dvh - 16px);width:min(94vw,640px)}
.card h1,.card p,.stars{flex:1 1 100%}
#ovB{flex-direction:row;flex-wrap:wrap}
.card .btn{width:auto;flex:1 1 auto;padding:8px 14px;font-size:16px}
body{flex-direction:row;justify-content:center}
#top{flex-direction:column;flex-wrap:nowrap;padding:52px 6px 0;align-items:stretch;text-align:center;justify-content:flex-start}
#main{flex-direction:row;padding:6px}
}

#panel{background:#fff;border:5px solid #ffd84a;border-radius:26px;box-shadow:0 8px 0 #0f2f57,0 16px 30px rgba(0,0,0,.3);width:min(96vw,640px);padding:clamp(8px,2vmin,18px) 8px 6px;color:#1b4f86;text-shadow:none;text-align:center}
#ask{font-weight:bold;font-size:clamp(14px,3.6vmin,20px);margin-bottom:2px}
#arrows{display:flex;justify-content:center;gap:clamp(2px,1.2vw,12px);font-size:clamp(34px,min(10.5vw,17vh),96px);line-height:1.1;color:#1b4f86;font-weight:bold}
#arrows span{display:inline-block;width:1.05em;text-align:center}
#arrows span.mid{color:#d63030}
#arrows.same span.mid{color:#1b4f86}
#mk{font-size:clamp(18px,4vmin,28px);color:#e8590c;line-height:1}
#tb{width:min(92%,440px);height:14px;margin:6px auto 4px;background:#0f2f57;border:3px solid #1b4f86;border-radius:10px;overflow:hidden}
#tf{height:100%;width:100%;background:linear-gradient(#ffd84a,#f08a12)}
#btns{display:flex;gap:clamp(10px,3vw,24px);width:min(96vw,640px)}
.ab{flex:1;font:inherit;font-size:clamp(40px,12vmin,72px);font-weight:bold;color:#fff;text-shadow:0 3px 0 #174f95;background:linear-gradient(#5fb8ff,#2a7fe0);border:4px solid #fff;border-radius:22px;box-shadow:0 8px 0 #174f95;height:clamp(64px,18vh,130px);cursor:pointer;padding:0;touch-action:manipulation}
.ab.R{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 8px 0 #a85d00;text-shadow:0 3px 0 #a85d00}
.ab:active{transform:translateY(6px);box-shadow:0 2px 0 #174f95}
#fb{height:30px;font-size:clamp(18px,4.4vmin,24px);font-weight:bold}
@media (max-height:480px){#main{flex-direction:column;gap:4px}#panel{width:min(62vw,520px)}#arrows{font-size:clamp(30px,13vh,60px)}#btns{width:min(62vw,520px)}.ab{height:clamp(50px,20vh,80px);font-size:40px;box-shadow:0 5px 0 #174f95}#fb{height:22px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute">🔊</button>

<div id="top"><div class="pill">⭐ <b id="sc">0</b></div><div class="pill">⏱ <b id="tm">45</b></div><div class="pill">🔥 <b id="st">0</b></div><div class="pill">🏆 <b id="bs">0</b></div></div>
<div id="main"><div id="panel"><div id="ask">Which way does the MIDDLE arrow point?</div><div id="arrows"></div><div id="mk">▲</div><div id="tb"><div id="tf"></div></div></div>
<div id="fb"></div>
<div id="btns"><button class="ab" id="bl">◀</button><button class="ab R" id="br">▶</button></div></div>
<div class="ov" id="ov"><div class="card"><h1 id="ovT"></h1><div class="stars" id="ovS"></div><p id="ovP"></p><div id="ovB"></div></div></div>
<script>
const KEY='flanker-arrows.html';
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let muted=false;try{muted=localStorage.getItem(KEY+'_mute')==='1'}catch(e){}
let AC;
function beep(f,d=.1,t='sine',v=.12){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle'),i*90))}
function load(k){try{return +localStorage.getItem(KEY+'_'+k)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(KEY+'_'+k,v)}catch(e){}}
function burst(x,y,list,n=12){for(let i=0;i<n;i++){const s=document.createElement('div');s.textContent=list[i%list.length];s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;font-size:'+(14+Math.random()*16)+'px;pointer-events:none;z-index:150;text-shadow:none';document.body.appendChild(s);const a=Math.random()*6.28,d=40+Math.random()*80;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d+30)+'px)) scale(.3)',opacity:0}],{duration:600+Math.random()*300,easing:'ease-out'}).onfinish=()=>s.remove()}}
function floatTxt(x,y,txt,col){const s=document.createElement('div');s.textContent=txt;s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;font-size:24px;font-weight:bold;color:'+(col||'#ffd84a')+';text-shadow:0 2px 0 #0f2f57,0 0 4px #0f2f57;pointer-events:none;z-index:160;white-space:nowrap';document.body.appendChild(s);s.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:'translate(-50%,-110px) scale(1.2)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>s.remove()}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function showOv(t,stars,p,btns){$('#ovT').textContent=t;$('#ovS').textContent=stars||'';$('#ovP').innerHTML=p;const b=$('#ovB');b.innerHTML='';btns.forEach(x=>{const e=document.createElement('button');e.className='btn '+(x.c||'');e.innerHTML=x.t;e.onclick=()=>{beep(520,.06);x.f()};b.appendChild(e)});$('#ov').classList.remove('hide')}
function hideOv(){$('#ov').classList.add('hide')}
$('#mute').textContent=muted?'🔇':'🔊';
$('#mute').onclick=()=>{muted=!muted;save('mute',muted?1:0);$('#mute').textContent=muted?'🔇':'🔊';beep(600,.05)};
document.addEventListener('pointerdown',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{passive:true});

const TOTAL=45;
let score=0,streak=0,time=TOTAL,lvl=0,ok=0,bad=0,run=false,dir=1,tStart=0,dl=3,best=0,timer=0,lock=false,maxS=0;
const AR={'-1':'◀','1':'▶'};
function trial(){const n=lvl>=4?7:5,mid=n>>1;const inc=Math.random()<Math.min(.8,.3+lvl*.07);dir=Math.random()<.5?-1:1;const fl=inc?-dir:dir;
 const a=$('#arrows');a.innerHTML='';a.className=lvl>=3?'same':'';
 for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=AR[i===mid?dir:fl];if(i===mid)s.className='mid';a.appendChild(s)}
 $('#mk').style.paddingLeft='0';dl=Math.max(1.3,3.2-lvl*.2);tStart=performance.now();lock=false}
function upd(){$('#sc').textContent=score;$('#tm').textContent=Math.ceil(time);$('#st').textContent=streak;$('#bs').textContent=best}
function start(){score=0;streak=0;time=TOTAL;lvl=0;ok=0;bad=0;maxS=0;run=true;best=load('best');hideOv();$('#fb').textContent='';trial();upd();clearInterval(timer);
 timer=setInterval(()=>{if(!run)return;time-=.05;const el=(performance.now()-tStart)/1000;$('#tf').style.width=Math.max(0,100-el/dl*100)+'%';
  if(time<=0){time=0;upd();end();return}
  if(el>dl&&!lock){miss(true)}upd()},50)}
function miss(timeout){streak=0;bad++;if(!timeout)time=Math.max(0,time-2);beep(150,.25,'sawtooth');$('#fb').textContent=timeout?'⌛ Too slow!':'❌ Oops! -2s';$('#fb').style.color='#d63030';shake($('#panel'));trial()}
function ans(d){if(!run||lock)return;
 if(d===dir){const el=(performance.now()-tStart)/1000;const fast=Math.max(0,Math.round((1-el/dl)*8));const pts=10+Math.min(streak,10)*2+fast;score+=pts;streak++;maxS=Math.max(maxS,streak);ok++;
  if(ok%6===0){lvl++;jingle([660,880])}else beep(500+Math.min(streak,12)*40,.08,'triangle');
  $('#fb').textContent='+'+pts+(streak>=5?'  🔥 x'+streak:'');$('#fb').style.color='#1b4f86';
  const r=$('#arrows').getBoundingClientRect();floatTxt(r.left+r.width/2,r.top,'+'+pts);if(streak%5===0)burst(r.left+r.width/2,r.top+r.height/2,['🔥','⭐','✨'],12);trial()}
 else miss(false);upd()}
function end(){run=false;clearInterval(timer);const nb=score>best;if(nb){best=score;save('best',best)}upd();jingle([392,330,262]);
 const st=score>=550?3:score>=300?2:1;if(nb)burst(innerWidth/2,innerHeight/3,['⭐','🎉','✨','🏆'],26);
 showOv(nb?'🏆 New Best!':'⏰ Time!','⭐'.repeat(st),'Score: <b>'+score+'</b> &nbsp; Best: <b>'+best+'</b><br>Correct: '+ok+' &nbsp; Misses: '+bad+'<br>Best streak: '+maxS,[{t:'▶ Play Again',f:start}])}
$('#bl').onpointerdown=e=>{e.preventDefault();ans(-1)};$('#br').onpointerdown=e=>{e.preventDefault();ans(1)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')ans(-1);else if(e.key==='ArrowRight'||e.key==='d')ans(1);else if((e.key==='Enter'||e.key===' ')&&!run&&!$('#ov').classList.contains('hide')){const b=$('#ovB button');if(b)b.click()}});
best=load('best');upd();
showOv('➡️ Flanker Arrows','','Look at the <b>MIDDLE</b> arrow only and tap the way it points. Ignore the arrows around it!<br>Wrong = -2s. Every 6 right makes it harder.<br>Keys: ← and →',[{t:'▶ Start',f:start}]);
</script></body></html>
