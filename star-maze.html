<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Star Maze - Race mazes, grab stars. Free online game, plays on phone, tablet and PC. No sign-up.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Maze</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{height:100dvh;background:linear-gradient(#1e90e6,#8fdcff) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 8px 2px;flex:none}
.home{background:linear-gradient(#ffb21f,#f07a0a);color:#fff;text-decoration:none;padding:0 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #a9560b}
.pill{background:#0b3a78;color:#fff;border:2px solid #ffe14a;border-radius:999px;padding:3px 12px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #06244d;white-space:nowrap}
.pill b{color:#ffe14a;font-size:19px}
.btn{min-height:44px;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 #1c701c;padding:8px 28px;border-radius:999px;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 6px 0 #1c701c}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1c701c}
.btn.sm{min-height:40px;min-width:44px;font-size:15px;padding:4px 12px;border-radius:999px;box-shadow:0 4px 0 #1c701c}
.btn.sm:active{box-shadow:0 1px 0 #1c701c}
#ov{position:fixed;inset:0;background:rgba(6,30,70,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov.hide{display:none}
#card{overflow:auto;background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:28px;padding:20px 26px;box-shadow:0 8px 0 #06244d;max-width:min(94vw,420px);max-height:94dvh;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop2 .5s}
@keyframes pop2{0%{transform:scale(.5)}70%{transform:scale(1.08)}}
#card h1{margin:0;font-size:clamp(26px,7vw,40px);text-shadow:0 3px 0 #0b3a78}#card p{margin:0;font-size:clamp(15px,4vw,19px);line-height:1.35;text-shadow:0 2px 0 #0b3a78}
#main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:4px 8px 10px}
#bw{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
canvas{display:block;border-radius:14px;border:4px solid #0b3a78;box-shadow:0 8px 0 #06204a,0 12px 22px rgba(0,0,0,.35);touch-action:none;background:#fff8e1}
#tbw{height:14px;background:#0b3a78;border:2px solid #fff;border-radius:8px;overflow:hidden;flex:none}
#tb{height:100%;width:100%;background:linear-gradient(#ffe14a,#f08a12)}
#pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;flex:none}
#pad button{border:0;border-radius:16px;background:linear-gradient(#5fe35f,#25a025);box-shadow:0 5px 0 #1c701c;color:#fff;font-size:24px;touch-action:none;text-shadow:0 2px 0 #1c701c}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #1c701c}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (orientation:landscape) and (max-height:520px){#main{flex-direction:row;gap:14px}#bw{width:auto;flex:0 1 auto;height:100%}}
</style></head><body>
<div id="top"><a class="home" href="index.html">⌂ Home</a><span class="pill">Lv <b id="lv">1</b></span><span class="pill">⏱ <b id="tm">0</b></span><span class="pill">Score <b id="sc">0</b></span><span class="pill">Best <b id="bs">0</b></span><button id="fog" class="btn sm">🌫 Fog: off</button><button id="mute" class="btn sm" aria-label="Sound">🔊</button></div>
<div id="main"><div id="bw"><canvas id="c" width="960" height="960"></canvas><div id="tbw"><div id="tb"></div></div></div>
<div id="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div></div>
<div id="ov"><div id="card"><h1 id="t">🐱 Star Maze</h1><p id="m">Reach the 🏁 before time runs out. Grab ⭐ for points! Arrows / WASD / swipe / D-pad. Fog mode = double points.</p><button class="btn" id="go">▶ Play</button></div></div>
<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const $=id=>document.getElementById(id);
let AC,muted=false;
function beep(f,d=.1,t='sine',v=.15){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function best(v){try{if(v!==undefined)localStorage.setItem('mzbest',v);return +localStorage.getItem('mzbest')||0}catch(e){return 0}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
const cv=$('c'),x=cv.getContext('2d'),S=480;
const FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let rng=Math.random,duoSeed=0,duoN=0;
function mk32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let N,cs,mz,px,py,vx,vy,stars,lvl=1,score=0,tl=0,tmax=1,fog=false,over=true,msg='',msgT=0,parts=[],held={},lastMove=0,bestS=best(),last=performance.now();
function fit(){const b=$('bw'),m=$('main'),row=getComputedStyle(m).flexDirection==='row',pd=$('pad'),w=row?m.clientWidth-16-(pd.offsetWidth?pd.offsetWidth+14:0):b.clientWidth,h=b.clientHeight-22;const s=Math.max(150,Math.floor(Math.min(w,h,820)));cv.style.width=cv.style.height=s+'px';$('tbw').style.width=s+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
$('fog').onclick=function(){fog=!fog;this.textContent='🌫 Fog: '+(fog?'ON x2':'off')};
function ui(){$('lv').textContent=lvl;$('tm').textContent=Math.ceil(Math.max(0,tl));$('sc').textContent=score;$('bs').textContent=bestS;$('tb').style.width=Math.max(0,tl/tmax*100)+'%';$('tb').style.background=tl/tmax<.25?'linear-gradient(#ff8a7a,#ff2a1a)':'linear-gradient(#ffe14a,#f08a12)'}
function gen(n){N=n;cs=S/N;mz=Array(N*N).fill(0);const seen=new Uint8Array(N*N),st=[0];seen[0]=1;
while(st.length){const i=st[st.length-1],cx=i%N,cy=i/N|0,o=[];
[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]].forEach(([dx,dy,a,b])=>{const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx])o.push([nx,ny,a,b])});
if(!o.length){st.pop();continue}const[nx,ny,a,b]=o[rng()*o.length|0];mz[i]|=a;mz[ny*N+nx]|=b;seen[ny*N+nx]=1;st.push(ny*N+nx)}}
function pathLen(){const d=new Int32Array(N*N).fill(-1),q=[0];d[0]=0;while(q.length){const i=q.shift(),cx=i%N,cy=i/N|0;
for(const[dx,dy,f]of[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]])if(mz[i]&f){const j=(cy+dy)*N+cx+dx;if(d[j]<0){d[j]=d[i]+1;q.push(j)}}}return d[N*N-1]}
function level(){gen(Math.min(7+(lvl-1)*2,27));px=py=vx=vy=0;stars=[];const k=Math.min(3+lvl,12);
while(stars.length<k){const sx=rng()*N|0,sy=rng()*N|0;if((sx||sy)&&(sx!=N-1||sy!=N-1)&&!stars.some(s=>s.x==sx&&s.y==sy))stars.push({x:sx,y:sy})}
tl=10+pathLen()*(.5-Math.min(.17,lvl*.012))+k*2;tmax=tl;ui()}
function start(){lvl=1;score=0;over=false;parts=[];level();$('ov').classList.add('hide');fit()}
$('go').onclick=()=>{rng=Math.random;start()};
Duo.addButtons($('card'),{game:'maze-runner',start:()=>{if(Duo.mode()==='two'){duoN++;if(duoN%2===1)duoSeed=Math.random()*4294967296|0;rng=mk32(duoSeed)}else rng=Math.random;fog=false;$('fog').textContent='🌫 Fog: off';start()},cpu:[300,1500],hw:true,unit:' pts'});
const CONF=['#ffe14a','#ff4a5a','#4ade5a','#3aa0ff','#ff8bd0','#ff9a1f'];
function burst(cx,cy,c,n=14){for(let i=0;i<n;i++)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:34,c:c||CONF[i%6]})}
function move(dx,dy){if(over)return;const f=dy<0?1:dx>0?2:dy>0?4:8;if(!(mz[py*N+px]&f))return;px+=dx;py+=dy;beep(420+(px+py)%5*30,.04,'square',.05);
const si=stars.findIndex(s=>s.x==px&&s.y==py);if(si>=0){stars.splice(si,1);const p=100*(fog?2:1);score+=p;burst((px+.5)*cs,(py+.5)*cs,'#ffd23f');beep(900,.15,'triangle',.2);msg='+'+p;msgT=40}
if(px==N-1&&py==N-1){const b=(200*lvl+Math.floor(tl)*5)*(fog?2:1);score+=b;burst((px+.5)*cs,(py+.5)*cs,null,40);burst(S/2,S/2,null,40);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*90));lvl++;const keep=Math.min(tl,10);level();tl+=keep;tmax=tl;msg='Level '+lvl+'! +'+b;msgT=80}
if(!Duo.active()&&score>bestS){bestS=score;best(bestS)}ui()}
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{if(document.querySelector('.duoOv'))return;const k=KM[e.key]||KM[e.key.toLowerCase()];if(!k)return;e.preventDefault();if(!held[e.key]){held[e.key]=k;move(k[0],k[1]);lastMove=performance.now()}});
addEventListener('keyup',e=>{delete held[e.key]});
let anc=null;
cv.addEventListener('pointerdown',e=>{anc={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!anc)return;const dx=e.clientX-anc.x,dy=e.clientY-anc.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);anc={x:e.clientX,y:e.clientY}}});
cv.addEventListener('pointerup',()=>anc=null);cv.addEventListener('pointercancel',()=>anc=null);
document.querySelectorAll('#pad button').forEach(b=>{const d=b.dataset.d.split(',').map(Number);let iv;
