<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Crossword</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc) fixed;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;height:100dvh}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:bold;box-shadow:0 3px 0 #a85d00;text-shadow:none;border:2px solid #fff}
#mute{position:fixed;right:10px;top:8px;z-index:1000;font-size:22px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 #1b4f86;cursor:pointer;padding:0}
.btn{font:inherit;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:3px solid #fff;border-radius:16px;padding:8px 20px;min-height:44px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
.btn.o{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 5px 0 #a85d00;text-shadow:0 2px 0 #a85d00}.btn.o:active{box-shadow:0 1px 0 #a85d00}
.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}
.btn.b{background:linear-gradient(#5fb8ff,#2a7fe0);box-shadow:0 5px 0 #174f95;text-shadow:0 2px 0 #174f95}.btn.b:active{box-shadow:0 1px 0 #174f95}
.btn:disabled{filter:grayscale(.7) brightness(.9);cursor:default}
#top{padding:52px 8px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.pill{background:linear-gradient(#3b86e0,#1b4f86);border:2px solid #fff;border-radius:999px;padding:2px clamp(8px,2.6vw,14px);font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 3px 0 #0f2f57;text-shadow:0 2px 0 #0f2f57;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(15,47,87,.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:48px 12px 12px;touch-action:manipulation}
.card{background:linear-gradient(#fff,#e3f3ff);color:#1b4f86;text-shadow:none;border:5px solid #ffd84a;border-radius:28px;box-shadow:0 10px 0 #0f2f57,0 20px 40px rgba(0,0,0,.35);padding:clamp(14px,4vmin,28px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);text-align:center;width:min(94vw,540px);max-height:calc(100dvh - 60px);overflow-y:auto;animation:cardin .4s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0;font-size:clamp(26px,7.5vmin,44px);color:#e8590c;text-shadow:0 3px 0 #ffd84a}
.card p{margin:0;font-size:clamp(15px,3.6vmin,20px);line-height:1.35;font-weight:bold}
.card .big{font-size:clamp(44px,12vmin,76px);line-height:1}
.card .btn{width:100%;font-size:clamp(20px,5vmin,26px)}
.stars{font-size:clamp(28px,8vmin,44px);letter-spacing:4px}.stars:empty{display:none}
#oextra{width:100%}#oextra:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:inherit;font-weight:bold;font-size:clamp(14px,3.8vmin,18px);color:#1b4f86;background:linear-gradient(#fff,#cfe6ff);border:3px solid #1b4f86;border-radius:14px;padding:6px 12px;min-height:44px;box-shadow:0 4px 0 #1b4f86;cursor:pointer}
.chip.on{background:linear-gradient(#ffe27a,#ffb300);box-shadow:0 4px 0 #a85d00;border-color:#a85d00}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #1b4f86}
@keyframes cardin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hide{display:none!important}
.fl{position:fixed;z-index:500;pointer-events:none;font-weight:bold;font-size:26px;text-shadow:0 2px 0 #0f2f57,0 0 6px #0f2f57;white-space:nowrap}
.pt{position:fixed;z-index:500;pointer-events:none;font-size:22px;line-height:1}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:popk .3s}
@keyframes popk{50%{transform:scale(1.18)}}
@media (max-height:480px){#top{padding:6px 60px 0 100px}.ov{padding:8px 12px}.card{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100dvh - 16px);width:min(94vw,680px)}.card h1,.card p,.stars,.card .big,#oextra{flex:1 1 100%}.card .big{font-size:40px}.card .btn{width:auto;flex:1 1 auto;padding:6px 14px;font-size:18px}}
#game{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 8px 8px}
@media (min-aspect-ratio:13/10){#game{flex-direction:row;justify-content:center;align-items:center;gap:18px}}
#grid{--S:300px;width:var(--S);height:var(--S);flex:none;display:grid;grid-template:repeat(5,1fr)/repeat(5,1fr);gap:calc(var(--S)*.015);padding:calc(var(--S)*.015);background:#0f2f57;border:5px solid #fff;border-radius:16px;box-shadow:0 7px 0 #0f2f57,0 14px 26px rgba(0,0,0,.3)}
.c{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;color:#1b4f86;text-shadow:none;font-weight:bold;font-size:calc(var(--S)*.11);border-radius:8%;cursor:pointer}
.c.k{background:#0f2f57;cursor:default}
.c.w{background:#cfe6ff}
.c.s{background:#ffd84a;color:#6b3b00;transform:scale(1.04);z-index:1}
.c.ok{background:#8bf08b;color:#0d4d0d}
.c.x{background:#ff8a8a;color:#7a0000}
.c i{position:absolute;left:5%;top:2%;font-style:normal;font-size:calc(var(--S)*.04);color:#e8590c}
#side{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(96vw,520px);flex:none}
@media (min-aspect-ratio:13/10){#side{width:min(46vw,420px)}}
#clue{width:100%;display:flex;align-items:center;gap:6px}
#ct{flex:1;min-height:clamp(46px,8vh,64px);background:#fff;color:#1b4f86;text-shadow:none;border:4px solid #ffd84a;border-radius:16px;box-shadow:0 4px 0 #0f2f57;padding:3px 10px;font-weight:bold;font-size:clamp(15px,2.8vh,21px);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
#clue .btn{padding:0;width:44px;font-size:20px}
#kb{display:flex;flex-direction:column;gap:clamp(4px,.9vh,7px);width:100%}
.kr{display:flex;gap:clamp(3px,1vw,6px);justify-content:center}
.kk{flex:1;max-width:48px;height:clamp(38px,6.6vh,54px);font:inherit;font-weight:bold;font-size:clamp(17px,3vh,24px);background:linear-gradient(#fff,#cfe6ff);color:#1b4f86;border:3px solid #fff;border-radius:11px;box-shadow:0 4px 0 #3f78b4;padding:0;cursor:pointer}
.kk:active{transform:translateY(3px);box-shadow:0 1px 0 #3f78b4}
.kk.d{max-width:72px;flex:1.5;background:linear-gradient(#ff8a8a,#d63030);color:#fff;box-shadow:0 4px 0 #8f1c1c}
#acts{display:flex;gap:8px}#acts .btn{font-size:clamp(15px,2.8vh,19px);padding:2px 14px}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a>
<button id="mute" aria-label="Sound on/off">🔊</button>
<div id="ov" class="ov"><div class="card"><div class="big" id="oe"></div><h1 id="ot"></h1><p id="op"></p><div class="stars" id="os"></div><div id="oextra"></div><button class="btn" id="obtn">Play</button></div></div>
<div id="top"><div class="pill" id="pP">🧩 1/3</div><div class="pill" id="pT">⏱ 0:00</div><div class="pill" id="pS">⭐ 0</div></div>
<div id="game"><div id="grid"></div><div id="side"><div id="clue"><button class="btn b" id="pv">◀</button><div id="ct"></div><button class="btn b" id="nx">▶</button></div><div id="kb"></div><div id="acts"><button class="btn o" id="chk">✔ Check (-50)</button><button class="btn p" id="rev">💡 Reveal (-100)</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const GK='mini-crossword.html:';
function lsGet(k,d){try{const v=localStorage.getItem(GK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(GK+k,JSON.stringify(v))}catch(e){}}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let AC=null,muted=lsGet('mute',false);
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d,type,v,delay){if(muted)return;try{audio();if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.1)+.02)}catch(e){}}
const sfx={tap(){beep(520,.05,'square',.06)},ok(){beep(660,.1);beep(880,.14,'sine',.15,.09)},bad(){beep(170,.22,'sawtooth',.1)},
 good(n){beep(500+Math.min(n||0,8)*70,.12,'triangle',.18)},win(){[523,659,784,1047].forEach((f,i)=>beep(f,.2,'triangle',.18,i*.11))},lose(){[420,330,250].forEach((f,i)=>beep(f,.25,'sawtooth',.1,i*.16))}};
function setMuteUI(){$('mute').textContent=muted?'🔇':'🔊'}
$('mute').onclick=()=>{muted=!muted;lsSet('mute',muted);setMuteUI();audio();if(!muted)sfx.tap()};setMuteUI();
addEventListener('pointerdown',audio);addEventListener('keydown',audio);
function overlay(o){$('oe').textContent=o.e||'';$('ot').textContent=o.t||'';$('op').innerHTML=o.p||'';
 $('os').textContent=o.s==null?'':'⭐'.repeat(o.s)+'☆'.repeat(3-o.s);
 $('oextra').innerHTML=o.extra||'';$('obtn').textContent=o.btn||'Play';$('obtn').onclick=()=>{sfx.tap();$('ov').classList.add('hide');o.go&&o.go()};
 const c=$('ov').firstElementChild;c.style.animation='none';c.offsetWidth;c.style.animation='';$('ov').classList.remove('hide')}
function floatText(x,y,t,c){const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.color=c||'#ffd84a';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
 const a=e.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-30px) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-80px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'});a.onfinish=()=>e.remove()}
function burst(x,y,n,list){list=list||['✨','⭐','🎉','💥'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='pt';e.textContent=list[rnd(list.length)];e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);
 const ang=Math.random()*6.283,d=40+Math.random()*90,dx=Math.cos(ang)*d,dy=Math.sin(ang)*d-30;
 const a=e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.2)`,opacity:1,offset:.6},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+60}px)) scale(.6)`,opacity:0}],{duration:700+Math.random()*400,easing:'ease-out'});a.onfinish=()=>e.remove()}}
function confetti(n){const cols=['#ff4d4d','#ffd84a','#5fd35f','#3b9cff','#c06bff','#ff9a2e'];for(let i=0;i<(n||60);i++){const e=document.createElement('div');e.style.cssText=`position:fixed;z-index:600;pointer-events:none;width:10px;height:14px;border-radius:2px;background:${cols[rnd(6)]};left:${Math.random()*100}vw;top:-20px`;document.body.appendChild(e);
 const a=e.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:1}],{duration:1400+Math.random()*1400,delay:Math.random()*400,easing:'ease-in'});a.onfinish=()=>e.remove()}}
function shake(el){el.classList.remove('shk');el.offsetWidth;el.classList.add('shk')}
function popEl(el){el.classList.remove('pop');el.offsetWidth;el.classList.add('pop')}
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
// Each puzzle: 3 across words (rows 1,3,5) and 3 down words (cols 1,3,5) of a 5x5 grid with black squares at the even-row/odd-col gaps.
const PZ=[
{a:['BLACK','EARLY','SNEAK'],d:['BLESS','AGREE','KAYAK'],ac:['Color of coal','Not late','Move quietly and secretly'],dc:['___ you! (said after a sneeze)','Say yes: ___ with','Small paddle boat'],t:'Kids'},
{a:['BLOOD','UNION','HONOR'],d:['BRUSH','ONION','DONOR'],ac:['Red liquid in your veins','Coming together as one','Great respect or an award'],dc:['Hair-fixing tool','Veggie that makes you cry','Gives blood to help others'],t:'Body'},
{a:['CROWD','TOTAL','HURRY'],d:['CATCH','OTTER','DELAY'],ac:['Large group of people','Sum of everything','Move fast!'],dc:['Grab a ball','Playful river animal','Make something late'],t:'Everyday'},
{a:['BOOTH','STEAM','CHAIN'],d:['BASIC','OPERA','HUMAN'],ac:['Photo ___ at a fair','Hot water vapor','Metal links in a necklace'],dc:['Simple, not fancy','Sung play with a diva','A person, not a robot'],t:'Everyday'},
{a:['DEALT','EIGHT','MORAL'],d:['DREAM','ANGER','TOTAL'],ac:['Handed out cards','Number after seven','Lesson at the end of a fable'],dc:['Imagine while asleep','Feeling mad','Sum of all'],t:'Mixed'},
{a:['TIGHT','KNIFE','NIGHT'],d:['TOKEN','GOING','TREAT'],ac:['Snug, not loose','It cuts bread','Dark time after dinner'],dc:['Arcade coin','Leaving: coming and ___','Candy on Halloween'],t:'Mixed'},
{a:['TOWEL','SHEET','ENTER'],d:['TASTE','WHEAT','LATER'],ac:['Dry off with this','Bed linen','Come in'],dc:['Sweet or sour sense','Grain used for bread','Not now, ___'],t:'Home'},
{a:['TOUGH','ALTER','TEACH'],d:['TOAST','ULTRA','HARSH'],ac:['Strong and hard to break','Change a little','Help someone learn'],dc:['Crunchy breakfast bread','Super-duper (prefix)','Rough and unkind'],t:'Words'},
{a:['VIVID','RAPID','SERVE'],d:['VIRUS','VAPOR','DODGE'],ac:['Bright and clear','Very fast','Bring food to a table'],dc:['Tiny germ that causes colds','Steam or mist','Duck out of the way']}];
const ROUND=3;let best=lsGet('best',0);
let order,pi,sol,usr,sel,dir,clues,total,starSum,helps,t0,tt,running,busy,cells=[],wrong=[];
function setup(p){sol=[];usr=[];for(let r=0;r<5;r++){sol.push([]);usr.push([]);for(let c=0;c<5;c++){let ch='#';if(r%2===0)ch=p.a[r/2][c];else if(c%2===0)ch=p.d[c/2][r];sol[r].push(ch);usr[r].push('')}}
 clues=[];[0,1,2].forEach(i=>clues.push({d:'A',i,n:[1,4,5][i],r:i*2,c:0,t:p.ac[i]}));[0,1,2].forEach(i=>clues.push({d:'D',i,n:[1,2,3][i],r:0,c:i*2,t:p.dc[i]}))}
function wordCells(cl){const o=[];for(let k=0;k<5;k++)o.push(cl.d==='A'?[cl.r,k]:[k,cl.c]);return o}
function curClue(){return clues.find(x=>x.d===dir&&(dir==='A'?x.r===sel[0]:x.c===sel[1]))}
function build(){const g=$('grid');g.innerHTML='';cells=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++){const e=document.createElement('div');e.className='c'+(sol[r][c]==='#'?' k':'');
 const n=clues.find(x=>x.r===r&&x.c===c);if(n&&sol[r][c]!=='#'){const i=document.createElement('i');i.textContent=clues.filter(x=>x.r===r&&x.c===c)[0].n;e.appendChild(i)}
 const s=document.createElement('span');e.appendChild(s);if(sol[r][c]!=='#')e.onpointerdown=ev=>{ev.preventDefault();tap(r,c)};g.appendChild(e);cells.push(e)}}
function tap(r,c){if(busy||!running)return;const both=r%2===0&&c%2===0;if(sel&&sel[0]===r&&sel[1]===c&&both)dir=dir==='A'?'D':'A';else{dir=both?(sel&&dir):(r%2===0?'A':'D');if(!dir)dir='A'}sel=[r,c];sfx.tap();render()}
function render(){const wc=sel&&curClue()?wordCells(curClue()).map(x=>x[0]*5+x[1]):[];const okSet=new Set();
 clues.forEach(cl=>{if(wordCells(cl).every(([r,c])=>usr[r][c]===sol[r][c]))wordCells(cl).forEach(([r,c])=>okSet.add(r*5+c))});
 cells.forEach((e,k)=>{const r=Math.floor(k/5),c=k%5;if(sol[r][c]==='#')return;e.lastChild.textContent=usr[r][c];
  e.className='c'+(sel&&sel[0]===r&&sel[1]===c?' s':wc.includes(k)?' w':'')+(okSet.has(k)?' ok':'')+(wrong.includes(k)?' x':'')});
 const cl=sel&&curClue();$('ct').textContent=cl?cl.n+(cl.d==='A'?' Across':' Down')+': '+cl.t:'Tap a square';$('pP').textContent='🧩 '+(pi+1)+'/'+ROUND;$('pS').textContent='⭐ '+total}
function type(ch){if(busy||!running||!sel)return;const cl=curClue();if(!cl)return;const wc=wordCells(cl);usr[sel[0]][sel[1]]=ch;wrong=[];sfx.tap();popEl(cells[sel[0]*5+sel[1]]);
 const i=wc.findIndex(x=>x[0]===sel[0]&&x[1]===sel[1]);if(i<4)sel=wc[i+1];render();check()}
function back(){if(busy||!running||!sel)return;const cl=curClue();const wc=wordCells(cl),i=wc.findIndex(x=>x[0]===sel[0]&&x[1]===sel[1]);wrong=[];
 if(usr[sel[0]][sel[1]]==='' && i>0)sel=wc[i-1];usr[sel[0]][sel[1]]='';sfx.tap();render()}
function check(){for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(sol[r][c]!=='#'&&usr[r][c]!==sol[r][c])return;solved()}
function solved(){busy=true;render();const secs=Math.floor(tt),pts=Math.max(100,1000-secs*4-penalty);total+=pts;
 starSum+=(helps===0&&secs<100)?3:(helps<=2&&secs<170)?2:1;$('pS').textContent='⭐ '+total;sfx.win();confetti(40);const r=$('grid').getBoundingClientRect();floatText(r.left+r.width/2,r.top+r.height/2,'Solved! +'+pts,'#ffd84a');burst(r.left+r.width/2,r.top+r.height/2,24);
 setTimeout(()=>{if(pi>=ROUND-1)finish();else loadP(pi+1)},1800)}
let penalty=0;
$('chk').onclick=()=>{if(busy||!running)return;wrong=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(usr[r][c]&&usr[r][c]!==sol[r][c])wrong.push(r*5+c);penalty+=50;helps++;
 if(wrong.length){sfx.bad();shake($('grid'))}else sfx.ok();render();setTimeout(()=>{wrong=[];if(!busy)render()},1600)};
$('rev').onclick=()=>{if(busy||!running||!sel)return;usr[sel[0]][sel[1]]=sol[sel[0]][sel[1]];penalty+=100;helps++;sfx.ok();wrong=[];const cl=curClue(),wc=wordCells(cl),i=wc.findIndex(x=>x[0]===sel[0]&&x[1]===sel[1]);if(i<4)sel=wc[i+1];render();check()};
function nav(d){if(busy||!running)return;const cl=curClue();let i=clues.indexOf(cl);i=(i+d+6)%6;const n=clues[i];dir=n.d;sel=[n.r,n.c];sfx.tap();render()}
$('pv').onclick=()=>nav(-1);$('nx').onclick=()=>nav(1);
['QWERTYUIOP','ASDFGHJKL','ZXCVBNM⌫'].forEach(r=>{const d=document.createElement('div');d.className='kr';for(const ch of r){const b=document.createElement('button');b.className='kk'+(ch==='⌫'?' d':'');b.textContent=ch;b.onpointerdown=e=>{e.preventDefault();ch==='⌫'?back():type(ch)};d.appendChild(b)}$('kb').appendChild(d)});
addEventListener('keydown',e=>{if(!running||busy)return;if(/^[a-z]$/i.test(e.key))type(e.key.toUpperCase());else if(e.key==='Backspace')back();else if(e.key==='Tab'){e.preventDefault();nav(e.shiftKey?-1:1)}});
function loadP(i){pi=i;setup(PZ[order[i]]);dir='A';sel=[0,0];helps=0;penalty=0;wrong=[];busy=false;t0=performance.now();tt=0;build();render()}
function newGame(){order=shuffle(PZ.map((x,i)=>i));total=0;starSum=0;running=true;loadP(0)}
function finish(){running=false;const st=Math.max(1,Math.min(3,Math.round(starSum/ROUND))),nb=total>best;if(nb){best=total;lsSet('best',best)}sfx.win();
 overlay({e:st===3?'🏆':'📰',t:'Crossword Cracked!',p:'Score <b>'+total+'</b><br>'+(nb?'🌟 New best!':'Best: '+best),s:st,btn:'Play Again',go:newGame})}
function fit(){const g=$('game'),W=g.clientWidth-16,H=g.clientHeight-10,land=g.clientWidth>g.clientHeight*1.3;const S=land?Math.min(H-14,W*.5):Math.min(W,H-250,420);$('grid').style.setProperty('--S',Math.max(170,Math.floor(S))+'px')}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
function loop(){if(running&&!busy){tt=(performance.now()-t0)/1000;const t=Math.floor(tt);$('pT').textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}requestAnimationFrame(loop)}
order=shuffle(PZ.map((x,i)=>i));total=0;running=false;busy=true;pi=0;setup(PZ[order[0]]);sel=null;dir='A';build();render();fit();loop();
overlay({e:'📰',t:'Mini Crossword',p:'Tap a square, read the clue, type the letters. Tap a crossing square again to switch Across/Down. 3 mini puzzles per round - go fast for more points!<br>Best: '+best,btn:'Start!',go:newGame});

</script></body></html>
