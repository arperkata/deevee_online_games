<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Hangman</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;background:linear-gradient(#27a2e8,#bdeafc) fixed;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center}
.home{position:fixed;left:10px;top:10px;z-index:999;background:#f08a12;color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none;font-weight:bold;box-shadow:0 3px 0 #a85d00;text-shadow:none}
#mute{position:fixed;right:10px;top:8px;z-index:999;font-size:22px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:0 3px 0 #1b4f86;cursor:pointer}
.btn{font:inherit;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:16px;padding:10px 22px;min-height:44px;box-shadow:0 5px 0 #1c701c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#top{padding:52px 8px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}


.pill{background:linear-gradient(#3b86e0,#1b4f86);border:2px solid #fff;border-radius:999px;padding:2px clamp(8px,2.6vw,14px);font-weight:bold;font-size:clamp(14px,4vw,20px);box-shadow:0 3px 0 #0f2f57;text-shadow:0 2px 0 #0f2f57;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(15,47,87,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:48px 12px 12px;touch-action:manipulation}
.card{background:linear-gradient(#fff,#e3f3ff);color:#1b4f86;text-shadow:none;border:5px solid #ffd84a;border-radius:28px;box-shadow:0 10px 0 #0f2f57,0 20px 40px rgba(0,0,0,.35);padding:clamp(14px,4vmin,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vmin,14px);text-align:center;width:min(94vw,520px);max-height:calc(100vh - 60px);overflow-y:auto;animation:cardin .4s cubic-bezier(.2,1.6,.4,1)}
.card h1{margin:0;font-size:clamp(26px,7.5vmin,44px);color:#e8590c;text-shadow:0 3px 0 #ffd84a}
.card p{margin:0;font-size:clamp(15px,3.6vmin,20px);line-height:1.35;font-weight:bold}
.card .btn{width:100%}
.stars{font-size:clamp(28px,8vmin,44px);letter-spacing:4px}.stars:empty{display:none}
.btn{border:3px solid #fff}
.btn.o{background:linear-gradient(#ffb347,#f08a12);box-shadow:0 5px 0 #a85d00;text-shadow:0 2px 0 #a85d00}.btn.o:active{box-shadow:0 1px 0 #a85d00}
.btn.r{background:linear-gradient(#ff8a8a,#d63030);box-shadow:0 5px 0 #8f1c1c;text-shadow:0 2px 0 #8f1c1c}.btn.r:active{box-shadow:0 1px 0 #8f1c1c}
.btn.p{background:linear-gradient(#c59cff,#7b3fe0);box-shadow:0 5px 0 #4a1fa0;text-shadow:0 2px 0 #4a1fa0}.btn.p:active{box-shadow:0 1px 0 #4a1fa0}
.btn.b{background:linear-gradient(#5fb8ff,#2a7fe0);box-shadow:0 5px 0 #174f95;text-shadow:0 2px 0 #174f95}.btn.b:active{box-shadow:0 1px 0 #174f95}
@keyframes cardin{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hide{display:none!important}
@media (max-height:480px){.ov{padding:8px 12px}.card{flex-direction:row;flex-wrap:wrap;justify-content:center;max-height:calc(100vh - 16px);width:min(94vw,640px)}.card h1,.card p,.stars{flex:1 1 100%}.card .btn{width:auto;flex:1 1 auto;padding:8px 14px;font-size:16px}html,body{overflow-y:auto}}
#game{display:flex;flex-direction:column;align-items:center;width:100%;flex:1;min-height:0}
#left{display:flex;justify-content:center;width:100%}
#right{display:flex;flex-direction:column;align-items:center;width:100%;flex:1;min-height:0}
#cv{width:min(300px,70vw,30vh);aspect-ratio:300/260;margin-top:6px;background:#eaf7ff;border:4px solid #fff;border-radius:22px;box-shadow:0 6px 0 #0f2f57}
#cv.shk{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#cat{font-size:clamp(14px,4vw,20px);font-weight:bold;margin:6px 0 2px;background:#1b4f86;border:2px solid #fff;border-radius:999px;padding:2px 14px;box-shadow:0 3px 0 #0f2f57}
#word{display:flex;gap:clamp(3px,1vw,8px);justify-content:center;flex-wrap:wrap;padding:0 8px;margin:8px 0 4px}
.L{width:clamp(26px,min(8vw,6vh),48px);height:clamp(34px,min(11vw,8vh),60px);background:#fff;color:#1b4f86;text-shadow:none;border-radius:10px;border-bottom:5px solid #f08a12;box-shadow:0 4px 0 #0f2f57;font-size:clamp(20px,min(7vw,5.5vh),38px);font-weight:bold;display:flex;align-items:center;justify-content:center}
.L.sp{border-color:transparent}.L.miss{color:#d63030}
#msg{height:28px;font-size:22px;font-weight:bold}
#kb{margin-top:auto;margin-bottom:max(8px,1vh);display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;padding:0 4px}
.row{display:flex;gap:clamp(3px,.9vw,6px);justify-content:center;width:100%}
.k{flex:1;max-width:clamp(34px,5vw,54px);min-width:0;height:clamp(36px,7vh,54px);font:inherit;font-size:clamp(16px,4.6vw,24px);font-weight:bold;background:linear-gradient(#fff,#cfe6ff);color:#1b4f86;text-shadow:none;border:2px solid #fff;border-radius:10px;box-shadow:0 4px 0 #3f78b4;cursor:pointer;padding:0}
.k:active{transform:translateY(3px);box-shadow:0 1px 0 #3f78b4}
.k.ok{background:linear-gradient(#7be07b,#2ea32e);color:#fff;box-shadow:0 4px 0 #1c701c}.k.no{background:linear-gradient(#ff8a8a,#d63030);color:#fff;box-shadow:0 4px 0 #8f1c1c}.k:disabled{pointer-events:none}
@media (max-height:480px) and (orientation:landscape){#top{padding-top:6px}#game{flex-direction:row;align-items:center;justify-content:center;gap:16px;padding:0 10px}#left{width:auto;flex:none}#cv{width:min(34vw,56vh);margin-top:0}#right{width:min(56vw,460px);flex:none}#kb{margin-top:0}#msg{height:22px;font-size:18px}.k{height:clamp(32px,10vh,42px)}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute">🔊</button>
<div id="top"><div class="pill">⭐ <b id="sc">0</b></div><div class="pill">🏆 <b id="bs">0</b></div><div class="pill">🔥 <b id="st">0</b></div><div class="pill">❤️ <b id="lv">7</b></div></div>
<div id="game"><div id="left"><canvas id="cv" width="600" height="520"></canvas></div><div id="right"><div id="cat"></div><div id="word"></div><div id="msg"></div><div id="kb"></div></div></div>
<div class="ov" id="ov"><div class="card"><h1 id="ovT">🎈 Happy Hangman</h1><div class="stars" id="ovS"></div><p id="ovP">Guess the word before the buddy runs out of tries!<br>Pick a category:</p>
<button class="btn" data-c="animals">🐼 Animals</button><button class="btn o" data-c="food">🍕 Food</button><button class="btn p" data-c="space">🚀 Space</button><button class="btn b" data-c="mix">🎲 Mix</button></div></div>
<script>
const $=s=>document.querySelector(s);
let muted=false;try{muted=localStorage.getItem('hm_mute')==='1'}catch(e){}
let AC;function beep(f,d=.1,t='sine',v=.12){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14,'triangle'),i*90))}
function load(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function burst(x,y,list,n=12){for(let i=0;i<n;i++){const s=document.createElement('div');s.textContent=list[i%list.length];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*16}px;pointer-events:none;z-index:150`;document.body.appendChild(s);const a=Math.random()*6.28,d=40+Math.random()*80;s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+30}px)) scale(.3)`,opacity:0}],{duration:600+Math.random()*300,easing:'ease-out'}).onfinish=()=>s.remove()}}
$('#mute').textContent=muted?'🔇':'🔊';
$('#mute').onclick=()=>{muted=!muted;save('hm_mute',muted?1:0);$('#mute').textContent=muted?'🔇':'🔊'};
const CATS={animals:'ELEPHANT GIRAFFE PENGUIN DOLPHIN KANGAROO TIGER ZEBRA PANDA KOALA MONKEY RABBIT TURTLE OCTOPUS PARROT HAMSTER LION CAMEL OTTER FALCON BUTTERFLY'.split(' '),
food:'PIZZA BANANA COOKIE PANCAKE SPAGHETTI BURGER CARROT CHEESE POPCORN WAFFLE NOODLES MANGO PEANUT STRAWBERRY SANDWICH CUPCAKE PRETZEL TOMATO CEREAL YOGURT'.split(' '),
space:'PLANET ROCKET GALAXY COMET ASTRONAUT SATURN JUPITER METEOR ORBIT NEBULA ECLIPSE MARS VENUS NEPTUNE ALIEN TELESCOPE GRAVITY COSMOS CRATER STARDUST'.split(' ')};
const EM={animals:'🐼',food:'🍕',space:'🚀'};
const MAX=7;
let cat,pool,word,wcat,guessed,wrong,score,streak,best,over,busy;
const c=$('#cv').getContext('2d');c.setTransform(2,0,0,2,0,0);function shk(){const e=$('#cv');e.classList.remove('shk');void e.offsetWidth;e.classList.add('shk')}
function ln(a,b,x,y){c.beginPath();c.moveTo(a,b);c.lineTo(x,y);c.stroke()}
function draw(n,state){c.clearRect(0,0,300,260);c.lineCap='round';c.lineWidth=7;c.strokeStyle='#7a4a1d';
c.fillStyle='#7ddc6a';c.beginPath();c.ellipse(150,258,150,28,0,0,6.3);c.fill();
if(n>=1){ln(40,240,170,240);ln(70,240,70,30);ln(70,30,170,30);ln(170,30,170,60)}
c.strokeStyle='#1b4f86';c.lineWidth=6;
if(n>=3)ln(170,122,170,185);if(n>=4)ln(170,140,138,168);if(n>=5)ln(170,140,202,168);if(n>=6)ln(170,185,146,226);if(n>=7)ln(170,185,194,226);
if(n>=2||state==='win'){c.fillStyle='#ffe08a';c.beginPath();c.arc(170,92,31,0,6.3);c.fill();c.stroke();
c.fillStyle='#ff9ab0';c.beginPath();c.arc(150,102,6,0,6.3);c.arc(190,102,6,0,6.3);c.fill();
c.strokeStyle='#1b4f86';c.lineWidth=4;c.fillStyle='#1b4f86';
if(state==='lose'){ln(154,80,164,90);ln(164,80,154,90);ln(176,80,186,90);ln(186,80,176,90);c.beginPath();c.arc(170,112,9,3.6,5.8);c.stroke()}
else{c.beginPath();c.arc(158,86,4,0,6.3);c.arc(182,86,4,0,6.3);c.fill();c.beginPath();c.arc(170,98,state==='win'?14:9,.2,2.94);c.stroke()}}}
function setup(){$('#kb').innerHTML='';['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach(r=>{const d=document.createElement('div');d.className='row';[...r].forEach(ch=>{const b=document.createElement('button');b.className='k';b.textContent=ch;b.dataset.k=ch;b.onclick=()=>guess(ch);d.appendChild(b)});$('#kb').appendChild(d)})}
function startGame(ct){cat=ct;score=0;streak=0;over=false;best=load('hm_best');upd();newWord();$('#ov').classList.add('hide')}
function newWord(){const list=cat==='mix'?[].concat(CATS.animals,CATS.food,CATS.space):CATS[cat];let w;do{w=list[Math.floor(Math.random()*list.length)]}while(w===word&&list.length>1);word=w;wcat=cat==='mix'?Object.keys(CATS).find(k=>CATS[k].includes(w)):cat;guessed=new Set();wrong=0;busy=false;$('#msg').textContent='';setup();show();draw(0)}
function upd(){$('#sc').textContent=score;$('#bs').textContent=best;$('#st').textContent=streak;$('#lv').textContent=MAX-wrong}
function show(){$('#cat').textContent=EM[wcat]+' '+wcat.toUpperCase()+' ('+word.length+' letters)';const w=$('#word');w.innerHTML='';[...word].forEach(ch=>{const d=document.createElement('div');d.className='L';d.textContent=guessed.has(ch)?ch:'';w.appendChild(d)});upd()}
function guess(ch){if(over||busy||guessed.has(ch))return;guessed.add(ch);const k=document.querySelector('.k[data-k="'+ch+'"]');k.disabled=true;
if(word.includes(ch)){k.classList.add('ok');beep(600+Math.random()*200,.1,'triangle');show();if([...word].every(x=>guessed.has(x)))win()}
else{k.classList.add('no');wrong++;beep(180,.2,'sawtooth');draw(wrong);shk();upd();if(wrong>=MAX)lose()}}
function win(){busy=true;const pts=20+(MAX-wrong)*5+streak*5;score+=pts;streak++;if(score>best){best=score;save('hm_best',best)}draw(wrong,'win');jingle([523,659,784,1047]);$('#msg').textContent='🎉 +'+pts+'!';const r=$('#cv').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,['⭐','🎈','✨','🎉']);upd();setTimeout(()=>{if(!over)newWord()},1400)}
function lose(){over=true;draw(MAX,'lose');streak=0;jingle([330,262,196]);document.querySelectorAll('.k').forEach(k=>k.disabled=true);const w=$('#word');w.innerHTML='';[...word].forEach(ch=>{const d=document.createElement('div');d.className='L miss';d.textContent=ch;w.appendChild(d)});
setTimeout(()=>{const nb=score>=best&&score>0;$('#ovS').textContent=(nb?'⭐⭐⭐':score>0&&score>=best*.6?'⭐⭐':score>0?'⭐':'💪');if(nb)burst(innerWidth/2,innerHeight/3,['⭐','🎉','✨','🏆'],26);$('#ovT').textContent=nb?'🏆 New Best!':'😵 Oh no!';$('#ovP').innerHTML='The word was <b>'+word+'</b><br>Score: <b>'+score+'</b> &nbsp; Best: <b>'+best+'</b><br>Play again?';$('#ov').classList.remove('hide')},1400)}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>startGame(b.dataset.c));
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[a-z]$/i.test(e.key)&&!$('#ov').classList.contains('hide')===false)guess(e.key.toUpperCase())});
setup();draw(0);word='';
</script></body></html>
