<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Tower</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:linear-gradient(#27a2e8,#bdeafc) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border:3px solid #1b4f86;border-radius:50%;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation;padding:0}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none}
.btn{font:inherit;font-size:clamp(24px,6vw,32px);font-weight:700;min-height:52px;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;padding:12px 44px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;text-align:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 35%,#2a6fcf 0,#123a7c 55%,#0a1f4d 100%)}
#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;font-size:clamp(16px,4.5vw,22px);line-height:1.4;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
#go{animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (max-height:430px){#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}.btn{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="ov"><h1 id="t">🏗️ Stack Tower</h1><p id="m">Tap to drop the sliding block. Overhang gets cut off. Land it perfectly for bonus points!</p><button class="btn" id="go">▶ Play</button></div>
<script>
const $=id=>document.getElementById(id);
let AC,muted=false;
try{muted=localStorage.getItem('stbest_m')=='1'}catch(e){}
function beep(f,d=.1,t='sine',v=.15){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function best(v){try{if(v!==undefined)localStorage.setItem('stbest',v);return +localStorage.getItem('stbest')||0}catch(e){return 0}}
addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';try{localStorage.setItem('stbest_m',muted?1:0)}catch(x){}this.blur();beep(660,.08)};
const cv=$('c'),x=cv.getContext('2d');
if(!x.roundRect)x.roundRect=function(a,b,c,d){this.rect(a,b,c,d)};
const W=360,H=640,BH=30,BASE=560;
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
function fit(){const vw=innerWidth,vh=innerHeight;let top=64,s=Math.min(vw/W,(vh-top-4)/H);const s2=Math.min(vw/W,(vh-8)/H);if((vw-W*s2)/2>=128){top=4;s=s2}cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top-4)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let blocks=[{x:80,w:200}],cur={x:0,w:200,dir:1},cam=0,camT=0,score=0,combo=0,over=true,deb=[],parts=[],texts=[],bestS=best(),startBest=bestS,newRec=false,last=performance.now(),shake=0,flash=0,bounce=0;
const clouds=Array.from({length:6},(_,i)=>({x:Math.random()*W,y:i*130,s:.6+Math.random()*.8}));
const stars=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.8}));
const hue=i=>(i*14+200)%360;
const mixc=(a,b,k)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';
function newCur(){const w=blocks[blocks.length-1].w;return{x:-w*.4,w,dir:1}}
function start(){blocks=[{x:80,w:200}];cur=newCur();cam=0;camT=0;score=0;combo=0;deb=[];parts=[];texts=[];shake=0;flash=0;bounce=0;startBest=bestS;newRec=false;over=false;$('ov').classList.add('hide')}
$('go').onclick=function(){this.blur();start()};
const ty=i=>BASE-(i+1)*BH+cam;
function sparks(px,py,n,c){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*9,vy:(Math.random()-.9)*7,l:38,c:c[i%c.length]})}
function drop(){if(over)return;const n=blocks.length,p=blocks[n-1],d=cur.x-p.x,ov=cur.w-Math.abs(d);
if(ov<=0){deb.push({x:cur.x,w:cur.w,top:BASE-(n+1)*BH,dy:0,vy:0,i:n});over=true;shake=12;beep(120,.4,'sawtooth');setTimeout(finish,900);return}
let nb;
if(Math.abs(d)<=5){combo++;nb={x:p.x,w:Math.min(200,cur.w+(combo>=3?6:0))};const pts=10+combo*5;score+=pts;texts.push({x:W/2,y:ty(n)-10,t:'PERFECT! +'+pts,l:55,c:'#ffe14d'});sparks(nb.x+nb.w/2,ty(n),22,['#fff','#ffe14d','#7ff']);flash=.5;bounce=1;beep(380+Math.min(combo,12)*55,.15,'triangle',.25)}
else{combo=0;nb={x:Math.max(cur.x,p.x),w:ov};shake=4;bounce=.6;
if(d>0)deb.push({x:p.x+p.w,w:d,top:BASE-(n+1)*BH,dy:0,vy:0,i:n});else deb.push({x:cur.x,w:-d,top:BASE-(n+1)*BH,dy:0,vy:0,i:n});
score+=1;beep(260+n*8,.1,'sine',.2)}
blocks.push(nb);cur=newCur();const m=blocks.length;camT=Math.max(0,(m+1)*BH-310);
if(score>bestS){bestS=score;best(bestS)}}
function finish(){newRec=score>0&&score>startBest;const b=blocks.length-1;
$('t').textContent=newRec?'New Record! 🏆':'💥 Tower fell!';
$('m').innerHTML='<span class="stars">'+(score>=250?'⭐⭐⭐':score>=100?'⭐⭐☆':score>=25?'⭐☆☆':'☆☆☆')+'</span><span class="big">'+score+'</span>'+b+' blocks · Best '+bestS+(newRec?'<br><span class="nb">🎉 New best!</span>':'');
$('go').textContent='▶ Play Again';$('ov').classList.remove('hide')}
function drawBlock(bx,top,w,i){const h=hue(i);x.save();x.globalAlpha=1;const g=x.createLinearGradient(0,top,0,top+BH);g.addColorStop(0,'hsl('+h+',95%,68%)');g.addColorStop(1,'hsl('+(h+20)+',90%,45%)');x.fillStyle=g;x.beginPath();x.roundRect(bx,top,w,BH,6);x.fill();x.fillStyle='#fff';x.globalAlpha=.4;x.beginPath();x.roundRect(bx+3,top+3,Math.max(2,w-6),7,3);x.fill();x.globalAlpha=1;x.lineWidth=3;x.strokeStyle='hsl('+(h+20)+',90%,28%)';x.beginPath();x.roundRect(bx+1,top+1,Math.max(1,w-2),BH-2,6);x.stroke();x.restore()}
function pill(px,py,pw,ph){x.save();x.fillStyle='#14367a';x.beginPath();x.roundRect(px,py,pw,ph,ph/2);x.fill();x.lineWidth=3;x.strokeStyle='#5cc8ff';x.stroke();x.restore()}
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button,a,#ov'))return;e.preventDefault();drop()});
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter'){e.preventDefault();if(!$('ov').classList.contains('hide')){if(!e.repeat)start()}else drop()}});
function loop(t){const dt=Math.min(2.5,(t-last)/16.67||1);last=t;
if(!over){const sp=Math.min(7,2.4+blocks.length*.08)*dt,lo=-cur.w/2,hi=W-cur.w/2;cur.x+=cur.dir*sp;if(cur.x>=hi){cur.x=hi;cur.dir=-1}else if(cur.x<=lo){cur.x=lo;cur.dir=1}}
cam+=(camT-cam)*Math.min(1,.08*dt);shake=Math.max(0,shake-.6*dt);flash=Math.max(0,flash-.03*dt);bounce=Math.max(0,bounce-.06*dt);
x.setTransform(DPR,0,0,DPR,0,0);x.globalAlpha=1;x.shadowBlur=0;
const k=Math.min(1,cam/1800),sk=x.createLinearGradient(0,0,0,H);sk.addColorStop(0,mixc([27,143,224],[10,20,60],k));sk.addColorStop(1,mixc([190,236,255],[60,110,200],k));x.fillStyle=sk;x.fillRect(0,0,W,H);
if(k>.15){x.fillStyle='#fff';for(const s of stars)x.fillRect(s.x,s.y,s.r,s.r)}
x.save();if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
x.fillStyle='#fff';for(const c of clouds){const cy=((c.y+cam*.3*c.s)%(H+80))-40;x.beginPath();x.ellipse(c.x,cy,50*c.s,18*c.s,0,0,7);x.ellipse(c.x+25*c.s,cy-8*c.s,30*c.s,16*c.s,0,0,7);x.fill()}
if(cam<H){x.fillStyle='#4cc94c';x.fillRect(-10,BASE+cam,W+20,H);x.fillStyle='#2f9e3f';x.fillRect(-10,BASE+cam,W+20,8);x.fillStyle='#8a5a2b';x.fillRect(-10,BASE+cam+22,W+20,H)}
blocks.forEach((b,i)=>{const y=ty(i);if(y>-BH&&y<H)drawBlock(b.x,y,b.w,i)});
if(!over)drawBlock(cur.x,ty(blocks.length),cur.w,blocks.length);
deb=deb.filter(d=>d.top+d.dy+cam<H+50);for(const d of deb){d.dy+=d.vy*dt;d.vy+=.6*dt;drawBlock(d.x,d.top+d.dy+cam,d.w,d.i)}
parts=parts.filter(p=>p.l>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.3*dt;p.l-=dt;x.globalAlpha=Math.max(0,Math.min(1,p.l/15));x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)}x.globalAlpha=1;
x.restore();
if(flash>0){x.save();x.globalAlpha=flash;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.restore()}
x.textAlign='center';x.lineJoin='round';x.lineWidth=8;x.strokeStyle='#1b4f86';x.fillStyle='#fff';x.font='bold 76px Fredoka,Trebuchet MS,sans-serif';const sc=1+bounce*.18;x.save();x.translate(W/2,96);x.scale(sc,sc);x.strokeText(blocks.length-1,0,0);x.fillText(blocks.length-1,0,0);x.restore();
pill(8,8,128,38);pill(W-120,8,112,38);x.font='bold 20px Fredoka,Trebuchet MS,sans-serif';x.lineWidth=4;x.textAlign='left';x.strokeText('Score '+score,18,35);x.fillText('Score '+score,18,35);x.textAlign='right';x.strokeText('Best '+bestS,W-16,35);x.fillText('Best '+bestS,W-16,35);
texts=texts.filter(q=>q.l>0);x.textAlign='center';x.font='bold 28px Fredoka,Trebuchet MS,sans-serif';x.lineWidth=6;for(const q of texts){q.y-=.8*dt;q.l-=dt;x.globalAlpha=Math.min(1,q.l/20);x.strokeText(q.t,q.x,q.y);x.fillStyle=q.c||'#fff';x.fillText(q.t,q.x,q.y)}x.globalAlpha=1;x.fillStyle='#fff';
requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
