<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroids</title>
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:radial-gradient(circle at 50% 30%,#2b3a8f,#0f1747 70%,#070b26) fixed;font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:#fff;text-shadow:0 2px 0 #1b4f86;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.home{position:fixed;left:10px;top:10px;z-index:1000;display:flex;align-items:center;min-height:44px;background:#f08a12;color:#fff;text-decoration:none;padding:0 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #a85d00;text-shadow:none;touch-action:manipulation}
#mute{position:fixed;right:10px;top:10px;z-index:100;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1b4f86;font-size:22px;cursor:pointer;box-shadow:0 3px 0 #1b4f86;touch-action:manipulation;padding:0}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;box-shadow:0 0 0 4px #5cc8ff,0 8px 0 4px #0b2a5c;touch-action:none;max-width:100vw}

#ov.hide{display:none}
#ov h1{margin:0;color:#ffe14d;text-shadow:0 4px 0 #1b4f86,0 0 18px #ff9a3d;font-size:clamp(34px,10vw,64px);line-height:1.05}
#ov p{margin:0;font-size:clamp(16px,4.5vw,22px);line-height:1.4;background:#14367a;border:3px solid #5cc8ff;border-radius:20px;padding:12px 22px;max-width:min(92vw,440px);color:#fff;font-weight:600;text-shadow:0 2px 0 #0b2a5c}
#ov p b{color:#ffe14d}
.big{display:block;font-size:2em;font-weight:700;color:#ffe14d;line-height:1.1}
.stars{display:block;font-size:2.2em;letter-spacing:4px;line-height:1.2}
.nb{display:inline-block;background:#ff9a3d;color:#fff;border-radius:999px;padding:2px 14px;margin-top:4px;font-weight:700}
.btn{font:inherit;font-weight:700;color:#fff;text-shadow:0 2px 0 #1c701c;background:linear-gradient(#5fd35f,#2ea32e);border:0;border-radius:18px;box-shadow:0 5px 0 #1c701c;cursor:pointer;touch-action:manipulation}
.btn:active,.btn.on{transform:translateY(4px);box-shadow:0 1px 0 #1c701c}
#go{font-size:clamp(24px,6vw,32px);min-height:52px;padding:12px 44px;animation:pulse 1.1s ease-in-out infinite}
#go:active{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
#pad{position:fixed;left:0;right:0;bottom:8px;display:none;justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:40;pointer-events:none}
@media (pointer:coarse),(hover:none){#pad{display:flex}}
#pad .pb{pointer-events:auto;width:68px;height:68px;font-size:30px;padding:0;margin:0;touch-action:none}
#pad .pb.f{width:92px;background:linear-gradient(#ff9a5c,#e8451e);box-shadow:0 5px 0 #8f200d;text-shadow:0 2px 0 #8f200d}
#pad .pb.f.on,#pad .pb.f:active{box-shadow:0 1px 0 #8f200d}
#pad .pb.t{background:linear-gradient(#ffd84d,#f0a30a);box-shadow:0 5px 0 #a86c00;text-shadow:0 2px 0 #a86c00}
#pad .pb.t.on,#pad .pb.t:active{box-shadow:0 1px 0 #a86c00}
#pl,#pr{display:flex;gap:10px;align-items:flex-end}
.dp{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:6px}
.dp .u{grid-area:1/2}.dp .l{grid-area:2/1}.dp .d{grid-area:2/2}.dp .r{grid-area:2/3}
@media (orientation:landscape) and (max-height:500px){
#pad{bottom:auto;top:0;height:100%;padding:0}
#pl,#pr{position:fixed;top:50%;transform:translateY(-50%);flex-wrap:wrap;justify-content:center}
#pl{left:8px;width:160px}#pr{right:8px;width:160px}
#pad .pb{width:56px;height:56px;font-size:26px}#pad .pb.f{width:76px}
.dp{grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:4px}
#ov{gap:6px;padding:8px}#ov h1{font-size:28px}#ov p{font-size:14px;padding:6px 14px}.big{font-size:1.5em}.stars{font-size:1.6em}#go{font-size:20px;padding:6px 28px;min-height:44px}}
</style></head><body>
<a class="home" href="index.html">⌂ Home</a><button id="mute" aria-label="Mute">🔊</button>
<canvas id="c"></canvas>
<div id="pad"><div id="pl"><button class="btn pb" data-k="left">◀</button><button class="btn pb" data-k="right">▶</button></div><div id="pr"><button class="btn pb t" data-k="up">🔥</button><button class="btn pb f" data-k="fire">💥</button></div></div>
<div id="ov"><h1 id="t"></h1><p id="m"></p><button class="btn" id="go">Play</button></div>
<script>
/* ===== DUO helper v1 (shared, pasted inline into each game as its own <script> BEFORE the game script) ===== */
const Duo=(()=>{
const KEY='duo_names',S={mode:null,names:['Player 1','Player 2'],scores:[null,null],turn:0,hw:true,cpuR:[0,100],lvl:'easy',start:null,game:'',unit:''};
let pill=null,ac=null;
function css(){if(document.getElementById('duoCss'))return;const s=document.createElement('style');s.id='duoCss';s.textContent=
'.duoOv{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(6,30,70,.88);padding:14px;font-family:"Fredoka","Trebuchet MS","Comic Sans MS",sans-serif}'+
'.duoCard{background:linear-gradient(#2f8cff,#0b4fb3);border:5px solid #ffe14a;border-radius:26px;padding:18px 20px;max-width:min(92vw,420px);width:100%;color:#fff;text-align:center;box-shadow:0 8px 0 #06244d;animation:duoPop .35s}'+
'@keyframes duoPop{0%{transform:scale(.6)}70%{transform:scale(1.05)}}'+
'.duoCard h2{margin:0 0 8px;font-size:clamp(22px,6vw,32px);text-shadow:0 3px 0 #0b3a78}.duoCard p{margin:6px 0;font-size:clamp(15px,4vw,19px);font-weight:600}'+
'.duoCard .big{font-size:clamp(34px,10vw,52px);line-height:1.1}'+
'.duoCard input{width:100%;box-sizing:border-box;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid #fff;margin:6px 0;color:#0b3a78;text-align:center}'+
'.duoCard label{display:block;text-align:left;font-weight:700;margin-top:6px;font-size:15px}'+
'.duoB{font:700 clamp(18px,5vw,24px) inherit;font-family:inherit;margin:8px 4px 0;padding:.45em 1.3em;min-height:46px;border:0;border-radius:999px;color:#fff;background:linear-gradient(#5fd35f,#2ea32e);box-shadow:0 5px 0 #1c701c;cursor:pointer;text-shadow:0 2px 0 #1c701c}'+
'.duoB.o{background:linear-gradient(#ffb21f,#f07a0a);box-shadow:0 5px 0 #a9560b;text-shadow:0 2px 0 #a9560b}.duoB.g{background:linear-gradient(#8a9bb5,#5d6f8a);box-shadow:0 5px 0 #3b4a63;text-shadow:none}'+
'.duoB:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}'+
'.duoMenu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 0}.duoMenu .duoB{margin:0}'+
'.duoPill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8000;background:#0b3a78;color:#fff;border:3px solid #ffe14a;border-radius:999px;padding:3px 14px;font:700 clamp(13px,3.6vw,17px) "Fredoka","Trebuchet MS",sans-serif;box-shadow:0 3px 0 #06244d;pointer-events:none;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}';
document.head.appendChild(s)}
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(d||.15));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function modal(html,buttons){css();return new Promise(res=>{const ov=document.createElement('div');ov.className='duoOv';ov.innerHTML='<div class="duoCard">'+html+'<div class="duoMenu"></div></div>';const m=ov.querySelector('.duoMenu');
 buttons.forEach(([label,cls,val])=>{const b=document.createElement('button');b.className='duoB '+(cls||'');b.innerHTML=label;b.onclick=()=>{const out=typeof val==='function'?val(ov):val;ov.remove();res(out)};m.appendChild(b)});
 document.body.appendChild(ov);const i=ov.querySelector('input');if(i){i.focus();i.select()}})}
function saved(){try{const a=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(a))return a}catch(e){}return null}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function clean(v,d){v=(v||'').trim().slice(0,14);return v||d}
const api={
 /* Ask both player names. Resolves to [n1,n2] or null if cancelled. opts.cpu=true asks only P1 name (P2 is "Computer"). opts.t1/t2 = labels */
 askNames(opts){opts=opts||{};const sv=saved()||['',''];
  const html='<div class="big">'+(opts.cpu?'🤖':'👥')+'</div><h2>'+(opts.cpu?'Your name':'Who is playing?')+'</h2>'+
   '<label>'+esc(opts.t1||'Player 1')+'</label><input id="duoN1" maxlength="14" placeholder="Player 1" value="'+esc(sv[0]||'')+'">'+
   (opts.cpu?'':'<label>'+esc(opts.t2||'Player 2')+'</label><input id="duoN2" maxlength="14" placeholder="Player 2" value="'+esc(sv[1]||'')+'">');
  return modal(html,[['▶ Start','',ov=>{const a=clean(ov.querySelector('#duoN1').value,'Player 1');const b=opts.cpu?'🤖 Computer':clean(ov.querySelector('#duoN2')&&ov.querySelector('#duoN2').value,'Player 2');if(!opts.cpu)save([a,b]);else save([a,sv[1]||'']);return [a,b]}],['Cancel','g',null]])},
 /* "Pass the device" screen for hot-seat turns / hidden information. Resolves when tapped. */
 cover(name,msg){beep(660,.12);return modal('<div class="big">🔄</div><h2>Pass to '+esc(name)+'</h2><p>'+esc(msg||'Tap when you are ready')+'</p>',[['I am '+esc(name),'',true]])},
 /* Add "2 Players" and "vs Computer" buttons into an element (start menu/overlay).
    o={game:'snake', start:fn(), hw:true(higher wins)|false(lower wins, e.g. time), cpu:[lo,hi] typical score range for the computer (e.g. [40,160]), unit:' pts', noTwo:false, noCpu:false} */
 addButtons(el,o){css();const wrap=document.createElement('div');wrap.className='duoMenu';
  if(!o.noTwo){const b=document.createElement('button');b.className='duoB o';b.innerHTML='👥 2 Players';b.onclick=async()=>{const n=await api.askNames();if(n)api.begin(Object.assign({},o,{mode:'two',names:n}))};wrap.appendChild(b)}
  if(!o.noCpu&&o.cpu){const b=document.createElement('button');b.className='duoB o';b.innerHTML='🤖 vs Computer';b.onclick=async()=>{const lv=await modal('<div class="big">🤖</div><h2>Computer level</h2>',[['😊 Easy','',  'easy'],['🧠 Hard','o','hard'],['Cancel','g',null]]);if(!lv)return;const n=await api.askNames({cpu:true});if(n)api.begin(Object.assign({},o,{mode:'cpu',names:n,lvl:lv}))};wrap.appendChild(b)}
  el.appendChild(wrap);return wrap},
 begin(o){S.mode=o.mode;S.names=o.names.slice();S.scores=[null,null];S.turn=0;S.hw=o.hw!==false;S.cpuR=o.cpu||[0,100];S.lvl=o.lvl||'easy';S.start=o.start;S.game=o.game||'';S.unit=o.unit||'';S.fmt=o.fmt||null;
  api.pill();if(o.start)o.start()},
 active(){return !!S.mode},
 mode(){return S.mode},
 player(){return S.names[S.turn]},
 names(){return S.names.slice()},
 pill(){css();if(!S.mode){if(pill){pill.remove();pill=null}return}if(!pill){pill=document.createElement('div');pill.className='duoPill';document.body.appendChild(pill)}
  pill.textContent=S.mode==='two'?'👤 '+S.names[S.turn]+'  ('+(S.turn+1)+'/2)':'👤 '+S.names[0]+'  vs  🤖'},
 fmt(v){return S.fmt?S.fmt(v):(Math.round(v*100)/100)+S.unit},
 cpuScore(){const [lo,hi]=S.cpuR,mid=(lo+hi)/2,r=Math.random();let v;
  if(S.hw)v=S.lvl==='easy'?lo+r*(mid-lo):mid+r*(hi-mid);else v=S.lvl==='easy'?mid+r*(hi-mid):lo+r*(mid-lo);return (hi-lo)>20?Math.round(v):Math.round(v*100)/100},
 /* Call when a round ends with the player's score. Returns true if Duo took over (the game must NOT show its own game-over overlay). */
 finish(score){if(!S.mode)return false;const sc=Number(score)||0;
  if(S.mode==='two'){S.scores[S.turn]=sc;
   if(S.turn===0){S.turn=1;api.pill();setTimeout(()=>{modal('<div class="big">✅</div><h2>'+esc(S.names[0])+' scored '+esc(api.fmt(sc))+'</h2><p>Now it is <b>'+esc(S.names[1])+'</b>\'s turn. Beat that!</p>',[['▶ '+esc(S.names[1])+': Go!','',true]]).then(()=>{if(S.start)S.start()})},700);return true}
   const [a,b]=S.scores,aw=S.hw?a>b:a<b,bw=S.hw?b>a:b<a;const win=aw?0:bw?1:-1;
   setTimeout(()=>{beep(880,.2);modal('<div class="big">'+(win<0?'🤝':'🏆')+'</div><h2>'+(win<0?'It is a tie!':esc(S.names[win])+' wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(a))+'</b></p><p>'+esc(S.names[1])+': <b>'+esc(api.fmt(b))+'</b></p>',[['🔁 Rematch','',1],['🏠 Menu','o',0]]).then(r=>{if(r){S.scores=[null,null];S.turn=0;api.pill();if(S.start)S.start()}else api.end(true)})},700);return true}
  /* vs computer */
  const c=api.cpuScore(),win=S.hw?(sc>c?0:sc<c?1:-1):(sc<c?0:sc>c?1:-1);
  setTimeout(()=>{beep(win===0?880:300,.25);modal('<div class="big">'+(win===0?'🏆':win<0?'🤝':'🤖')+'</div><h2>'+(win===0?esc(S.names[0])+' wins!':win<0?'Tie!':'Computer wins!')+'</h2><p>'+esc(S.names[0])+': <b>'+esc(api.fmt(sc))+'</b></p><p>🤖 Computer: <b>'+esc(api.fmt(c))+'</b></p>',[['🔁 Play again','',1],['🏠 Menu','o',0]]).then(r=>{if(r){api.pill();if(S.start)S.start()}else api.end(true)})},700);return true},
 /* Leave duo mode. If reload, the page reloads to the game's normal start menu. */
 end(reload){S.mode=null;api.pill();if(reload)location.reload()}
};
return api})();
/* ===== end DUO ===== */
</script>
<script>
const W=500,H=560,KEY='asteroids.html_best',PADH=84,SIDEW=160;
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
let best=0,muted=false;
try{best=+localStorage.getItem(KEY)||0;muted=localStorage.getItem(KEY+'_m')=='1'}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(KEY,best)}catch(e){}return true}return false}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'_m',muted?1:0)}catch(x){}e.currentTarget.blur();beep(660,.08)};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,audio,{passive:true}));
function beep(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{audio();if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function fit(){const vw=innerWidth,vh=innerHeight,pd=$('pad'),sp=pd&&getComputedStyle(pd).display!='none';
 const land=sp&&matchMedia('(orientation:landscape) and (max-height:500px)').matches;
 const bot=sp&&!land?PADH:0,side=land?SIDEW*2+16:0;let top=60;
 let s=Math.min((vw-side)/W,(vh-top-4-bot)/H);const s2=Math.min((vw-side)/W,(vh-8-bot)/H);
 if(land||(vw-side-W*s2)/2>=130){top=4;s=s2}
 s=Math.max(.2,s);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.top=(top+(vh-top-bot-4)/2)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
let parts=[],pops=[],shake=0;
function burst(x,y,n,cols,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.4,m:.9,c:cols[i%cols.length],r:2+Math.random()*3})}}
function pop(x,y,t,c,s){pops.push({x,y,t,c,s,l:.9})}
function clearFx(){parts=[];pops=[];shake=0}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const q of pops){q.y-=40*dt;q.l-=dt}pops=pops.filter(q=>q.l>0);shake=Math.max(0,shake-dt*30)}
function drawFx(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1;for(const q of pops){g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,q.s||22,'center',q.c)}g.globalAlpha=1}
function txt(t,x,y,s,al,c){g.font='bold '+s+"px Fredoka,'Trebuchet MS',sans-serif";g.textAlign=al||'left';g.textBaseline='alphabetic';g.lineWidth=s/4.5;g.shadowBlur=0;g.strokeStyle='#1b4f86';g.lineJoin='round';g.strokeText(t,x,y);g.fillStyle=c||'#fff';g.fillText(t,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function pill(x,y,w,h,c){g.save();g.globalAlpha=1;g.fillStyle=c||'#14367a';rr(x,y,w,h,h/2);g.fill();g.lineWidth=3;g.strokeStyle='#5cc8ff';g.stroke();g.restore()}
function gloss(x,y,w,h,r,c1,c2){g.save();g.globalAlpha=1;const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;rr(x,y,w,h,r);g.fill();g.globalAlpha=.4;g.fillStyle='#fff';rr(x+3,y+2,Math.max(2,w-6),Math.max(2,h*.38),Math.min(r*.7,h/2));g.fill();g.restore()}
const stars=n=>'<span class="stars">'+'⭐'.repeat(n)+'☆'.repeat(3-n)+'</span>';
function emo(e,x,y,s,base,al){g.save();g.globalAlpha=al==null?1:al;g.shadowBlur=0;g.font=s+"px 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";g.textAlign='center';g.textBaseline=base||'middle';g.fillStyle='#000';g.fillText(e,x,y);g.restore()}
function shakeOn(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.shadowBlur=0;g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
const ovHidden=()=>$('ov').classList.contains('hide');
function hideOv(){$('ov').classList.add('hide')}
function showOv(t,m,b){$('t').textContent=t;$('m').innerHTML=m;$('go').textContent=b;$('ov').classList.remove('hide')}
/* input: keys + pad buttons */
const keys={left:0,right:0,up:0,down:0,fire:0},hooks={press(k){}};
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down',' ':'fire',z:'fire',x:'fire'};
function setKey(k,v){if(v&&!keys[k])hooks.press(k);keys[k]=v?1:0;document.querySelectorAll('[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',!!v))}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName=='INPUT')return;const k=KM[e.key.toLowerCase()];if(k&&ovHidden()){e.preventDefault();if(!e.repeat)setKey(k,1)}});
addEventListener('keyup',e=>{const k=KM[e.key.toLowerCase()];if(k)setKey(k,0)});
addEventListener('blur',()=>{for(const k in keys)setKey(k,0)});
document.querySelectorAll('.pb').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}setKey(k,1)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,0)))});
$('go').onclick=()=>{$('go').blur();startGame()};
addEventListener('keydown',e=>{if(document.querySelector('.duoOv'))return;if(!ovHidden()&&(e.code=='Space'||e.code=='Enter')){e.preventDefault();startGame()}});
/* ---------- GAME ---------- */
const RR=[0,15,27,44],RC=[['#ffd84d','#f0a30a'],['#ff9a5c','#e8451e'],['#ff7be5','#b62fd6'],['#7be57b','#2ea32e']],PT=[0,100,50,20];
const STARS=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,2)}));
let state='ready',score=0,lives=3,wave=1,ship,rocks=[],bul=[],fireT=0,inv=0,combo=0,comboT=0,bannerT=0,respT=0,t=0,flame=0;
function mkRock(x,y,sz,sp){
  const n=rint(9,12),vs=[];for(let i=0;i<n;i++)vs.push(rnd(.75,1.1));
  const a=rnd(0,6.283),v=rnd(30,70)*(1+(4-sz)*.35)*(1+wave*.06);
  return{x,y,sz,r:RR[sz],vx:Math.cos(a)*v*sp,vy:Math.sin(a)*v*sp,a:rnd(0,6.283),w:rnd(-1.2,1.2),vs};
}
function spawnWave(){
  rocks=[];const n=Math.min(9,3+wave);
  for(let i=0;i<n;i++){let x,y;do{x=rnd(0,W);y=rnd(0,H)}while(Math.hypot(x-W/2,y-H/2)<150);rocks.push(mkRock(x,y,3,1))}
}
function resetShip(){ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2};inv=2.2;respT=0}
function startGame(){
  if(ovHidden())return;hideOv();clearFx();score=0;lives=3;wave=1;bul=[];combo=0;comboT=0;bannerT=0;fireT=0;state='play';resetShip();spawnWave();beep(520,.1,'triangle');
}
function wrap(o,m){o.x=(o.x+W+m)%(W+m*2)-m;o.y=(o.y+H+m)%(H+m*2)-m}
function split(r,bx,by){
  score+=PT[r.sz]*Math.min(5,1+combo);combo++;comboT=1.6;
  const m=Math.min(5,combo);pop(r.x,r.y,'+'+PT[r.sz]*Math.min(5,combo)+(m>1?' x'+m:''),'#ffe14d',20);
  burst(r.x,r.y,8+r.sz*4,RC[r.sz],120+r.sz*40);beep(200+(4-r.sz)*120,.12,'sawtooth',.05,-120);shake=Math.max(shake,r.sz*2);
  if(r.sz>1)for(let i=0;i<2;i++){const c=mkRock(r.x,r.y,r.sz-1,1.15);c.vx+=bx*.1;c.vy+=by*.1;rocks.push(c)}
}
function hurt(){
  lives--;shake=16;burst(ship.x,ship.y,40,['#fff','#ffe14d','#ff5c5c','#5cc8ff'],280);beep(150,.6,'sawtooth',.08,-110);combo=0;ship=null;respT=1.4;
  if(lives<=0)over();
}
function over(){
  state='over';if(Duo.active()&&Duo.finish(score))return;
  const nb=saveBest(score);const n=score>=3000?3:score>=1200?2:score>=300?1:0;
  setTimeout(()=>showOv(nb&&score>0?'New Record! 🏆':'Game Over ☄️',stars(n)+'<span class="big">'+score+'</span>Reached wave '+wave+' · Best '+best+(nb&&score>0?'<br><span class="nb">🎉 New best!</span>':''),'Play again'),800);
}
function update(dt){
  t+=dt;fireT=Math.max(0,fireT-dt);comboT-=dt;if(comboT<=0)combo=0;
  if(state!='play')return;
  for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.w*dt;wrap(r,r.r)}
  if(ship){
    ship.a+=(keys.right-keys.left)*4.2*dt;flame=0;
    if(keys.up){ship.vx+=Math.cos(ship.a)*340*dt;ship.vy+=Math.sin(ship.a)*340*dt;flame=1;
      if(Math.random()<.7)parts.push({x:ship.x-Math.cos(ship.a)*14,y:ship.y-Math.sin(ship.a)*14,vx:-Math.cos(ship.a)*120+rnd(-40,40),vy:-Math.sin(ship.a)*120+rnd(-40,40),l:.3,m:.3,c:Math.random()<.5?'#ffe14d':'#ff7a2d',r:3})}
    const dr=Math.pow(.55,dt);ship.vx*=dr;ship.vy*=dr;const sp=Math.hypot(ship.vx,ship.vy);if(sp>380){ship.vx*=380/sp;ship.vy*=380/sp}
    ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship,12);inv=Math.max(0,inv-dt);
    if(keys.fire&&fireT<=0&&bul.length<6){fireT=.2;bul.push({x:ship.x+Math.cos(ship.a)*16,y:ship.y+Math.sin(ship.a)*16,vx:ship.vx+Math.cos(ship.a)*540,vy:ship.vy+Math.sin(ship.a)*540,l:1});beep(760,.07,'square',.04,-400)}
  }else if(state=='play'){
    respT-=dt;if(respT<=0&&!rocks.some(r=>Math.hypot(r.x-W/2,r.y-H/2)<r.r+90))resetShip();
  }
  for(const b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;wrap(b,3)}
  for(const b of bul){
    for(let i=0;i<rocks.length;i++){const r=rocks[i];if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){b.l=0;rocks.splice(i,1);split(r,b.vx,b.vy);break}}
  }
  bul=bul.filter(b=>b.l>0);
  if(ship&&inv<=0)for(let i=0;i<rocks.length;i++){const r=rocks[i];if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r*.9+9){rocks.splice(i,1);split(r,0,0);hurt();break}}
  if(state=='play'&&!rocks.length&&bannerT<=0){bannerT=1.6;score+=200*wave;pop(W/2,H/2-60,'Wave clear! +'+200*wave,'#ffe14d',28);beep(700,.3,'triangle',.07,500)}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0&&state=='play'){wave++;spawnWave();if(wave%3==0&&lives<5)lives++;if(ship)inv=Math.max(inv,1.5)}}
}
function drawRock(r){
  g.save();g.translate(r.x,r.y);g.rotate(r.a);g.beginPath();
  const n=r.vs.length;for(let i=0;i<n;i++){const a=i/n*6.283,d=r.r*r.vs[i];i?g.lineTo(Math.cos(a)*d,Math.sin(a)*d):g.moveTo(Math.cos(a)*d,Math.sin(a)*d)}
  g.closePath();const gr=g.createLinearGradient(0,-r.r,0,r.r);gr.addColorStop(0,RC[r.sz][0]);gr.addColorStop(1,RC[r.sz][1]);
  g.fillStyle=gr;g.fill();g.lineWidth=4;g.lineJoin='round';g.strokeStyle='#3a1c00';g.stroke();
  g.fillStyle='#3a1c00';for(const [cx,cy,cr] of [[-.3,-.2,.18],[.25,.15,.14],[-.05,.4,.1]]){g.beginPath();g.arc(cx*r.r,cy*r.r,cr*r.r,0,6.283);g.fill()}
  g.restore();
}
function drawShip(){
  if(!ship||(inv>0&&Math.floor(inv*10)%2))return;
  g.save();g.translate(ship.x,ship.y);g.rotate(ship.a);
  if(flame){g.fillStyle='#ff7a2d';g.beginPath();g.moveTo(-10,-6);g.lineTo(-26-Math.random()*8,0);g.lineTo(-10,6);g.fill()}
  g.beginPath();g.moveTo(18,0);g.lineTo(-13,-12);g.lineTo(-7,0);g.lineTo(-13,12);g.closePath();
  const gr=g.createLinearGradient(-13,-12,18,12);gr.addColorStop(0,'#6fe0ff');gr.addColorStop(1,'#1f7fe0');g.fillStyle=gr;g.fill();g.lineWidth=3;g.lineJoin='round';g.strokeStyle='#fff';g.stroke();
  g.fillStyle='#ffe14d';g.beginPath();g.arc(3,0,3.5,0,6.283);g.fill();g.restore();
}
function draw(){
  shakeOn();
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1450');bg.addColorStop(1,'#1c2c8c');g.fillStyle=bg;g.fillRect(-20,-20,W+40,H+40);
  g.fillStyle='#fff';for(const s of STARS)g.fillRect(s.x,s.y,s.r,s.r);
  for(const r of rocks)drawRock(r);
  for(const b of bul){g.fillStyle='#0b2a5c';g.beginPath();g.arc(b.x,b.y,5.5,0,6.283);g.fill();g.fillStyle='#7dff7d';g.beginPath();g.arc(b.x,b.y,3.8,0,6.283);g.fill()}
  drawShip();drawFx();
  if(bannerT>0)txt('Wave '+(wave+1)+' incoming!',W/2,H/2+10,32,'center','#ffe14d');
  g.restore();
  g.lineWidth=5;g.strokeStyle='#5cc8ff';g.strokeRect(2.5,2.5,W-5,H-5);
  pill(8,8,160,40);txt('Score '+score,40,36,22);
  pill(W-140,8,132,40);txt('Wave '+wave,W-130,36,22,'left','#ffe14d');
  for(let i=0;i<lives;i++)emo('🚀',22+i*28,H-18,22);
  if(combo>1)txt('Combo x'+Math.min(5,combo),W/2,H-10,22,'center','#ffe14d');
  txt('Best '+best,W-10,H-10,16,'right');
}
Duo.addButtons($('ov'),{game:'asteroids',start:()=>{$('ov').classList.remove('hide');startGame()},cpu:[1500,6000],hw:true,unit:' pts'});
showOv('☄️ Asteroids','Rotate, thrust and blast the space rocks - they <b>split</b>!<br>← → turn · ↑ thrust · Space fire<br>(or use the on-screen buttons)','Play');

/* ---------- LOOP ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000)||0);last=now;try{update(dt);updFx(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script><script src="mascot.js" defer></script>
